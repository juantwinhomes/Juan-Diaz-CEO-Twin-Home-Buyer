<title>Equity Track Contract Signing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;500;600;700&family=Dancing+Script:wght@600&family=Great+Vibes&family=Allura&display=swap">
<style>
/* Layout: navy letterhead band over a single centered work column; documents sit on white "paper". */
:root {
  --navy: #13265c;
  --navy-deep: #0c1a42;
  --on-navy: #ffffff;
  --bg: #f3f5fa;
  --surface: #ffffff;
  --paper: #ffffff;
  --paper-ink: #111827;
  --line: #d8deea;
  --fg: #141b2d;
  --muted: #5b6579;
  --link: #1d3a8a;
  --btn: #13265c;
  --btn-fg: #ffffff;
  --btn-2: #e7ebf5;
  --btn-2-fg: #13265c;
  --ok: #17734a; --ok-bg: #e3f3ea;
  --warn: #8a5200; --warn-bg: #fbf0dc;
  --bad: #b3261e; --bad-bg: #fbe5e3;
  --info: #1d3a8a; --info-bg: #e5ebfa;
  --focus: #3b63d6;
  --doc: "Tinos", "Times New Roman", Times, serif;
  --ui: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --navy: #13265c; --navy-deep: #0a1534; --on-navy: #ffffff;
    --bg: #0b1122; --surface: #131b31; --paper: #ffffff; --paper-ink: #111827;
    --line: #29344f; --fg: #e7ebf4; --muted: #9ba6bf; --link: #9db4ff;
    --btn: #3557b8; --btn-fg: #ffffff; --btn-2: #1e2944; --btn-2-fg: #d5defa;
    --ok: #6fd3a2; --ok-bg: #12301f; --warn: #f0bd6a; --warn-bg: #33260f;
    --bad: #ff9c94; --bad-bg: #3a1614; --info: #a9bdff; --info-bg: #18234a; --focus: #8fa8ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --navy: #13265c; --navy-deep: #0a1534; --on-navy: #ffffff;
  --bg: #0b1122; --surface: #131b31; --paper: #ffffff; --paper-ink: #111827;
  --line: #29344f; --fg: #e7ebf4; --muted: #9ba6bf; --link: #9db4ff;
  --btn: #3557b8; --btn-fg: #ffffff; --btn-2: #1e2944; --btn-2-fg: #d5defa;
  --ok: #6fd3a2; --ok-bg: #12301f; --warn: #f0bd6a; --warn-bg: #33260f;
  --bad: #ff9c94; --bad-bg: #3a1614; --info: #a9bdff; --info-bg: #18234a; --focus: #8fa8ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--ui); font-size: 15px; line-height: 1.5; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.2; }
p { margin: 0; }
a { color: var(--link); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.band { background: var(--navy); color: var(--on-navy); padding: 18px 16px 16px; }
.band-in { max-width: 1040px; margin: 0 auto; display: flex; gap: 12px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
.letterhead { font-family: var(--doc); font-weight: 700; letter-spacing: .12em; font-size: 1.05rem; }
.band-sub { font-size: .85rem; opacity: .82; margin-top: 2px; }
.who { font-size: .8rem; opacity: .9; display: flex; gap: 8px; align-items: center; }
.who .chip { border: 1px solid rgba(255,255,255,.45); border-radius: 999px; padding: 2px 10px; letter-spacing: .04em; }

main { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; display: grid; gap: 20px; }
.narrow { max-width: 760px; width: 100%; margin: 0 auto; display: grid; gap: 20px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 14px; min-width: 0; }
.eyebrow { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.title { font-family: var(--doc); font-size: 1.6rem; font-weight: 700; color: var(--fg); }
.lede { color: var(--muted); max-width: 62ch; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }
.stack { display: grid; gap: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }

label.f { display: grid; gap: 4px; font-weight: 600; font-size: .9rem; }
label.f span.h { font-weight: 400; color: var(--muted); font-size: .82rem; }
input[type=text], input[type=date], input[type=number], input[type=search], textarea, select {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 11px; min-width: 0;
}
textarea { min-height: 80px; resize: vertical; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: .92rem; }
.check input { margin-top: 4px; width: 18px; height: 18px; flex: none; }

.btn { border: 0; border-radius: 8px; padding: 10px 16px; font-weight: 600; cursor: pointer; background: var(--btn); color: var(--btn-fg); display: inline-flex; gap: 8px; align-items: center; justify-content: center; }
.btn.secondary { background: var(--btn-2); color: var(--btn-2-fg); }
.btn.ghost { background: transparent; color: var(--link); padding: 6px 8px; }
.btn.danger { background: var(--bad-bg); color: var(--bad); }
.btn.sm { padding: 6px 10px; font-size: .85rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.big { padding: 13px 20px; font-size: 1rem; }

.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: .78rem; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.s-draft { background: var(--btn-2); color: var(--muted); }
.s-awaiting_employee { background: var(--info-bg); color: var(--info); }
.s-awaiting_company { background: var(--warn-bg); color: var(--warn); }
.s-fully_signed { background: var(--ok-bg); color: var(--ok); }
.s-returned { background: var(--bad-bg); color: var(--bad); }

.note { border-radius: 8px; padding: 12px 14px; font-size: .92rem; }
.note.info { background: var(--info-bg); color: var(--info); }
.note.warn { background: var(--warn-bg); color: var(--warn); }
.note.bad { background: var(--bad-bg); color: var(--bad); }
.note.ok { background: var(--ok-bg); color: var(--ok); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { background: none; border: 0; padding: 10px 14px; cursor: pointer; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab[aria-selected=true] { color: var(--fg); border-bottom-color: var(--btn); }
.tab .count { background: var(--btn-2); color: var(--btn-2-fg); border-radius: 999px; padding: 0 7px; font-size: .75rem; margin-left: 4px; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--bg); }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.code { font-family: var(--mono); font-size: .82rem; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 4px; cursor: pointer; text-align: left; }
.stat[aria-pressed=true] { outline: 2px solid var(--btn); }
.stat b { font-size: 1.7rem; font-variant-numeric: tabular-nums; line-height: 1; }

/* Employee stepper */
.steps { display: flex; gap: 0; list-style: none; padding: 0; margin: 0; counter-reset: s; overflow-x: auto; }
.steps li { flex: 1; min-width: 92px; display: grid; gap: 6px; font-size: .78rem; color: var(--muted); padding-top: 10px; border-top: 3px solid var(--line); }
.steps li.done { border-top-color: var(--ok); color: var(--fg); }
.steps li.now { border-top-color: var(--btn); color: var(--fg); font-weight: 700; }
.steps li + li { margin-left: 6px; }

/* Payroll explanation */
.pay { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.pay td { padding: 9px 0; border-bottom: 1px dashed var(--line); }
.pay td:last-child { text-align: right; white-space: nowrap; padding-left: 12px; }
.pay tr.sub td { font-weight: 700; border-bottom: 1px solid var(--fg); }
.pay tr.total td { font-weight: 700; font-size: 1.15rem; border-bottom: 0; padding-top: 14px; }
.pay .why { display: block; color: var(--muted); font-size: .8rem; }
.pay .neg { color: var(--bad); }

/* Documents */
.doc-frame { background: #e4e7ee; border-radius: 10px; padding: 12px; display: grid; gap: 12px; max-height: 78vh; overflow: auto; }
.doc-frame canvas { width: 100%; height: auto; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); display: block; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.facts div { padding: 10px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 2px; }
.facts dt { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.facts dd { margin: 0; font-family: var(--doc); font-size: 1.05rem; font-weight: 700; font-variant-numeric: tabular-nums; }

/* Signature */
.sig-tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.sig-tabs button { border: 0; background: var(--surface); padding: 8px 16px; cursor: pointer; font-weight: 600; }
.sig-tabs button[aria-pressed=true] { background: var(--btn); color: var(--btn-fg); }
.pad { position: relative; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; touch-action: none; }
.pad canvas { display: block; width: 100%; height: 190px; cursor: crosshair; }
.pad::after { content: ""; position: absolute; left: 6%; right: 6%; bottom: 44px; border-bottom: 1px solid #9aa3b5; pointer-events: none; }
.pad .hint { position: absolute; left: 6%; bottom: 20px; color: #7a8399; font-size: .78rem; pointer-events: none; }
.typed-opts { display: grid; gap: 8px; }
.typed-opt { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; background: var(--paper); color: #0f2154; cursor: pointer; }
.typed-opt input { flex: none; }
.typed-opt span { font-size: 2rem; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sig-preview { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; place-items: center; min-height: 110px; }
.sig-preview img { max-height: 90px; }

/* Combobox */
.combo { position: relative; }
.combo ul { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; list-style: none; margin: 0; padding: 4px; max-height: 240px; overflow: auto; box-shadow: 0 8px 24px rgba(10,20,50,.15); }
.combo li { padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.combo li[aria-selected=true], .combo li:hover { background: var(--btn-2); }

/* Modal */
.scrim { position: fixed; inset: 0; background: rgba(8,14,32,.55); display: grid; place-items: start center; padding: 24px 16px; overflow: auto; z-index: 20; }
.dialog { background: var(--surface); color: var(--fg); border-radius: 12px; width: 100%; max-width: 760px; padding: 20px; display: grid; gap: 14px; }
.dialog.wide { max-width: 1000px; }
.dialog header { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 30; max-width: calc(100% - 32px); font-size: .92rem; }
.toast.error { background: var(--bad); color: #fff; }

.diff { font-family: var(--doc); font-size: .95rem; border: 1px solid var(--line); border-radius: 8px; max-height: 360px; overflow: auto; }
.diff div { padding: 2px 10px; }
.diff .add { background: var(--ok-bg); color: var(--ok); }
.diff .del { background: var(--bad-bg); color: var(--bad); text-decoration: line-through; }
.diff .same { color: var(--muted); }

.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 22px; text-align: center; display: grid; gap: 8px; place-items: center; }
.drop.over { border-color: var(--btn); background: var(--info-bg); }
.spinner { width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--btn); border-radius: 50%; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
.center { display: grid; place-items: center; gap: 12px; padding: 48px 16px; text-align: center; }
.confidential { font-size: .82rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
.check-ok { color: var(--ok); }
.check-bad { color: var(--bad); }
</style>

<header class="band">
  <div class="band-in">
    <div>
      <div class="letterhead">EQUITY TRACK INC. PHILIPPINES</div>
      <div class="band-sub">Employment Contract Review &amp; Digital Signing</div>
    </div>
    <div class="who" id="who"></div>
  </div>
</header>
<main id="app">
  <div class="center"><div class="spinner"></div><p class="muted">Checking your Claude sign-in…</p></div>
</main>
<div id="layer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
