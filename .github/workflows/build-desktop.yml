name: Build Desktop App (.exe)

# Builds the Windows desktop app on GitHub's Windows runners (which can download
# the Electron binary) and publishes the .exe as a downloadable artifact and,
# on manual runs, as a GitHub Release.

on:
  push:
    paths:
      - 'desktop/**'
      - 'thb_kpi_dashboard.html'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build & publish Windows .exe (with auto-update metadata)
        working-directory: desktop
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: THB-DirectMail-Windows
          path: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
          if-no-files-found: error
