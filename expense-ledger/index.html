<title>Twin Home Expense Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: same system as Card Balances. Header, section tabs, a "View" dropdown or card tabs, then one working surface. */
:root{
  --ground:#EEF1F4; --surface:#FFFFFF; --surface-2:#F6F8FA;
  --ink:#18242F; --muted:#5A6B78; --faint:#8794A1;
  --line:#DCE2E8; --line-strong:#C6D0D8;
  --accent:#0C6E6B; --accent-soft:#D6E9E7; --accent-ink:#094B49; --on-accent:#FFFFFF;
  --warn:#9A5B0A; --warn-soft:#F5E6CE; --warn-line:#E4C68C;
  --bad:#B42318; --bad-soft:#FBE3DF;
  --good:#1F7A44; --good-soft:#DDF0E4;
  --k0:#0C6E6B; --k1:#2A6FDB; --k2:#C2412E; --k3:#7A2E22; --k4:#E07B00; --k5:#B8500B; --k6:#8A5A12; --k7:#8E1B3B; --k8:#5B4BB7; --k9:#3F7D20;
  --shadow-sm:0 1px 2px rgba(24,36,47,.05);
  --f-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono","SF Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ground:#0E141A; --surface:#161E26; --surface-2:#1C2732;
  --ink:#E7ECF1; --muted:#9DAAB6; --faint:#71808C;
  --line:#28333E; --line-strong:#37424E;
  --accent:#33B3AE; --accent-soft:#12332F; --accent-ink:#8FD8D3; --on-accent:#0E141A;
  --warn:#E0A85B; --warn-soft:#33280F; --warn-line:#5C4A22;
  --bad:#F2806F; --bad-soft:#3D1C18; --good:#5FBE84; --good-soft:#173325;
  --k0:#33B3AE; --k1:#6EA2F5; --k2:#EE7A66; --k3:#D08B7E; --k4:#F5A640; --k5:#DB8A4E; --k6:#C9A160; --k7:#E3708F; --k8:#9D90F0; --k9:#8BC86A;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --ground:#0E141A; --surface:#161E26; --surface-2:#1C2732;
  --ink:#E7ECF1; --muted:#9DAAB6; --faint:#71808C;
  --line:#28333E; --line-strong:#37424E;
  --accent:#33B3AE; --accent-soft:#12332F; --accent-ink:#8FD8D3; --on-accent:#0E141A;
  --warn:#E0A85B; --warn-soft:#33280F; --warn-line:#5C4A22;
  --bad:#F2806F; --bad-soft:#3D1C18; --good:#5FBE84; --good-soft:#173325;
  --k0:#33B3AE; --k1:#6EA2F5; --k2:#EE7A66; --k3:#D08B7E; --k4:#F5A640; --k5:#DB8A4E; --k6:#C9A160; --k7:#E3708F; --k8:#9D90F0; --k9:#8BC86A;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f-sans);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:24px 64px}
.mono,.amt{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}
a{color:var(--accent-ink)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}

header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 16px;margin-bottom:18px}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:4px 0 2px}
.subtitle{color:var(--muted);font-size:15px}
.badge-live{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent-ink);padding:4px 10px;border-radius:999px;font-weight:600;font-size:12px}
.badge-live .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.badge-live.off{background:var(--warn-soft);color:var(--warn)} .badge-live.off .dot{background:var(--warn)}

nav.sections{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
nav.sections a{padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav.sections a:hover{color:var(--ink)}
nav.sections a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.count{display:inline-block;min-width:18px;margin-left:6px;padding:0 6px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-size:11px;text-align:center;font-weight:700}

/* card tabs, like sheet tabs */
.cardtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.cardtabs button{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px;box-shadow:var(--shadow-sm)}
.cardtabs button:hover{border-color:var(--line-strong)}
.cardtabs button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cardtabs i,.chip i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.cardtabs .count{margin-left:0}

.toolbar{display:flex;align-items:center;gap:10px 12px;margin-bottom:16px;flex-wrap:wrap}
.toolbar .lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.select-shell{position:relative;flex:1;min-width:220px;max-width:460px}
.select-shell select{appearance:none;width:100%;font-weight:600;font-size:15px;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:11px;padding:10px 40px 10px 14px;cursor:pointer;box-shadow:var(--shadow-sm)}
.select-shell .chev{position:absolute;right:14px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted)}
.spacer{flex:1}

.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;box-shadow:var(--shadow-sm);min-width:0}
.tile .label{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .big{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:24px;letter-spacing:-.02em;margin-top:4px;line-height:1.15}
.tile .big.bad{color:var(--bad)} .tile .big.good{color:var(--good)} .tile .big.warn{color:var(--warn)}
.tile .foot{font-size:12.5px;color:var(--faint);margin-top:4px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm);min-width:0}
.panel-pad{padding:16px 18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}

.btn{border:1px solid var(--line-strong);background:var(--surface);padding:6px 12px;border-radius:9px;cursor:pointer;font-weight:600;white-space:nowrap;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.sm{padding:2px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.file-btn{position:relative;overflow:hidden;display:inline-block}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
select,input[type=text],input[type=date],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px;min-width:0}
select:hover,input:hover,textarea:hover{border-color:var(--line-strong)}
textarea{width:100%;resize:vertical}
label.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
label.field input,label.field select,label.field textarea{color:var(--ink);font-weight:400;font-size:14px}
.check{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-weight:600;color:var(--muted);font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink)}

.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:12px;font-weight:600}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.plain{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)} .pill.acc{background:var(--accent-soft);color:var(--accent-ink)}
.tag{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--warn);font-weight:700}
.note{background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:12px;padding:10px 14px;font-size:13px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.note.info{background:var(--surface-2);border-color:var(--line)}

/* tables */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:900px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:9px 8px;border-bottom:1px solid var(--line-strong);background:var(--surface-2);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13px}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 40%,transparent)}
td.amt,th.amt{text-align:right;white-space:nowrap}
td.amt.neg{color:var(--good)}
td.d{white-space:nowrap;color:var(--muted);font-family:var(--f-mono);font-size:12px}
td.payee{min-width:170px;max-width:260px;font-weight:500}
td select{max-width:180px;font-size:12.5px;padding:4px 6px}
td input.notes{width:100%;min-width:150px;font-size:12.5px;padding:4px 6px}
tfoot td{font-weight:700;border-top:1px solid var(--line-strong);background:var(--surface-2)}
.needs{font-size:11px;color:var(--warn);white-space:nowrap}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* card balance rows (overview) */
.rows{display:flex;flex-direction:column;gap:8px}
.brow{display:grid;grid-template-columns:220px 1fr 130px 130px;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 18px;box-shadow:var(--shadow-sm);cursor:pointer;text-align:left;width:100%}
.brow:hover{border-color:var(--accent)}
.brow .name{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.brow .amt{text-align:right;font-weight:600;font-size:17px}
.brow .amt small{display:block;font-size:10.5px;color:var(--faint);font-weight:400;letter-spacing:.03em;text-transform:uppercase;font-family:var(--f-sans)}
.track{height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.fill{height:100%;background:var(--accent)} .fill.over{background:var(--bad)}
@media (max-width:760px){ .brow{grid-template-columns:1fr auto} .brow .track,.brow .amt.paid{display:none} }

.btabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;padding-inline:8px}
.btabs button{border:0;background:transparent;padding:12px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.btabs button span{font-family:var(--f-mono);font-size:12px;font-weight:500;margin-left:6px}
.btabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* breakdown bars */
.bd{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px 28px}
.bd-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-size:13.5px}
.bd-row .track{grid-column:1/-1;height:8px}
.bd-row b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}

/* collapsible sections */
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm)}
details.sec>summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary h3{font-size:16px;font-weight:700}
details.sec>summary .sum{margin-left:auto;font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
details.sec>summary .chev{transition:transform .15s;color:var(--muted)}
details.sec[open]>summary .chev{transform:rotate(90deg)}
details.sec>.body{padding:0 18px 18px;display:flex;flex-direction:column;gap:14px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.pl{display:flex;flex-direction:column;gap:5px;max-width:460px}
.pl .line{display:flex;justify-content:space-between;gap:12px;font-size:13.5px}
.pl .line b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
.pl .total{border-top:2px solid var(--ink);padding-top:6px;font-weight:700}
.pl .total b{font-weight:700;font-size:16px}
.files{display:flex;flex-direction:column;gap:6px}

.drop{border:1.5px dashed var(--line-strong);border-radius:12px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;background:var(--surface-2)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:10px;font-weight:600;max-width:calc(100% - 32px)}
#toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:6px;padding:2px 8px;cursor:pointer;font-weight:700}
#modal{position:fixed;inset:0;z-index:60;background:rgb(0 0 0 / .4);display:flex;align-items:center;justify-content:center;padding:16px}
#modal .box{background:var(--surface);border-radius:14px;padding:20px;width:min(460px,100%);display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto}
.fname{font-family:var(--f-mono);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;word-break:break-all}
fieldset.ro{border:0;margin:0;padding:0;min-width:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Twin Home Buyer · Expenses</div>
      <h1>Twin Home Expense Ledger</h1>
      <div class="subtitle">Import each card, categorize, attach the receipt, and it transfers to the tracker.</div>
    </div>
    <span class="badge-live off" id="sync"><span class="dot"></span>Connecting…</span>
  </header>
  <nav class="sections" id="tabs" aria-label="Sections"></nav>
  <div id="app"></div>
</div>
<div id="toast" hidden></div>
<div id="modal" hidden></div>

<script>
/* ---------- defaults (from the Daily Expense Tracker SETTINGS tab) ---------- */
const DEFAULTS = {
  cards:[
    {k:'amex',n:'AmEx'},{k:'cap1p',n:'Capital One Personal'},{k:'cap1b',n:'Capital One Business'},{k:'disc2645',n:'Discover 2645'},
    {k:'hd5253',n:'Home Depot 5253'},{k:'hd1511',n:'Home Depot 1511'},{k:'hd5880',n:'Home Depot 5880'},{k:'boa0475',n:'BOA 0475'}
  ],
  types:['Overhead Expense','Property Expense','Marketing Expense','Overhead - Peninsula','Overhead - Prescott','Overhead - Daliaz','Overhead - Equity Track Inc','Overhead - Matrix Group One'],
  categories:['Office & Administrative Expense','Technology Expense','Marketing Tools','Sales Acquisition - Real Estate','PPS - Sales Acquisition','Direct Mail','Direct Mail - Checks (Real Estate)','Direct Mail - Postcards (Real Estate)','PPS - Postcards','PPC - Real Estate','PPC - PPS','Real Estate - Facebook Ads','PPS - Facebook Ads','Iriga Office - Facebook','PPS - Nextdoor Ads','PPS - Bing Ads','PPS - Yelp','PPS - Smarter Contact','PPS - QR Code','TV','Motivated Leads','Property Leads','LeadGeeks','Reddit','Peninsula Plumbing','Personal Expense'],
  subcategories:['Materials','Local Team Labor','Virtual Team Payroll','Matrix Payroll','Contractor Service','Supplies & Equipment','Tools','Permits & Fees','Auto Expenses (this includes tolls, fuel and maintenance)','Meals & Entertainment','Travel','Hotel','Insurance','GL Insurance','Legal & Professional Fees','Bank Charges & Fees','Interest Expense (for cc’s NOT mortgage interest)','Taxes Paid – business taxes only','Training & Education','Charitable Contributions','Dues & Subscriptions','Office Supplies','Postage','Other Office Expenses','Infrastructure (email, hosting, internet)','CRM','Telephone Services','Website','Miscellaneous Technology','Salaries & Wages','Gifts and Promotions','Gift to Seller','Service Fee','Dispute','Advertising','Facebook','Postcard','Marketing Materials','Marketing Software','Marketing Tools','QBO Equity','QBO Daliaz','QBO Matrix','QBO PPS','QBO Iriga Office','Personal Expense'],
  methods:['Check','Wire','ACH','Zelle','Relay Bank','Wells Fargo','Cash','Lender Draw','Other'],
  statuses:['Active construction','Upcoming construction','Rental','Owner residence','Office','Sold'],
  requireReceipt:true,
  receiptFolder:'https://drive.google.com/drive/folders/1Ps4suRRPe33QgBj35QEZt6smAj0sScoe',
  propertyFolder:''
};
const SECTIONS = [{k:'daily',n:'Daily Expenses'},{k:'tracker',n:'Card Tracker'},{k:'properties',n:'Properties'},{k:'settings',n:'Settings'}];
const BUCKETS = {overhead:'Overhead',property:'Property',marketing:'Marketing'};
const DRIVE='Google Drive';

/* ---------- state ---------- */
const today=()=>new Date().toISOString().slice(0,10);
const S={
  txns:new Map(), props:new Map(), pays:new Map(), L:{...DEFAULTS},
  ready:{txns:false,props:false}, dbState:'connecting', readOnly:false,
  tab:(location.hash||'').slice(1)||'daily',
  dCard:null, dView:'todo', dMonth:'all',
  tCard:'all', tBucket:'overhead', tPaid:'unpaid',
  propId:'all', propFilter:'active', sel:new Set(), open:{calc:true,fin:false,budget:false,pays:false,files:false},
  preview:null, importing:false, confirm:null, draft:{}, modal:null
};
if(!SECTIONS.some(s=>s.k===S.tab)) S.tab='daily';
let db=null, mcp=null, fileArgs=false;

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>{n=Number(n)||0;return(n<0?'−':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});};
const money0=n=>{n=Number(n)||0;return(n<0?'−':'')+'$'+Math.round(Math.abs(n)).toLocaleString('en-US');};
const num=v=>{let s=String(v??'').trim().replace(/[$,\s]/g,'');let neg=false;if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1);}if(s.startsWith('-')){neg=!neg;s=s.slice(1);}const n=parseFloat(s);return isNaN(n)?0:(neg?-n:n);};
const r2=n=>Math.round(n*100)/100;
const sum=(a,f=x=>x.amount)=>r2(a.reduce((t,x)=>t+(Number(f(x))||0),0));
const D=(k,f='')=>S.draft[k]??f;
const shortDate=d=>d?new Date(d+'T12:00').toLocaleDateString('en-US',{month:'2-digit',day:'2-digit',year:'numeric'}):'';
const monthLabel=m=>new Date(m+'-01T12:00').toLocaleDateString('en-US',{month:'long',year:'numeric'});
const byDate=(a,b)=>(b.date||'').localeCompare(a.date||'')||(a.desc||'').localeCompare(b.desc||'');
const cards=()=>S.L.cards||DEFAULTS.cards;
const cardIdx=k=>Math.max(0,cards().findIndex(c=>c.k===k));
const cardName=k=>cards().find(c=>c.k===k)?.n||k;
const chip=k=>`<span class="chip" style="--c:var(--k${cardIdx(k)%10})"><i></i>${esc(cardName(k))}</span>`;
const bucketOf=type=>!type?'':type==='Property Expense'?'property':type==='Marketing Expense'?'marketing':'overhead';
const propName=id=>S.props.get(id)?.address||(id?'(removed property)':'');
const folderId=v=>{const m=String(v||'').match(/folders\/([\w-]+)/);return m?m[1]:(/^[\w-]{15,}$/.test(String(v||'').trim())?String(v).trim():'');};
const shortAddr=a=>String(a||'').split(',')[0].trim();
function opts(list,cur,ph){const l=cur&&!list.includes(cur)?[...list,cur]:list;return(ph!=null?`<option value="">${esc(ph)}</option>`:'')+l.map(x=>`<option value="${esc(x)}"${x===cur?' selected':''}>${esc(x)}</option>`).join('');}
function propOpts(cur,ph='Choose property…'){

function missing(t){
  const m=[],b=bucketOf(t.type);
  if(!t.type) m.push('expense type');
  if(b!=='property' && !t.category) m.push('category');
  if(!t.sub) m.push('sub category');
  if(b==='property' && !t.propertyId) m.push('property');
  if(S.L.requireReceipt && !t.receiptUrl) m.push('receipt');
  if(t.status==='Pending') m.push('posting');
  return m;
}

async function write(fn){
  if(!db){toast('The ledger is offline. Open it on claude.ai while signed in.');return false;}
  try{await fn();return true;}
  catch(e){
    if(e?.code==='invalid_argument'){S.readOnly=true;render();toast('You have view-only access, so changes are not saved.');}
    else if(e?.code==='quota_exceeded') toast('The ledger is full. Delete old rows, then try again.');
    else toast('Could not save. Check your connection and try again.');
    return false;
  }
}

/* ---------- Google Drive ---------- */
function driveErr(e){
  const c=e?.code;
  if(c==='server_not_connected') return 'Google Drive is not connected. Add it in claude.ai Settings → Connectors.';
  if(c==='needs_reauth') return 'Google Drive needs to be reconnected in claude.ai Settings → Connectors.';
  if(c==='not_in_manifest') return 'Google Drive is turned off for this page. Allow it when the page asks.';
  if(c==='blocked_by_policy'||c==='approval_required') return 'Your organization blocks Drive uploads from this page.';
  if(c==='tool_error') return 'Google Drive refused the upload: '+(e.message||'unknown reason');
  return 'Could not reach Google Drive. Try again in a moment.';
}
function blobToB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=rej;r.readAsDataURL(blob);});}
async function driveTitles(base,parent){
  if(!mcp) return [];
  const q=`title contains '${base.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}'`+(parent?` and parentId = '${parent}'`:'');
  try{ const r=await mcp.callTool(DRIVE,'search_files',{query:q,pageSize:50,excludeContentSnippets:true},{cache:false}); return (r.payload?.files||[]).map(f=>f.title||''); }catch{ return []; }
}
async function uniqueName(base,ext,parent){
  const used=new Set([...S.txns.values()].map(t=>(t.receiptName||'').toLowerCase()).filter(Boolean));
  for(const t of await driveTitles(base,parent)) used.add(t.toLowerCase());
  const nameFor=n=>n===1?base+ext:`${base}.${n}${ext}`;
  let n=1; while(used.has(nameFor(n).toLowerCase())) n++;
  return nameFor(n);
}
async function uploadToDrive(file,title,parent){
  const type=file.type||'application/octet-stream';
  const input={title,contentMimeType:type,disableConversionToGoogleType:true};
  if(parent) input.parentId=parent;
  if(fileArgs) input.base64Content={$file:{data:file,name:title.replace(/[\/\\]/g,'-'),type}};
  else { if(file.size>700000) throw {code:'too_big'}; input.base64Content=await blobToB64(file); }
  const r=await mcp.callTool(DRIVE,'create_file',input);
  const p=r.payload||{}; const f=p.file||p;
  const id=f.id||f.fileId||'';
  return {id,url:f.viewUrl||f.webViewLink||f.alternateLink||(id?`https://drive.google.com/file/d/${id}/view`:'')};
}
function vendorFrom(desc){
  let s=String(desc||'');
  s=s.replace(/^(AplPay|SQ \*|SQ\*|TST\*|TST \*|SP |SP\*|PAYPAL \*|PP\*|BT\*|DD |DD\*|IN \*|PY \*)\s*/i,'');
  s=s.replace(/\bBT\*DD\b/i,'').replace(/#\s*\d+/g,'').replace(/\b\d{3,}\b/g,'').replace(/\s{2,}/g,' ').trim();
  const known=[[/home ?depot/i,'Home Depot'],[/amazon|amzn/i,'Amazon'],[/lowe'?s/i,"Lowe's"],[/doordash/i,'DoorDash'],[/uber/i,'Uber'],[/google/i,'Google'],[/facebook|facebk|meta/i,'Facebook'],[/shell/i,'Shell'],[/chevron/i,'Chevron'],[/costco/i,'Costco'],[/yelp/i,'Yelp']];
  for(const [re,n] of known) if(re.test(s)) return n;
  s=s.replace(/[\/\\:*?"<>|]/g,' ').trim();
  return s.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase()).slice(0,40)||'Vendor';
}
const amtStr=a=>(Number(a)||0).toFixed(2);
const extOf=f=>f?('.'+(f.name.split('.').pop()||'pdf').toLowerCase()):'.pdf';

/* ---------- CSV import ---------- */
function parseCSV(text){
  const first=text.split(/\r?\n/)[0]||''; const sep=first.includes('\t')&&!first.includes(',')?'\t':',';
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true; else if(c===sep){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';}
    else f+=c;}
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows.map(r=>r.map(x=>x.trim())).filter(r=>r.some(x=>x!==''));
}
function normDate(s){s=String(s||'').trim();let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))){let y=m[3];if(y.length===2)y='20'+y;return`${y}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;}
  const d=new Date(s);return isNaN(d)?'':d.toISOString().slice(0,10);}
function hash(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}return(h>>>0).toString(36);}
const isCardPayment=d=>/\b(payment|autopay|auto pay|thank you|pymt|online pmt)\b/i.test(d);
function buildPreview(text,fileName,card){
  const rows=parseCSV(text); let hi=-1,cols=null;
  for(let i=0;i<Math.min(rows.length,15);i++){
    const h=rows[i].map(x=>x.toLowerCase());
    const find=res=>{for(const re of res){const j=h.findIndex(x=>re.test(x));if(j>=0)return j;}return -1;};
    const date=find([/^trans(action)?\.? ?date/,/^date$/,/^posted? ?date/,/^posting date/,/date/]);
    const desc=find([/^description/,/^merchant/,/^payee/,/^name/,/details|memo/]);
    const amount=find([/^amount/]); const debit=find([/^debit/,/^charges?$/]); const credit=find([/^credit/,/^payments?$/]);
    const status=find([/^status/]);
    if(date>=0&&desc>=0&&(amount>=0||debit>=0)){hi=i;cols={date,desc,amount,debit,credit,status};break;}
  }
  if(hi<0) return {card,error:'Could not find Date, Description and Amount columns. Export the activity as CSV from the card website, or paste rows that include the header line.'};
  const parsed=[];
  for(const r of rows.slice(hi+1)){
    const date=normDate(r[cols.date]); if(!date) continue;
    let amt;
    if(cols.debit>=0&&(r[cols.debit]||'')!=='') amt=Math.abs(num(r[cols.debit]));
    else if(cols.credit>=0&&(r[cols.credit]||'')!=='') amt=-Math.abs(num(r[cols.credit]));
    else if(cols.amount>=0) amt=num(r[cols.amount]); else continue;
    const st=cols.status>=0&&/pend/i.test(r[cols.status]||'')?'Pending':'Posted';
    parsed.push({date,desc:(r[cols.desc]||'').replace(/\s+/g,' '),raw:amt,status:st});
  }
  if(!parsed.length) return {card,error:'The file had a header row but no transactions under it.'};
  const negs=parsed.filter(p=>p.raw<0).length;
  return {fileName,card,parsed,flip:cols.debit<0&&negs>parsed.length/2,removeGone:true};
}
function previewRows(p){
  const seen={},rows=[];let payments=0;
  for(const r of p.parsed){
    const amount=r2(p.flip?-r.raw:r.raw);
    if(amount<0&&isCardPayment(r.desc)){payments++;continue;}
    const base=`${p.card}-${r.date}-${Math.round(amount*100)}-${hash(r.desc.toLowerCase())}`;
    seen[base]=(seen[base]||0)+1;
    const id=(base+'-'+seen[base]).replace(/[^A-Za-z0-9_\-.~:@+]/g,'_');
    const ex=S.txns.get(id);
    rows.push({...r,amount,id,dupe:!!ex,statusChange:!!(ex&&ex.status==='Pending'&&r.status==='Posted')});
  }
  const ids=new Set(rows.map(r=>r.id)); const dates=rows.map(r=>r.date).sort();
  const lo=dates[0],hi=dates[dates.length-1];
  const gone=lo?[...S.txns.values()].filter(t=>t.card===p.card&&t.status!=='Transferred'&&t.source!=='manual'&&!t.example&&t.date>=lo&&t.date<=hi&&!ids.has(t.id)):[];
  return {rows,payments,gone,lo,hi};
}
async function doImport(){
  const p=S.preview; if(!p) return;
  const {rows,gone}=previewRows(p); const fresh=rows.filter(r=>!r.dupe), upd=rows.filter(r=>r.statusChange);
  S.importing=true; render();
  const now=new Date().toISOString(); let failed=0, carried=0;
  // keep work done on a pending row whose amount changed when it posted
  const goneByKey=new Map(); if(p.removeGone) for(const g of gone) goneByKey.set(g.date+'|'+hash((g.desc||'').toLowerCase()),g);
  const jobs=[
    ...fresh.map(r=>async()=>{
      const prev=goneByKey.get(r.date+'|'+hash(r.desc.toLowerCase()));
      const carry=prev?{type:prev.type||'',category:prev.category||'',sub:prev.sub||'',propertyId:prev.propertyId||'',notes:prev.notes||'',receiptUrl:prev.receiptUrl||'',receiptName:prev.receiptName||''}:{};
      if(prev) carried++;
      await db.doc('txns/'+r.id).set({card:p.card,date:r.date,desc:r.desc,amount:r.amount,status:r.status,type:'',category:'',sub:'',propertyId:'',notes:'',receiptUrl:'',receiptName:'',paid:false,importedAt:now,source:p.fileName||'paste',...carry});
    }),
    ...upd.map(r=>async()=>{ const t=S.txns.get(r.id); const patch={status:'Posted'}; await db.doc('txns/'+r.id).update(patch); }),
    ...(p.removeGone?gone.map(g=>async()=>db.doc('txns/'+g.id).delete()):[])
  ];
  let i=0; const total=jobs.length;
  async function worker(){ while(jobs.length){ const j=jobs.shift(); try{await j();}catch(e){failed++; if(e?.code==='invalid_argument'){S.readOnly=true;jobs.length=0;}} i++; const el=$('#imp-prog'); if(el) el.textContent=`Saving ${i} of ${total}…`; } }
  await Promise.all([worker(),worker(),worker(),worker()]);
  S.importing=false; S.preview=null; S.draft.paste=''; S.dView='todo';
  render();
  const parts=[`${fresh.length} new`]; if(upd.length) parts.push(`${upd.length} now posted`); if(p.removeGone&&gone.length) parts.push(`${gone.length} removed`); if(carried) parts.push(`${carried} kept your edits`);
  toast((failed?`${failed} rows did not save. Import the file again to retry. `:'')+`${cardName(p.card)}: `+parts.join(', '));
}

  if(S.importing) return h+`<b id="imp-prog">Saving…</b></div>`;
  h+=`<div class="drop" id="drop"><b>Upload ${esc(cardName(k))} CSV</b>
    <span class="btn primary file-btn">Choose file<input type="file" id="imp-file" accept=".csv,text/csv,.txt" data-act="imp-file"></span>
    <span class="muted">or drop it here ·</span>
    <button class="btn ghost" data-act="toggle" data-k="showPaste">${S.draft.showPaste?'Hide paste box':'Paste rows'}</button>
    <button class="btn ghost" data-act="toggle" data-k="showManual">${S.draft.showManual?'Hide':'Add one by hand'}</button>
    <span class="faint" style="font-size:12.5px">Rows already here are skipped. Pending rows that dropped off the new export are removed.</span></div>`;
  if(S.draft.showPaste) h+=`<textarea id="paste" rows="4" data-draft="paste" placeholder="Date,Description,Amount&#10;09/28/2026,THE HOME DEPOT #6512,412.18">${esc(D('paste'))}</textarea><div><button class="btn" data-act="parse-paste">Read pasted rows</button></div>`;
  if(S.draft.showManual) h+=`<div class="form-grid">
    <label class="field">Date<input type="date" id="m-date" data-draft="m-date" value="${esc(D('m-date',today()))}"></label>
    <label class="field" style="grid-column:span 2">Payee<input type="text" id="m-desc" data-draft="m-desc" value="${esc(D('m-desc'))}" placeholder="Vendor"></label>
    <label class="field">Amount<input type="text" inputmode="decimal" id="m-amt" data-draft="m-amt" value="${esc(D('m-amt'))}" placeholder="0.00"></label>
    <div style="align-self:end"><button class="btn primary" data-act="add-manual">Add to ${esc(cardName(k))}</button></div></div>`;
  if(p?.error) h+=`<div class="note">${esc(p.error)}</div>`;
  else if(p){
    const {rows,payments,gone,lo,hi}=previewRows(p); const fresh=rows.filter(r=>!r.dupe), upd=rows.filter(r=>r.statusChange);
    h+=`<div class="row" style="justify-content:space-between"><div><b>${esc(p.fileName)}</b> · <b>${fresh.length}</b> new · ${rows.length-fresh.length} already here${upd.length?` (${upd.length} now posted)`:''}${payments?` · ${payments} card payments skipped`:''}</div>
      <label class="check"><input type="checkbox" data-act="imp-flip"${p.flip?' checked':''}> Charges show as negative in this file</label></div>
      ${gone.length?`<div class="note" style="margin:0"><span><b>${gone.length}</b> uncategorized row${gone.length===1?'':'s'} from ${shortDate(lo)}–${shortDate(hi)} ${gone.length===1?'is':'are'} no longer in this export (usually pending charges that changed or dropped): ${gone.slice(0,4).map(g=>esc(g.desc)+' '+money(g.amount)).join(', ')}${gone.length>4?'…':''}</span><label class="check"><input type="checkbox" data-act="imp-gone"${p.removeGone?' checked':''}> Remove them</label></div>`:''}
      <div class="tbl" style="border:1px solid var(--line);border-radius:10px"><table style="min-width:520px"><thead><tr><th>Date</th><th>Payee</th><th class="amt">Amount</th><th>Status</th><th></th></tr></thead><tbody>${rows.slice(0,6).map(r=>`<tr><td class="d">${shortDate(r.date)}</td><td>${esc(r.desc)}</td><td class="amt">${money(r.amount)}</td><td>${r.status}</td><td>${r.dupe?'<span class="pill plain">Already here</span>':'<span class="pill good">New</span>'}</td></tr>`).join('')}${rows.length>6?`<tr><td colspan="5" class="faint">…and ${rows.length-6} more</td></tr>`:''}</tbody></table></div>
      <div class="row"><button class="btn primary" data-act="do-import"${!fresh.length&&!upd.length&&!(p.removeGone&&gone.length)?' disabled':''}>Import to ${esc(cardName(k))}</button><button class="btn ghost" data-act="cancel-import">Cancel</button></div>`;
  }
  return h+`</div>`;
}

/* ----- Card Tracker ----- */
function viewTracker(){
  const T=transferred();
  let h=cardTabs(S.tCard,null,'tcard');
  if(S.tCard==='all'){
    const list=cards().map((c,i)=>{const r=T.filter(t=>t.card===c.k);return{...c,i,total:sum(r),unpaid:sum(r.filter(t=>!t.paid)),paid:sum(r.filter(t=>t.paid))};});
    const max=Math.max(1,...list.map(c=>c.unpaid));
    h+=`<div class="summary"><div class="tile"><div class="label">Unpaid · all cards</div><div class="big bad">${money(sum(list,c=>c.unpaid))}</div></div><div class="tile"><div class="label">Paid</div><div class="big good">${money(sum(list,c=>c.paid))}</div></div><div class="tile"><div class="label">Total transferred</div><div class="big">${money(sum(list,c=>c.total))}</div></div></div>
    <div class="rows">${list.map(c=>`<button class="brow" data-act="tcard" data-k="${esc(c.k)}"><span class="name"><span class="chip" style="--c:var(--k${c.i%10})"><i></i></span>${esc(c.n)}</span><span class="track"><span class="fill" style="display:block;width:${Math.max(1.5,c.unpaid/max*100)}%"></span></span><span class="amt paid">${money(c.paid)}<small>paid</small></span><span class="amt">${money(c.unpaid)}<small>unpaid</small></span></button>`).join('')}</div>`;
    return h;
  }
  const mine=T.filter(t=>t.card===S.tCard);
  const by=b=>mine.filter(t=>bucketOf(t.type)===b);
  h+=`<div class="summary">
    <div class="tile"><div class="label">Unpaid</div><div class="big bad">${money(sum(mine.filter(t=>!t.paid)))}</div><div class="foot">${mine.filter(t=>!t.paid).length} charges</div></div>
    <div class="tile"><div class="label">Paid</div><div class="big good">${money(sum(mine.filter(t=>t.paid)))}</div></div>
    <div class="tile"><div class="label">Total</div><div class="big">${money(sum(mine))}</div></div>
    ${Object.entries(BUCKETS).map(([b,n])=>`<div class="tile"><div class="label">${n}</div><div class="big" style="font-size:19px">${money(sum(by(b)))}</div></div>`).join('')}
  </div>`;
  const list=by(S.tBucket).filter(t=>S.tPaid==='all'||(S.tPaid==='paid')===!!t.paid).sort(byDate);
  const isP=S.tBucket==='property', isO=S.tBucket==='overhead';
  h+=`<div class="panel"><div class="btabs" role="group" aria-label="Sheet">${Object.entries(BUCKETS).map(([b,n])=>`<button data-act="tbucket" data-k="${b}" aria-pressed="${S.tBucket===b}">${n}<span>${by(b).length}</span></button>`).join('')}</div>
    <div class="toolbar" style="padding:12px 14px 0"><div class="seg" role="group" aria-label="Paid">${['unpaid','paid','all'].map(v=>`<button data-act="tpaid" data-v="${v}" aria-pressed="${S.tPaid===v}">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}</div><span class="spacer"></span>
    ${S.tPaid!=='paid'&&list.some(t=>!t.paid)?(S.confirm==='payall'?`<button class="btn primary sm" data-act="payall-yes">Mark ${list.filter(t=>!t.paid).length} as paid</button><button class="btn ghost sm" data-act="cancel">Cancel</button>`:`<button class="btn sm" data-act="payall">Mark all shown as paid</button>`):''}</div>
    ${list.length?`<div class="tbl"><table><thead><tr><th>Paid</th><th>Date</th><th>Receipt</th><th>Payee</th><th>What is this for?</th>${isO?'<th>Expense type</th>':''}<th>Category</th><th>Sub category</th>${isP?'<th>Property</th>':''}<th class="amt">Amount</th><th></th></tr></thead><tbody>
    ${list.map(t=>`<tr data-id="${esc(t.id)}"><td><input type="checkbox" data-act="tf" data-f="paid"${t.paid?' checked':''} aria-label="Paid"></td><td class="d">${shortDate(t.date)}</td><td>${receiptCell(t)}</td><td class="payee">${esc(t.desc)}${t.example?' <span class="tag">example</span>':''}</td>
      <td><input class="notes" type="text" id="tn-${esc(t.id)}" data-act="tf" data-f="notes" value="${esc(t.notes||'')}" placeholder="Add a note" aria-label="What is this for?"></td>
      ${isO?`<td>${esc(t.type)}</td>`:''}<td>${esc(t.category||'—')}</td>
      <td><select data-act="tf" data-f="sub" aria-label="Sub category">${opts(S.L.subcategories,t.sub)}</select></td>
      ${isP?`<td><select data-act="tf" data-f="propertyId" aria-label="Property">${propOpts(t.propertyId)}</select></td>`:''}
      <td class="amt${t.amount<0?' neg':''}">${money(t.amount)}</td><td><button class="btn sm ghost" data-act="untransfer" title="Send back to Daily Expenses">Recategorize</button></td></tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="${isP||isO?8:7}">${list.length} shown</td><td class="amt">${money(sum(list))}</td><td></td></tr></tfoot></table></div>`
    :`<div class="empty"><b>No ${S.tPaid==='all'?'':S.tPaid+' '}${BUCKETS[S.tBucket].toLowerCase()} charges on ${esc(cardName(S.tCard))}</b>Charges arrive here from Daily Expenses once they are categorized.</div>`}</div>`;
  return h;
}

}
function filesBody(p){
  return `<label class="field">Notes<textarea id="pf-notes" rows="3" data-act="pf" data-f="notes" data-num="0" placeholder="Scope, contractor contacts, draw schedule…">${esc(p.notes||'')}</textarea></label>
  <div class="row"><span class="btn file-btn">Upload file to Drive<input type="file" data-act="pfile" aria-label="Upload a file for this property"></span><span class="faint" style="font-size:12.5px">${mcp?`Saved to the Drive folder in Settings as “${esc(shortAddr(p.address))} - file name”.`:'Drive upload needs this page open on claude.ai with Google Drive connected.'}</span></div>
  ${(p.files||[]).length?`<div class="files">${p.files.map((f,i)=>`<span class="row" style="gap:6px"><a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a><span class="faint" style="font-size:12px">${esc(shortDate(f.date))}</span><button class="btn sm ghost" data-act="pfile-del" data-i="${i}" aria-label="Remove link">✕</button></span>`).join('')}</div>`:''}`;
}

/* ----- Settings ----- */
function viewSettings(){
  const L=S.L, ta=(k,label,rows=8)=>`<label class="field">${label}<textarea id="ls-${k}" rows="${rows}" data-draft="ls-${k}">${esc(D('ls-'+k,(L[k]||[]).join('\n')))}</textarea></label>`;
  return `<div class="toolbar"><h2 style="font-size:20px">Settings</h2><span class="spacer"></span><button class="btn primary" data-act="save-settings">Save changes</button></div>
  <div class="stack">
  <div class="panel panel-pad stack"><h3 style="font-size:16px">Cards</h3><span class="muted" style="font-size:13px">Each card gets its own tab in Daily Expenses and the Card Tracker.</span>
    <div class="form-grid">${cards().map(c=>`<label class="field">Card name<input type="text" id="cn-${esc(c.k)}" data-draft="cn-${esc(c.k)}" value="${esc(D('cn-'+c.k,c.n))}"></label>`).join('')}
    <label class="field">Add a card<input type="text" id="cn-new" data-draft="cn-new" value="${esc(D('cn-new'))}" placeholder="e.g. Home Depot 8087"></label></div></div>
  <div class="panel panel-pad stack"><h3 style="font-size:16px">Google Drive</h3>
    <div class="form-grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">
    <label class="field">Receipts folder (link)<input type="text" id="ls-receiptFolder" data-draft="ls-receiptFolder" value="${esc(D('ls-receiptFolder',L.receiptFolder||''))}" placeholder="https://drive.google.com/drive/folders/…"></label>
    <label class="field">Property files folder (link)<input type="text" id="ls-propertyFolder" data-draft="ls-propertyFolder" value="${esc(D('ls-propertyFolder',L.propertyFolder||''))}" placeholder="Leave blank to use the receipts folder"></label></div>
    <span class="faint" style="font-size:12.5px">Receipts are named “Amount - Vendor”, for example 352.15 - Home Depot.pdf. A repeat gets .2, .3 and so on, as in the receipt SOP.</span>
    <label class="check"><input type="checkbox" id="ls-req" data-draft="ls-req"${D('ls-req',L.requireReceipt)?' checked':''}> Require a receipt before a row transfers</label></div>
  <div class="form-grid" style="grid-template-columns:repeat(auto-fill,minmax(250px,1fr))">${ta('types','Expense types')}${ta('categories','Categories',10)}${ta('subcategories','Sub categories',10)}${ta('methods','Payment methods (non-card)')}${ta('statuses','Property statuses')}</div>
  <p class="faint" style="font-size:12.5px">One option per line. Renaming an option does not change rows already filed under the old name.</p></div>`;
}

/* ---------- modal ---------- */
function openModal(m){S.modal=m;renderModal();}
function closeModal(){S.modal=null;renderModal();render();}
function renderModal(){
  const el=$('#modal'), m=S.modal;
  if(!m){el.hidden=true;el.innerHTML='';return;}
  if(m.type==='prop'){
    el.innerHTML=`<div class="box" role="dialog" aria-modal="true" aria-labelledby="mh"><h3 id="mh">New property</h3><label class="field">Address<input type="text" id="mp-addr" value="${esc(m.addr||'')}" placeholder="492 Umland Dr, Santa Rosa, CA 95401"></label><div class="row"><button class="btn primary" data-act="mp-create">Create property</button><button class="btn ghost" data-act="m-close">Cancel</button></div></div>`;
  } else if(m.type==='rcpt'){
    const t=S.txns.get(m.txnId); if(!t){S.modal=null;el.hidden=true;return;}
    el.innerHTML=`<div class="box" role="dialog" aria-modal="true" aria-labelledby="mh"><h3 id="mh">Receipt · ${esc(t.desc)} · ${money(t.amount)}</h3>
      ${mcp?`<label class="field">Receipt file<input type="file" id="mr-file" accept="image/*,application/pdf" data-act="mr-file"></label>
      <label class="field">Vendor name for the file<input type="text" id="mr-vendor" value="${esc(m.vendor)}"></label>
      <div class="fname" id="mr-name">${esc(amtStr(t.amount)+' - '+m.vendor+extOf(m.file))}</div>
      <div class="row"><button class="btn primary" data-act="mr-upload"${!m.file||m.busy?' disabled':''}>${m.busy?'Uploading…':'Upload to Drive'}</button>${m.file?`<span class="faint" style="font-size:12px">${esc(m.file.name)}</span>`:''}</div>
      <div class="faint" style="text-align:center;font-size:12px">or</div>`:`<div class="note" style="margin:0">Drive upload needs this page open on claude.ai with Google Drive connected. You can still paste a link.</div>`}
      <label class="field">Paste a Drive link to a receipt that is already saved<input type="text" id="mr-link" value="${esc(m.link||'')}" placeholder="https://drive.google.com/file/d/…"></label>
      <div class="row"><button class="btn" data-act="mr-link">Save link</button><button class="btn ghost" data-act="m-close">Cancel</button></div>
      ${m.err?`<div class="note" style="margin:0">${esc(m.err)}</div>`:''}</div>`;
  }
  el.hidden=false;
  setTimeout(()=>{const f=el.querySelector('#mp-addr');if(f&&document.activeElement===document.body)f.focus();},0);
}

/* ---------- events ---------- */
document.addEventListener('input',e=>{const t=e.target;const k=t.dataset?.draft;if(k)S.draft[k]=t.type==='checkbox'?t.checked:t.value;
  if(!S.modal) return;
  if(t.id==='mr-vendor'){S.modal.vendor=t.value;const tx=S.txns.get(S.modal.txnId);$('#mr-name').textContent=amtStr(tx.amount)+' - '+t.value.trim()+extOf(S.modal.file);}
  if(t.id==='mr-link') S.modal.link=t.value; if(t.id==='mp-addr') S.modal.addr=t.value;});
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset?.sec)S.open[d.dataset.sec]=d.open;},true);
document.addEventListener('change',async e=>{
  const t=e.target, act=t.dataset.act; if(t.dataset.draft) S.draft[t.dataset.draft]=t.type==='checkbox'?t.checked:t.value;
  if(!act) return;
  const tr=t.closest('tr'), id=tr?.dataset.id;
  if(act==='tf'&&id){await setTxn(id,{[t.dataset.f]:t.type==='checkbox'?t.checked:t.value});return;}
  if(act==='sel'&&id){if(t.checked)S.sel.add(id);else S.sel.delete(id);render();return;}
  if(act==='sel-all'){const rows=todo().filter(x=>x.card===S.dCard&&(S.dMonth==='all'||(x.date||'').startsWith(S.dMonth))&&ready(x));for(const x of rows){if(t.checked)S.sel.add(x.id);else S.sel.delete(x.id);}render();return;}
  if(act==='imp-file'&&t.files[0]){const f=t.files[0];S.preview=buildPreview(await f.text(),f.name,S.dCard);render();return;}
  if(act==='imp-flip'){S.preview.flip=t.checked;render();return;}
  if(act==='imp-gone'){S.preview.removeGone=t.checked;render();return;}
  if(act==='dmonth'){S.dMonth=t.value;render();return;}
  if(act==='prop-pick'){S.propId=t.value;S.confirm=null;render();return;}
  if(act==='pf'&&S.propId!=='all'){const f=t.dataset.f;const v=t.type==='checkbox'?t.checked:t.dataset.num==='1'?num(t.value):t.value;if(f==='address'&&!String(v).trim()){render();return;}await write(()=>db.doc('properties/'+S.propId).update({[f]:v}));return;}
  if(act==='cf'&&S.propId!=='all'){const f=t.dataset.f;const v=t.dataset.text?t.value.trim().toUpperCase():(t.value.trim()===''?null:num(t.value));await write(()=>db.doc('properties/'+S.propId).update({calc:{[f]:v}}));return;}
  if(act==='pb'&&S.propId!=='all'){await write(()=>db.doc('properties/'+S.propId).update({budgets:{[t.dataset.cat]:num(t.value)}}));return;}
  if(act==='payf'){const pid=tr?.dataset.pid;if(!pid)return;if(tr.dataset.kind==='card')await setTxn(pid,{paid:t.checked});else await write(()=>db.doc('payments/'+pid).update({paid:t.checked}));return;}
  if(act==='mr-file'&&S.modal){S.modal.file=t.files[0]||null;S.modal.err='';renderModal();return;}
  if(act==='pfile'&&t.files[0]){
    const p=S.props.get(S.propId); if(!p||!mcp){toast('Drive upload needs Google Drive connected.');return;}
    const f=t.files[0]; toast('Uploading to Drive…');
    try{const name=shortAddr(p.address)+' - '+f.name.replace(/[\/\\]/g,'-');const r=await uploadToDrive(f,name,folderId(S.L.propertyFolder||S.L.receiptFolder));
      await write(()=>db.doc('properties/'+p.id).update({files:[...(p.files||[]),{name,url:r.url,date:today()}]}));toast('Saved to Drive');}
    catch(err){toast(err?.code==='too_big'?'That file is too large for this viewer. Upload it in Drive and paste the link in Notes.':driveErr(err));}
    return;
  }
});
document.addEventListener('click',async e=>{
  const ta=e.target.closest('[data-tab]');
  if(ta){e.preventDefault();S.tab=ta.dataset.tab;S.confirm=null;history.replaceState(null,'','#'+S.tab);render();window.scrollTo(0,0);return;}
  const b=e.target.closest('[data-act]'); if(!b||b.tagName==='SELECT'||b.tagName==='INPUT') return;
  if(e.target.closest('a[href^="#"]')) e.preventDefault();
  const act=b.dataset.act, tr=b.closest('tr'), id=tr?.dataset.id;
  if(!/-yes$|^(del|clear-ex|payall|del-prop|del-pay)$/.test(act)) S.confirm=null;
  switch(act){
    case 'dcard': S.dCard=b.dataset.k; S.dMonth='all'; S.sel.clear(); break;
    case 'dview': S.dView=b.dataset.v; break;
    case 'toggle': S.draft[b.dataset.k]=!S.draft[b.dataset.k]; break;
    case 'parse-paste': if(!(S.draft.paste||'').trim()){toast('Paste rows from the statement first.');return;} S.preview=buildPreview(S.draft.paste,'Pasted rows',S.dCard); break;
    case 'cancel-import': S.preview=null; break;
    case 'do-import': await doImport(); return;
    case 'add-manual': {
      const desc=(S.draft['m-desc']||'').trim(), amount=r2(num(S.draft['m-amt'])), date=S.draft['m-date']||today();
      if(!desc||!amount){toast('Fill in the payee and amount.');return;}
      if(await write(()=>db.doc('txns/m-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)).set({card:S.dCard,date,desc,amount,status:'Posted',type:'',category:'',sub:'',propertyId:'',notes:'',receiptUrl:'',receiptName:'',paid:false,importedAt:new Date().toISOString(),source:'manual'}))){S.draft['m-desc']='';S.draft['m-amt']='';toast('Added. Categorize it below.');}
      break;
    }
    case 'del': S.confirm=id; break;
    case 'del-yes': {const c=S.confirm;S.confirm=null;await write(()=>db.doc('txns/'+c).delete());break;}
    case 'transfer': await transferSelected(); return;
    case 'untransfer': await write(()=>db.doc('txns/'+id).update({status:'Posted'})); toast('Back in Daily Expenses to edit'); break;
    case 'rcpt': { const t=S.txns.get(id); openModal({type:'rcpt',txnId:id,vendor:vendorFrom(t.desc),file:null,link:''}); return; }
    case 'rcpt-clear': await setTxn(id,{receiptUrl:'',receiptName:''}); break;
    case 'mr-upload': {
      const m=S.modal, t=S.txns.get(m.txnId); if(!m.file||m.busy) return;
      m.busy=true; m.err=''; renderModal();
      try{
        const parent=folderId(S.L.receiptFolder);
        const name=await uniqueName(amtStr(t.amount)+' - '+(m.vendor.trim()||'Vendor'),extOf(m.file),parent);
        const r=await uploadToDrive(m.file,name,parent);
        S.modal=null; renderModal(); await setTxn(t.id,{receiptUrl:r.url,receiptName:name}); toast('Saved to Drive as '+name);
      }catch(err){ m.busy=false; m.err=err?.code==='too_big'?'That file is too large for this viewer. Upload it in Drive and paste the link below.':driveErr(err); renderModal(); }
      return;
    }
    case 'mr-link': {
      const m=S.modal, link=(m.link||'').trim(); if(!/^https:\/\/(drive|docs)\.google\.com\//.test(link)){m.err='Paste a Google Drive link that starts with https://drive.google.com/';renderModal();return;}
      const tid=m.txnId; S.modal=null; renderModal(); await setTxn(tid,{receiptUrl:link,receiptName:''}); break;
    }
    case 'm-close': closeModal(); return;
    case 'tcard': S.tCard=b.dataset.k; break;
    case 'tbucket': S.tBucket=b.dataset.k; break;
    case 'tpaid': S.tPaid=b.dataset.v; break;
    case 'payall': S.confirm='payall'; break;
    case 'payall-yes': {S.confirm=null;const rows=transferred().filter(t=>t.card===S.tCard&&bucketOf(t.type)===S.tBucket&&!t.paid);for(const t of rows)await write(()=>db.doc('txns/'+t.id).update({paid:true,paidDate:today()}));toast(`Marked ${rows.length} as paid`);break;}
    case 'new-prop': openModal({type:'prop',addr:''}); return;
    case 'mp-create': {
      const m=S.modal, addr=(m.addr||'').trim(); if(!addr){toast('Type the address first.');return;}
      const ref=db.collection('properties').doc();
      if(!await write(()=>ref.set({address:addr,status:S.L.statuses[0]||'',budgets:{},files:[],createdAt:new Date().toISOString()}))) return;
      S.props.set(ref.id,{id:ref.id,address:addr}); S.modal=null; renderModal();
      if(m.txnId) await setTxn(m.txnId,{propertyId:ref.id}); else {S.propId=ref.id;S.tab='properties';history.replaceState(null,'','#properties');}
      break;
    }
    case 'pfilter': S.propFilter=b.dataset.k; break;
    case 'open-prop': S.propId=b.dataset.id; window.scrollTo(0,0); break;
    case 'del-prop': S.confirm='delprop'; break;
    case 'del-prop-yes': {const pid=S.propId;S.confirm=null;S.propId='all';await write(()=>db.doc('properties/'+pid).delete());toast('Property deleted. Its card charges stay on their cards.');break;}
    case 'add-bcat': {const c=(S.draft['nb-cat']||'').trim();if(!c)return;await write(()=>db.doc('properties/'+S.propId).update({budgets:{[c]:0}}));S.draft['nb-cat']='';break;}
    case 'add-pay': {
      const amount=r2(num(S.draft['np-amt'])),payee=(S.draft['np-payee']||'').trim(); if(!amount||!payee){toast('Fill in who was paid and the amount.');return;}
      if(await write(()=>db.collection('payments').add({propertyId:S.propId,date:S.draft['np-date']||today(),payee,sub:S.draft['np-sub']||'Contractor Service',method:S.draft['np-method']||S.L.methods[0],amount,notes:S.draft['np-notes']||'',paid:S.draft['np-paid']??true,createdAt:new Date().toISOString()}))){S.draft['np-payee']='';S.draft['np-amt']='';S.draft['np-notes']='';toast('Payment added');}
      break;
    }
    case 'del-pay': S.confirm='pay-'+tr.dataset.pid; break;
    case 'del-pay-yes': {const pid=S.confirm.slice(4);S.confirm=null;await write(()=>db.doc('payments/'+pid).delete());break;}
    case 'pfile-del': {const p=S.props.get(S.propId);const files=[...(p.files||[])];files.splice(Number(b.dataset.i),1);await write(()=>db.doc('properties/'+p.id).update({files}));break;}
    case 'save-settings': {
      const lines=k=>{const v=S.draft['ls-'+k];return v==null?S.L[k]:v.split('\n').map(x=>x.trim()).filter(Boolean);};
      const cs=cards().map(c=>({k:c.k,n:(S.draft['cn-'+c.k]??c.n).trim()||c.n}));
      const nw=(S.draft['cn-new']||'').trim(); if(nw) cs.push({k:(nw.toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,20)||'card')+Date.now().toString(36).slice(-3),n:nw});
      const data={cards:cs,types:lines('types'),categories:lines('categories'),subcategories:lines('subcategories'),methods:lines('methods'),statuses:lines('statuses'),
        receiptFolder:(S.draft['ls-receiptFolder']??S.L.receiptFolder??'').trim(),propertyFolder:(S.draft['ls-propertyFolder']??S.L.propertyFolder??'').trim(),requireReceipt:S.draft['ls-req']??S.L.requireReceipt};
      if(await write(()=>db.doc('settings/lists').set(data))){for(const k of Object.keys(S.draft))if(/^(ls-|cn-)/.test(k))delete S.draft[k];toast('Settings saved');}
      break;
    }
    case 'clear-ex': S.confirm='clear-ex'; break;
    case 'clear-ex-yes': {S.confirm=null;const jobs=[...[...S.txns.values()].filter(x=>x.example).map(x=>'txns/'+x.id),...[...S.pays.values()].filter(x=>x.example).map(x=>'payments/'+x.id)];for(const p of jobs)await write(()=>db.doc(p).delete());toast('Examples removed');break;}
    case 'cancel': S.confirm=null; break;
    default: return;
  }
  render();
});
document.addEventListener('dragover',e=>{const d=e.target.closest?.('#drop');if(d){e.preventDefault();d.classList.add('over');}});
document.addEventListener('dragleave',e=>{const d=e.target.closest?.('#drop');if(d)d.classList.remove('over');});
document.addEventListener('drop',async e=>{const d=e.target.closest?.('#drop');if(!d)return;e.preventDefault();const f=e.dataTransfer.files[0];if(!f)return;S.preview=buildPreview(await f.text(),f.name,S.dCard);render();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal)closeModal();});
window.addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(SECTIONS.some(x=>x.k===t)){S.tab=t;render();}});

/* ---------- boot ---------- */
render();
(async()=>{
  const c=window.claude; if(!c?.use){S.dbState='off';render();return;}
  db=await c.use('db'); if(!db){S.dbState='off';render();return;}
  const user=await c.use('user');
  try{const can=user?.can?await user.can('data.write'):null;if(can===false)S.readOnly=true;}catch{}
  S.dbState='live';
  const onErr=e=>{if(e?.code==='revoked'){S.dbState='off';render();}};
  const toMap=s=>new Map(s.docs.map(d=>[d.id,{id:d.id,...d.data()}]));
  db.collection('txns').onSnapshot(s=>{S.txns=toMap(s);S.ready.txns=true;scheduleRender();},onErr);
  db.collection('properties').onSnapshot(s=>{S.props=toMap(s);S.ready.props=true;scheduleRender();},onErr);
  db.collection('payments').onSnapshot(s=>{S.pays=toMap(s);scheduleRender();},onErr);
  db.doc('settings/lists').onSnapshot(d=>{S.L=d.exists?{...DEFAULTS,...d.data()}:{...DEFAULTS};scheduleRender();},onErr);
  render();
  try{ mcp=await c.use('mcp'); if(mcp){ const lt=await mcp.listTools().catch(()=>null); fileArgs=!!lt?.fileArgs; } }catch{ mcp=null; }
  render();
})();
</script>
