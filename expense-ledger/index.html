<title>Twin Home Expense Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: same system as Card Balances. Header, section tabs, a "View" dropdown or card tabs, then one working surface. */
:root{
  --ground:#EEF1F4; --surface:#FFFFFF; --surface-2:#F6F8FA;
  --ink:#18242F; --muted:#5A6B78; --faint:#8794A1;
  --line:#DCE2E8; --line-strong:#C6D0D8;
  --accent:#0C6E6B; --accent-soft:#D6E9E7; --accent-ink:#094B49; --on-accent:#FFFFFF;
  --warn:#9A5B0A; --warn-soft:#F5E6CE; --warn-line:#E4C68C;
  --bad:#B42318; --bad-soft:#FBE3DF;
  --good:#1F7A44; --good-soft:#DDF0E4;
  --k0:#0C6E6B; --k1:#2A6FDB; --k2:#C2412E; --k3:#7A2E22; --k4:#E07B00; --k5:#B8500B; --k6:#8A5A12; --k7:#8E1B3B; --k8:#5B4BB7; --k9:#3F7D20;
  --shadow-sm:0 1px 2px rgba(24,36,47,.05);
  --f-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono","SF Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ground:#0E141A; --surface:#161E26; --surface-2:#1C2732;
  --ink:#E7ECF1; --muted:#9DAAB6; --faint:#71808C;
  --line:#28333E; --line-strong:#37424E;
  --accent:#33B3AE; --accent-soft:#12332F; --accent-ink:#8FD8D3; --on-accent:#0E141A;
  --warn:#E0A85B; --warn-soft:#33280F; --warn-line:#5C4A22;
  --bad:#F2806F; --bad-soft:#3D1C18; --good:#5FBE84; --good-soft:#173325;
  --k0:#33B3AE; --k1:#6EA2F5; --k2:#EE7A66; --k3:#D08B7E; --k4:#F5A640; --k5:#DB8A4E; --k6:#C9A160; --k7:#E3708F; --k8:#9D90F0; --k9:#8BC86A;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --ground:#0E141A; --surface:#161E26; --surface-2:#1C2732;
  --ink:#E7ECF1; --muted:#9DAAB6; --faint:#71808C;
  --line:#28333E; --line-strong:#37424E;
  --accent:#33B3AE; --accent-soft:#12332F; --accent-ink:#8FD8D3; --on-accent:#0E141A;
  --warn:#E0A85B; --warn-soft:#33280F; --warn-line:#5C4A22;
  --bad:#F2806F; --bad-soft:#3D1C18; --good:#5FBE84; --good-soft:#173325;
  --k0:#33B3AE; --k1:#6EA2F5; --k2:#EE7A66; --k3:#D08B7E; --k4:#F5A640; --k5:#DB8A4E; --k6:#C9A160; --k7:#E3708F; --k8:#9D90F0; --k9:#8BC86A;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f-sans);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:24px 64px}
.mono,.amt{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}
a{color:var(--accent-ink)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}

header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 16px;margin-bottom:18px}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:4px 0 2px}
.subtitle{color:var(--muted);font-size:15px}
.badge-live{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent-ink);padding:4px 10px;border-radius:999px;font-weight:600;font-size:12px}
.badge-live .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.badge-live.off{background:var(--warn-soft);color:var(--warn)} .badge-live.off .dot{background:var(--warn)}

nav.sections{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
nav.sections a{padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav.sections a:hover{color:var(--ink)}
nav.sections a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.count{display:inline-block;min-width:18px;margin-left:6px;padding:0 6px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-size:11px;text-align:center;font-weight:700}

/* card tabs, like sheet tabs */
.cardtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.cardtabs button{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px;box-shadow:var(--shadow-sm)}
.cardtabs button:hover{border-color:var(--line-strong)}
.cardtabs button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cardtabs i,.chip i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.cardtabs .count{margin-left:0}

.toolbar{display:flex;align-items:center;gap:10px 12px;margin-bottom:16px;flex-wrap:wrap}
.toolbar .lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.select-shell{position:relative;flex:1;min-width:220px;max-width:460px}
.select-shell select{appearance:none;width:100%;font-weight:600;font-size:15px;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:11px;padding:10px 40px 10px 14px;cursor:pointer;box-shadow:var(--shadow-sm)}
.select-shell .chev{position:absolute;right:14px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted)}
.spacer{flex:1}

.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;box-shadow:var(--shadow-sm);min-width:0}
.tile .label{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .big{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:24px;letter-spacing:-.02em;margin-top:4px;line-height:1.15}
.tile .big.bad{color:var(--bad)} .tile .big.good{color:var(--good)} .tile .big.warn{color:var(--warn)}
.tile .foot{font-size:12.5px;color:var(--faint);margin-top:4px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm);min-width:0}
.panel-pad{padding:16px 18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}

.btn{border:1px solid var(--line-strong);background:var(--surface);padding:6px 12px;border-radius:9px;cursor:pointer;font-weight:600;white-space:nowrap;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.sm{padding:2px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.file-btn{position:relative;overflow:hidden;display:inline-block}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
select,input[type=text],input[type=date],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px;min-width:0}
select:hover,input:hover,textarea:hover{border-color:var(--line-strong)}
textarea{width:100%;resize:vertical}
label.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
label.field input,label.field select,label.field textarea{color:var(--ink);font-weight:400;font-size:14px}
.check{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-weight:600;color:var(--muted);font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink)}

.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:12px;font-weight:600}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.plain{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)} .pill.acc{background:var(--accent-soft);color:var(--accent-ink)}
.tag{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--warn);font-weight:700}
.note{background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:12px;padding:10px 14px;font-size:13px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.note.info{background:var(--surface-2);border-color:var(--line)}

/* tables */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:900px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:9px 8px;border-bottom:1px solid var(--line-strong);background:var(--surface-2);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13px}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 40%,transparent)}
td.amt,th.amt{text-align:right;white-space:nowrap}
td.amt.neg{color:var(--good)}
td.d{white-space:nowrap;color:var(--muted);font-family:var(--f-mono);font-size:12px}
td.payee{min-width:170px;max-width:260px;font-weight:500}
td select{max-width:180px;font-size:12.5px;padding:4px 6px}
td input.notes{width:100%;min-width:150px;font-size:12.5px;padding:4px 6px}
tfoot td{font-weight:700;border-top:1px solid var(--line-strong);background:var(--surface-2)}
.needs{font-size:11px;color:var(--warn);white-space:nowrap}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* card balance rows (overview) */
.rows{display:flex;flex-direction:column;gap:8px}
.brow{display:grid;grid-template-columns:220px 1fr 130px 130px;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 18px;box-shadow:var(--shadow-sm);cursor:pointer;text-align:left;width:100%}
.brow:hover{border-color:var(--accent)}
.brow .name{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.brow .amt{text-align:right;font-weight:600;font-size:17px}
.brow .amt small{display:block;font-size:10.5px;color:var(--faint);font-weight:400;letter-spacing:.03em;text-transform:uppercase;font-family:var(--f-sans)}
.track{height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.fill{height:100%;background:var(--accent)} .fill.over{background:var(--bad)}
@media (max-width:760px){ .brow{grid-template-columns:1fr auto} .brow .track,.brow .amt.paid{display:none} }

.btabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;padding-inline:8px}
.btabs button{border:0;background:transparent;padding:12px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.btabs button span{font-family:var(--f-mono);font-size:12px;font-weight:500;margin-left:6px}
.btabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* breakdown bars */
.bd{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px 28px}
.bd-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-size:13.5px}
.bd-row .track{grid-column:1/-1;height:8px}
.bd-row b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}

/* tracker groups */
details.grp{border-top:1px solid var(--line)}
details.grp:first-child{border-top:0}
details.grp>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:16px minmax(0,1fr) 140px 110px 120px;gap:10px;align-items:center;padding:10px 4px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .chev{transition:transform .15s;color:var(--muted)}
details.grp[open]>summary .chev{transform:rotate(90deg)}
details.grp>summary .gname{font-weight:600}
details.grp>summary .gname small{display:block;font-weight:400;color:var(--faint);font-size:12px}
details.grp>summary .amt{text-align:right}
details.grp>.gbody{padding:0 0 12px 26px}
@media (max-width:760px){details.grp>summary{grid-template-columns:16px minmax(0,1fr) auto}details.grp>summary .track,details.grp>summary .gun{display:none}}
.recon{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 22px;align-items:end}
.recon .k{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.recon .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:26px;line-height:1.15;margin-top:2px}
/* collapsible sections */
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm)}
details.sec>summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary h3{font-size:16px;font-weight:700}
details.sec>summary .sum{margin-left:auto;font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
details.sec>summary .chev{transition:transform .15s;color:var(--muted)}
details.sec[open]>summary .chev{transform:rotate(90deg)}
details.sec>.body{padding:0 18px 18px;display:flex;flex-direction:column;gap:14px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.pl{display:flex;flex-direction:column;gap:5px;max-width:460px}
.pl .line{display:flex;justify-content:space-between;gap:12px;font-size:13.5px}
.pl .line b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
.pl .total{border-top:2px solid var(--ink);padding-top:6px;font-weight:700}
.pl .total b{font-weight:700;font-size:16px}
.files{display:flex;flex-direction:column;gap:6px}

.drop{border:1.5px dashed var(--line-strong);border-radius:12px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;background:var(--surface-2)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:10px;font-weight:600;max-width:calc(100% - 32px)}
#toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:6px;padding:2px 8px;cursor:pointer;font-weight:700}
#modal{position:fixed;inset:0;z-index:60;background:rgb(0 0 0 / .4);display:flex;align-items:center;justify-content:center;padding:16px}
#modal .box{background:var(--surface);border-radius:14px;padding:20px;width:min(460px,100%);display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto}
.fname{font-family:var(--f-mono);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;word-break:break-all}
fieldset.ro{border:0;margin:0;padding:0;min-width:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Twin Home Buyer · Expenses</div>
      <h1>Twin Home Expense Ledger</h1>
      <div class="subtitle">Import each card, categorize, attach the receipt, and it transfers to the tracker.</div>
    </div>
    <span class="badge-live off" id="sync"><span class="dot"></span>Connecting…</span>
  </header>
  <nav class="sections" id="tabs" aria-label="Sections"></nav>
  <div id="app"></div>
</div>
<div id="toast" hidden></div>
<div id="modal" hidden></div>
<style>
.fx-vd{display:grid;grid-template-columns:10px 1fr;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.fx-vd>i{background:var(--faint)}.fx-vd.go>i{background:var(--good)}.fx-vd.wait>i{background:var(--warn)}.fx-vd.stop>i{background:var(--bad)}
.fx-vd .b{padding:16px 20px;min-width:0}
.fx-vd .q{font-size:13px;color:var(--muted)}
.fx-vd .a{font-size:24px;font-weight:700;line-height:1.2;margin:2px 0 6px}
.fx-vd.go .a{color:var(--good)}.fx-vd.wait .a{color:var(--warn)}.fx-vd.stop .a{color:var(--bad)}
.fx-vd .why{color:var(--ink);max-width:72ch;margin:0}
.fx-how{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}
.fx-how>summary{cursor:pointer;font-weight:700;font-size:13.5px}
.fx-how ol{margin:10px 0 0;padding-left:20px}.fx-how li{margin:0 0 10px}
.fx-math{display:block;background:var(--surface-2);border-radius:7px;padding:5px 9px;margin:4px 0;font-size:12.5px;overflow-x:auto;font-family:var(--f-mono)}
.fx-src{font-size:12px;color:var(--faint)}
.fx-say{background:var(--surface-2);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:8px 12px;margin-top:10px;font-size:13.5px}
.fx-say b{display:block;font-size:12px;color:var(--muted)}
.fx-chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.fx-chips button{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink)}
.fx-chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.fx-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.fx-chart{width:100%;height:auto;display:block}
.fx-chart text{fill:var(--muted);font-size:11px}
.fx-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.fx-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.fx-in{width:100%;min-width:90px}
.fx-tbl input,.fx-tbl select{width:100%;min-width:80px}
.fx-h{font-size:17px;font-weight:700;margin:22px 0 8px}
.fx-p{max-width:76ch;color:var(--muted);font-size:13.5px;margin:0 0 10px}

.fx-sub{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 10px;border-bottom:1px solid var(--line)}
.fx-sub button{border:0;background:none;padding:8px 12px;font-weight:600;font-size:13.5px;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
.fx-sub button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.fx-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
.fx-nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0 4px}
.fx-nums>div{background:var(--surface-2);border-radius:9px;padding:8px 10px}
.fx-nums span{display:block;font-size:12px;color:var(--muted)}
.fx-nums b{font-size:17px}.fx-nums b.good{color:var(--good)}.fx-nums b.bad{color:var(--bad)}.fx-nums b.warn{color:var(--warn)}
.fx-minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-bottom:18px}
.fx-mini{text-align:left;border:1px solid var(--line);border-left:6px solid var(--faint);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:3px;color:var(--ink);font:inherit}
.fx-mini.go{border-left-color:var(--good)}.fx-mini.wait{border-left-color:var(--warn)}.fx-mini.stop{border-left-color:var(--bad)}
.fx-mini .q{font-size:12.5px;color:var(--muted)}.fx-mini .a{font-size:17px;font-weight:700}.fx-mini .why{font-size:13px;color:var(--muted)}
.fx-mini.go .a{color:var(--good)}.fx-mini.wait .a{color:var(--warn)}.fx-mini.stop .a{color:var(--bad)}
.fx-flag{padding:6px 0;border-bottom:1px solid var(--line)}.fx-flag:last-child{border-bottom:0}
.fx-rline{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.fx-rline .dot{width:12px;height:12px;border-radius:50%;margin-top:4px;flex:0 0 auto;background:var(--faint)}
.fx-rline .dot.go{background:var(--good)}.fx-rline .dot.wait{background:var(--warn)}.fx-rline .dot.stop{background:var(--bad)}
</style>
<script>
/* ===== Controller section: one tab with sub-pages. Reads this ledger + the QuickBooks snapshot. ===== */
const FX={sub:'overview',q:'afford',obl:null,flip:null,pdf:'',pdfBusy:false,stress:{price:0,delay:0}};
const fxN=v=>{if(v==null||v==='')return null;const n=num(v);return isFinite(n)?n:null;};
const fxISO=()=>today();
const fxMonths=(a,b)=>{if(!a||!b)return null;const [y1,m1,d1]=a.split('-').map(Number),[y2,m2,d2]=b.split('-').map(Number);return Math.max(0,(y2-y1)*12+(m2-m1)+(d2>=d1?0:-1));};
const fxDays=(a,b)=>Math.round((Date.parse(b+'T12:00')-Date.parse(a+'T12:00'))/864e5);
const fxAddM=(ym,k)=>{let [y,m]=ym.split('-').map(Number);m+=k;while(m>12){m-=12;y++;}while(m<1){m+=12;y--;}return y+'-'+String(m).padStart(2,'0');};
const fxML=ym=>new Date(ym+'-01T12:00').toLocaleDateString('en-US',{month:'short',year:'numeric'});
const fxD=d=>d?new Date(d+'T12:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'—';
const fxPct=n=>n==null||!isFinite(n)?'—':Math.round(n*100)+'%';
const fxSet=()=>S.fxs||{};
const QB=()=>(S.fxQB&&S.fxQB.get('snapshot'))||null;
const fxWorst=c=>c.some(x=>x.s==='stop')?'stop':c.some(x=>x.s==='wait')?'wait':'go';
const pillOf=s=>s==='go'?'good':s==='stop'?'bad':s==='wait'?'warn':'plain';

/* ---------- ledger spending ---------- */
function fxAllRows(){
  const out=[];
  for(const c of cards()) for(const r of mergedRows(c.k)) out.push(r);
  for(const r of S.sheetRows) if(!cards().some(c=>c.k===r.card)) out.push(r);
  for(const p of S.pays.values()) out.push({amount:Number(p.amount)||0,date:p.date||'',bucket:'property',paid:!!p.paid,src:'payment'});
  return out;
}
function fxSpendByMonth(n){
  const rows=fxAllRows(), cur=fxISO().slice(0,7), months=[...Array(n)].map((_,i)=>fxAddM(cur,-(n-i)));
  const by=Object.fromEntries(months.map(m=>[m,{overhead:0,property:0,marketing:0,ppc:0}]));
  for(const r of rows){const m=(r.date||'').slice(0,7); if(!by[m]) continue; const b=r.bucket==='uncat'?'overhead':r.bucket; if(by[m][b]!=null) by[m][b]+=r.amount; if(b==='marketing'&&isPPC(r)) by[m].ppc+=r.amount;}
  return months.map(m=>({m,...by[m]}));
}
function fxRunRate(){const l=fxSpendByMonth(3),a=k=>r2(sum(l,x=>x[k])/3);return {months:l.map(x=>x.m),overhead:a('overhead'),property:a('property'),marketing:a('marketing'),ppc:a('ppc')};}

/* ---------- people & accounts ---------- */
const fxOpen=()=>[...(S.fxObls||new Map()).values()].filter(o=>!['Paid off','Returned','Sold'].includes(o.status));
const fxActive=p=>p&&['active'].includes(groupOf(p));
const fxBanksList=()=>[...(S.fxBanks||new Map()).values()].sort((a,b)=>(a.order||99)-(b.order||99)||(a.name||'').localeCompare(b.name||''));
function fxCash(){
  const q=QB(), banks=fxBanksList().filter(b=>b.company!==false);
  const cash=banks.length?r2(sum(banks,b=>fxN(b.balance)||0)):null;
  const tracker=r2(sum(cards(),c=>cardBalance(c.k).balance));
  const qbCards=q?.bs?.cardsTotal??null;
  const cardDebt=Math.max(tracker,qbCards||0), cl=fxCardList(), cardsOwed=r2(sum(cl,c=>c.min)), cardsEst=cl.filter(c=>c.est).length;
  const ap=q?.bs?.ap||0;
  const fixed=r2(sum(fxOpen().filter(o=>o.paysMonthly!==false),o=>fxN(o.monthly)||0));
  const cushion=fxN(fxSet().cushion)||0;
  const free=cash==null?null:r2(cash-cardsOwed-ap-fixed-cushion);
  return {banks,cash,tracker,qbCards,cardDebt,cardsOwed,cardsEst,ap,fixed,cushion,free,asOf:banks.map(b=>b.asOf).filter(Boolean).sort()[0]||null};
}

/* ---------- decision card ---------- */
function fxCard(v,open){
  return `<section class="fx-vd ${v.level}"><i aria-hidden="true"></i><div class="b">
    <div class="q">${esc(v.q)}</div><div class="a">${esc(v.a)}</div><p class="why">${esc(v.why)}</p>
    ${v.nums&&v.nums.length?`<div class="fx-nums">${v.nums.map(([k,val,s])=>`<div><span>${esc(k)}</span><b class="${s?pillOf(s):''}">${esc(val)}</b></div>`).join('')}</div>`:''}
    ${v.steps&&v.steps.length?`<details class="fx-how"${open?' open':''}><summary>Show me how we got this</summary><ol>${v.steps.map(c=>`<li><b>${esc(c.t)}</b> <span class="pill ${pillOf(c.s)}">${{go:'OK',wait:'Check',stop:'Problem',info:'Step'}[c.s]}</span><div>${esc(c.d)}</div>${c.m?`<code class="fx-math">${esc(c.m)}</code>`:''}<div class="fx-src">From: ${esc(c.src||'This ledger')}</div></li>`).join('')}</ol></details>`:''}
    ${v.say?`<div class="fx-say"><b>If Juan asks, say</b>${esc(v.say)}</div>`:''}</div></section>`;
}

/* ---------- 1. can we afford it ---------- */
function fxAfford(amtRaw){
  const C=fxCash(), amt=fxN(amtRaw), q=QB();
  if(C.cash==null) return {level:'wait',q:'Can we afford this?',a:'Can’t answer yet',why:'No bank balances yet.',nums:[],steps:[]};
  const st=[
    {s:'info',t:'Cash in company bank accounts',d:`${C.banks.length} company accounts. Juan’s personal accounts are left out.`,m:C.banks.map(b=>`${b.name} ${money0(fxN(b.balance))}`).join(' + ')+` = ${money0(C.cash)}`,src:q?`QuickBooks Balance Sheet, ${fxD(q.asOf)}`:'Banks'},
    {s:C.cardsEst?'wait':'info',t:'Minus this month’s card payments',d:`We pay the minimum (or what’s needed), not the full balance.${C.cardsEst?` ${C.cardsEst} card${C.cardsEst>1?'s don’t':' doesn’t'} have a minimum entered yet, so I estimate 2% of the balance. Type the real minimum in Banks.`:''}`,m:money0(C.cardsOwed),src:'Banks → card minimums'},
    {s:'wait',t:'Card debt we keep carrying',d:`The full card balance (${money0(C.cardDebt)}) is still debt and costs interest. It isn’t taken out here, but it isn’t free money either.${C.qbCards!=null&&Math.abs(C.qbCards-C.tracker)>1000?` QuickBooks says ${money0(C.qbCards)}; the card tracker says ${money0(C.tracker)}; they should match.`:''}`,m:`Card debt ${money0(C.cardDebt)} (not subtracted)`,src:'QuickBooks + Card Tracker'},
    {s:'info',t:'Minus bills entered in QuickBooks',d:'Vendor bills waiting to be paid (Accounts Payable).',m:money0(C.ap),src:'QuickBooks A/P'},
    {s:'info',t:'Minus this month’s loan and lease payments',d:'Mortgages on active flips, vehicles, equipment.',m:money0(C.fixed),src:'Loans & Vehicles'},
    {s:C.cushion?'info':'wait',t:'Minus the safety cushion',d:C.cushion?'Money we never spend.':'Not set yet. Ask Juan for the minimum to always keep.',m:money0(C.cushion),src:'Banks'},
    ...C.banks.filter(b=>/investor|reserved/i.test(b.note||'')).map(b=>({s:'wait',t:`${b.name} may be set aside`,d:`${b.note}. If that money is only for that project, free cash is up to ${money0(fxN(b.balance))} lower.`,m:'Counted for now',src:'Banks'})),
    {s:C.free>=0?'go':'stop',t:'Free cash',d:'What’s left to decide on.',m:`${money0(C.cash)} − ${money0(C.cardsOwed)} − ${money0(C.ap)} − ${money0(C.fixed)} − ${money0(C.cushion)} = ${money0(C.free)}`}];
  let level=C.free>=0?'go':'stop',a=C.free>=0?`${money0(C.free)} is free to spend`:`We’re ${money0(-C.free)} short`,why='Everything we already owe comes out first.';
  if(amt){const left=r2(C.free-amt);
    if(left>=0){level='go';a='Yes, we can afford it';why=`After paying ${money0(amt)} we still have ${money0(left)} free.`;}
    else if(C.cushion&&left+C.cushion>=0){level='wait';a='Only by using the cushion';why=`It’s ${money0(-left)} more than free cash. That’s Juan’s call.`;}
    else{level='stop';a='No, not right now';why=`We’d be ${money0(-left)} short after paying what we owe.`;}
    st.push({s:level,t:'Compare to the payment',d:why,m:`${money0(C.free)} − ${money0(amt)} = ${money0(left)}`});}
  return {level,q:amt?`Can we afford ${money0(amt)}?`:'How much can we spend right now?',a,why,
    nums:[['Cash in the bank',money0(C.cash)],['Due this month',money0(C.cardsOwed+C.ap+C.fixed)],['Free to spend',money0(C.free),C.free>=0?'go':'stop'],['Card debt carried',money0(C.cardDebt),'wait']],
    steps:st,say:`${a}. We have ${money0(C.cash)} in company accounts; after this month’s card minimums, bills and loan payments, ${money0(C.free)} is free. We still carry ${money0(C.cardDebt)} of card debt.`};
}

/* ---------- 2. making money (QuickBooks) ---------- */
function fxProfit(){
  const q=QB(); if(!q?.pl) return {level:'wait',q:'Are we making money this year?',a:'Waiting for QuickBooks',why:'Ask Claude to refresh QuickBooks.',nums:[],steps:[]};
  const p=q.pl, mk=p.marketingTotal, oh=r2(p.netOperating!=null?p.grossProfit-p.netOperating:0);
  const level=p.netOperating>=0?'go':'stop';
  return {level,q:`Are we making money in ${p.year}?`,a:p.netOperating>=0?`Yes, ${money0(p.netOperating)} so far`:`Not yet: down ${money0(-p.netOperating)} so far`,
    why:`The flips themselves made ${money0(p.grossProfit)}. Running the company (marketing, legal, payroll, office) cost ${money0(oh)}, which is more than the flips made.${mk?` Marketing alone was ${money0(mk)}.`:''}`,
    nums:[['Sold (property sales)',money0(p.propertySales)],['Profit from flips',money0(p.grossProfit),'go'],['Company running costs',money0(oh),'stop'],['Left over',money0(p.netOperating),level]],
    steps:[{s:'info',t:'Money in',d:'Property sales, wholesale fees and rent.',m:`${money0(p.propertySales)} sales + ${money0(p.wholesale)} wholesale fees + ${money0(p.rental)} rent = ${money0(p.income)}`,src:`QuickBooks Profit & Loss, ${p.period}`},
      {s:'info',t:'Minus the cost of the houses',d:'Buying price, rehab, closing costs, commissions and loan interest on each flip.',m:`${money0(p.income)} − ${money0(p.income-p.grossProfit)} = ${money0(p.grossProfit)} profit from flips (${fxPct(p.grossProfit/p.income)} of sales)`,src:'QuickBooks P&L, Cost of Goods Sold'},
      {s:'stop',t:'Minus the cost of running the company',d:'Biggest items below.',m:(p.topCosts||[]).map(([k,v])=>`${k} ${money0(v)}`).join(' · '),src:'QuickBooks P&L, Expenses'},
      {s:level,t:'Left over',d:'This is the company’s profit or loss.',m:`${money0(p.grossProfit)} − ${money0(oh)} = ${money0(p.netOperating)}`,src:'QuickBooks P&L'}],
    say:`So far in ${p.year} we sold ${money0(p.propertySales)} of property. The flips made ${money0(p.grossProfit)}, but running the company cost ${money0(oh)}, so we are ${p.netOperating>=0?'up':'down'} ${money0(Math.abs(p.netOperating))}. Marketing is the biggest cost at ${money0(mk)}.`};
}

/* ---------- 3. marketing (QuickBooks + deals + KPI sheet) ---------- */
const FX_CH=[
  {id:'ppc',n:'PPC (Google ads)',qb:['AM - PPC'],test:r=>isPPC(r)||/digital marketing/i.test(r.cat||'')},
  {id:'dm',n:'Direct mail',qb:['AM- Direct Mail'],test:r=>/direct mail|postcard/i.test(r.cat||'')},
  {id:'leads',n:'Bought leads',qb:['AM - Property Leads','AM - Motivated Leads'],test:r=>/property leads|motivated leads|leadgeeks|investorbase/i.test(r.cat||'')},
  {id:'tv',n:'TV (Bullseye)',qb:['AM - Bullseye'],test:r=>/^tv$|commercial/i.test(r.cat||'')},
  {id:'social',n:'Facebook & social',qb:['AM - Facebook','AM - Reddit'],test:r=>/facebook|reddit|meta/i.test(r.cat||'')},
  {id:'tools',n:'Tools & other',qb:['AM - Tech','AM - Other','AM - Smarter Contact'],test:r=>/sales acquisition|marketing tools|technology/i.test(r.cat||'')}
];
function fxChannels(){
  const q=QB(), yr=fxISO().slice(0,4), rows=marketingRows().filter(r=>(r.date||'').startsWith(yr)), left=new Set(rows);
  return FX_CH.map(c=>{const mine=rows.filter(r=>left.has(r)&&c.test(r)); mine.forEach(r=>left.delete(r));
    const d=(S.fxCh||new Map()).get(c.id)||{}, qbSpend=q?.pl?.marketing?r2(sum(c.qb,k=>q.pl.marketing[k]||0)):null, ledger=r2(sum(mine));
    const spend=qbSpend??ledger, deals=fxN(d.deals)||0, fees=fxN(d.fees)||0;
    return {...c,d,spend,ledger,qbSpend,deals,fees,pending:d.pending||'',ratio:spend?fees/spend:null,cpd:deals?spend/deals:null};});
}
function fxChVerdict(c){
  const target=fxN(fxSet().targetCPD)||15000, rule=fxN(fxSet().juanRule)||20000;
  if(c.id==='tools') return {s:'info',a:'Shared cost',why:'Supports every channel.'};
  if(!c.deals) return c.spend>=rule?{s:'stop',a:'Stop or pause',why:`${money0(c.spend)} spent and no signed deal this year.`}:{s:'info',a:'Too small to judge',why:`${money0(c.spend)} spent, no deal yet.`};
  return c.cpd<=target?{s:'go',a:'Keep',why:`${money0(c.cpd)} per deal, at or under the ${money0(target)} target.`}:c.cpd<=target*2?{s:'wait',a:'Keep, but cut cost',why:`${money0(c.cpd)} per deal. Target is ${money0(target)}.`}:{s:'stop',a:'Cut back',why:`${money0(c.cpd)} per deal, more than double the ${money0(target)} target.`};
}
function fxMarketing(){
  const ch=fxChannels(), q=QB(), tot=r2(sum(ch,c=>c.spend)), deals=sum(ch,c=>c.deals), target=fxN(fxSet().targetCPD)||15000, cpd=deals?tot/deals:null;
  const level=cpd==null?'stop':cpd<=target?'go':cpd<=target*2?'wait':'stop';
  return {level,q:`Is marketing working in ${fxISO().slice(0,4)}?`,a:level==='go'?'Yes':level==='wait'?'Partly':'No, it costs too much per deal',
    why:`We spent ${money0(tot)} on marketing and got ${deals} signed deals. That’s ${money0(cpd)} for each deal. Our target is ${money0(target)} a deal.`,
    nums:[['Spent on marketing',money0(tot)],['Signed deals',String(deals)],['Cost per deal',money0(cpd),level],['Target per deal',money0(target)]],
    steps:ch.filter(c=>c.spend||c.deals).map(c=>{const v=fxChVerdict(c);return {s:v.s,t:`${c.n}: ${v.a}`,d:v.why,m:`spent ${money0(c.spend)}${c.qbSpend!=null&&Math.abs(c.qbSpend-c.ledger)>500?` (QuickBooks; ledger shows ${money0(c.ledger)})`:''} · ${c.deals} deal${c.deals===1?'':'s'}${c.cpd?` · ${money0(c.cpd)} each`:''}${c.pending?` · pending: ${c.pending}`:''}`,src:'QuickBooks P&L (Acquisition Marketing) + Acquired Properties sheet for deals'};}),
    say:`This year marketing cost ${money0(tot)} for ${deals} signed deals, about ${money0(cpd)} per deal against a ${money0(target)} target. ${ch.filter(c=>fxChVerdict(c).s==='stop').map(c=>c.n).join(' and ')||'No channel'} should be cut or paused.`};
}
function fxPPC(){
  const s=fxSet(), C=fxCash(), daily=Number(S.L.ppcDailyLimit)||750, need=daily*30, start=S.L.ppcStart||'';
  const ch=fxChannels().find(c=>c.id==='ppc'), d=ch.d, target=fxN(s.targetCPD)||15000, pause=fxN(s.ppcPause)||40000, alert=fxN(s.ppcAlert)||25000;
  const ppcRows=marketingRows().filter(isPPC), last=d.lastContract||'', since=last?r2(sum(ppcRows.filter(r=>r.date>last))):null;
  const el=fxN(d.leads), nr=fxN(d.neverReached);
  const st=[
    {s:ch.cpd<=target?'go':'stop',t:'Cost per signed deal',d:`${ch.deals} PPC deals this year.`,m:`${money0(ch.spend)} ÷ ${ch.deals} = ${money0(ch.cpd)} per deal · target ${money0(target)}`,src:'QuickBooks P&L (AM - PPC) + Acquired Properties sheet'},
    since!=null?{s:since>=pause?'stop':since>=alert?'wait':'go',t:'Spent since the last signed PPC deal',d:since>=pause?`Past the ${money0(pause)} pause line.`:'Below the pause line.',m:`Since ${fxD(last)}: ${money0(since)}${ch.pending?` · pending: ${ch.pending}`:''}`,src:'Marketing tab (Google/Bing charges)'}:null,
    el?{s:nr/el<=.2?'go':nr/el<=.3?'wait':'stop',t:'Leads we paid for but never reached',d:'Every unreached lead is wasted ad money.',m:`${nr} of ${el} = ${fxPct(nr/el)} · healthy is 20% or less`,src:d.leadSource||'Bateman PPC Lead KPI Dashboard'}:null,
    C.free==null?null:{s:C.free>=need?'go':'stop',t:'Cash for one month of ads',d:'',m:`${money0(daily)} × 30 = ${money0(need)} · free cash ${money0(C.free)}`,src:'Free cash'},
    ch.qbSpend!=null&&Math.abs(ch.qbSpend-ch.ledger)>500?{s:'wait',t:'QuickBooks and the ledger don’t match',d:'Some Google charges are in one and not the other. Reconcile before reporting.',m:`QuickBooks ${money0(ch.qbSpend)} vs ledger ${money0(ch.ledger)}`,src:'QuickBooks + Marketing tab'}:null].filter(Boolean);
  const level=fxWorst(st), live=start&&fxISO()>=start;
  const a=level==='go'?'Go':level==='wait'?'Go, with conditions':'Not yet';
  const fixes=st.filter(x=>x.s==='stop').map(x=>x.t.toLowerCase());
  return {level,q:live?'Is PPC making progress?':`Should PPC relaunch${start?` on ${fxD(start)}`:''}?`,a,
    why:level==='go'?'The numbers support it.':`Fix first: ${fixes.join('; ')}.`,
    nums:[['PPC spend this year',money0(ch.spend)],['Signed PPC deals',String(ch.deals)],['Cost per deal',money0(ch.cpd),ch.cpd<=target?'go':'stop'],el?['Leads never reached',fxPct(nr/el),nr/el<=.2?'go':'stop']:null].filter(Boolean),
    steps:st,say:`PPC: ${a}. This year it cost ${money0(ch.spend)} for ${ch.deals} signed deals, ${money0(ch.cpd)} per deal against a ${money0(target)} target.${el?` ${fxPct(nr/el)} of leads were never reached.`:''} Relaunch only with the $750/day cap, the $40K pause line, and every lead called the same day.`};
}

/* ---------- 4. loans, vehicles, equipment ---------- */
const FX_KINDS=['Mortgage','Vehicle loan','Vehicle lease','Equipment loan','Private loan','Owned (no payment)','Not confirmed'];
const FX_GROUPS=[['Mortgage','Mortgages on active flips'],['Vehicle loan','Vehicles'],['Vehicle lease','Vehicles'],['Owned (no payment)','Vehicles'],['Not confirmed','Vehicles'],['Equipment loan','Equipment'],['Private loan','Private & investor loans']];
const fxGroupOf=o=>(FX_GROUPS.find(g=>g[0]===o.kind)||[0,'Vehicles'])[1];
function fxObl(o){
  const m=fxN(o.monthly)||0, owed=fxN(o.balance), worth=fxN(o.value), eq=owed!=null&&worth!=null?r2(worth-owed):null, st=[];
  const personal=/personal|family/i.test(o.assigned||'');
  const left=o.endDate?fxMonths(fxISO(),o.endDate):null;
  if(owed!=null) st.push({s:'info',t:'What we still owe',d:'',m:money0(owed),src:o.balSrc||'QuickBooks Balance Sheet'});
  if(worth!=null) st.push({s:'info',t:'What it’s worth',d:o.valueSrc||'',m:money0(worth),src:o.valueSrc||'Entered'});
  if(eq!=null) st.push({s:eq>=0?'go':'wait',t:eq>=0?'Worth more than we owe':'We owe more than it’s worth',d:'',m:`${money0(worth)} − ${money0(owed)} = ${money0(eq)}`});
  if(personal) st.push({s:'wait',t:'Personal use, paid by the company',d:`Used by ${o.assigned}. Personal vehicle payments should be booked as owner draws, not business costs. Confirm with the CPA.`});
  let level='go',a='Keep paying',why='';
  if(o.kind==='Mortgage'){
    const p=o.propertyId?S.props.get(o.propertyId):null;
    if(p&&!fxActive(p)){level='stop';a='Check: property no longer active';why='This loan should be paid off or moved. Confirm with the lender.';}
    else{a='Keep paying until it sells';why=`Each month this flip doesn’t sell costs about ${m?money0(m):'its interest'}. Selling on time is what protects the profit.`;}
  } else if(o.kind==='Vehicle lease'){
    if(left!=null&&left<=1){level='stop';a=`Act now: lease ends ${fxD(o.endDate)}`;why='Ask for an extension first, then compare return, buy out, or exchange.';}
    else{const buy=fxN(o.buyout);
      if(buy!=null&&worth!=null){const g=r2(worth-buy);level='go';a=g>0?'Buy it out or trade it in':'Return it at the end';why=g>0?`It’s worth ${money0(g)} more than the buyout.`:`The buyout is ${money0(-g)} more than it’s worth.`;st.push({s:'info',t:'Worth vs buyout',m:`${money0(worth)} − ${money0(buy)} = ${money0(g)}`});}
      else{level='wait';a='Get the buyout quote';why=`Ask the lender for the buyout price and a dealer for a trade-in offer. Then this says return, buy, or exchange.${left!=null?` ${left} payments left (${money0(m*left)}).`:''}`;}}
  } else if(o.kind==='Vehicle loan'||o.kind==='Equipment loan'){
    if(owed!=null&&owed<=0){level='wait';a='Looks paid off: confirm';why=`QuickBooks shows ${money0(owed)} owed. If it’s paid off, stop the monthly payment and mark it Paid off.`;}

const FX_SELL=()=>{const q=QB()?.pl;return {comm:fxN(fxSet().commissionRate)??(q?.commissionRate??5),close:fxN(fxSet().sellCloseRate)??(q?.sellCloseRate??1.5)};};
function fxFlip(p){

  const buyCosts=fxN(f.buyCosts)||0, spent=st.total, left=fxN(f.rehabLeft)??Math.max(0,(hold||0)-spent), daily=fxN(f.dailyInterest)||0;
  const start=f.interestFrom||f.purchaseDate||'', end=f.saleDate||'', days=start&&end?Math.max(0,fxDays(start,end)):0;

  const qb=QB()?.bs?.props?.[p.id]||null;
  return {p,f,buy,sale:sale2,loan,hold,buyCosts,spent,left,daily,days:days2,interest,comm,close,costs,profit,cashBack,cashIn,sell,qb,ready:buy!=null&&sale!=null};
}

function fxReportItems(){
  const P=fxProfit(),A=fxAfford(''),F=fxForecast().card,M=fxMarketing(),PP=fxPPC();
  const one=v=>v.say||v.why;
  const Wk=fxWeekCard(fxWeek());
  const answers=[{...Wk,one:Wk.why},{...P,one:P.why},{...A,one:A.why},{...F,one:F.why},{...M,one:M.why},{...PP,one:PP.why}];
  const asks=[];
  if(!fxN(fxSet().cushion)) asks.push('Tell me the minimum cash to always keep in the bank.');
  if(PP.level!=='go') asks.push('Approve PPC relaunch only with the $750/day cap and the $40K pause line, after sales confirms every lead gets called the same day.');
  for(const o of fxOpen()){const v=fxObl(o); if(v.level==='stop') asks.push(`${o.name}: ${v.a}.`);}
  for(const b of (QB()?.blind||[]).filter(b=>b.sev==='High').slice(0,3)) asks.push(`${b.title}: ${b.todo}`);

}

const fxT=s=>String(s??'').replace(/[−–—]/g,'-').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/·/g,'|').replace(/…/g,'...').replace(/→/g,'->').replace(/×/g,'x').replace(/÷/g,'/').replace(/[^\x20-\x7E\n]/g,'');
function fxLoadPDF(){return window.jspdf?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';s.onload=res;s.onerror=()=>rej(new Error('pdf'));document.head.appendChild(s);});}
async function fxPDF(title,blocks){
  await fxLoadPDF(); const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:'pt',format:'letter'});
  const W=612,L=48,R=W-48,CW=R-L; let y=0;
  const COL={go:[31,122,68],wait:[154,91,10],stop:[180,35,24],info:[90,107,120],ink:[24,36,47],mut:[90,107,120],line:[220,226,232],acc:[12,110,107]};
  const page=()=>{doc.addPage();y=56;};
  const need=h=>{if(y+h>740)page();};
  const text=(t,size,style,color,indent=0,lh=1.35)=>{doc.setFont('helvetica',style||'normal');doc.setFontSize(size);doc.setTextColor(...(color||COL.ink));const lines=doc.splitTextToSize(fxT(t),CW-indent);for(const ln of lines){need(size*lh);doc.text(ln,L+indent,y+size);y+=size*lh;}};
  // header
  doc.setFillColor(...COL.acc);doc.rect(0,0,W,6,'F');y=40;
  text(title,20,'bold');text(`Equity Track Inc. / Twin Home Buyer  |  Prepared by Kristine, Accounting  |  ${fxD(fxISO())}`,9,'normal',COL.mut);y+=8;
  for(const b of blocks){
    if(b.t==='h'){y+=10;need(30);text(b.x,13,'bold');doc.setDrawColor(...COL.line);doc.line(L,y+1,R,y+1);y+=8;}
    else if(b.t==='p'){text(b.x,10,'normal',COL.ink);y+=4;}
    else if(b.t==='v'){const v=b.v;need(90);const top=y,pg=doc.getNumberOfPages();doc.setFillColor(...COL[v.level]||COL.info);
      y+=6;text(v.q,9,'normal',COL.mut,14);text(v.a,15,'bold',COL[v.level]||COL.ink,14);text(v.why,10,'normal',COL.ink,14);
      if(b.steps&&v.steps?.length){y+=2;text('How we got this:',9,'bold',COL.mut,14);v.steps.forEach((s,i)=>{text(`${i+1}. ${s.t}: ${s.d}`,9,'normal',COL.ink,24);if(s.m)text(s.m,8.5,'normal',COL.mut,34);});}
      if(v.say){y+=2;text('If you ask me: '+v.say,9,'italic',COL.ink,14);}
      doc.setFillColor(...(COL[v.level]||COL.info));if(doc.getNumberOfPages()===pg)doc.rect(L,top,4,y-top,'F');y+=12;}
    else if(b.t==='tbl'){const n=b.head.length,cw=CW/n;need(20);doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(...COL.mut);b.head.forEach((c,i)=>doc.text(fxT(c),b.right?.includes(i)?L+cw*(i+1)-4:L+cw*i,y+9,{align:b.right?.includes(i)?'right':'left'}));y+=14;doc.setDrawColor(...COL.line);doc.line(L,y,R,y);y+=4;
      doc.setFont('helvetica','normal');doc.setTextColor(...COL.ink);for(const r of b.rows){const cells=r.map((c,i)=>doc.splitTextToSize(fxT(c),cw-8));const h=Math.max(...cells.map(c=>c.length))*11+4;need(h);cells.forEach((c,i)=>doc.text(c,b.right?.includes(i)?L+cw*(i+1)-4:L+cw*i,y+9,{align:b.right?.includes(i)?'right':'left'}));y+=h;doc.line(L,y,R,y);y+=2;}y+=8;}
    else if(b.t==='bars'){const H=150;need(H+30);const max=Math.max(1,...b.d.map(d=>b.k.reduce((t,k)=>t+Math.max(0,d[k]||0),0))),gap=CW/b.d.length,bw=gap*.6,base=y+H;doc.setFontSize(8);
      b.d.forEach((d,i)=>{let yy=base;const x=L+i*gap+(gap-bw)/2;b.k.forEach((k,j)=>{const h=Math.max(0,d[k]||0)/max*(H-20);yy-=h;doc.setFillColor(...b.c[j]);doc.rect(x,yy,bw,h,'F');});doc.setTextColor(...COL.mut);doc.text(fxT(d.label),x+bw/2,base+11,{align:'center'});});
      doc.setDrawColor(...COL.line);doc.line(L,base,R,base);doc.text(fxT(money0(max)),L,y+6);y=base+22;let lx=L;b.l.forEach((l,j)=>{doc.setFillColor(...b.c[j]);doc.rect(lx,y-7,8,8,'F');doc.setTextColor(...COL.mut);doc.text(fxT(l),lx+12,y);lx+=doc.getTextWidth(fxT(l))+28;});y+=14;}
    else if(b.t==='line'){const H=150;need(H+34);const rows=b.rows,vals=rows.flatMap(r=>[r.base,r.up]).concat([b.cushion||0,0]),mx=Math.max(...vals),mn=Math.min(...vals),sp=mx-mn||1;
      const X=i=>L+40+i*(CW-50)/Math.max(1,rows.length-1),Y=v=>y+8+(mx-v)/sp*(H-20);doc.setFontSize(8);doc.setTextColor(...COL.mut);doc.text(fxT(money0(mx)),L,Y(mx)+3);doc.text(fxT(money0(mn)),L,Y(mn)+3);
      doc.setDrawColor(...COL.line);doc.line(L+40,Y(0),R,Y(0));if(b.cushion){doc.setDrawColor(...COL.wait);doc.setLineDashPattern([4,3],0);doc.line(L+40,Y(b.cushion),R,Y(b.cushion));doc.setLineDashPattern([],0);}
      doc.setLineWidth(2);doc.setDrawColor(...COL.acc);rows.forEach((r,i)=>{if(i)doc.line(X(i-1),Y(rows[i-1].base),X(i),Y(r.base));});doc.setLineWidth(1);
      rows.forEach((r,i)=>{doc.setFillColor(...(r.base<0?COL.stop:COL.acc));doc.circle(X(i),Y(r.base),2.5,'F');doc.setTextColor(...COL.mut);doc.text(fxT(fxML(r.m)),X(i),y+H+4,{align:'center'});doc.text(fxT(money0(r.base)),X(i),Y(r.base)-6,{align:'center'});});
      y+=H+16;doc.setFontSize(8);doc.text(fxT('Line: cash by month, counting only confirmed money in.'+(b.cushion?' Dashed: safety cushion.':'')),L,y);y+=14;}
  }
  const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(...COL.mut);doc.text(fxT(`Numbers from QuickBooks${QB()?' ('+fxD(QB().asOf)+')':''} and the Twin Home Expense Ledger. Page ${i} of ${n}`),L,770);}
  return doc.output('blob');
}
async function fxSavePDF(title,blocks,fname){
  if(!mcp){toast('Saving the PDF needs Google Drive connected to this page.');return;}
  FX.pdfBusy=true;render();
  try{const blob=await fxPDF(title,blocks);const name=`${fname} - ${fxISO()}.pdf`;const r=await uploadToDrive(new File([blob],name,{type:'application/pdf'}),name,folderId(fxSet().reportsFolder||''));FX.pdf=r.url;toast('PDF saved to Google Drive');}
  catch(e){toast(e?.message==='pdf'?'Could not load the PDF maker. Check your connection.':e?.code==='too_big'?'The PDF is too large for this viewer.':driveErr(e));}
  FX.pdfBusy=false;render();
}

/* ---------- CSV import ---------- */
function parseCSV(text){
  const first=text.split(/\r?\n/)[0]||''; const sep=first.includes('\t')&&!first.includes(',')?'\t':',';
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true; else if(c===sep){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';}
    else f+=c;}
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows.map(r=>r.map(x=>x.trim())).filter(r=>r.some(x=>x!==''));
}
function normDate(s){s=String(s||'').trim();let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))){let y=m[3];if(y.length===2)y='20'+y;return`${y}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;}
  const d=new Date(s);return isNaN(d)?'':d.toISOString().slice(0,10);}
function hash(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}return(h>>>0).toString(36);}
const isCardPayment=d=>/\b(payment|autopay|auto pay|thank you|pymt|online pmt)\b/i.test(d);
function buildPreview(text,fileName,card){
  const rows=parseCSV(text); let hi=-1,cols=null;
  for(let i=0;i<Math.min(rows.length,15);i++){
    const h=rows[i].map(x=>x.toLowerCase());
    const find=res=>{for(const re of res){const j=h.findIndex(x=>re.test(x));if(j>=0)return j;}return -1;};
    const date=find([/^trans(action)?\.? ?date/,/^date$/,/^posted? ?date/,/^posting date/,/date/]);
    const desc=find([/^description/,/^merchant/,/^payee/,/^name/,/details|memo/]);
    const amount=find([/^amount/]); const debit=find([/^debit/,/^charges?$/]); const credit=find([/^credit/,/^payments?$/]);
    const status=find([/^status/]);
    if(date>=0&&desc>=0&&(amount>=0||debit>=0)){hi=i;cols={date,desc,amount,debit,credit,status};break;}
  }
  if(hi<0) return {card,error:'Could not find Date, Description and Amount columns. Export the activity as CSV from the card website, or paste rows that include the header line.'};
  const parsed=[];
  for(const r of rows.slice(hi+1)){
    const date=normDate(r[cols.date]); if(!date) continue;
    let amt;
    if(cols.debit>=0&&(r[cols.debit]||'')!=='') amt=Math.abs(num(r[cols.debit]));
    else if(cols.credit>=0&&(r[cols.credit]||'')!=='') amt=-Math.abs(num(r[cols.credit]));
    else if(cols.amount>=0) amt=num(r[cols.amount]); else continue;
    const st=cols.status>=0&&/pend/i.test(r[cols.status]||'')?'Pending':'Posted';
    parsed.push({date,desc:(r[cols.desc]||'').replace(/\s+/g,' '),raw:amt,status:st});
  }
  if(!parsed.length) return {card,error:'The file had a header row but no transactions under it.'};
  const negs=parsed.filter(p=>p.raw<0).length;
  return {fileName,card,parsed,flip:cols.debit<0&&negs>parsed.length/2,removeGone:true};
}
function previewRows(p){
  // A file row counts as already here when the same card has a charge for the same amount within 3 days,
  // in the ledger (any status, any source) or in the card's tracker sheet. Each existing charge can match one file row,
  // so two real identical charges in the file still come in as two.
  const seen={},rows=[],pays=[];let payments=0;
  const near=(a,b)=>Math.abs(dayNum(a)-dayNum(b))<=3;
  const ledger=[...S.txns.values()].filter(t=>t.card===p.card), sheet=S.sheetRows.filter(r=>r.card===p.card);
  const claimedL=new Set(), claimedS=new Set();
  for(const r of p.parsed){
    const amount=r2(p.flip?-r.raw:r.raw);
    if(amount<0&&isCardPayment(r.desc)){payments++;const pid=(`${p.card}-${r.date}-${Math.round(-amount*100)}-pay`).replace(/[^A-Za-z0-9_\-.~:@+]/g,'_');pays.push({id:pid,date:r.date,amount:-amount,desc:r.desc,dupe:S.cpays.has(pid)});continue;}
    const base=`${p.card}-${r.date}-${Math.round(amount*100)}-${hash(r.desc.toLowerCase())}`;
    seen[base]=(seen[base]||0)+1;
    const id=(base+'-'+seen[base]).replace(/[^A-Za-z0-9_\-.~:@+]/g,'_');
    const cents=Math.round(amount*100);
    let ex=S.txns.get(id); if(ex&&claimedL.has(ex.id)) ex=null;
    if(!ex) ex=ledger.find(t=>!claimedL.has(t.id)&&Math.round(t.amount*100)===cents&&near(t.date,r.date))||null;
    let why='';
    if(ex){ claimedL.add(ex.id); why='Already here'; }
    else { const sr=sheet.find(x=>!claimedS.has(x.id)&&Math.round(x.amount*100)===cents&&near(x.date,r.date)); if(sr){ claimedS.add(sr.id); why='In card sheet'; } }
    rows.push({...r,amount,id,matchId:ex?.id||'',dupe:!!why,why,statusChange:!!(ex&&ex.status==='Pending'&&r.status==='Posted')});
  }
  const dates=rows.map(r=>r.date).sort(); const lo=dates[0],hi=dates[dates.length-1];
  const csvSource=t=>t.source&&!['manual','example','Daily Expense Tracker'].includes(t.source)&&!/^Daily Expense Tracker/.test(t.source);
  const gone=lo?ledger.filter(t=>t.status!=='Transferred'&&csvSource(t)&&!t.example&&t.date>=lo&&t.date<=hi&&!claimedL.has(t.id)):[];
  return {rows,payments,pays,gone,lo,hi};
}
async function doImport(){
  const p=S.preview; if(!p) return;

  S.importing=true; render();
  const now=new Date().toISOString(); let failed=0, carried=0;
  // keep work done on a pending row whose amount changed when it posted
  const goneByKey=new Map(); if(p.removeGone) for(const g of gone) goneByKey.set(g.date+'|'+hash((g.desc||'').toLowerCase()),g);
  const jobs=[
    ...fresh.map(r=>async()=>{
      const prev=goneByKey.get(r.date+'|'+hash(r.desc.toLowerCase()));
      const carry=prev?{type:prev.type||'',category:prev.category||'',sub:prev.sub||'',propertyId:prev.propertyId||'',notes:prev.notes||'',receiptUrl:prev.receiptUrl||'',receiptName:prev.receiptName||''}:{};
      if(prev) carried++;
      await db.doc('txns/'+r.id).set({card:p.card,date:r.date,desc:r.desc,amount:r.amount,status:r.status,type:'',category:'',sub:'',propertyId:'',notes:'',receiptUrl:'',receiptName:'',paid:false,importedAt:now,source:p.fileName||'paste',...carry});
    }),
    ...upd.map(r=>async()=>{ await db.doc('txns/'+r.matchId).update({status:'Posted'}); }),
    ...(p.removeGone?gone.map(g=>async()=>db.doc('txns/'+g.id).delete()):[]),
    ...newPays.map(x=>async()=>db.doc('cardpays/'+x.id).set({card:p.card,date:x.date,amount:x.amount,desc:x.desc,source:p.fileName||'paste'}))
  ];
  let i=0; const total=jobs.length;
  async function worker(){ while(jobs.length){ const j=jobs.shift(); try{await j();}catch(e){failed++; if(e?.code==='invalid_argument'){S.readOnly=true;jobs.length=0;}} i++; const el=$('#imp-prog'); if(el) el.textContent=`Saving ${i} of ${total}…`; } }
  await Promise.all([worker(),worker(),worker(),worker()]);
  S.importing=false; S.preview=null; S.draft.paste=''; S.dView='todo';
  render();
  const parts=[`${fresh.length} new`]; if(newPays.length) parts.push(`${newPays.length} card payment${newPays.length===1?'':'s'} recorded`); if(upd.length) parts.push(`${upd.length} now posted`); if(p.removeGone&&gone.length) parts.push(`${gone.length} removed`); if(carried) parts.push(`${carried} kept your edits`);
  toast((failed?`${failed} rows did not save. Import the file again to retry. `:'')+`${cardName(p.card)}: `+parts.join(', '));
}

function cardForTab(name){
  const n=String(name||'').toUpperCase().replace(/\s+/g,' ').trim();
  if(/GIFT CARD|RELAY|WELLS|CALC|SETTINGS/.test(n)) return null;
  const digits=(n.match(/\d{4}/)||[])[0];
  for(const c of cards()){ const cn=c.n.toUpperCase(); if(digits&&cn.includes(digits)) return c.k; }
  if(/AMEX|AMERICAN EXPRESS/.test(n)) return cards().find(c=>/amex|american express/i.test(c.n))?.k||null;
  if(/CAPITAL ONE PERSONAL/.test(n)) return cards().find(c=>/capital one personal/i.test(c.n))?.k||null;
  if(/CAPITAL ONE BUSINESS/.test(n)) return cards().find(c=>/capital one business/i.test(c.n))?.k||null;
  if(/DISCOVER/.test(n)) return cards().find(c=>/discover/i.test(c.n))?.k||null;
  if(/CITI/.test(n)) return cards().find(c=>/citi/i.test(c.n))?.k||null;
  if(/BOA|BANK OF AMERICA/.test(n)) return cards().find(c=>/boa|bank of america/i.test(c.n))?.k||null;
  return null;
}

  S.dtBusy=`Saving ${jobs.length} rows…`; render(); let failed=0;
  const q=[...jobs]; async function w(){while(q.length){const j=q.shift();try{await j();}catch{failed++;}}} await Promise.all([w(),w(),w(),w()]);
  S.dtBusy=''; S.dtPreview=null; render(); toast(`Imported ${added} new, filled in ${updated}`+(failed?`, ${failed} failed (import again to retry)`:''));
}

function sheetDate(v){ if(v instanceof Date&&!isNaN(v)) return v.toISOString().slice(0,10); const s=String(v??'').trim(); let m;
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return m[0];
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/))&&m[3]>='1990') return `${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`; return ''; }
function parseCardSheet(wb,src){
  const out=[]; const notes=[];
  for(const [tab,card,bucket] of src.tabs){
    const ws=wb.Sheets[tab]; if(!ws){notes.push(`Tab “${tab}” not found`);continue;}
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
    const hi=rows.slice(0,15).findIndex(r=>r&&r.some(c=>/^date$/i.test(String(c??'').trim()))); if(hi<0){notes.push(`No header on “${tab}”`);continue;}
    const H=rows[hi].map(c=>String(c??'').trim().toLowerCase()); const ix=n=>H.indexOf(n);
    let cA,cP,cDesc,cVen,cCat,cProp=ix('property'),cRc=ix('receipts link'),cSub=-1;
    if(src.marketing){ const u=ix('usage frequency'); cA=u+1; cP=u+2; cDesc=ix('simple charge description'); cVen=ix('vendor name'); cCat=ix('marketing type'); cSub=ix('lead channel'); }
    else { cP=H.findIndex(h=>h==='paid'); cA=ix('amount')>=0?ix('amount'):(cP>=0?cP+1:-1); cDesc=ix('description'); cVen=ix('vendor'); cCat=ix('category')>=0?ix('category'):ix('bucket'); cSub=ix('expense type'); }
    const cD=H.findIndex(h=>h==='date');
    if(cA<0){notes.push(`No amount column on “${tab}”`);continue;}
    const noPaid=cP<0; if(noPaid) notes.push(`“${tab}” has no Paid column, so its rows count as paid`);
    for(let i=hi+1;i<rows.length;i++){ const r=rows[i]||[]; const a=r[cA]; if(a==null||a===''||typeof a==='boolean'||a instanceof Date||isNaN(Number(a))) continue;
      const amount=Math.round(Number(a)*100)/100; if(!amount) continue; const date=sheetDate(r[cD]); if(!date) continue;
      const pv=noPaid?true:r[cP]; const paid=pv===true||String(pv).toUpperCase()==='TRUE';
      const vendor=String(r[cVen]??'').trim(), desc=String(r[cDesc]??'').trim();
      const rc=cRc>=0?(ws[XLSX.utils.encode_cell({r:i,c:cRc})]?.l?.Target||(/^https?:/.test(String(r[cRc]??''))?String(r[cRc]):'')):'';
      out.push({card,bucket,tab,date,vendor,desc,amount,paid,cat:String(r[cCat]??'').trim(),sub:cSub>=0?String(r[cSub]??'').trim():'',prop:cProp>=0?String(r[cProp]??'').replace(/["']/g,'').trim():'',rc});
    }
  }
  return {rows:out,notes};
}

const PACK=['card','bucket','tab','date','vendor','desc','amount','paid','cat','sub','prop','rc'];
const pack=r=>PACK.map(k=>r[k]);
const unpack=a=>Object.fromEntries(PACK.map((k,i)=>[k,a[i]]));
async function syncCardSheets(){
  if(!mcp||!window.XLSX||S.csSync) return; S.csSync='Reading card tracker sheets from Drive…'; S.csErr=''; render();
  const at=new Date().toISOString(); let ok=0;
  for(const src of CARD_SHEETS){
    S.csSync=`Reading ${src.name}…`; render();
    try{
      const r=await mcp.callTool(DRIVE,'download_file_content',{fileId:src.file,exportMimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'},{cache:false});
      const wb=XLSX.read(r.payload?.content||'',{type:'base64',cellDates:true});
      const {rows,notes}=parseCardSheet(wb,src);
      const packed=rows.map(pack), size=700, chunks=Math.max(1,Math.ceil(packed.length/size));
      S.sheets[src.file]={fetchedAt:at,notes,rows};
      if(db){ for(let i=0;i<chunks;i++) await db.doc(`cardsheet/${src.file}-${i}`).set({file:src.file,i,rows:packed.slice(i*size,(i+1)*size)});
        await db.doc(`cardsheetmeta/${src.file}`).set({file:src.file,name:src.name,fetchedAt:at,chunks,notes,count:rows.length,cfgVer:CS_VER}); }
      ok++;
    }catch(e){ S.csErr=`${src.name}: ${driveErr(e)}`; }
  }
  S.csSync=''; rebuildSheetRows(); render(); if(ok) toast(`Read ${ok} card tracker sheets from Drive`);
}
function rebuildSheetRows(){
  // from the db cache unless a fresh read is in memory
  const out=[];
  for(const src of CARD_SHEETS){
    if(S.sheets[src.file]?.rows){ out.push(...S.sheets[src.file].rows.map((r,i)=>({...r,id:'s:'+src.file+':'+i,src:'sheet'}))); continue; }
    const meta=S.csMeta.get(src.file); if(!meta) continue;
    for(let i=0;i<meta.chunks;i++){ const ch=S.csChunks.get(`${src.file}-${i}`); if(!ch) continue; ch.rows.forEach((a,j)=>out.push({...unpack(a),id:`s:${src.file}:${i}:${j}`,src:'sheet'})); }
  }
  S.sheetRows=out;
}
const dayNum=d=>Math.round(Date.parse(d+'T12:00:00Z')/864e5);
function ledgerView(t){ return {...t,src:'ledger',bucket:bucketOf(t.type)||'uncat',cat:t.category||'',sub:t.sub||'',prop:propName(t.propertyId),vendor:'',rc:t.receiptUrl||''}; }
function mergedRows(card){
  const sheet=S.sheetRows.filter(r=>r.card===card).map(r=>({...r,ledger:null}));
  const byAmt=new Map(); for(const r of sheet){const k=Math.round(r.amount*100);if(!byAmt.has(k))byAmt.set(k,[]);byAmt.get(k).push(r);}
  const extra=[];
  for(const t of S.txns.values()){ if(t.card!==card) continue;
    const m=(byAmt.get(Math.round(t.amount*100))||[]).find(r=>!r.ledger&&Math.abs(dayNum(r.date)-dayNum(t.date))<=3);
    if(m){ m.ledger=t; if(!m.rc&&t.receiptUrl) m.rc=t.receiptUrl; } else extra.push(ledgerView(t)); }
  return [...sheet,...extra];
}
function cardBalance(k){
  const info=S.cinfo.get(k)||{}, rows=mergedRows(k);
  const sheetUnpaid=sum(rows.filter(r=>r.src==='sheet'&&!r.paid)), ledgerUnpaid=sum(rows.filter(r=>r.src==='ledger'&&!r.paid));
  const balance=r2(sheetUnpaid+ledgerUnpaid), has=info.siteBalance!=null&&info.siteBalance!=='';

/* ----- Draws (lender holdback) ----- */
// Each draw: amount approved out of the holdback, the lender's inspection fee (also taken from the holdback),
// how much of it has reached us so far, and where the whole draw amount went.
const dAmt=d=>Number(d.amount)||0, dFee=d=>Number(d.fee)||0, dRecv=d=>Math.min(Number(d.received)||0,dAmt(d));
const drawStatus=d=>dRecv(d)>=dAmt(d)&&dAmt(d)>0?'Disbursed':dRecv(d)>0?'Partly disbursed':'Pending';
function drawStats(p){
  const list=[...S.drawsMap.values()].filter(d=>d.propertyId===p.id).sort(byDate);
  const holdback=Number(p.holdback)||0, drawn=sum(list,dAmt), fees=sum(list,dFee), disbursed=sum(list,dRecv);
  const pending=r2(drawn-disbursed), used=r2(list.reduce((a,d)=>a+sum(d.uses||[]),0));
  const lender=p.lenderRemaining==null||p.lenderRemaining===''?null:Number(p.lenderRemaining);
  const calc=holdback?r2(holdback-drawn-fees):null;
  // what is left: the lender's own "remaining to fund" when entered, else holdback − draws − fees
  const remaining=lender!=null?lender:(calc??0);
  return {list,holdback,drawn,fees,disbursed,pending,remaining,calc,lender,diff:lender!=null&&calc!=null?r2(calc-lender):null,impliedHoldback:lender!=null?r2(lender+drawn+fees):null,used,unassigned:r2(drawn-used)};
}
const drawProps=()=>[...S.props.values()].filter(p=>Number(p.holdback)>0||(p.lenderRemaining!=null&&p.lenderRemaining!=='')||[...S.drawsMap.values()].some(d=>d.propertyId===p.id)).sort((a,b)=>(a.address||'').localeCompare(b.address||''));
function viewDraws(){
  const ps=drawProps();
  if(!ps.length) return `<div class="panel"><div class="empty"><b>No properties with a holdback yet</b>Open a property in Properties and add its holdback.</div></div>`;
  if(S.drawProp!=='all'&&!ps.some(p=>p.id===S.drawProp)) S.drawProp='all';
  let h=`<div class="cardtabs" role="group" aria-label="Property"><button data-act="dprop" data-k="all" aria-pressed="${S.drawProp==='all'}">All properties</button>${ps.map(p=>{const s=drawStats(p);return `<button data-act="dprop" data-k="${esc(p.id)}" aria-pressed="${S.drawProp===p.id}">${esc(shortAddr(p.address))}${s.pending>0?`<span class="count">${money0(s.pending)}</span>`:''}</button>`;}).join('')}</div>`;
  if(S.drawProp==='all'){
    const st=ps.map(p=>({p,s:drawStats(p)})), T=k=>sum(st,x=>x.s[k]);
    const hb=x=>x.s.holdback||x.s.impliedHoldback||0, totalHb=sum(st,hb);
    const pcT=v=>totalHb?Math.max(0,Math.min(100,v/totalHb*100)):0;
    h+=`<div class="summary">
      <div class="tile"><div class="label">Total holdback</div><div class="big">${money0(totalHb)}</div><div class="foot">${ps.length} properties</div></div>
      <div class="tile"><div class="label">Disbursed to us</div><div class="big good">${money0(T('disbursed'))}</div></div>
      <div class="tile"><div class="label">Pending</div><div class="big warn">${money0(T('pending'))}</div><div class="foot">drawn, not received yet</div></div>
      <div class="tile"><div class="label">Inspection fees</div><div class="big">${money0(T('fees'))}</div></div>
      <div class="tile"><div class="label">Left to fund</div><div class="big">${money0(T('remaining'))}</div><div class="foot">still at the lenders</div></div>

function ttaxRates(city,price){
  const c=TTAX[city]; if(!c) return [0,0]; let cr=c[1],co=c[2];
  if(city==='BERKELEY') cr=price<2500000?15:25;
  if(city==='OAKLAND') cr=price<=300000?10:15;
  if(city==='RICHMOND') cr=price<1000000?7:12.5;
  if(city==='CULVER') cr=price<1500000?4.5:19.5;
  if(city==='SAN FRANCISCO') cr=price>=1000000?7.5:6.8;
  return [cr,co];
}
function cityFrom(addr){
  const A=' '+String(addr||'').toUpperCase().replace(/[.,#]/g,' ').replace(/\s+/g,' ')+' ';
  let best=''; for(const k of Object.keys(TTAX)) if(A.includes(' '+k+' ')&&k.length>best.length) best=k;
  return best;
}
const CALC_DEF={months:3,commissionRate:5,liens:0,insurance:0,marketingFee:0,vtCommission:850,cesarCommission:1255,points:1,rate:9.95,constLoan:0,constPoints:5,constRate:12,airbnb:0,engineering:0,admin:0,inspection:0,staging:0,escrow:1000,legal:0,inhouseRate:2.5,offer:0,redfin:0};
function calcInputs(p,s){
  const c={...CALC_DEF}; for(const [k,v] of Object.entries(p.calc||{})) if(v!=null&&v!=='') c[k]=v;
  if(c.hardCosts==null) c.hardCosts=Math.max(s.budget,s.total);
  if(c.loan==null) c.loan=Number(p.loanAmount)||0;
  if(c.city==null) c.city=cityFrom(p.address);
  c.purchase=Number(p.purchasePrice)||0; c.sale=Number(p.salePrice)||0;
  return c;
}
function twin(c,sale){
  const m=(Number(c.months)||0)/12, n=k=>Number(c[k])||0;
  const commission=sale*n('commissionRate')/100;
  const finance=n('points')/100*m*n('loan')+n('constPoints')/100*m*n('constLoan')+n('rate')/100*m*n('loan')+n('constRate')/100*m*n('constLoan');
  const [cr,co]=ttaxRates(c.city,c.purchase); const transfer=(cr+co)*c.purchase/1000;
  const propTax=0.01*m*((sale+c.purchase)/2);
  const soft=n('airbnb')+n('engineering')+n('admin')+n('inspection')+n('staging')+propTax+transfer+n('escrow')+n('legal');
  const other=n('liens')+n('insurance')+n('marketingFee')+n('vtCommission')+n('cesarCommission');
  const net=sale-commission-soft-finance-n('hardCosts')-other-c.purchase;
  const inhouse=sale*n('inhouseRate')/100, gross=net+inhouse;
  const oop=(c.purchase-n('loan'))+finance+soft;
  const roi=oop>0&&m>0?(net/2)/oop/m:null;
  return {sale,commission,finance,transfer,propTax,soft,other,hard:n('hardCosts'),net,inhouse,gross,oop,roi};
}
function breakEven(c){const a=twin(c,0).net,b=twin(c,1000000).net;const k=(b-a)/1000000;return k>0?-a/k:null;}

function propStats(p){
  const cardRows=transferred().filter(t=>bucketOf(t.type)==='property'&&t.propertyId===p.id);
  const payRows=[...S.pays.values()].filter(x=>x.propertyId===p.id);
  const prior=p.prior||null, after=d=>!prior?.asOf||(d||'')>prior.asOf; // the Drive tracker already counts anything on or before its date
  const all=[...cardRows.filter(t=>after(t.date)).map(t=>({amount:t.amount,paid:!!t.paid,sub:t.sub})),...payRows.filter(x=>after(x.date)).map(x=>({amount:Number(x.amount)||0,paid:!!x.paid,sub:x.sub}))];
  const priorTotal=prior?r2(Object.values(prior.byCat||{}).reduce((a,b)=>a+(Number(b)||0),0)):0;
  const byCat={}; for(const x of all){const k=x.sub||'Uncategorized'; byCat[k]=r2((byCat[k]||0)+x.amount);}
  if(prior) for(const [k,v] of Object.entries(prior.byCat||{})) byCat[k]=r2((byCat[k]||0)+(Number(v)||0));
  const priorUnpaid=prior?Number(prior.unpaid)||0:0;
  const total=r2(sum(all)+priorTotal), unpaid=r2(sum(all.filter(x=>!x.paid))+priorUnpaid), paid=r2(total-unpaid);
  const budget=r2(Object.values(p.budgets||{}).reduce((a,b)=>a+(Number(b)||0),0));
  const g=k=>Number(p[k])||0, carrying=r2(g('mortgageMonthly')*g('monthsHeld'));
  const cashIn=r2(g('emd')+g('fundsToClose')+total+carrying-(p.holdbackReceived?g('holdback'):0));
  const st={cardRows,payRows,byCat,total,paid,unpaid,priorTotal,cardTotal:sum(cardRows.filter(t=>after(t.date))),otherTotal:sum(payRows.filter(x=>after(x.date)),x=>x.amount),budget,carrying,cashIn,over:budget>0&&total>budget,holdPending:p.holdbackReceived?0:g('holdback')};
  const c=calcInputs(p,st); st.calc=c; st.profit=c.sale?r2(twin(c,c.sale).net):null;
  return st;
}

/* ---------- receipts (card charges and property payments) ---------- */
const MONTHS=['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
const _monthFolders={};
// Card folder → month folder ("SEPTEMBER 2026"), created when it doesn't exist yet
async function receiptParent(m){
  const t=m.coll==='txns'?S.txns.get(m.rid):S.pays.get(m.rid);
  const cardF=m.coll==='txns'?folderId((S.L.cardFolders||{})[t?.card]):'';
  const base=cardF||folderId(S.L.receiptFolder); if(!cardF||!t?.date||!mcp) return base;
  const label=MONTHS[Number(t.date.slice(5,7))-1]+' '+t.date.slice(0,4), key=cardF+'|'+label;
  if(_monthFolders[key]) return _monthFolders[key];
  try{
    const r=await mcp.callTool(DRIVE,'search_files',{query:`parentId = '${cardF}' and mimeType = 'application/vnd.google-apps.folder' and title contains '${label}'`,pageSize:10,excludeContentSnippets:true},{cache:false});
    const hit=(r.payload?.files||[]).find(f=>String(f.title||'').trim().toUpperCase()===label);
    if(hit?.id) return _monthFolders[key]=hit.id;
    const c=await mcp.callTool(DRIVE,'create_file',{title:label,parentId:cardF,mimeType:'application/vnd.google-apps.folder'});
    const id=(c.payload?.file||c.payload||{}).id; if(id) return _monthFolders[key]=id;
  }catch{}
  return cardF;
}
function rcptRef(tr){ if(tr?.dataset.pid) return tr.dataset.kind==='pay'?{coll:'payments',rid:tr.dataset.pid}:{coll:'txns',rid:tr.dataset.pid}; return {coll:'txns',rid:tr?.dataset.id}; }
function rcptRec(m){ if(m.coll==='payments'){const x=S.pays.get(m.rid);return x?{amount:Number(x.amount)||0,desc:x.payee}:null;} const t=S.txns.get(m.rid);return t?{amount:t.amount,desc:t.desc}:null; }
async function saveReceipt(m,patch){ if(m.coll==='payments') await write(()=>db.doc('payments/'+m.rid).update(patch)); else await setTxn(m.rid,patch); render(); }

    S.apRowBusy=null; render(); return;

    const f=t.files[0]; toast('Uploading to Drive…');
    try{const name=shortAddr(p.address)+' - '+f.name.replace(/[\/\\]/g,'-');const r=await uploadToDrive(f,name,folderId(S.L.propertyFolder||S.L.receiptFolder));
      await write(()=>db.doc('properties/'+p.id).update({files:[...(p.files||[]),{name,url:r.url,date:today()}]}));toast('Saved to Drive');}
    catch(err){toast(err?.code==='too_big'?'That file is too large for this viewer. Upload it in Drive and paste the link in Notes.':driveErr(err));}
    return;

});
document.addEventListener('click',async e=>{

        S.modal=null; renderModal(); await saveReceipt(m,{receiptUrl:r.url,receiptName:name}); toast('Saved to Drive as '+name);
      }catch(err){ m.busy=false; m.err=err?.code==='too_big'?'That file is too large for this viewer. Upload it in Drive and paste the link below.':driveErr(err); renderModal(); }

    case 'vw-search': {const q=(S.draft['vw-q']||'').trim();try{S.vwHits=S.user?.search?(await S.user.search(q)).filter(p=>p.id&&p.id!==S.uid).slice(0,6):[];}catch{S.vwHits=[];}if(!S.vwHits.length)toast('No one found. Share the page with them first, then search again.');break;}
    case 'vw-add': {const id=b.dataset.id;S.vwHits=[];S.draft['vw-q']='';await write(()=>db.doc('settings/lists').set({...S.L,viewers:{...(S.L.viewers||{}),[id]:{view:'report'}}}));break;}
    case 'vw-del': {const id=b.closest('tr').dataset.vid,v={...(S.L.viewers||{})};delete v[id];await write(()=>db.doc('settings/lists').set({...S.L,viewers:v}));break;}
    case 'brief-copy': {const t=briefText(briefData()); try{await navigator.clipboard.writeText(t);toast('Brief copied. Paste it into an email or message to Juan.');}catch{openModal({type:'brief',text:t});} return;}
    case 'ap-send': await write(()=>db.doc('ap/'+tr.dataset.ap).update({status:'Waiting on Juan'})); break;
    case 'ap-dec': {const id=tr.dataset.ap,v=b.dataset.v; if(v==='Approved'&&S.isOwner&&!apReview(S.ap.get(id)).mine){toast(`Above your ${money0(POL().limit)} limit${POL().alwaysJuan?' / vendor payments need Juan':''}. Juan approves this one.`);return;} if(v==='Note'){S.apNote=id;await write(()=>db.doc('ap/'+id).update({status:'Note',decision:{by:S.uid||'',at:new Date().toISOString(),note:''}}));break;}
      S.apNote=null; await write(()=>db.doc('ap/'+id).update({status:v,decision:{by:S.uid||'',at:new Date().toISOString(),note:''}})); break;}
    case 'ap-note-save': {const id=tr.dataset.ap,n=(S.draft['apn-'+id]||'').trim(); if(bankBlocked(n)) return; await write(()=>db.doc('ap/'+id).update({decision:{by:S.uid||'',at:new Date().toISOString(),note:n}})); S.apNote=null; break;}
    case 'ap-all': S.confirm='ap-all'; break;
    case 'ap-all-yes': {S.confirm=null; const at=new Date().toISOString(); for(const x of [...S.ap.values()].filter(x=>x.status==='Waiting on Juan'&&(!S.isOwner||apReview(x).mine))) await write(()=>db.doc('ap/'+x.id).update({status:'Approved',decision:{by:S.uid||'',at,note:''}})); toast('All waiting bills approved'); break;}
    case 'ap-paid': await write(()=>db.doc('ap/'+tr.dataset.ap).update({status:'Paid',paidDate:today()})); toast('Marked paid'); break;
    case 'ap-del': S.confirm='apd-'+tr.dataset.ap; break;
    case 'ap-del-yes': {const id=S.confirm.slice(4);S.confirm=null;await write(()=>db.doc('ap/'+id).delete());break;}
    case 'ci2-add': {const amount=r2(num(S.draft['ci2-a'])),label=(S.draft['ci2-l']||'').trim();if(!amount||!label){toast('Fill in what it is and the amount.');return;} if(bankBlocked(label)) return;
      if(await write(()=>db.collection('cashitems').add({date:S.draft['ci2-d']||today(),label,kind:S.draft['ci2-k']||'out',amount:Math.abs(amount),createdAt:new Date().toISOString()}))){S.draft['ci2-a']='';S.draft['ci2-l']='';}break;}
    case 'ci2-del': await write(()=>db.doc('cashitems/'+tr.dataset.cid).delete()); break;
    case 'rk-flag': await write(()=>db.doc('properties/'+b.dataset.pid).update({flaggedAt:new Date().toISOString(),flaggedBy:S.uid||'',riskStatus:'Raised with Juan'})); toast('Recorded: flagged to Juan'); break;
    case 'rk-add': {const pid=S.draft['rk-add'];if(!pid)return;await write(()=>db.doc('properties/'+pid).update({inRegister:true}));S.draft['rk-add']='';break;}
    case 'add-draw': {const pid=b.dataset.pid;const amount=r2(num(S.draft['da-'+pid]));if(!amount){toast('Type the draw amount.');return;}
      if(await write(()=>db.collection('draws').add({propertyId:pid,date:S.draft['dd-'+pid]||today(),amount,fee:r2(num(S.draft['df-'+pid])),received:r2(num(S.draft['dr-'+pid])),note:(S.draft['dn-'+pid]||'').trim(),uses:[],createdAt:new Date().toISOString()}))){for(const k of ['da-','df-','dr-','dn-'])S.draft[k+pid]='';toast('Draw added');}break;}
    case 'del-draw': S.confirm='dw-'+b.dataset.did; break;
    case 'del-draw-yes': {const id=b.dataset.did;S.confirm=null;await write(()=>db.doc('draws/'+id).delete());break;}
    case 'add-use': {const id=b.dataset.did,d=S.drawsMap.get(id);if(!d)return;const amount=r2(num(S.draft['ua-'+id])),to=(S.draft['ut-'+id]||'').trim();if(!amount||!to){toast('Fill in where the money went and the amount.');return;}
      if(await write(()=>db.doc('draws/'+id).update({uses:[...(d.uses||[]),{date:S.draft['ud-'+id]||today(),to,category:S.draft['uc-'+id]||'Contractor Service',amount}]}))){S.draft['ua-'+id]='';S.draft['ut-'+id]='';}break;}
    case 'del-use': {const id=b.dataset.did,d=S.drawsMap.get(id);if(!d)return;const uses=[...(d.uses||[])];uses.splice(Number(b.dataset.i),1);await write(()=>db.doc('draws/'+id).update({uses}));break;}
    case 'dt-read': await importDailyFromDrive(); return;
    case 'dt-commit': await commitDailyImport(); return;
    case 'dt-cancel': S.dtPreview=null; break;
    case 'clear-ex': S.confirm='clear-ex'; break;
    case 'clear-ex-yes': {S.confirm=null;const jobs=[...[...S.txns.values()].filter(x=>x.example).map(x=>'txns/'+x.id),...[...S.pays.values()].filter(x=>x.example).map(x=>'payments/'+x.id)];for(const p of jobs)await write(()=>db.doc(p).delete());toast('Examples removed');break;}
    case 'cancel': S.confirm=null; break;
    default: return;
  }
  render();
});
document.addEventListener('dragover',e=>{const d=e.target.closest?.('#drop');if(d){e.preventDefault();d.classList.add('over');}});
document.addEventListener('dragleave',e=>{const d=e.target.closest?.('#drop');if(d)d.classList.remove('over');});
document.addEventListener('drop',async e=>{const d=e.target.closest?.('#drop');if(!d)return;e.preventDefault();const f=e.dataTransfer.files[0];if(!f)return;S.preview=buildPreview(await f.text(),f.name,S.dCard);render();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal)closeModal();});
window.addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(SECTIONS.some(x=>x.k===t)){S.tab=t;render();}});

const CS_VER=2; // bump when CARD_SHEETS tabs change so open pages re-read Drive
function maybeAutoSync(){ if(!mcp||!S.csLoaded||S.csSync||S.csAuto) return; const metas=[...S.csMeta.values()]; const at=metas.map(m=>m.fetchedAt).sort()[0]; const stale=metas.length<CARD_SHEETS.length||metas.some(m=>(m.cfgVer||1)<CS_VER); if(!stale&&at&&Date.now()-Date.parse(at)<6*3600e3) return; S.csAuto=true; syncCardSheets(); }
/* ---------- boot ---------- */
render();
(async()=>{
  const c=window.claude; if(!c?.use){S.dbState='off';render();return;}
  db=await c.use('db'); if(!db){S.dbState='off';render();return;}
  const user=await c.use('user');
  try{S.uid=user?await user.id():null;S.user=user;S.isOwner=user?await user.isOwner():false;}catch{S.isOwner=false;}
  try{const can=user?.can?await user.can('data.write'):null;if(can===false&&S.isOwner)S.readOnly=true;}catch{}
  S.dbState='live';
  const onErr=e=>{if(e?.code==='revoked'){S.dbState='off';render();}};
  const toMap=s=>new Map(s.docs.map(d=>[d.id,{id:d.id,...d.data()}]));
  db.collection('txns').onSnapshot(s=>{S.txns=toMap(s);S.ready.txns=true;scheduleRender();},onErr);
  db.collection('properties').onSnapshot(s=>{S.props=toMap(s);S.ready.props=true;scheduleRender();},onErr);
  db.collection('payments').onSnapshot(s=>{S.pays=toMap(s);scheduleRender();},onErr);
  db.collection('cardpays').onSnapshot(s=>{S.cpays=toMap(s);scheduleRender();},onErr);
  db.collection('cardinfo').onSnapshot(s=>{S.cinfo=toMap(s);scheduleRender();},onErr);
  db.collection('draws').onSnapshot(s=>{S.drawsMap=toMap(s);scheduleRender();},onErr);
  db.collection('ap').onSnapshot(s=>{S.ap=toMap(s);scheduleRender();},onErr);
  db.collection('cashitems').onSnapshot(s=>{S.cashItems=toMap(s);scheduleRender();},onErr);
  db.collection('closes').onSnapshot(s=>{S.closes=toMap(s);scheduleRender();},onErr);
  db.collection('exceptions').onSnapshot(s=>{S.exceptions=toMap(s);scheduleRender();},onErr);
  db.collection('weekly').onSnapshot(s=>{S.weekly=toMap(s);scheduleRender();},onErr);
  db.collection('cardsheetmeta').onSnapshot(s=>{S.csMeta=toMap(s);rebuildSheetRows();scheduleRender();S.csLoaded=true;maybeAutoSync();},onErr);
  db.collection('cardsheet').onSnapshot(s=>{S.csChunks=toMap(s);rebuildSheetRows();scheduleRender();},onErr);
  fxSubscribe();
  db.doc('settings/lists').onSnapshot(d=>{S.L=d.exists?{...DEFAULTS,...d.data()}:{...DEFAULTS};scheduleRender();},onErr);
  render();
  try{ mcp=await c.use('mcp'); if(mcp){ const lt=await mcp.listTools().catch(()=>null); fileArgs=!!lt?.fileArgs; } }catch{ mcp=null; }
  maybeAutoSync();
  render();
})();
</script>
