<title>THB Card Approvals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: the page is a banknote. A large engraved "Total to pay" note leads, card tabs read as bills,
   each expense type is a ledger band, and a pay-slip bar along the bottom keeps the running total in view. */
:root {
  --bg: #e9efe6;
  --paper: #fbfcf7;
  --ink: #142019;
  --muted: #56675d;
  --line: #cfdacd;
  --soft: #e1e9dc;
  --note-green: #123d29;     /* banknote face */
  --note-green-2: #1d5a3c;
  --note-ink: #f3efd9;       /* cream engraving */
  --gold: #c9a23c;
  --gold-ink: #7d5f12;
  --gold-bg: #f5ebc9;
  --ok: #1d7a45;  --ok-bg: #d9eedf;
  --hold: #8d5c00; --hold-bg: #f7e8c2;
  --nt: #2a5d8c;  --nt-bg: #dce8f4;
  --warn: #b0392b;
  --focus: #2f7f9a;
  --hatch: rgba(20, 70, 45, .045);
  --f-money: "Spectral", Georgia, "Times New Roman", serif;
  --f-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-serial: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1511; --paper: #141e18; --ink: #e3ece5; --muted: #93a699; --line: #26372d; --soft: #1b2820;
  --note-green: #0f3122; --note-green-2: #1a4a33; --note-ink: #f1ecd2; --gold: #d9b552; --gold-ink: #e6c66a; --gold-bg: #362c10;
  --ok: #78d29b; --ok-bg: #173323; --hold: #e9b84b; --hold-bg: #382c11; --nt: #8fc0ea; --nt-bg: #172b3c;
  --warn: #ef8a7c; --focus: #7cc6dc; --hatch: rgba(140, 210, 170, .035);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0d1511; --paper: #141e18; --ink: #e3ece5; --muted: #93a699; --line: #26372d; --soft: #1b2820;
  --note-green: #0f3122; --note-green-2: #1a4a33; --note-ink: #f1ecd2; --gold: #d9b552; --gold-ink: #e6c66a; --gold-bg: #362c10;
  --ok: #78d29b; --ok-bg: #173323; --hold: #e9b84b; --hold-bg: #382c11; --nt: #8fc0ea; --nt-bg: #172b3c;
  --warn: #ef8a7c; --focus: #7cc6dc; --hatch: rgba(140, 210, 170, .035);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background-color: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45;
  background-image: repeating-linear-gradient(45deg, var(--hatch) 0 1px, transparent 1px 9px), repeating-linear-gradient(-45deg, var(--hatch) 0 1px, transparent 1px 9px); }
.wrap { max-width: 1000px; margin: 0 auto; padding: 24px 16px 120px; display: grid; gap: 18px; }
button, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.amt { font-family: var(--f-money); font-variant-numeric: lining-nums tabular-nums; font-weight: 700; }

header.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 8px 16px; }
.eyebrow { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold-ink); font-weight: 700; }
h1 { font-family: var(--f-money); font-weight: 800; font-size: 30px; line-height: 1.05; margin: 2px 0 0; text-wrap: balance; }
.who { color: var(--muted); font-size: 12px; }

/* Card tabs as bills */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.bill { position: relative; text-align: left; cursor: pointer; border-radius: 8px; padding: 12px 16px 11px; border: 1px solid var(--line);
  background: var(--paper); display: grid; gap: 1px; overflow: hidden; }
.bill::before { content: ""; position: absolute; inset: 4px; border: 1px solid var(--line); border-radius: 5px; pointer-events: none; }
.bill .bn { font-weight: 700; font-size: 13px; letter-spacing: .02em; }
.bill .bo { font-family: var(--f-money); font-size: 22px; font-weight: 700; font-variant-numeric: lining-nums tabular-nums; }
.bill .bs { font-size: 11px; color: var(--muted); }
.bill .corner { position: absolute; right: 12px; top: 9px; font-family: var(--f-money); font-weight: 800; font-size: 13px; color: var(--gold-ink); }
.bill[aria-selected="true"] { background-color: var(--note-green); color: var(--note-ink); border-color: var(--note-green);
  background-image: radial-gradient(circle at 100% 100%, rgba(201,162,60,.25), transparent 55%), repeating-radial-gradient(circle at 100% 100%, rgba(243,239,217,.07) 0 1px, transparent 1px 7px); }
.bill[aria-selected="true"]::before { border-color: rgba(201,162,60,.55); }
.bill[aria-selected="true"] .bs { color: inherit; opacity: .75; }
.bill[aria-selected="true"] .corner { color: var(--gold); }

/* The banknote */
.banknote { position: relative; border-radius: 16px; color: var(--note-ink); padding: 22px 24px; overflow: hidden;
  background-color: var(--note-green);
  background-image:
    radial-gradient(ellipse at 85% 50%, rgba(201,162,60,.18), transparent 45%),
    repeating-radial-gradient(circle at 85% 50%, rgba(243,239,217,.06) 0 1px, transparent 1px 6px),
    repeating-linear-gradient(90deg, rgba(243,239,217,.035) 0 1px, transparent 1px 4px),
    linear-gradient(135deg, var(--note-green-2), var(--note-green));
  box-shadow: 0 1px 0 rgba(0,0,0,.05), 0 10px 30px -18px rgba(10, 40, 25, .7); }
.banknote::before { content: ""; position: absolute; inset: 8px; border: 1.5px solid rgba(201,162,60,.7); border-radius: 10px; pointer-events: none; }
.banknote::after { content: ""; position: absolute; inset: 12px; border: 1px dashed rgba(201,162,60,.35); border-radius: 8px; pointer-events: none; }
.bn-grid { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px 24px; align-items: center; }
.bn-label { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.bn-total { font-family: var(--f-money); font-weight: 800; font-size: clamp(40px, 8vw, 64px); line-height: 1; font-variant-numeric: lining-nums tabular-nums; letter-spacing: -.01em; margin: 4px 0 6px; text-shadow: 0 1px 0 rgba(0,0,0,.25); }
.bn-sub { font-size: 14px; opacity: .9; }
.bn-sub b { font-family: var(--f-money); font-size: 16px; }
.bn-serial { font-family: var(--f-serial); font-size: 11px; letter-spacing: .14em; color: var(--gold); opacity: .85; margin-top: 10px; }
.seal { width: 118px; height: 118px; border-radius: 50%; display: grid; place-items: center; position: relative;
  background: repeating-conic-gradient(from 0deg, rgba(201,162,60,.55) 0 4deg, transparent 4deg 8deg);
  -webkit-mask: radial-gradient(circle, #000 0 58px, transparent 59px); mask: radial-gradient(circle, #000 0 58px, transparent 59px); }
.seal::before { content: ""; position: absolute; inset: 12px; border-radius: 50%; background: var(--note-green); border: 2px solid var(--gold); }
.seal span { position: relative; font-family: var(--f-money); font-weight: 800; font-size: 26px; color: var(--gold); text-align: center; line-height: 1; }
.seal small { display: block; font-family: var(--f-body); font-size: 9px; letter-spacing: .14em; font-weight: 700; margin-top: 3px; }
.bn-stats { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
.bn-stat { background: rgba(243,239,217,.08); border: 1px solid rgba(243,239,217,.16); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.bn-stat span { display: block; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; opacity: .75; font-weight: 700; }
.bn-stat b { font-family: var(--f-money); font-size: 18px; font-variant-numeric: lining-nums tabular-nums; }
.bn-stat small { display: block; font-size: 11px; opacity: .7; }
.bn-stat.ok b { color: #9fe0b6; } .bn-stat.hold b { color: #f1cf7a; } .bn-stat.nt b { color: #b3d3f0; }
.bn-meter { position: relative; height: 6px; border-radius: 3px; background: rgba(243,239,217,.12); overflow: hidden; display: flex; margin-top: 14px; }
.bn-meter i { display: block; height: 100%; }
.bn-meter .ok { background: #6fcf97; } .bn-meter .nt { background: #8fc0ea; } .bn-meter .hold { background: #e9b84b; }
.bn-msg { position: relative; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; margin-top: 10px; opacity: .92; }
.bn-msg .warn { color: #ffb4a8; font-weight: 700; }
.bn-msg .min { color: var(--gold); font-weight: 700; }

/* What must be paid */
.req { position: relative; min-width: 290px; background: linear-gradient(160deg, #f6e7b0, #d9b552); color: #2a1f05; border-radius: 12px; padding: 14px 18px 12px;
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.35), 0 8px 24px -12px rgba(0,0,0,.6); }
.req::after { content: ""; position: absolute; inset: 5px; border: 1px dashed rgba(42,31,5,.35); border-radius: 8px; pointer-events: none; }
.req-label { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; font-weight: 800; }
.req-amt { font-family: var(--f-money); font-weight: 800; font-size: clamp(34px, 6vw, 46px); line-height: 1.05; font-variant-numeric: lining-nums tabular-nums; margin: 2px 0 8px; }
.req-bar { height: 8px; border-radius: 4px; background: rgba(42,31,5,.18); overflow: hidden; }
.req-bar i { display: block; height: 100%; background: #1d5a3c; }
.req-status { font-size: 13px; font-weight: 800; margin-top: 6px; color: #7a2a1d; }
.req.met .req-status { color: #1d5a3c; }
.bn-msg .epdmsg { color: #9fe0b6; font-weight: 700; }
.slip-req { display: grid; gap: 1px; background: linear-gradient(160deg, #f6e7b0, #d9b552); color: #2a1f05; border-radius: 10px; padding: 5px 12px; }
.slip-req span { font-size: 11px; font-weight: 700; letter-spacing: .04em; }
.slip-req b { font-family: var(--f-money); font-size: 17px; color: #7a2a1d; }
.slip-req.met b { color: #1d5a3c; }
.bill .bs b { font-family: var(--f-money); font-size: 13px; }
.lg-blurb { font-size: 13px; color: var(--ink); margin: 2px 0 1px; }
details.ledger[data-sec="pastdue"] { border: 2px solid var(--warn); }
details.ledger[data-sec="pastdue"] > summary { background-image: linear-gradient(90deg, rgba(176,57,43,.12), transparent 70%); }
details.ledger[data-sec="pastdue"] .lg-name { color: var(--warn); }
details.ledger[data-sec="epd"] { border: 2px solid var(--gold); }
details.ledger[data-sec="epd"] > summary { background-image: linear-gradient(90deg, var(--gold-bg), transparent 70%); }
.ln-owed s.full { display: block; font-size: 13px; color: var(--muted); }

/* Ledgers */
.ledgers { display: grid; gap: 14px; }
details.ledger { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
details.ledger > summary { list-style: none; cursor: pointer; padding: 14px 18px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 14px; align-items: center;
  background-image: linear-gradient(90deg, var(--soft), transparent 70%); }
details.ledger > summary::-webkit-details-marker { display: none; }
details.ledger[open] > summary { border-bottom: 1px solid var(--line); }
.chev { width: 30px; height: 30px; border-radius: 50%; background: var(--note-green); display: grid; place-items: center; transition: transform .15s; box-shadow: inset 0 0 0 2px var(--gold); }
.chev::before { content: ""; border: solid var(--note-ink); border-width: 0 2px 2px 0; padding: 3px; transform: rotate(-45deg); margin-left: -2px; }
details[open] > summary .chev { transform: rotate(90deg); }
.lg-name { font-family: var(--f-money); font-size: 22px; font-weight: 800; }
.lg-meta { font-size: 12px; color: var(--muted); }
.lg-right { text-align: right; display: grid; gap: 1px; }
.lg-right small { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.lg-right .amt { font-size: 22px; }
.lg-right .topay { font-size: 12px; font-weight: 700; color: var(--ok); }
.lg-bulk { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center; padding: 8px 18px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
.bulk { border: 1px solid var(--ok); color: var(--ok); background: var(--paper); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-weight: 700; font-size: 12px; }
.bulk.confirm { background: var(--ok); color: var(--paper); }
.bulk:disabled { opacity: .45; cursor: default; }

.ln { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px 18px; align-items: center; padding: 14px 18px; border-top: 1px dashed var(--line); position: relative; }
.lines > .ln:first-child { border-top: 0; }
.ln::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 4px; border-radius: 0 3px 3px 0; background: transparent; }
.ln[data-s="approve"]::before { background: var(--ok); }
.ln[data-s="hold"]::before { background: var(--hold); }
.ln[data-s="note"]::before { background: var(--nt); }
.ln[data-s="approve"] { background: linear-gradient(90deg, var(--ok-bg), transparent 55%); }
.ln-name { font-family: var(--f-money); font-weight: 700; font-size: 18px; line-height: 1.2; overflow-wrap: anywhere; }
.ln-charges { font-size: 12px; color: var(--muted); margin-top: 2px; }
.ln-charges .warn { color: var(--warn); font-weight: 700; }
.ln-charges .save { color: var(--gold-ink); font-weight: 700; }
.about { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.about span { background: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 12px; white-space: nowrap; }
.about span b { font-family: var(--f-money); font-weight: 700; font-variant-numeric: lining-nums tabular-nums; margin-left: 4px; }
.about span.more { background: transparent; color: var(--muted); }
.ln-owed { text-align: right; min-width: 120px; }
.ln-owed small { display: block; font-size: 10px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; font-weight: 700; }
.ln-owed .amt { font-size: 22px; display: block; }
.ln-owed .pay { display: inline-block; margin-top: 3px; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 1px 9px; }
.pay.ok { color: var(--ok); background: var(--ok-bg); } .pay.hold { color: var(--hold); background: var(--hold-bg); } .pay.nt { color: var(--nt); background: var(--nt-bg); }
.dec { display: flex; gap: 6px; }
.dec button { border: 1.5px solid var(--line); background: var(--paper); border-radius: 999px; padding: 8px 14px; cursor: pointer; font-size: 13px; font-weight: 700; color: var(--muted); transition: background .12s, border-color .12s; }
.dec button:hover { border-color: var(--ink); color: var(--ink); }
.dec button[aria-pressed="true"][data-v="approve"] { background: var(--ok); border-color: var(--ok); color: var(--paper); }
.dec button[aria-pressed="true"][data-v="hold"] { background: var(--hold); border-color: var(--hold); color: var(--paper); }
.dec button[aria-pressed="true"][data-v="note"] { background: var(--nt); border-color: var(--nt); color: var(--paper); }
.ln-note { grid-column: 1 / -1; display: grid; gap: 6px; }
.ln-note textarea { width: 100%; min-height: 54px; resize: vertical; border: 1.5px solid var(--nt); background: var(--nt-bg); border-radius: 10px; padding: 9px 12px; font-size: 14px; }
.ln-note .nf { font-size: 12px; color: var(--muted); }

/* Pay slip */
.payslip { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding: 0 12px calc(10px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
.payslip .in { pointer-events: auto; max-width: 1000px; margin: 0 auto; background: var(--note-green); color: var(--note-ink); border-radius: 14px; padding: 10px 18px;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 18px; box-shadow: 0 10px 30px -10px rgba(0,0,0,.45); border: 1px solid rgba(201,162,60,.6); }
.payslip .lab { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.payslip .tot { font-family: var(--f-money); font-weight: 800; font-size: 26px; font-variant-numeric: lining-nums tabular-nums; line-height: 1.05; }
.payslip .side { font-size: 12px; opacity: .85; text-align: right; }
.payslip .ghost { border: 1px solid rgba(243,239,217,.4); background: transparent; color: inherit; border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 12px; font-weight: 700; }

.banner { background: var(--hold-bg); border: 1px solid var(--hold); border-radius: 10px; padding: 12px 14px; }
.foot { color: var(--muted); font-size: 12px; max-width: 70ch; }

@media (max-width: 720px) {
  .bn-grid { grid-template-columns: 1fr; }
  .req { min-width: 0; }
  .seal { display: none; }
  .bn-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ln { grid-template-columns: minmax(0, 1fr); }
  .ln-owed { text-align: left; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  .ln-owed small { width: 100%; }
  .about span { white-space: normal; }
  .dec button { flex: 1; padding: 10px; }
  .ln-owed { min-width: 0; }
  h1 { font-size: 24px; }
  .lg-name { font-size: 19px; }
  .payslip .side { text-align: left; }
}
@media (prefers-reduced-motion: reduce) { .chev, .dec button { transition: none; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Twin Home Buyer · Accounts payable</div>
      <h1>Card Approvals for Juan</h1>
    </div>
    <div class="who" id="who">Connecting…</div>
  </header>

  <nav class="cards" id="cards" role="tablist" aria-label="Credit cards"></nav>
  <div id="banner" class="banner" hidden></div>
  <section class="banknote" id="note" aria-label="Total to pay"></section>
  <div class="ledgers" id="ledgers"></div>
  <p class="foot">Approve pays the full amount owed. Hold means don't pay it yet. Note is for anything Juan wants to say. If a note includes a dollar amount, like “pay $500 now”, that amount is counted toward the total to pay.</p>
</div>

<div class="payslip" aria-live="polite"><div class="in" id="slip"></div></div>

<script>
const DATA = /*__DATA__*/null;
const LABEL = { overhead: ["category", "categories"], property: ["property", "properties"], pastdue: ["line", "lines"], epd: ["property", "properties"], later: ["property", "properties"], marketing: ["marketing type", "marketing types"] };
const st = { card: DATA.cards[0].key, open: new Set(), closed: new Set(), notesOpen: new Set() };
const OPEN_BY_DEFAULT = new Set(["pastdue", "epd"]);
const dec = new Map();
const lineRef = new Map();
let db = null, myId = null;
try { const s = JSON.parse(localStorage.getItem("thb-approvals-v2") || "{}"); if (s.card && DATA.cards.some((c) => c.key === s.card)) st.card = s.card; } catch (e) {}
for (const c of DATA.cards) for (const s of c.sections) for (const l of s.lines) lineRef.set(l.id, { card: c.key, section: s.key, line: l });

const $ = (id) => document.getElementById(id);
const fmt = (n) => (n < 0 ? "−$" : "$") + Math.abs(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmt0 = (n) => (n < 0 ? "−$" : "$") + Math.round(Math.abs(n)).toLocaleString("en-US");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const today = new Date().toISOString().slice(0, 10);
const fmtDate = (d) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || ""); return m ? new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString("en-US", { month: "short", day: "numeric" }) : ""; };
const card = () => DATA.cards.find((c) => c.key === st.card) || DATA.cards[0];
const statusOf = (id) => dec.get(id)?.status || "pending";
// A dollar amount written in a note ("pay $500", "1,200") is the amount to pay on that line.
function noteAmount(t) { const m = /\$?\s*(\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?|\d+(?:\.\d{1,2})?)/.exec(t || ""); return m ? Math.round(parseFloat(m[1].replace(/,/g, "")) * 100) / 100 : null; }
// Early-pay lines cost the discounted price until each invoice's early-pay date passes.
function owedOf(l) { if (l.kind !== "epd" || !l.dues) return l.owed; return Math.round(l.dues.reduce((a, d) => a + (d.ed && d.ed >= today ? d.ea : d.a), 0) * 100) / 100; }
function payOf(l) { const d = dec.get(l.id); if (!d) return 0; if (d.status === "approve") return owedOf(l); if (d.status === "note") return noteAmount(d.note) ?? 0; return 0; }
function saveUi() { try { localStorage.setItem("thb-approvals-v2", JSON.stringify({ card: st.card })); } catch (e) {} }
const plural = (n, key) => { const w = LABEL[key] || ["line", "lines"]; return `${n} ${n === 1 ? w[0] : w[1]}`; };

function stats(lines) {
  const s = { owed: 0, pay: 0, approve: 0, approveN: 0, nt: 0, ntN: 0, hold: 0, holdN: 0, wait: 0, waitN: 0, n: lines.length };
  for (const l of lines) {
    s.owed += owedOf(l); const k = statusOf(l.id), p = payOf(l); s.pay += p;
    if (k === "approve") { s.approve += p; s.approveN++; } else if (k === "note") { s.nt += p; s.ntN++; }
    else if (k === "hold") { s.hold += owedOf(l); s.holdN++; } else { s.wait += owedOf(l); s.waitN++; }
  }
  return s;
}
const cardLines = (c) => c.sections.flatMap((s) => s.lines);
function dueInfo(l) {
  if (!l.dues) return null;
  const late = l.dues.filter((d) => d.d < today), epd = l.dues.filter((d) => d.ed && d.ed >= today);
  return { lateN: late.length, late: late.reduce((a, b) => a + b.a, 0), epdN: epd.length, save: epd.reduce((a, b) => a + (b.a - b.ea), 0), epdBy: epd.map((d) => d.ed).sort()[0] || "" };
}

function renderCards() {
  $("cards").innerHTML = DATA.cards.map((c, i) => {
    const s = stats(cardLines(c));
    return `<button class="bill" role="tab" aria-selected="${c.key === st.card}" data-card="${c.key}"><span class="corner">${["I", "II", "III", "IV", "V", "VI"][i] || i + 1}</span><span class="bn">${esc(c.name)}</span><span class="bo">${fmt(s.owed)}</span><span class="bs">${c.required ? `${esc(c.required.label.split(" · ")[0])} <b>${fmt(c.required.kind === "owed" ? s.owed : c.required.amount)}</b>` : (s.waitN ? `${s.waitN} of ${s.n} lines waiting` : "All lines decided")}</span></button>`;
  }).join("");
}
function requiredInfo(c) {
  const r = c.required; if (!r) return null;
  let paid;
  if (r.kind === "pastdue") paid = c.sections.filter((x) => x.key === "pastdue").flatMap((x) => x.lines).filter((l) => l.owed > 0).reduce((a, l) => a + payOf(l), 0);
  else paid = stats(cardLines(c)).pay;
  const amount = r.kind === "owed" ? stats(cardLines(c)).owed : r.amount;
  return { label: r.label, amount, paid, short: Math.max(0, amount - paid), pct: amount > 0 ? Math.min(100, (paid / amount) * 100) : 100 };
}
function renderNote() {
  const c = card(), s = stats(cardLines(c)), req = requiredInfo(c);
  const pct = (v) => (s.owed > 0 ? Math.max(0, Math.min(100, (v / s.owed) * 100)) : 0);
  const msgs = [];
  for (const f of c.facts || []) msgs.push(`<span>${esc(f.label)}: ${fmt(f.amount)}</span>`);
  const di = cardLines(c).map(dueInfo).filter(Boolean);
  if (di.length) {
    const ln = di.reduce((a, b) => a + b.lateN, 0), la = di.reduce((a, b) => a + b.late, 0), sv = di.reduce((a, b) => a + b.save, 0);
    if (sv > 0) msgs.push(`<span class="epdmsg">Early-pay discount available: save ${fmt(sv)} on ${di.reduce((a, b) => a + b.epdN, 0)} invoices</span>`);
  }
  $("note").innerHTML = `<div class="bn-grid">
      <div><div class="bn-label">Total to pay · ${esc(c.name)}</div>
        <div class="bn-total">${fmt(s.pay)}</div>
        <div class="bn-sub">of <b>${fmt(s.owed)}</b> owed on this card</div>
        <div class="bn-serial">THB · ${esc(c.key.toUpperCase())} · ${today.replace(/-/g, "")}</div></div>
      ${req ? `<div class="req ${req.short <= 0.005 ? "met" : ""}">
          <div class="req-label">${esc(req.label)}</div>
          <div class="req-amt">${fmt(req.amount)}</div>
          <div class="req-bar" aria-hidden="true"><i style="width:${req.pct}%"></i></div>
          <div class="req-status">${req.short <= 0.005 ? "✓ Covered by what's approved" : `${fmt(req.short)} still needed`}</div>
        </div>` : `<div class="seal" aria-hidden="true"><span>${Math.round(pct(s.pay))}%<small>APPROVED</small></span></div>`}
    </div>
    <div class="bn-stats">
      <div class="bn-stat ok"><span>Approved</span><b>${fmt0(s.approve)}</b><small>${s.approveN} line${s.approveN === 1 ? "" : "s"}</small></div>
      <div class="bn-stat nt"><span>From notes</span><b>${fmt0(s.nt)}</b><small>${s.ntN} line${s.ntN === 1 ? "" : "s"}</small></div>
      <div class="bn-stat hold"><span>On hold</span><b>${fmt0(s.hold)}</b><small>${s.holdN} line${s.holdN === 1 ? "" : "s"}</small></div>
      <div class="bn-stat"><span>Waiting</span><b>${fmt0(s.wait)}</b><small>${s.waitN} line${s.waitN === 1 ? "" : "s"}</small></div>
    </div>
    <div class="bn-meter" aria-hidden="true"><i class="ok" style="width:${pct(s.approve)}%"></i><i class="nt" style="width:${pct(s.nt)}%"></i><i class="hold" style="width:${pct(s.hold)}%"></i></div>
    ${msgs.length ? `<div class="bn-msg">${msgs.join("")}</div>` : ""}`;
}
function renderSlip() {
  const c = card(), s = stats(cardLines(c));
  const all = stats(DATA.cards.flatMap(cardLines));
  const req = requiredInfo(c);
  $("slip").innerHTML = `<div><div class="lab">Total to pay · ${esc(c.name)}</div><div class="tot">${fmt(s.pay)}</div></div>
    ${req ? `<div class="slip-req ${req.short <= 0.005 ? "met" : ""}"><span>${esc(req.label.split(" · ")[0])} ${fmt(req.amount)}</span><b>${req.short <= 0.005 ? "✓ Covered" : fmt(req.short) + " short"}</b></div>` : ""}
    <div class="side">${s.approveN + s.ntN} of ${s.n} lines set to pay${DATA.cards.length > 1 ? `<br>All cards: ${fmt(all.pay)} of ${fmt(all.owed)}` : ""}</div>
    <button class="ghost" id="export" hidden>Download</button>`;
  if (exportReady) { $("export").hidden = false; }
}
function sectionHead(sec) {
  const s = stats(sec.lines);
  return `<small>Owed</small><span class="amt">${fmt(s.owed)}</span><span class="topay">To pay ${fmt(s.pay)}</span>`;
}
function bulkHtml(sec) {
  const pend = sec.lines.filter((l) => statusOf(l.id) === "pending");
  return `<span>${pend.length ? `${pend.length} waiting · ${fmt(pend.reduce((a, b) => a + owedOf(b), 0))}` : "Every line has a decision"}</span><button class="bulk" data-bulk="${sec.key}"${pend.length ? "" : " disabled"}>Approve all ${pend.length} waiting</button>`;
}
function lineHtml(l) {
  const d = dec.get(l.id), s = d?.status || "pending", di = dueInfo(l);
  let charges = l.count ? `${l.count} charge${l.count === 1 ? "" : "s"}` : "Home Depot charges";
  if (l.from && l.count) charges += ` · ${l.from === l.to ? fmtDate(l.from) : `${fmtDate(l.from)} – ${fmtDate(l.to)}`}`;
  if (di?.lateN) charges += ` · <span class="warn">${di.lateN} past due</span>`;
  if (di?.save > 0) charges += ` · <span class="save">pay by ${fmtDate(di.epdBy)}, save ${fmt(di.save)}</span>`;
  const about = (l.about || []).map((a) => `<span class="${/ more$/.test(a.label) ? "more" : ""}">${esc(a.label)}${a.amount != null ? `<b>${fmt0(a.amount)}</b>` : ""}</span>`).join("");
  let tag = "";
  if (s === "approve") tag = `<span class="pay ok">Paying ${fmt(owedOf(l))}</span>`;
  else if (s === "note") { const a = noteAmount(d.note); tag = a != null ? `<span class="pay nt">Paying ${fmt(a)}</span>` : `<span class="pay nt">Note</span>`; }
  else if (s === "hold") tag = `<span class="pay hold">On hold</span>`;
  const showNote = s === "note" || st.notesOpen.has(l.id);
  return `<div class="ln" data-id="${l.id}" data-s="${s}">
    <div style="min-width:0"><div class="ln-name">${esc(l.name)}</div><div class="ln-charges">${charges}</div>${about ? `<div class="about">${about}</div>` : ""}</div>
    <div class="ln-owed"><small>${l.kind === "epd" && owedOf(l) < l.owed ? "Early-pay price" : "Owed"}</small><span class="amt">${fmt(owedOf(l))}</span>${l.kind === "epd" && owedOf(l) < l.owed ? `<s class="full">${fmt(l.owed)}</s>` : ""}${tag}</div>
    <div class="dec" role="group" aria-label="Decision for ${esc(l.name)}">
      <button data-v="approve" aria-pressed="${s === "approve"}">Approve</button>
      <button data-v="hold" aria-pressed="${s === "hold"}">Hold</button>
      <button data-v="note" aria-pressed="${s === "note"}">Note</button>
    </div>
    ${showNote ? `<div class="ln-note"><textarea id="txt-${l.id}" aria-label="Note for ${esc(l.name)}" placeholder="Write anything. Example: pay $500 now, rest next month">${esc(d?.note || "")}</textarea><div class="nf" data-ns="${l.id}">Saves when you click away.</div></div>` : ""}
  </div>`;
}
function renderLedgers() {
  const c = card();
  $("ledgers").innerHTML = c.sections.map((sec) => {
    const key = c.key + "|" + sec.key, s = stats(sec.lines);
    const open = st.open.has(key) || (!st.closed.has(key) && (OPEN_BY_DEFAULT.has(sec.key) || c.sections.length === 1 || sec.lines.length === 1));
    return `<details class="ledger" data-sec="${sec.key}"${open ? " open" : ""}>
      <summary><span class="chev" aria-hidden="true"></span>
        <div style="min-width:0"><div class="lg-name">${esc(sec.name)}</div>${sec.blurb ? `<div class="lg-blurb">${esc(sec.blurb)}</div>` : ""}<div class="lg-meta">${plural(sec.lines.length, sec.key)} · <span data-pend>${s.waitN ? `${s.waitN} waiting` : "all decided"}</span></div></div>
        <div class="lg-right">${sectionHead(sec)}</div></summary>
      ${sec.lines.length > 1 ? `<div class="lg-bulk">${bulkHtml(sec)}</div>` : ""}
      <div class="lines">${sec.lines.map(lineHtml).join("")}</div>
    </details>`;
  }).join("");
}
function renderAll() { renderCards(); renderNote(); renderLedgers(); renderSlip(); }
function refresh(ids) {
  renderCards(); renderNote(); renderSlip();
  const touched = new Set();
  for (const id of ids) {
    const r = lineRef.get(id); if (!r || r.card !== st.card) continue;
    touched.add(r.section);
    const el = document.querySelector(`.ln[data-id="${id}"]`); if (!el) continue;
    const a = document.activeElement;
    if (a && el.contains(a) && a.tagName === "TEXTAREA") {
      const s = statusOf(id); el.dataset.s = s;
      el.querySelectorAll(".dec button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === s)));
      continue;
    }
    const t = document.createElement("div"); t.innerHTML = lineHtml(r.line); el.replaceWith(t.firstElementChild);
  }
  for (const sk of touched) {
    const el = document.querySelector(`details.ledger[data-sec="${sk}"]`); if (!el) continue;
    const sec = card().sections.find((x) => x.key === sk), s = stats(sec.lines);
    el.querySelector(".lg-right").innerHTML = sectionHead(sec);
    el.querySelector("[data-pend]").textContent = s.waitN ? `${s.waitN} waiting` : "all decided";
    const b = el.querySelector(".lg-bulk"); if (b) b.innerHTML = bulkHtml(sec);
  }
}

// ---------- saving ----------
const ref = (id) => db.collection(`approvals/${lineRef.get(id).card}/lines`).doc(id);
function banner(msg) { const b = $("banner"); b.textContent = msg; b.hidden = !msg; }
function build(id, patch) {
  const r = lineRef.get(id), prev = dec.get(id) || {};
  const next = { status: "", note: "", ...prev, ...patch, by: myId || "", at: new Date().toISOString(), section: r.section, line: r.line.name, owed: owedOf(r.line) };
  delete next.pay;
  const p = next.status === "approve" ? owedOf(r.line) : next.status === "note" ? noteAmount(next.note) : null;
  if (p != null) next.toPay = p; else delete next.toPay;
  return next;
}
async function write(id, prev, next) {
  const undo = () => { if (prev) dec.set(id, prev); else dec.delete(id); refresh([id]); };
  if (!db) { banner("Decisions can't be saved in this view. Open the page signed in to claude.ai."); undo(); return false; }
  try { if (next) await ref(id).set(next); else await ref(id).delete(); return true; }
  catch (e) { undo(); banner(e?.code === "not_granted" ? "This view is read-only, so decisions aren't saved. Ask for edit access." : "That didn't save. Check your connection and try again."); return false; }
}
async function setStatus(id, v) {
  const prev = dec.get(id);
  let next;
  if (prev?.status === v) { st.notesOpen.delete(id); next = prev.note ? build(id, { status: "" }) : null; }
  else { if (v === "note") st.notesOpen.add(id); else st.notesOpen.delete(id); next = build(id, { status: v }); }
  if (next) dec.set(id, next); else dec.delete(id);
  refresh([id]);
  if (v === "note" && next?.status === "note") setTimeout(() => document.getElementById("txt-" + id)?.focus(), 0);
  return write(id, prev, next);
}
async function saveNote(id) {
  const el = document.getElementById("txt-" + id); if (!el) return;
  const note = el.value.trim(), prev = dec.get(id);
  if ((prev?.note || "") === note && prev?.status === "note") return;
  const next = build(id, { status: "note", note });
  dec.set(id, next);
  const tag = document.querySelector(`[data-ns="${id}"]`); if (tag) tag.textContent = "Saving…";
  const ok = await write(id, prev, next);
  const t2 = document.querySelector(`[data-ns="${id}"]`); if (t2) t2.textContent = ok ? "Saved" : "Not saved. Try again.";
  refresh([id]);
}
async function bulk(secKey, btn) {
  if (!btn.classList.contains("confirm")) {
    const n = btn.textContent.match(/\d+/)?.[0];
    btn.classList.add("confirm"); btn.textContent = `Tap again to approve ${n}`;
    setTimeout(() => { if (btn.isConnected && btn.classList.contains("confirm")) { btn.classList.remove("confirm"); btn.textContent = `Approve all ${n} waiting`; } }, 4000);
    return;
  }
  btn.disabled = true;
  const sec = card().sections.find((s) => s.key === secKey);
  const jobs = sec.lines.filter((l) => statusOf(l.id) === "pending").map((l) => { const prev = dec.get(l.id), next = build(l.id, { status: "approve" }); dec.set(l.id, next); return [l.id, prev, next]; });
  refresh(jobs.map((j) => j[0]));
  for (const [id, prev, next] of jobs) await write(id, prev, next);
}

// ---------- events ----------
$("cards").addEventListener("click", (e) => { const b = e.target.closest("[data-card]"); if (!b) return; st.card = b.dataset.card; saveUi(); renderAll(); });
$("ledgers").addEventListener("toggle", (e) => { const el = e.target; if (!el.matches?.("details.ledger")) return; const k = st.card + "|" + el.dataset.sec; if (el.open) { st.open.add(k); st.closed.delete(k); } else { st.open.delete(k); st.closed.add(k); } }, true);
$("ledgers").addEventListener("click", (e) => {
  const d = e.target.closest(".dec button"); if (d) { setStatus(d.closest(".ln").dataset.id, d.dataset.v); return; }
  const b = e.target.closest("[data-bulk]"); if (b) { e.preventDefault(); bulk(b.dataset.bulk, b); }
});
$("ledgers").addEventListener("input", (e) => {
  const m = /^txt-(.+)$/.exec(e.target.id || ""); if (!m) return;
  const a = noteAmount(e.target.value), tag = document.querySelector(`[data-ns="${m[1]}"]`);
  if (tag) tag.textContent = a != null ? `Will count ${fmt(a)} toward the total. Saves when you click away.` : "Saves when you click away.";
});
$("ledgers").addEventListener("focusout", (e) => { const m = /^txt-(.+)$/.exec(e.target.id || ""); if (m) saveNote(m[1]); });

let exportReady = false;
async function setupExport() {
  const dl = await claude.use("downloads"); if (!dl) return;
  exportReady = true; renderSlip();
  document.addEventListener("click", async (e) => {
    if (!e.target.closest("#export")) return;
    const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const rows = [["Card", "Expense type", "Line", "Charges", "Owed", "Decision", "To pay", "Note"].map(q).join(",")];
    for (const c of DATA.cards) for (const s of c.sections) for (const l of s.lines) {
      const d = dec.get(l.id);
      rows.push([c.name, s.name, l.name, l.count, owedOf(l).toFixed(2), ({ approve: "Approve", hold: "Hold", note: "Note" })[d?.status] || "Waiting", payOf(l).toFixed(2), d?.note || ""].map(q).join(","));
    }
    try { await dl.save({ filename: `card-approvals-${today}.csv`, data: rows.join("\n") }); } catch (err) {}
  });
}

// ---------- boot ----------
renderAll();
(async () => {
  const [d, u] = await Promise.all([claude.use("db"), claude.use("user")]);
  db = d;
  if (u) { try { myId = await u.id(); } catch (e) {} }
  const me = u ? await u.me().catch(() => null) : null;
  $("who").textContent = db ? (me?.name ? `Signed in as ${me.name}` : "Signed in") : "View only. Sign in to claude.ai to record decisions.";
  if (!db) return;
  const pending = new Set(); let t = null;
  for (const c of DATA.cards) {
    db.collection(`approvals/${c.key}/lines`).limit(1000).onSnapshot((snap) => {
      for (const ch of snap.docChanges()) {
        const id = ch.doc.id; if (!lineRef.has(id)) continue;
        if (ch.type === "removed") dec.delete(id);
        else { const v = ch.doc.data(); if (v && (v.status || v.note)) dec.set(id, v); else dec.delete(id); }
        pending.add(id);
      }
      if (!t) t = setTimeout(() => { t = null; const ids = [...pending]; pending.clear(); refresh(ids); }, 60);
    }, () => banner("Live updates paused. Reload the page to see the latest decisions."));
  }
  setupExport();
})();
</script>
