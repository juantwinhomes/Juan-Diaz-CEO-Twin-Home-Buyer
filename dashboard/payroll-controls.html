<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Payroll Timekeeping & Controls</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one centered report column; tab bar switches views, "Full report" stacks every section for reading or PDF. */
:root {
  --bg: #ffffff;
  --surface: #f6f8fb;
  --line: #e2e7ee;
  --line-strong: #cfd7e2;
  --navy: #0f2547;
  --ink: #1d2b3e;
  --muted: #5a6a7e;
  --teal: #0b8a85;
  --teal-strong: #08706c;
  --teal-soft: #e5f4f3;
  --blue: #3355c4;
  --blue-soft: #edf1fd;
  --amber: #a5670b;
  --amber-soft: #fdf4e3;
  --rose: #b4372b;
  --rose-soft: #fcedeb;
  --bar-prev: #b8c3d3;
  --shadow: 0 1px 2px rgba(15, 37, 71, .05), 0 4px 16px rgba(15, 37, 71, .04);
  --font-body: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { color: var(--navy); margin: 0; text-wrap: balance; line-height: 1.25; }
p { margin: 0; }
ul { margin: 0; padding-left: 1.1em; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }

.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header */
.masthead { border-bottom: 1px solid var(--line); padding-block: 28px 0; }
.masthead-top { display: flex; flex-wrap: wrap; gap: 16px 32px; justify-content: space-between; align-items: flex-end; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--teal-strong); }
.masthead h1 { font-size: clamp(24px, 3.2vw, 32px); font-weight: 700; letter-spacing: -.01em; margin-top: 6px; }
.subtitle { color: var(--muted); margin-top: 6px; font-size: 15px; }
.subtitle strong { color: var(--ink); font-weight: 600; }
.prepared { display: grid; gap: 2px; text-align: right; font-size: 13px; color: var(--muted); }
.prepared b { color: var(--navy); font-weight: 600; }

.toolbar { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; margin-top: 22px; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-bottom: -1px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 10px 14px 12px; font-weight: 600; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--navy); }
.tab[aria-selected="true"] { color: var(--navy); border-bottom-color: var(--teal); }
.tools { display: flex; gap: 8px; align-items: center; padding-bottom: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--bg); padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--navy); cursor: pointer; }
.btn:hover { border-color: var(--teal); color: var(--teal-strong); }
.btn[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn svg { width: 15px; height: 15px; }

/* Legend + status chips */
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding-block: 14px; font-size: 12.5px; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; letter-spacing: .02em; white-space: nowrap; line-height: 1.6; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip-current { background: var(--teal-soft); color: var(--teal-strong); }
.chip-planned { background: var(--blue-soft); color: var(--blue); }
.chip-verify { background: var(--amber-soft); color: var(--amber); }
.chip-gap { background: var(--rose-soft); color: var(--rose); }
.chip-neutral { background: var(--surface); color: var(--muted); }

main { padding-block: 8px 56px; }
.view { display: grid; gap: 48px; }
.section { display: grid; gap: 18px; scroll-margin-top: 16px; }
.section-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
.section-head h2 { font-size: 21px; font-weight: 700; letter-spacing: -.005em; }
.section-head p { color: var(--muted); font-size: 14px; max-width: 62ch; }
.kicker { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }

.card { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.panel { background: var(--surface); border-radius: 12px; }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.kpi { padding: 18px 20px; display: grid; gap: 6px; align-content: start; }
.kpi-label { font-size: 13px; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 8px; }
.kpi-label svg { width: 16px; height: 16px; color: var(--teal); }
.kpi-value { font-size: 30px; font-weight: 700; color: var(--navy); letter-spacing: -.02em; line-height: 1.1; }
.kpi-value small { font-size: 15px; font-weight: 600; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
.kpi-note { font-size: 12.5px; color: var(--muted); }
.kpi.accent { border-color: #bfe3e1; background: linear-gradient(180deg, var(--teal-soft), var(--bg) 70%); }
.kpi.accent .kpi-value { color: var(--teal-strong); }

.callout { display: grid; grid-template-columns: auto 1fr; gap: 14px; padding: 18px 20px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.callout svg { width: 20px; height: 20px; color: var(--teal); margin-top: 2px; }
.callout p { max-width: 80ch; }
.callout .lead { font-weight: 600; color: var(--navy); margin-bottom: 2px; }

.glance { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.glance-card { padding: 18px 20px; display: grid; gap: 10px; align-content: start; }
.glance-card h3 { font-size: 15px; }
.glance-card .chip { justify-self: start; }
.glance-card ul { padding: 0; list-style: none; display: grid; gap: 6px; font-size: 14px; }
.glance-card li { display: flex; gap: 8px; align-items: flex-start; }
.glance-card li::before { content: ""; flex: none; width: 5px; height: 5px; border-radius: 50%; background: var(--line-strong); margin-top: 9px; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--teal-strong); font-weight: 600; font-size: 13px; cursor: pointer; justify-self: start; display: inline-flex; gap: 4px; align-items: center; }
.linkbtn svg { width: 14px; height: 14px; }
.linkbtn:hover { text-decoration: underline; }

/* Tooltip terms */
.term { position: relative; display: inline-flex; align-items: baseline; }
.term-btn { border: 0; background: none; padding: 0; font: inherit; color: inherit; font-weight: inherit; cursor: help; border-bottom: 1px dashed var(--teal); line-height: inherit; }
.term-pop { position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%); width: max-content; max-width: min(280px, 78vw); background: var(--navy); color: #fff; font-size: 12.5px; font-weight: 400; line-height: 1.5; padding: 10px 12px; border-radius: 8px; box-shadow: 0 8px 24px rgba(15,37,71,.22); opacity: 0; visibility: hidden; transition: opacity .12s; z-index: 20; pointer-events: none; text-align: left; letter-spacing: 0; text-transform: none; }
.term-pop b { display: block; font-size: 12px; color: #9fe0dc; margin-bottom: 2px; font-weight: 600; }
.term:hover .term-pop, .term:focus-within .term-pop { opacity: 1; visibility: visible; }

/* Workflow */
.flow-scroll { overflow-x: auto; padding-bottom: 4px; }
.flow { display: grid; grid-template-columns: repeat(5, minmax(190px, 1fr)); gap: 28px; position: relative; min-width: 1060px; }
.step { position: relative; padding: 16px 16px 18px; display: grid; gap: 10px; align-content: start; }
.step + .step::before { content: ""; position: absolute; left: -24px; top: 34px; width: 20px; height: 2px; background: var(--line-strong); }
.step + .step::after { content: ""; position: absolute; left: -10px; top: 30px; border: 5px solid transparent; border-left: 7px solid var(--line-strong); }
.step-top { display: flex; align-items: center; gap: 10px; }
.step-num { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--navy); color: #fff; font-size: 13px; font-weight: 700; font-family: var(--font-data); }
.step h3 { font-size: 15px; }
.step .owner { font-size: 12.5px; color: var(--muted); margin-top: -2px; }
.step ul { padding: 0; list-style: none; display: grid; gap: 8px; font-size: 13.5px; }
.step li { display: grid; grid-template-columns: 14px 1fr; gap: 6px; }
.step li svg { width: 14px; height: 14px; color: var(--teal); margin-top: 3px; }
.step li.is-verify svg { color: var(--amber); }
.step li.is-gap svg { color: var(--rose); }
.step.gap { border: 1.5px solid #e7b2ac; background: linear-gradient(180deg, var(--rose-soft), var(--bg) 60%); }
.step.gap .step-num { background: var(--rose); }
.gap-flag { font-size: 12px; font-weight: 600; color: var(--rose); display: flex; gap: 6px; align-items: center; }
.gap-flag svg { width: 14px; height: 14px; }

/* Tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface); white-space: nowrap; }
td { padding: 11px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
th.r, td.r { text-align: right; }
.who { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.person { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 3px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; font-weight: 600; color: var(--navy); white-space: nowrap; }
.avatar { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; background: var(--navy); }
.avatar.t { background: var(--teal); }
.avatar.g { background: #6b7a90; }
.stage { font-size: 12px; color: var(--muted); font-weight: 500; }

/* Controls */
.controls { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.control { padding: 16px 18px; display: grid; grid-template-columns: 36px 1fr; gap: 4px 14px; align-content: start; }
.control .ic { grid-row: span 3; width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; background: var(--teal-soft); color: var(--teal-strong); }
.control .ic svg { width: 18px; height: 18px; }
.control h3 { font-size: 15px; }
.control p { font-size: 13.5px; color: var(--muted); }
.control .chip { justify-self: start; margin-top: 6px; }
.pending { border: 1px dashed #dcb978; background: var(--amber-soft); border-radius: 12px; padding: 16px 20px; display: grid; gap: 10px; }
.pending-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.pending h3 { font-size: 15px; color: var(--navy); }
.pending ul { padding: 0; list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.pending li { background: var(--bg); border: 1px solid #efd9ad; border-radius: 9px; padding: 10px 12px; font-size: 13.5px; display: flex; gap: 8px; align-items: flex-start; }
.pending li svg { flex: none; width: 15px; height: 15px; color: var(--amber); margin-top: 3px; }
.pending .fine { font-size: 12.5px; color: var(--amber); }

/* Overtime */
.ot-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 16px; align-items: stretch; }
.ot-chart { padding: 20px 20px 12px; display: grid; gap: 4px; }
.ot-chart .big { font-size: 22px; font-weight: 700; color: var(--navy); }
.ot-chart .big span { color: var(--teal-strong); }
.ot-chart .sub { color: var(--muted); font-size: 13px; }
.chart-box { height: 260px; margin-top: 8px; }
.ot-why { padding: 20px; display: grid; gap: 14px; align-content: start; }
.ot-why .quote { border-left: 3px solid var(--teal); padding-left: 14px; color: var(--ink); }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.fact { background: var(--surface); border-radius: 10px; padding: 10px 12px; }
.fact .v { font-weight: 700; color: var(--navy); font-size: 17px; }
.fact .l { font-size: 12px; color: var(--muted); }
.hbar { display: flex; align-items: center; gap: 10px; min-width: 140px; }
.hbar-track { flex: 1; height: 8px; border-radius: 4px; background: var(--surface); overflow: hidden; }
.hbar-fill { height: 100%; border-radius: 4px; background: var(--teal); }
.hbar-fill.fixed { background: var(--navy); opacity: .55; }
.hours { font-family: var(--font-data); font-weight: 600; color: var(--navy); font-size: 13.5px; }
.table-foot { padding: 12px 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; background: var(--surface); border-radius: 0 0 12px 12px; }
.table-foot svg { width: 15px; height: 15px; color: var(--teal); flex: none; }

/* Exceptions */
.exceptions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.exc-head { width: 100%; border: 0; background: none; text-align: left; padding: 18px 20px; display: grid; grid-template-columns: 40px 1fr auto; gap: 14px; align-items: center; cursor: pointer; border-radius: 12px; }
.exc-head .ic { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--surface); color: var(--navy); }
.exc-head .ic svg { width: 20px; height: 20px; }
.exc-head h3 { font-size: 16px; }
.exc-head .meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
.exc-head .chev { width: 18px; height: 18px; color: var(--muted); transition: transform .15s; }
.exc-head[aria-expanded="true"] .chev { transform: rotate(180deg); }
.exc-figs { display: flex; flex-wrap: wrap; gap: 10px; padding: 0 20px 16px; }
.exc-fig { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-width: 120px; }
.exc-fig .v { font-weight: 700; color: var(--navy); font-size: 18px; }
.exc-fig .l { font-size: 12px; color: var(--muted); }
.exc-body { border-top: 1px solid var(--line); padding: 16px 20px 20px; display: grid; gap: 12px; }
.exc-body ul { padding: 0; list-style: none; display: grid; gap: 9px; font-size: 14px; }
.exc-body li { display: grid; grid-template-columns: 16px 1fr; gap: 8px; }
.exc-body li svg { width: 15px; height: 15px; margin-top: 3px; color: var(--teal); }
.exc-body li.is-verify svg { color: var(--amber); }
.note { font-size: 13px; padding: 10px 12px; border-radius: 9px; display: flex; gap: 8px; align-items: flex-start; }
.note svg { flex: none; width: 15px; height: 15px; margin-top: 2px; }
.note.verify { background: var(--amber-soft); color: #7a4c06; }
.note.verify svg { color: var(--amber); }
.note.doc { background: var(--blue-soft); color: #253f94; }
.note.doc svg { color: var(--blue); }

/* Roadmap */
.pipes { display: grid; gap: 14px; }
.pipe { padding: 18px 20px; display: grid; gap: 14px; }
.pipe-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.pipe-head h3 { font-size: 15px; display: flex; gap: 10px; align-items: center; }
.pipe-head .hint { font-size: 13px; color: var(--muted); }
.pipe-row { display: flex; align-items: stretch; gap: 0; overflow-x: auto; padding-bottom: 2px; }
.node { flex: 1 1 0; min-width: 130px; border: 1px solid var(--line-strong); background: var(--bg); border-radius: 10px; padding: 12px 12px; font-size: 13.5px; font-weight: 600; color: var(--navy); display: grid; gap: 4px; align-content: center; text-align: center; }
.node small { font-weight: 500; color: var(--muted); font-size: 12px; }
.node.manual { border: 1.5px dashed var(--rose); background: var(--rose-soft); color: #8a2a21; flex-grow: 1.4; }
.node.manual small { color: var(--rose); font-weight: 600; }
.node.auto { border: 1.5px dashed var(--teal); background: var(--teal-soft); color: var(--teal-strong); flex-grow: 1.4; }
.node.auto small { color: var(--teal-strong); }
.arrow { flex: none; width: 28px; display: grid; place-items: center; color: var(--line-strong); }
.arrow svg { width: 18px; height: 18px; }
.pipe.current { background: var(--bg); }
.pipe.proposed { background: linear-gradient(180deg, #f3faf9, var(--bg)); border-color: #cfe9e7; }

.options { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.option { padding: 18px 20px; display: grid; gap: 10px; align-content: start; }
.option-top { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.option .tag { font-family: var(--font-data); font-size: 12px; font-weight: 600; color: var(--teal-strong); letter-spacing: .04em; }
.option h3 { font-size: 16px; display: flex; gap: 8px; align-items: center; }
.option h3 svg { width: 18px; height: 18px; color: var(--teal); }
.option ul { display: grid; gap: 6px; font-size: 13.5px; color: var(--ink); }
.option li::marker { color: var(--teal); }
.option .req { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
.principle { background: var(--navy); color: #fff; border-radius: 12px; padding: 18px 22px; display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start; }
.principle svg { width: 22px; height: 22px; color: #7fd6d1; margin-top: 2px; }
.principle .k { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #9fe0dc; }
.principle p { margin-top: 4px; font-size: 15px; max-width: 75ch; }

/* Monday + actions */
.ops { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; }
.monday { padding: 20px; display: grid; gap: 14px; }
.monday-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.monday-top h3 { font-size: 17px; display: flex; align-items: center; gap: 10px; }
.cal { width: 44px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line-strong); text-align: center; flex: none; }
.cal .m { background: var(--teal); color: #fff; font-size: 9px; font-weight: 700; letter-spacing: .08em; padding: 2px 0; }
.cal .d { font-size: 13px; font-weight: 700; color: var(--navy); padding: 3px 0 4px; }
.monday ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; counter-reset: s; }
.monday li { counter-increment: s; display: grid; grid-template-columns: 26px 1fr; gap: 10px; font-size: 14px; }
.monday li::before { content: counter(s); width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--blue); color: var(--blue); font-size: 12px; font-weight: 700; display: grid; place-items: center; font-family: var(--font-data); }
.status-line { font-size: 13px; padding: 10px 12px; border-radius: 9px; background: var(--blue-soft); color: #253f94; display: flex; gap: 8px; align-items: center; }
.status-line svg { width: 15px; height: 15px; color: var(--blue); flex: none; }
.actions td:first-child { width: 36px; padding-right: 0; }
.box { width: 16px; height: 16px; border: 1.5px solid var(--line-strong); border-radius: 4px; display: block; }
.actions td { font-size: 14px; }
.actions .owner { font-weight: 600; color: var(--navy); white-space: nowrap; }

footer { border-top: 1px solid var(--line); padding-block: 18px 32px; color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; }

.report-break { border: 0; border-top: 1px solid var(--line); margin: 0; }
.view-label { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--teal-strong); display: flex; align-items: center; gap: 12px; }
.view-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.loading { padding: 64px 0; color: var(--muted); text-align: center; }

@media (max-width: 960px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .controls, .options, .glance { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ot-grid, .ops, .exceptions { grid-template-columns: minmax(0, 1fr); }
  .pending ul { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 620px) {
  .kpis, .controls, .options, .glance, .facts { grid-template-columns: minmax(0, 1fr); }
  .prepared { text-align: left; }
  .kpi-value { font-size: 26px; }
  .flow { grid-template-columns: minmax(0, 1fr); min-width: 0; gap: 22px; }
  .step + .step::before { left: 30px; top: -18px; width: 2px; height: 14px; }

/* ---------- App shell ---------- */
const TABS = [
  ["overview", "Overview"],
  ["workflow", "Current workflow"],
  ["payroll", "Payroll review"],
  ["automation", "Automation"],
];
const readHash = () => { const h = (location.hash || "").slice(1); return TABS.some(t => t[0] === h) ? h : "overview"; };
const canPrint = (() => { try { return window.self === window.top; } catch (e) { return false; } })();

function App() {
  const [tab, setTab] = useState(readHash);
  const [report, setReport] = useState(false);

  useEffect(() => {
    const onHash = () => { setTab(readHash()); setReport(false); };
    const onBefore = () => ReactDOM.flushSync(() => setReport(true));
    window.addEventListener("hashchange", onHash);
    window.addEventListener("beforeprint", onBefore);
    return () => { window.removeEventListener("hashchange", onHash); window.removeEventListener("beforeprint", onBefore); };
  }, []);

  const go = (t, anchor) => {
    setReport(false);
    setTab(t);
    try { history.replaceState(null, "", "#" + t); } catch (e) {}
    requestAnimationFrame(() => {
      const el = anchor && document.getElementById(anchor);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      else window.scrollTo({ top: 0 });
    });
  };

  const views = {
    overview: <Overview go={go} />,
    workflow: <><Workflow /><Responsibility /><Controls /></>,
    payroll: <><Overtime /><Exceptions allOpen={report} /></>,
    automation: <><Roadmap /><Operations /></>,
  };

  const printNow = () => { ReactDOM.flushSync(() => setReport(true)); setTimeout(() => window.print(), 300); };

  return (
    <>
      <header className="masthead">
        <div className="wrap">
          <div className="masthead-top">
            <div>
              <div className="eyebrow">Twin Home Buyer / Equity Track Inc. · Controller's report</div>
              <h1>Deputy Timekeeping &amp; Payroll Controls</h1>
              <p className="subtitle"><strong>October 12–18, 2026</strong> · Prepared by Accounting</p>
            </div>
            <div className="prepared">
              <span>Prepared for <b>Juan Diaz, CEO</b></span>
              <span>Reading time about 3 minutes</span>
            </div>
          </div>
          <div className="toolbar">
            <nav className="tabs" role="tablist" aria-label="Dashboard sections">
              {TABS.map(([id, label]) => (
                <button key={id} role="tab" className="tab" aria-selected={!report && tab === id} onClick={() => go(id)}>{label}</button>
              ))}
            </nav>
            <div className="tools">
              <button className="btn" aria-pressed={report} onClick={() => { setReport(r => !r); window.scrollTo({ top: 0 }); }}>
                <Icon name="layers" />{report ? "Back to tabs" : "Full report view"}
              </button>
              {canPrint && <button className="btn" onClick={printNow}><Icon name="printer" />Print / Save PDF</button>}
            </div>
          </div>
        </div>
      </header>

      <div className="wrap">
        <div className="legend">
          <span>Status key</span>
          <Chip s="current" /><Chip s="planned" /><Chip s="verify" /><Chip s="gap" />
          <span>Approximate figures are marked ≈</span>
        </div>
      </div>

      <main className="wrap">
        {report ? (
          <div className="view">
            {TABS.map(([id, label]) => (
              <div key={id} className="view view-block">
                <div className="view-label">{label}</div>
                {views[id]}
              </div>
            ))}
          </div>
        ) : (
          <div className="view" role="tabpanel">{views[tab]}</div>
        )}
      </main>

      <footer className="wrap">
        <span>Source: Accounting payroll review for the weeks of Oct 5–11 and Oct 12–18, 2026; Deputy timesheets; TripLog Summary Report.</span>
        <span>Proposed automation is not yet implemented.</span>
      </footer>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
