<title>Accounting Mail Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f3f5f4; --surface:#ffffff; --sunk:#e9edeb; --ink:#16201c; --ink-2:#4a5752; --ink-3:#77837e;
  --line:#d6ddd9; --accent:#0e6b62; --accent-ink:#ffffff; --accent-soft:#dcefeb;
  --crit:#b3261e; --crit-soft:#fbe7e5; --high:#a15c07; --high-soft:#fcefd9;
  --norm:#2f5f8a; --norm-soft:#e3edf6; --low:#6b7772; --low-soft:#eceeed; --ok:#2e7d4f; --ok-soft:#e1f2e7;
  --shadow:0 1px 2px rgba(20,32,28,.06),0 4px 16px rgba(20,32,28,.05);
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark; --bg:#111715; --surface:#19211e; --sunk:#141b18; --ink:#e6ece9; --ink-2:#a9b6b1; --ink-3:#7f8c87;
  --line:#2c3833; --accent:#4cc2b2; --accent-ink:#0c1a17; --accent-soft:#16332e;
  --crit:#f2867c; --crit-soft:#3a1d1a; --high:#e9aa52; --high-soft:#352813; --norm:#8cb7e0; --norm-soft:#1a2835;
  --low:#97a39e; --low-soft:#202926; --ok:#7fcf9c; --ok-soft:#18301f; --shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#111715; --surface:#19211e; --sunk:#141b18; --ink:#e6ece9; --ink-2:#a9b6b1; --ink-3:#7f8c87;
  --line:#2c3833; --accent:#4cc2b2; --accent-ink:#0c1a17; --accent-soft:#16332e;
  --crit:#f2867c; --crit-soft:#3a1d1a; --high:#e9aa52; --high-soft:#352813; --norm:#8cb7e0; --norm-soft:#1a2835;
  --low:#97a39e; --low-soft:#202926; --ok:#7fcf9c; --ok-soft:#18301f; --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:20px 60px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
header.top h1{font-size:26px;font-weight:700;letter-spacing:-.01em}
header.top p{margin:2px 0 0;color:var(--ink-2)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--crit)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left}
.tile:hover{border-color:var(--ink-3)}
.tile .n{font-size:24px;font-weight:700;font-family:var(--mono)}
.tile .l{font-size:12px;color:var(--ink-2);font-weight:600}
.tile .sub{font-size:12px;color:var(--ink-3)}
.tile[data-p="urgent"] .n{color:var(--crit)} .tile[data-p="high"] .n{color:var(--high)}
.tile[data-p="normal"] .n{color:var(--norm)} .tile[data-p="low"] .n{color:var(--low)}
@media (max-width:640px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar input[type=search]{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px}
.toolbar select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
.chk{display:inline-flex;gap:6px;align-items:center;color:var(--ink-2);font-size:13px;cursor:pointer}

.banner{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:12px 14px;color:var(--ink-2)}
.banner.err{border-color:var(--crit);background:var(--crit-soft);color:var(--ink)}

section.tier{display:flex;flex-direction:column;gap:8px}
.tier-head{display:flex;align-items:baseline;gap:10px;padding:6px 2px 2px;border-bottom:2px solid var(--line)}
.tier-head h2{font-size:15px;font-weight:700}
.tier-head .why{color:var(--ink-3);font-size:13px}
.tier-head .cnt{margin-left:auto;color:var(--ink-3);font-size:12px}
.tier[data-p="urgent"] .tier-head{border-color:var(--crit)} .tier[data-p="urgent"] h2{color:var(--crit)}
.tier[data-p="high"] .tier-head{border-color:var(--high)} .tier[data-p="high"] h2{color:var(--high)}
.tier[data-p="normal"] .tier-head{border-color:var(--norm)} .tier[data-p="normal"] h2{color:var(--norm)}
.tier[data-p="low"] h2{color:var(--low)}
.empty-tier{color:var(--ink-3);font-size:13px;padding:6px 2px}

.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;position:relative}
.item::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--stripe,var(--low))}
.item[data-p="urgent"]{--stripe:var(--crit)} .item[data-p="high"]{--stripe:var(--high)} .item[data-p="normal"]{--stripe:var(--norm)}
.item.done{opacity:.72}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:12px 14px 12px 18px;cursor:pointer;width:100%;background:none;border:0;text-align:left}
.row:hover{background:var(--sunk)}
.row .t{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.row .meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;color:var(--ink-2);font-size:13px}
.row .right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
.row .amt{font-family:var(--mono);font-weight:500;font-size:14px;max-width:220px;overflow-wrap:anywhere}
.row .due{font-size:12px;color:var(--ink-3)}
.row .due.over{color:var(--crit);font-weight:600}
.row .due.soon{color:var(--high);font-weight:600}
@media (max-width:560px){.row{grid-template-columns:1fr}.row .right{align-items:flex-start;text-align:left}}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;background:var(--low-soft);color:var(--ink-2);white-space:nowrap}
.pill.pay{background:var(--crit-soft);color:var(--crit)} .pill.ver{background:var(--high-soft);color:var(--high)}
.pill.inv{background:var(--norm-soft);color:var(--norm)} .pill.ok{background:var(--ok-soft);color:var(--ok)}
.tag{font-size:12px;color:var(--ink-3)}
.counts{display:inline-flex;gap:10px;font-size:12px;color:var(--ink-3)}

.detail{border-top:1px solid var(--line);padding:14px 16px 16px 18px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
@media (max-width:760px){.detail{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.block h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:4px}
.block p,.block pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-family:inherit;color:var(--ink)}
.block.next{background:var(--accent-soft);border-radius:8px;padding:10px 12px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fields label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-3);font-weight:600}
.fields input,.fields select,.fields textarea{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 8px;font-size:13px;font-weight:400;color:var(--ink);width:100%}
.fields .wide{grid-column:1/-1}

.notes{display:flex;flex-direction:column;gap:8px}
.note{background:var(--sunk);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.note .who{font-size:12px;color:var(--ink-3);display:flex;gap:8px;align-items:center}
.note .who b{color:var(--ink-2);font-weight:600}
.note .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.note .x{margin-left:auto;background:none;border:0;color:var(--ink-3);cursor:pointer;font-size:12px}
.note .x:hover{color:var(--crit)}
.compose{display:flex;flex-direction:column;gap:6px}
.compose textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-height:64px;resize:vertical;width:100%}
.compose .acts{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--ink-3)}

.files{display:flex;flex-direction:column;gap:6px}
.file{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0}
.file .ic{font-family:var(--mono);font-size:10px;font-weight:600;background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:2px 5px;flex:none}
.file a{color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.file a:hover{color:var(--accent)}
.file .sz{font-size:12px;color:var(--ink-3);flex:none}
.file .x{background:none;border:0;color:var(--ink-3);cursor:pointer;flex:none}
.file .x:hover{color:var(--crit)}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:12px;text-align:center;color:var(--ink-3);font-size:13px;cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.linkadd{display:flex;gap:6px}
.linkadd input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 8px;font-size:13px}
.thumb{max-height:120px;border-radius:6px;border:1px solid var(--line)}
.foot{display:flex;justify-content:flex-end;gap:8px;align-items:center;flex-wrap:wrap}

dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,20,16,.45)}
dialog form{padding:18px;display:flex;flex-direction:column;gap:12px}
dialog h2{font-size:18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;z-index:10}
@media (prefers-reduced-motion:no-preference){.item{transition:border-color .15s}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Twin Home Buyer · Accounting</div>
      <h1>Mail Desk — <span id="monthLabel">September 2026</span></h1>
      <p>Bills, notices and follow-ups, sorted by how soon they need action. Least urgent is at the bottom.</p>
    </div>
    <button class="btn primary" id="addBtn" type="button">+ Add item</button>
  </header>

  <div id="banner" class="banner" hidden></div>

  <div class="summary" id="summary"></div>

  <div class="toolbar">
    <input type="search" id="q" placeholder="Search vendor, address, account, note…" aria-label="Search">
    <select id="fStatus" aria-label="Filter by status"><option value="">All statuses</option></select>
    <select id="fCat" aria-label="Filter by category"><option value="">All categories</option></select>
    <label class="chk"><input type="checkbox" id="hideDone"> Hide paid / closed</label>
  </div>

  <div id="list"></div>
</div>

<dialog id="dlg">
  <form id="addForm">
    <h2>Add an item</h2>
    <div class="fields">
      <label class="wide">Name / vendor<input id="nTitle" required placeholder="e.g. PG&E – 27 Prague St"></label>
      <label>Priority<select id="nPri"></select></label>
      <label>Status<select id="nStatus"></select></label>
      <label>Amount<input id="nAmt" placeholder="$0.00"></label>
      <label>Due date<input id="nDue" type="date"></label>
      <label>Category<select id="nCat"></select></label>
      <label>Action<select id="nAction"></select></label>
      <label class="wide">Description<textarea id="nDesc" rows="2"></textarea></label>
      <label class="wide">Next step<textarea id="nNext" rows="2"></textarea></label>
    </div>
    <div class="foot">
      <button class="btn" type="button" id="cancelAdd">Cancel</button>
      <button class="btn primary" type="submit">Add item</button>
    </div>
  </form>
</dialog>

<script>
const TIERS=[
  {k:"urgent",name:"Urgent",why:"Overdue, lien, collections or shut-off risk. Act now."},
  {k:"high",name:"High",why:"Due or decision needed within about two weeks."},
  {k:"normal",name:"Normal",why:"Follow up or verify. No hard deadline."},
  {k:"low",name:"No urgent task",why:"Paid, filed for records, or notice only."}];
const STATUSES=["For Payment","For Verification","Investigate","Pending","For Record","Notice","No Action Needed","Paid","Done","Thrown"];
const DONE=new Set(["Paid","Done","Thrown","For Record","Notice","No Action Needed"]);
const CATS=["Utilities","Property tax","Insurance","Vehicle","Loans & banking","Vendor invoice","Notices","Other"];
const ACTIONS=["Pay","Verify","Investigate","Keep","Mail/Return","Throw"];
const PRI_ORDER={urgent:0,high:1,normal:2,low:3};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const state={items:[],notes:[],files:[],open:new Set(),names:{},me:null,canUpload:false,db:null,assets:null,user:null,confirmDel:null};
try{state.open=new Set(JSON.parse(localStorage.getItem("mdOpen")||"[]"))}catch(e){}
try{$("#hideDone").checked=localStorage.getItem("mdHide")==="1"}catch(e){}

function fillSelect(el,vals,labels){el.insertAdjacentHTML("beforeend",vals.map((v,i)=>`<option value="${esc(v)}">${esc(labels?labels[i]:v)}</option>`).join(""))}
fillSelect($("#fStatus"),STATUSES);fillSelect($("#fCat"),CATS);
fillSelect($("#nPri"),TIERS.map(t=>t.k),TIERS.map(t=>t.name));$("#nPri").value="normal";
fillSelect($("#nStatus"),STATUSES);fillSelect($("#nCat"),CATS);fillSelect($("#nAction"),ACTIONS);

function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function banner(msg,err){const b=$("#banner");b.hidden=!msg;b.textContent=msg||"";b.classList.toggle("err",!!err)}

const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
function dueInfo(it){
  if(!it.dueDate) return {txt:it.dueText||"No due date",cls:""};
  const d=new Date(it.dueDate+"T00:00:00"),days=Math.round((d-today())/864e5);
  const f=d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
  if(DONE.has(it.status)) return {txt:"Due "+f,cls:""};
  if(days<0) return {txt:`${f} · ${-days} day${days==-1?"":"s"} overdue`,cls:"over"};
  if(days===0) return {txt:`${f} · due today`,cls:"over"};
  if(days<=7) return {txt:`${f} · in ${days} day${days==1?"":"s"}`,cls:"soon"};
  return {txt:`${f} · in ${days} days`,cls:""};
}
function pillClass(s){if(s==="For Payment")return"pay";if(s==="For Verification"||s==="Pending")return"ver";if(s==="Investigate")return"inv";if(s==="Paid"||s==="Done")return"ok";return""}
function who(by){if(by==="sheet")return"September sheet";if(by==="claude")return"Claude";if(!by)return"Someone";return state.names[by]||"Someone"}
function fmtAt(at){try{return new Date(at).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}catch(e){return""}}
function fmtSize(b){if(!b)return"";if(b<1024)return b+" B";if(b<1048576)return Math.round(b/1024)+" KB";return(b/1048576).toFixed(1)+" MB"}
function money(s){const m=String(s||"").match(/\$\s?([\d,]+(?:\.\d{2})?)/);return m?parseFloat(m[1].replace(/,/g,"")):0}

function sorted(items){
  return items.slice().sort((a,b)=>{
    const da=DONE.has(a.status)?1:0,dbb=DONE.has(b.status)?1:0; if(da!==dbb)return da-dbb;
    const x=a.dueDate||"9999",y=b.dueDate||"9999"; if(x!==y)return x<y?-1:1;
    return (a.title||"").localeCompare(b.title||"");
  });
}
function matches(it){
  const q=$("#q").value.trim().toLowerCase(),fs=$("#fStatus").value,fc=$("#fCat").value;
  if($("#hideDone").checked&&DONE.has(it.status))return false;
  if(fs&&it.status!==fs)return false; if(fc&&it.category!==fc)return false;
  if(!q)return true;
  const notes=state.notes.filter(n=>n.itemId===it.id).map(n=>n.text).join(" ");
  return [it.title,it.description,it.info,it.amount,it.nextStep,it.status,it.category,notes].join(" ").toLowerCase().includes(q);
}

function renderSummary(){
  $("#summary").innerHTML=TIERS.map(t=>{
    const all=state.items.filter(i=>(i.priority||"normal")===t.k), open=all.filter(i=>!DONE.has(i.status));
    const due=open.filter(i=>i.action==="Pay").reduce((s,i)=>s+money(i.amount),0);
    const sub=t.k==="low"?`${all.length} item${all.length==1?"":"s"} total`:(due?`$${due.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})} to pay`:"nothing to pay");
    return `<button class="tile" type="button" data-p="${t.k}" data-jump="${t.k}"><span class="l">${esc(t.name)}</span><span class="n">${t.k==="low"?all.length:open.length}</span><span class="sub">${t.k==="low"?"":"open · "}${sub}</span></button>`;
  }).join("");
}

function itemHTML(it){
  const d=dueInfo(it),open=state.open.has(it.id),done=DONE.has(it.status);
  const notes=state.notes.filter(n=>n.itemId===it.id).sort((a,b)=>(a.at||"")<(b.at||"")?-1:1);
  const files=state.files.filter(f=>f.itemId===it.id).sort((a,b)=>(a.at||"")<(b.at||"")?-1:1);
  let h=`<article class="item${done?" done":""}" data-p="${esc(it.priority||"normal")}" data-id="${esc(it.id)}">
  <button class="row" type="button" data-toggle="${esc(it.id)}" aria-expanded="${open}">
    <div style="display:flex;flex-direction:column;gap:4px;min-width:0">
      <span class="t">${esc(it.title)}</span>
      <span class="meta"><span class="pill ${pillClass(it.status)}">${esc(it.status)}</span><span class="tag">${esc(it.category||"")}${it.action?" · "+esc(it.action):""}</span>
      <span class="counts"><span>${notes.length} note${notes.length==1?"":"s"}</span><span>${files.length} file${files.length==1?"":"s"}</span></span></span>
    </div>
    <div class="right"><span class="amt">${esc(shortAmt(it.amount))}</span><span class="due ${d.cls}">${esc(d.txt)}</span></div>
  </button>`;
  if(open) h+=detailHTML(it,notes,files);
  return h+`</article>`;
}
function shortAmt(a){a=String(a||"");if(!a||/^n\/?a$/i.test(a))return"—";const m=a.match(/\$[\d,]+(?:\.\d{2})?/);return a.length>34&&m?m[0]:a}

function detailHTML(it,notes,files){
  const id=esc(it.id),ro=!state.db;
  const sel=(k,vals,labels)=>`<select id="f-${k}-${id}" data-field="${k}" data-id="${id}" ${ro?"disabled":""}>${vals.map((v,i)=>`<option value="${esc(v)}"${(it[k]||"")===v?" selected":""}>${esc(labels?labels[i]:v)}</option>`).join("")}</select>`;
  return `<div class="detail">
    <div class="col">
      ${it.nextStep?`<div class="block next"><h3>Next step</h3><p>${esc(it.nextStep)}</p></div>`:""}
      ${it.description?`<div class="block"><h3>What this is</h3><p>${esc(it.description)}</p></div>`:""}
      ${it.info?`<div class="block"><h3>Account details</h3><pre>${esc(it.info)}</pre></div>`:""}
      ${it.amount?`<div class="block"><h3>Amount</h3><p class="mono">${esc(it.amount)}</p></div>`:""}
      ${it.dueText?`<div class="block"><h3>Due (as written)</h3><p>${esc(it.dueText)}</p></div>`:""}
      <div class="block"><h3>Edit</h3>
        <div class="fields">
          <label>Priority${sel("priority",TIERS.map(t=>t.k),TIERS.map(t=>t.name))}</label>
          <label>Status${sel("status",STATUSES)}</label>
          <label>Due date<input type="date" id="f-dueDate-${id}" data-field="dueDate" data-id="${id}" value="${esc(it.dueDate||"")}" ${ro?"disabled":""}></label>
          <label>Category${sel("category",CATS)}</label>
          <label class="wide">Amount<input id="f-amount-${id}" data-field="amount" data-id="${id}" value="${esc(it.amount||"")}" ${ro?"disabled":""}></label>
          <label class="wide">Next step<textarea rows="3" id="f-nextStep-${id}" data-field="nextStep" data-id="${id}" ${ro?"disabled":""}>${esc(it.nextStep||"")}</textarea></label>
        </div>
      </div>
    </div>
    <div class="col">
      <div class="block"><h3>Notes</h3>
        <div class="notes">${notes.length?notes.map(n=>`<div class="note"><div class="who"><b>${esc(who(n.by))}</b><span>${esc(fmtAt(n.at))}</span>${(n.by===state.me&&state.me)?`<button class="x" type="button" data-delnote="${esc(n.id)}">Delete</button>`:""}</div><div class="txt">${esc(n.text)}</div></div>`).join(""):`<div class="hint">No notes yet.</div>`}</div>
      </div>
      <div class="compose">
        <textarea id="note-${id}" placeholder="Add a note: who you called, confirmation #, what's next…" ${ro?"disabled":""}></textarea>
        <div class="acts"><span class="hint">Ctrl/⌘ + Enter to save</span><button class="btn small primary" type="button" data-addnote="${id}" ${ro?"disabled":""}>Add note</button></div>
      </div>
      <div class="block"><h3>Files &amp; receipts</h3>
        <div class="files">${files.map(fileHTML).join("")||`<div class="hint">No files yet.</div>`}</div>
      </div>
      ${state.canUpload?`<label class="drop" data-drop="${id}"><input type="file" multiple hidden data-upload="${id}" accept=".pdf,.png,.jpg,.jpeg,.gif,.webp,.csv,.txt,.json,.md">Drop a PDF, photo or receipt here, or click to choose</label>`:
        `<div class="hint">${state.db?"File uploads need Editor access to this page. You can still add a link below.":""}</div>`}
      <div class="linkadd"><input id="link-${id}" placeholder="Paste a link (Google Drive receipt, portal…)" ${ro?"disabled":""}><button class="btn small" type="button" data-addlink="${id}" ${ro?"disabled":""}>Add link</button></div>
      <div class="foot">${state.confirmDel===it.id?`<span class="hint">Delete this item and its notes?</span><button class="btn small" type="button" data-canceldel>Keep</button><button class="btn small danger" type="button" data-delitem="${id}">Yes, delete</button>`:`<button class="btn small danger" type="button" data-askdel="${id}" ${ro?"disabled":""}>Delete item</button>`}</div>
    </div>
  </div>`;
}
function fileHTML(f){
  const href=f.assetId?"/_blob/"+f.assetId:f.href;
  const ext=f.kind==="link"?"LINK":((f.name||"").split(".").pop()||"FILE").slice(0,4).toUpperCase();
  const img=f.assetId&&/^image\//.test(f.contentType||"");
  return `<div class="file"><span class="ic">${esc(ext)}</span><a href="${esc(href)}" target="_blank" rel="noopener">${esc(f.name||href)}</a><span class="sz">${esc(fmtSize(f.size))}${f.by?" · "+esc(who(f.by)):""}</span>${state.db?`<button class="x" type="button" title="Remove" aria-label="Remove file" data-delfile="${esc(f.id)}">✕</button>`:""}</div>${img?`<img class="thumb" src="${esc(href)}" alt="${esc(f.name)}">`:""}`;
}

function render(){
  renderSummary();
  const vis=state.items.filter(matches);
  const drafts={};document.querySelectorAll("textarea[id^=note-],input[id^=link-]").forEach(el=>{if(el.value)drafts[el.id]=el.value});
  const ae=document.activeElement,focusId=ae&&ae.id,focusVal=ae&&ae.dataset&&ae.dataset.field?ae.value:null;
  $("#list").innerHTML=TIERS.map(t=>{
    const its=sorted(vis.filter(i=>(i.priority||"normal")===t.k));
    return `<section class="tier" data-p="${t.k}" id="tier-${t.k}"><div class="tier-head"><h2>${esc(t.name)}</h2><span class="why">${esc(t.why)}</span><span class="cnt">${its.length}</span></div>
    ${its.length?its.map(itemHTML).join(""):`<div class="empty-tier">Nothing here${$("#q").value?" matches your search":""}.</div>`}</section>`;
  }).join("");
  for(const k in drafts){const el=document.getElementById(k);if(el)el.value=drafts[k]}
  if(focusId){const el=document.getElementById(focusId);if(el){if(focusVal!==null)el.value=focusVal;el.focus()}}
}

async function resolveNames(){
  if(!state.user)return;
  const ids=[...new Set([...state.notes,...state.files].map(n=>n.by).filter(b=>b&&b!=="sheet"&&b!=="claude"))];
  if(!ids.length)return;
  try{const ps=await state.user.profiles(ids);let ch=false;for(const id of ids){const n=(ps[id]&&ps[id].name)||"";if(state.names[id]!==n){state.names[id]=n;ch=true}}if(ch)render()}catch(e){}
}

async function write(fn,okMsg){
  try{await fn();if(okMsg)toast(okMsg)}
  catch(e){
    if(e&&e.code==="invalid_argument")banner("You have view-only access, so changes can't be saved. Ask the owner for Contributor or Editor access.",true);
    else if(e&&e.code==="quota_exceeded")banner("The list is full. Delete old items or files to add more.",true);
    else banner("That change didn't save. Check your connection and try again.",true);
  }
}
const now=()=>new Date().toISOString();

document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-toggle],[data-addnote],[data-delnote],[data-addlink],[data-delfile],[data-askdel],[data-canceldel],[data-delitem],[data-jump]");
  if(!t)return;
  if(t.dataset.jump){const el=document.getElementById("tier-"+t.dataset.jump);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});return}
  if(t.dataset.toggle){const id=t.dataset.toggle;state.open.has(id)?state.open.delete(id):state.open.add(id);try{localStorage.setItem("mdOpen",JSON.stringify([...state.open]))}catch(e){}render();return}
  if(t.dataset.addnote)return addNote(t.dataset.addnote);
  if(t.dataset.delnote)return write(()=>state.db.doc("notes/"+t.dataset.delnote).delete(),"Note deleted");
  if(t.dataset.addlink){
    const id=t.dataset.addlink,inp=document.getElementById("link-"+id),v=inp.value.trim();
    if(!/^https?:\/\//i.test(v)){toast("Paste a full link starting with https://");return}
    inp.value="";let name=v;try{const u=new URL(v);name=u.hostname.includes("drive.google")?"Google Drive file":u.hostname}catch(e){}
    return write(()=>state.db.collection("files").add({itemId:id,name,href:v,kind:"link",by:state.me,at:now()}),"Link added");
  }
  if(t.dataset.delfile){
    const f=state.files.find(x=>x.id===t.dataset.delfile);if(!f)return;
    await write(()=>state.db.doc("files/"+f.id).delete(),"File removed");
    if(f.assetId&&state.assets&&!state.files.some(x=>x.id!==f.id&&x.assetId===f.assetId)){try{await state.assets.delete(f.assetId)}catch(e){}}
    return;
  }
  if(t.dataset.askdel){state.confirmDel=t.dataset.askdel;render();return}
  if("canceldel" in t.dataset){state.confirmDel=null;render();return}
  if(t.dataset.delitem){
    const id=t.dataset.delitem;state.confirmDel=null;
    await write(async()=>{for(const n of state.notes.filter(n=>n.itemId===id))await state.db.doc("notes/"+n.id).delete();
      for(const f of state.files.filter(f=>f.itemId===id))await state.db.doc("files/"+f.id).delete();
      await state.db.doc("items/"+id).delete()},"Item deleted");
  }
});
async function addNote(id){
  const ta=document.getElementById("note-"+id),v=ta.value.trim();if(!v||!state.db)return;
  ta.value="";await write(()=>state.db.collection("notes").add({itemId:id,text:v,by:state.me,at:now()}),"Note added");
}
document.addEventListener("keydown",e=>{if(e.target.id&&e.target.id.startsWith("note-")&&e.key==="Enter"&&(e.metaKey||e.ctrlKey)){e.preventDefault();addNote(e.target.id.slice(5))}});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.field&&el.dataset.id&&state.db){
    const it=state.items.find(i=>i.id===el.dataset.id);if(!it||(it[el.dataset.field]||"")===el.value)return;
    const patch={[el.dataset.field]:el.value||null,updatedAt:now(),updatedBy:state.me};
    write(()=>state.db.doc("items/"+el.dataset.id).update(patch),"Saved");
  }
  if(el.dataset.upload)uploadFiles(el.dataset.upload,el.files);
});
["q","fStatus","fCat","hideDone"].forEach(id=>$("#"+id).addEventListener("input",()=>{if(id==="hideDone")try{localStorage.setItem("mdHide",$("#hideDone").checked?"1":"0")}catch(e){}render()}));
document.addEventListener("dragover",e=>{const d=e.target.closest("[data-drop]");if(d){e.preventDefault();d.classList.add("over")}});
document.addEventListener("dragleave",e=>{const d=e.target.closest("[data-drop]");if(d)d.classList.remove("over")});
document.addEventListener("drop",e=>{const d=e.target.closest("[data-drop]");if(d){e.preventDefault();d.classList.remove("over");uploadFiles(d.dataset.drop,e.dataTransfer.files)}});

const TYPE_BY_EXT={pdf:"application/pdf",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",webp:"image/webp",csv:"text/csv",txt:"text/plain",json:"application/json",md:"text/markdown"};
async function uploadFiles(itemId,list){
  if(!state.assets||!list||!list.length)return;
  for(const f of list){
    const ext=(f.name.split(".").pop()||"").toLowerCase(),type=TYPE_BY_EXT[ext];
    if(!type){toast(`${f.name}: use PDF, image, CSV or text files`);continue}
    toast("Uploading "+f.name+"…");
    try{
      const r=await state.assets.upload(f,{type});
      await write(()=>state.db.collection("files").add({itemId,name:f.name,assetId:r.id,contentType:r.contentType,size:r.sizeBytes,kind:"asset",by:state.me,at:now()}),"Uploaded "+f.name);
    }catch(e){
      const m={too_large:"is over the 20 MB limit",unsupported_type:"isn't a supported file type",quota_or_state:"couldn't be stored: storage is full",rate_limited:"wasn't uploaded. Wait a moment and try again",not_granted:"needs Editor access to upload"};
      toast(`${f.name} ${m[e&&e.code]||"didn't upload. Try again"}`);
    }
  }
}

$("#addBtn").addEventListener("click",()=>{if(!state.db){toast("The shared list isn't connected in this view");return}const d=$("#dlg");d.showModal?d.showModal():d.setAttribute("open","")});
$("#cancelAdd").addEventListener("click",()=>$("#dlg").close());
$("#addForm").addEventListener("submit",async e=>{
  e.preventDefault();const title=$("#nTitle").value.trim();if(!title)return;
  const data={title,priority:$("#nPri").value,status:$("#nStatus").value,amount:$("#nAmt").value.trim(),dueDate:$("#nDue").value||null,
    dueText:"",category:$("#nCat").value,action:$("#nAction").value,description:$("#nDesc").value.trim(),nextStep:$("#nNext").value.trim(),info:"",
    month:new Date().toISOString().slice(0,7),createdAt:now(),createdBy:state.me};
  $("#dlg").close();e.target.reset();$("#nPri").value="normal";
  await write(async()=>{const ref=await state.db.collection("items").add(data);state.open.add(ref.id)},"Item added");
});

render();
banner("Connecting to the shared list…");
(async()=>{
  const claude=window.claude;if(!claude||!claude.use){banner("Open this page on claude.ai to see and edit the shared list.",true);return}
  const [db,user,assets]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("assets")]);
  if(!db){banner("The shared list isn't available in this view. Open the page from its claude.ai link while signed in.",true);return}
  state.db=db;state.user=user;state.assets=assets;state.canUpload=!!assets;
  if(user){try{state.me=await user.id()}catch(e){}}
  let loaded=0;const done=()=>{if(++loaded>=1)banner("")};
  const sub=(name,key)=>db.collection(name).onSnapshot(s=>{state[key]=s.docs.map(d=>({id:d.id,...d.data()}));done();render();if(key!=="items")resolveNames()},
    err=>{if(err.code!=="revoked")banner("Live updates stopped. Reload the page to reconnect.",true)});
  sub("items","items");sub("notes","notes");sub("files","files");
})();
</script>
