<title>Accounting Mail Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f3f6f1; --surface:#ffffff; --sunk:#f0f3ee; --ink:#23241f; --ink-2:#55574f; --ink-3:#8a8c83;
  --line:#dfe5dc; --line-2:#cbd3c7; --accent:#1f8a4c; --accent-ink:#ffffff; --accent-soft:#dcf3e3; --hero:#17442e; --hero-2:#1f6b45; --hero-ink:#f4fbf6; --hero-sub:#b9dcc6; --gold:#f2b544;
  --ok:#1f8a4c; --ok-soft:#d9f2e1; --wait:#b86b00; --wait-soft:#ffecc7; --bad:#c9302c; --bad-soft:#ffe1dc;
  --info:#2566b0; --info-soft:#deebfb; --chip:#eceee8; --plum:#8a3fa0; --plum-soft:#f3e3f8; --teal:#0f8190; --teal-soft:#d8f1f4;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif; --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark; --bg:#161714; --surface:#1e1f1b; --sunk:#191a17; --ink:#ebeae4; --ink-2:#b4b5ac; --ink-3:#86887f;
  --line:#2f312b; --line-2:#3c3e37; --accent:#6fd394; --accent-ink:#0d2014; --accent-soft:#183324; --hero:#123522; --hero-2:#1a5236; --hero-ink:#eef8f1; --hero-sub:#9fcbb0; --gold:#f2b544;
  --ok:#86cf98; --ok-soft:#1c2f20; --wait:#e8b35f; --wait-soft:#33280f; --bad:#f08b80; --bad-soft:#3a1d19;
  --info:#95bbe3; --info-soft:#1b2734; --chip:#2a2b26; --plum:#d5a0e6; --plum-soft:#34203b; --teal:#6fd0dc; --teal-soft:#143339;
}}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#161714; --surface:#1e1f1b; --sunk:#191a17; --ink:#ebeae4; --ink-2:#b4b5ac; --ink-3:#86887f;
  --line:#2f312b; --line-2:#3c3e37; --accent:#6fd394; --accent-ink:#0d2014; --accent-soft:#183324; --hero:#123522; --hero-2:#1a5236; --hero-ink:#eef8f1; --hero-sub:#9fcbb0; --gold:#f2b544;
  --ok:#86cf98; --ok-soft:#1c2f20; --wait:#e8b35f; --wait-soft:#33280f; --bad:#f08b80; --bad-soft:#3a1d19;
  --info:#95bbe3; --info-soft:#1b2734; --chip:#2a2b26; --plum:#d5a0e6; --plum-soft:#34203b; --teal:#6fd0dc; --teal-soft:#143339;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.5;padding-inline:16px;padding-block:14px 60px}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.page{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* header */
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-start;justify-content:space-between;padding:16px 18px;border-radius:14px;color:var(--hero-ink);background:linear-gradient(120deg,var(--hero) 0%,var(--hero-2) 70%,#2a7d52 100%);box-shadow:0 6px 20px rgba(23,68,46,.18);position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(242,181,68,.28),transparent 70%);pointer-events:none}
.crumb{font-size:12px;color:var(--hero-sub);margin-bottom:6px;letter-spacing:.03em}
.titleRow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.top h1{font-family:var(--serif);font-size:25px;font-weight:700;letter-spacing:-.01em}
.top .sub{color:var(--hero-sub);font-size:12.5px;margin-top:3px}
.top .chip.wait{background:var(--gold);color:#3b2600}.top .chip.bad{background:#ffd3cc;color:#8a1a14}.top .chip.ok{background:#c9f0d6;color:#0f4d29}
.search{flex:0 1 380px;min-width:0;display:flex;align-items:center;gap:8px;border:1px solid transparent;background:var(--surface);color:var(--ink);position:relative;z-index:1;border-radius:8px;padding:7px 10px;margin-top:4px}
.search input{border:0;background:none;outline:none;flex:1;min-width:0}
.search kbd{font-family:var(--mono);font-size:11px;color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--chip);color:var(--ink-2)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.wait{background:var(--wait-soft);color:var(--wait)}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.info{background:var(--info-soft);color:var(--info)}

/* shell */
.shell{display:grid;grid-template-columns:190px minmax(0,1fr);gap:22px;align-items:start}
.side{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:2px}
.tab{display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;background:none;text-align:left;padding:7px 10px;border-radius:7px;color:var(--ink-2);cursor:pointer;font-weight:500}
.tab:hover{background:var(--sunk);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700;box-shadow:inset 3px 0 0 var(--accent)}
.tab .chip{font-size:11px;padding:0 7px}
.side .sep{height:1px;background:var(--line);margin:8px 4px}
.side .who{font-size:11.5px;color:var(--ink-3);padding:8px 10px;line-height:1.45}
.side .addBtn{margin-top:8px}
@media (max-width:760px){
  .shell{grid-template-columns:1fr;gap:12px}
  .side{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .tab{flex:none}.side .sep,.side .who{display:none}.side .addBtn{margin-top:0;flex:none}
}

/* cards */
main{display:flex;flex-direction:column;gap:14px;min-width:0}
.viewHead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px}
.viewHead h2{font-family:var(--serif);font-size:21px;font-weight:700;color:var(--hero-2)}
.viewHead .src{font-size:12px;color:var(--ink-3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.card.goal{border-top:4px solid var(--accent)}
.card.goal .lead{font-size:14.5px}
.card.goal .lead b{font-weight:700}
.bar{height:6px;background:var(--sunk);border-radius:999px;overflow:hidden;margin:10px 0 4px}
.bar{height:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--ok));border-radius:999px}
.barRow{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.fact{border:0;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:var(--sunk)}
.fact.ok{background:var(--ok-soft)}.fact.ok .k{color:var(--ok)}.fact.wait{background:var(--wait-soft)}.fact.wait .k{color:var(--wait)}.fact.bad{background:var(--bad-soft)}.fact.bad .k{color:var(--bad)}
.fact .k{font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.fact .v{font-weight:600}
@media (max-width:640px){.facts{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.cardHead{display:flex;align-items:flex-start;gap:10px;margin:-14px -16px 8px;padding:11px 16px;border-radius:10px 10px 0 0;background:var(--sunk);border-bottom:1px solid var(--line)}
section.tier-urgent .cardHead{background:var(--bad-soft)}section.tier-high .cardHead{background:var(--wait-soft)}section.tier-normal .cardHead{background:var(--info-soft)}section.tier-low .cardHead{background:var(--ok-soft)}
section.tier-urgent h3{color:var(--bad)}section.tier-high h3{color:var(--wait)}section.tier-normal h3{color:var(--info)}section.tier-low h3{color:var(--ok)}
.cardHead .num{flex:none;width:22px;height:22px;border-radius:50%;background:var(--info);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.tier-urgent .num{background:var(--bad);color:#fff} .tier-high .num{background:var(--wait);color:#fff}
.tier-low .num{background:var(--ok);color:#fff}
.cardHead h3{font-size:14px;font-weight:700;flex:1}
.cardHead .why{display:block;font-size:12px;color:var(--ink-3);font-weight:400;margin-top:1px}
.mini{display:flex;flex-direction:column}
.miniRow{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:4px 8px;align-items:start;padding:7px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.miniRow:first-child{border-top:0}
.miniRow:hover .t{color:var(--accent)}
.miniRow .t{font-weight:500;overflow-wrap:anywhere}
.miniRow .d{font-size:11.5px;color:var(--ink-3);grid-column:2}
.miniRow .chip{grid-row:1;grid-column:3}
.cardFoot{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);margin-top:8px;padding-top:9px;font-size:12px;color:var(--ink-3)}
.link{background:none;border:0;padding:0;color:var(--ink-2);cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:5px}
.link:hover{color:var(--accent)}
.link svg{width:13px;height:13px}

/* checkbox */
.cb{appearance:none;width:15px;height:15px;border:1.5px solid var(--line-2);border-radius:3px;margin:2px 0 0;background:var(--surface);cursor:pointer;display:grid;place-items:center;flex:none}
.cb:checked{background:var(--ok);border-color:var(--ok)}
.cb:checked::after{content:"";width:4px;height:8px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.cb:disabled{cursor:default}
.dot{width:15px;height:15px;border-radius:3px;margin-top:2px;border:1.5px solid var(--line-2)}
.dot.on{background:var(--ok);border-color:var(--ok)}

/* item card */
.item{display:flex;flex-direction:column;gap:6px}
.item{border-left:5px solid var(--info)}.item.tier-urgent{border-left-color:var(--bad)}.item.tier-high{border-left-color:var(--wait)}.item.tier-low{border-left-color:var(--ok)}
.item.closed{background:linear-gradient(0deg,var(--surface),var(--surface)),var(--ok-soft)}
.card{box-shadow:0 1px 2px rgba(30,60,40,.05),0 3px 12px rgba(30,60,40,.05)}
.itemTop{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:2px 8px;align-items:start}
.itemTop .t{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.item.closed .itemTop .t{color:var(--ink-3)}
.itemTop .chip{margin-top:1px}
.meta{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;color:var(--ink-2)}
.meta .amt{font-family:var(--mono);font-weight:600;color:var(--ink)}
.cat{border-radius:5px;padding:0 6px;font-size:11px;font-weight:600;background:var(--chip);color:var(--ink-2)}
.cat.c0{background:var(--info-soft);color:var(--info)}.cat.c1{background:var(--plum-soft);color:var(--plum)}.cat.c2{background:var(--teal-soft);color:var(--teal)}.cat.c3{background:var(--wait-soft);color:var(--wait)}.cat.c4{background:var(--ok-soft);color:var(--ok)}.cat.c5{background:var(--bad-soft);color:var(--bad)}
.checked{grid-column:2/-1;font-size:11.5px;color:var(--ok)}
.nextShort{margin-left:26px;font-size:12.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .cardFoot{margin-left:0}
.item .cardFoot .sp{margin-left:auto}
.badge{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 5px;border-radius:999px;background:var(--chip);color:var(--ink-2);font-size:10.5px;font-weight:700}
.badge.wait{background:var(--wait-soft);color:var(--wait)}

.detail{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.blk h4{margin:0 0 3px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.blk p,.blk pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-family:inherit}
.quote{border-left:3px solid var(--accent);background:var(--accent-soft);padding:9px 12px;border-radius:0 8px 8px 0;font-family:var(--serif);font-size:14px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fields label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--ink-3);font-weight:600}
.fields input,.fields select,.fields textarea{border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:6px 8px;font-size:13px;font-weight:400;color:var(--ink);width:100%}
.fields .wide{grid-column:1/-1}
.notes{display:flex;flex-direction:column;gap:6px}
.note{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--bg)}
.note .by{font-size:11.5px;color:var(--ink-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.note .by b{color:var(--accent);font-weight:700}
.note{border-left:3px solid var(--teal)!important}
.note .txt{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.note .on{font-size:11.5px;color:var(--ink-3);margin-bottom:2px}
.note .on button{font-weight:600;color:var(--ink-2)}
.x{margin-left:auto;background:none;border:0;color:var(--ink-3);cursor:pointer;font-size:11.5px}
.x:hover{color:var(--bad)}
.compose{display:flex;flex-direction:column;gap:6px}
.compose textarea{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:58px;resize:vertical;width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.hint{font-size:11.5px;color:var(--ink-3)}
.files{display:flex;flex-direction:column;gap:5px}
.file{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:7px;padding:5px 9px;min-width:0;background:var(--bg)}
.file .ic{font-family:var(--mono);font-size:9.5px;font-weight:600;background:var(--info-soft);color:var(--info);border-radius:4px;padding:1px 5px;flex:none}
.file a{color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.file a:hover{color:var(--accent)}
.file .sz{font-size:11.5px;color:var(--ink-3);flex:none}
.thumb{max-height:120px;border-radius:6px;border:1px solid var(--line)}
.drop{border:1.5px dashed var(--line-2);border-radius:8px;padding:10px;text-align:center;color:var(--ink-3);font-size:12.5px;cursor:pointer;display:block}
.drop.over{border-color:var(--accent);color:var(--accent);background:var(--ok-soft)}
.linkadd{display:flex;gap:6px}
.linkadd input{flex:1;min-width:0;border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:6px 8px;font-size:12.5px}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:7px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:12.5px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.banner{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:9px 12px;color:var(--ink-2);font-size:12.5px}
.banner.err{border-color:var(--bad);background:var(--bad-soft);color:var(--ink)}
.empty{color:var(--ink-3);font-size:12.5px;padding:4px 0}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters select{border:1px solid var(--line-2);background:var(--surface);border-radius:7px;padding:5px 8px;font-size:12.5px}
.chk{display:inline-flex;gap:6px;align-items:center;color:var(--ink-2);font-size:12.5px;cursor:pointer}

dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,20,16,.45)}
dialog form{padding:18px;display:flex;flex-direction:column;gap:12px}
dialog h2{font-family:var(--serif);font-size:19px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:600;z-index:10}
</style>

<div class="page">
  <header class="top">
    <div>
      <div class="crumb">Twin Home Buyer · Accounting</div>
      <div class="titleRow"><h1>September mail desk</h1><span class="chip wait" id="deadlineChip">Loading…</span></div>
      <div class="sub" id="subline">Bills, notices and follow-ups for Equity Track, Prescott Development, Matrix Group and the Diaz household</div>
    </div>
    <label class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="q" placeholder="Search vendors, addresses, accounts, notes" aria-label="Search"><kbd>/</kbd></label>
  </header>

  <div id="banner" class="banner" hidden></div>

  <div class="shell">
    <nav class="side" id="side" aria-label="Sections"></nav>
    <main id="main"></main>
  </div>
</div>

<dialog id="dlg">
  <form id="addForm">
    <h2>Add an item</h2>
    <div class="fields">
      <label class="wide">Name / vendor<input id="nTitle" required placeholder="e.g. PG&amp;E – 27 Prague St"></label>
      <label>Priority<select id="nPri"></select></label>
      <label>Status<select id="nStatus"></select></label>
      <label>Amount<input id="nAmt" placeholder="$0.00"></label>
      <label>Due date<input id="nDue" type="date"></label>
      <label>Category<select id="nCat"></select></label>
      <label>Action<select id="nAction"></select></label>
      <label class="wide">What this is<textarea id="nDesc" rows="2"></textarea></label>
      <label class="wide">Next step<textarea id="nNext" rows="2"></textarea></label>
    </div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn" type="button" id="cancelAdd">Cancel</button>
      <button class="btn primary" type="submit">Add item</button>
    </div>
  </form>
</dialog>

<script>
const TIERS=[
  {k:"urgent",name:"Urgent",why:"Overdue, lien, collections or shut-off risk. Act now."},
  {k:"high",name:"High",why:"Due or decision needed within about two weeks."},
  {k:"normal",name:"Normal",why:"Follow up or verify. No hard deadline."},
  {k:"low",name:"No urgent task",why:"Paid, filed for records, or notice only."}];
const STATUSES=["For Payment","For Verification","Investigate","Pending","For Record","Notice","No Action Needed","Paid","Done","Thrown"];
const DONE=new Set(["Paid","Done","Thrown","For Record","Notice","No Action Needed"]);
const CATS=["Utilities","Property tax","Insurance","Vehicle","Loans & banking","Vendor invoice","Notices","Other"];
const ACTIONS=["Pay","Verify","Investigate","Keep","Mail/Return","Throw"];
const ICON_C='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>';
const ICON_F='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 11.5 12.6 20a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/></svg>';
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const S={items:[],notes:[],files:[],open:new Set(),names:{},me:null,db:null,assets:null,user:null,confirmDel:null,view:"overview",loaded:false};
try{S.open=new Set(JSON.parse(localStorage.getItem("mdOpen")||"[]"))}catch(e){}
try{const v=(location.hash||"").slice(1)||localStorage.getItem("mdView");if(v)S.view=v}catch(e){}
const fill=(el,vals,labels)=>el.insertAdjacentHTML("beforeend",vals.map((v,i)=>`<option value="${esc(v)}">${esc(labels?labels[i]:v)}</option>`).join(""));
fill($("#nPri"),TIERS.map(t=>t.k),TIERS.map(t=>t.name));$("#nPri").value="normal";
fill($("#nStatus"),STATUSES);fill($("#nCat"),CATS);fill($("#nAction"),ACTIONS);

function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function banner(m,err){const b=$("#banner");b.hidden=!m;b.textContent=m||"";b.classList.toggle("err",!!err)}
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const isDone=it=>DONE.has(it.status);
const pri=it=>it.priority||"normal";
function daysTo(it){if(!it.dueDate)return null;return Math.round((new Date(it.dueDate+"T00:00:00")-today())/864e5)}
function fmtDate(iso){return new Date(iso+"T00:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"})}
function fmtAt(at){try{return new Date(at).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}catch(e){return""}}
function fmtSize(b){if(!b)return"";if(b<1024)return b+" B";if(b<1048576)return Math.round(b/1024)+" KB";return(b/1048576).toFixed(1)+" MB"}
function money(s){const m=String(s||"").match(/\$\s?([\d,]+(?:\.\d{2})?)/);return m?parseFloat(m[1].replace(/,/g,"")):0}
const usd=n=>"$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
function who(by){if(by==="sheet")return"September sheet";if(by==="claude")return"Claude";if(!by)return"Someone";return S.names[by]||"Someone"}
function shortAmt(a){a=String(a||"");if(!a||/^n\/?a$|^not stated/i.test(a))return"";const m=a.match(/\$[\d,]+(?:\.\d{2})?/);return a.length>28&&m?m[0]:a}

// Status chip: green done, amber waiting, red overdue
function statusChip(it){
  if(isDone(it))return`<span class="chip ok">${esc(it.status==="Paid"?"Paid":"Done")}</span>`;
  const d=daysTo(it);
  if(d!==null&&d<0)return`<span class="chip bad">${-d} day${d==-1?"":"s"} overdue</span>`;
  if(d===0)return`<span class="chip bad">Due today</span>`;
  if(d!==null&&d<=14)return`<span class="chip wait">Due in ${d} day${d==1?"":"s"}</span>`;
  return`<span class="chip wait">${esc(it.status||"Open")}</span>`;
}
function dueLine(it){if(it.dueDate)return"Due "+fmtDate(it.dueDate);return it.dueText&&!/^n\/?a/i.test(it.dueText)?it.dueText.split("\n")[0].slice(0,60):"No due date"}
function sortItems(a){return a.slice().sort((x,y)=>{const dx=isDone(x)?1:0,dy=isDone(y)?1:0;if(dx!==dy)return dx-dy;const p=(x.dueDate||"9999"),q=(y.dueDate||"9999");if(p!==q)return p<q?-1:1;return(x.title||"").localeCompare(y.title||"")})}
const notesFor=id=>S.notes.filter(n=>n.itemId===id).sort((a,b)=>(a.at||"")<(b.at||"")?-1:1);
const filesFor=id=>S.files.filter(f=>f.itemId===id).sort((a,b)=>(a.at||"")<(b.at||"")?-1:1);

function stats(){
  const open=S.items.filter(i=>!isDone(i)),closed=S.items.length-open.length;
  const overdue=open.filter(i=>{const d=daysTo(i);return d!==null&&d<0});
  const toPay=open.filter(i=>i.action==="Pay").reduce((s,i)=>s+money(i.amount),0);
  const upcoming=sortItems(open.filter(i=>{const d=daysTo(i);return d!==null&&d>=0}))[0];
  const byTier={};TIERS.forEach(t=>{const all=S.items.filter(i=>pri(i)===t.k);byTier[t.k]={all,open:all.filter(i=>!isDone(i))}});
  return{open,closed,overdue,toPay,upcoming,byTier};
}

function renderHeader(st){
  const c=$("#deadlineChip");
  if(!S.loaded){c.textContent="Loading…";return}
  if(st.upcoming){const d=daysTo(st.upcoming);c.className="chip "+(d<=3?"bad":"wait");c.textContent=`${st.upcoming.title.split(/[—_(]/)[0].trim()} ${fmtDate(st.upcoming.dueDate)} · ${d===0?"due today":d+" day"+(d==1?"":"s")+" left"}`}
  else{c.className="chip ok";c.textContent="No upcoming deadlines"}
  $("#subline").textContent=`${S.items.length} items · ${st.open.length} open · ${st.closed} closed · Updated live for everyone`;
}
function renderSide(st){
  const n=k=>st.byTier[k]?st.byTier[k].open.length:0;
  const openNotes=S.notes.length;
  const tabs=[["overview","Overview",""],["urgent","Urgent",n("urgent"),"bad"],["high","High",n("high"),"wait"],["normal","Normal",n("normal"),"info"],
    ["low","No urgent task",(st.byTier.low||{all:[]}).all.length,""],["notes","All notes",openNotes,""],["files","Documents",S.files.length,""]];
  $("#side").innerHTML=tabs.map(([k,l,c,cls])=>`<button class="tab" type="button" data-view="${k}" ${S.view===k?'aria-current="page"':""}><span>${esc(l)}</span>${c!==""?`<span class="chip ${cls||""}">${c}</span>`:""}</button>`).join("")+
  `<button class="btn primary addBtn" type="button" id="addBtn">+ Add item</button><div class="sep"></div><div class="who">Accounting team, Twin Home Buyer<br>170 Glenn Way Ste 5, San Carlos</div>`;
}

function miniRow(it){
  return`<button class="miniRow" type="button" data-goto="${esc(it.id)}"><span class="dot ${isDone(it)?"on":""}"></span><span class="t">${esc(it.title)}</span>${statusChip(it)}<span class="d">${esc([shortAmt(it.amount),dueLine(it)].filter(Boolean).join(" · "))}</span></button>`;
}
function overview(st){
  const pct=S.items.length?Math.round(st.closed/S.items.length*100):0;
  const u=st.byTier.urgent.open, next=st.upcoming;
  let lead=`<b>${st.open.length} of ${S.items.length} items are still open</b>, with <b>${usd(st.toPay)}</b> left to pay across open bills. `;
  lead+=st.overdue.length?`<b style="color:var(--bad)">${st.overdue.length} are past their due date.</b> `:"Nothing is past due. ";
  lead+=next?`The next deadline is <b>${esc(next.title)}</b> on ${fmtDate(next.dueDate)}.`:"";
  const facts=[
    ["Confirmed / closed",`${st.closed} items paid, filed or notice only`],
    ["Still open",`${u.length} urgent · ${st.byTier.high.open.length} high · ${st.byTier.normal.open.length} normal`],
    ["Next deadline",next?`${fmtDate(next.dueDate)} · ${next.title.split(/[—_(]/)[0].trim()}`:"None scheduled"]];
  let h=`<div class="viewHead"><h2>Overview</h2><span class="src">From the September 2026 mail sheet</span></div>
  <div class="card goal"><div class="lead">${lead}</div>
  <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
  <div class="barRow"><span>Changes save automatically and show up for everyone.</span><span>${st.closed} of ${S.items.length} closed</span></div>
  <div class="facts">${facts.map(([k,v],i)=>`<div class="fact ${["ok","wait","bad"][i]}"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join("")}</div></div>
  <div class="grid">`;
  TIERS.forEach((t,i)=>{
    const b=st.byTier[t.k],list=sortItems(t.k==="low"?b.all:b.open);
    const chip=t.k==="low"?`<span class="chip ok">${b.all.length} closed</span>`:(b.open.length?`<span class="chip ${t.k==="urgent"?"bad":"wait"}">${b.open.length} open</span>`:`<span class="chip ok">Done</span>`);
    const show=t.k==="low"?list.slice(0,6):list;
    h+=`<section class="card tier-${t.k}"><div class="cardHead"><span class="num">${i+1}</span><h3>${esc(t.name)}<span class="why">${esc(t.why)}</span></h3>${chip}</div>
    <div class="mini">${show.map(miniRow).join("")||`<div class="empty">Nothing open here.</div>`}</div>
    <div class="cardFoot"><button class="link" type="button" data-view="${t.k}">${t.k==="low"&&list.length>6?`See all ${list.length}`:"Open this list"} →</button></div></section>`;
  });
  return h+`</div>`;
}

function itemCard(it){
  const open=S.open.has(it.id),notes=notesFor(it.id),files=filesFor(it.id),done=isDone(it),ro=!S.db,id=esc(it.id);
  const checked=done?(it.closedBy?`Closed by ${esc(who(it.closedBy))} · ${esc(fmtAt(it.closedAt))}`:`Marked ${esc(it.status)} on the September sheet`):(it.updatedBy?`Updated by ${esc(who(it.updatedBy))} · ${esc(fmtAt(it.updatedAt))}`:"");
  let h=`<article class="card item tier-${esc(pri(it))}${done?" closed":""}" id="item-${id}">
  <div class="itemTop"><input type="checkbox" class="cb" data-close="${id}" ${done?"checked":""} ${ro?"disabled":""} aria-label="Mark closed" title="${done?"Reopen":"Mark paid / done"}">
    <span class="t">${esc(it.title)}</span>${statusChip(it)}
    <span class="meta">${shortAmt(it.amount)?`<span class="amt">${esc(shortAmt(it.amount))}</span>`:""}<span>${esc(dueLine(it))}</span>${it.category?`<span class="cat c${CATS.indexOf(it.category)%6}">${esc(it.category)}</span>`:""}${it.action?`<span>${esc(it.action)}</span>`:""}</span>
    ${checked?`<span class="checked">${checked}</span>`:""}</div>
  ${!open&&it.nextStep?`<div class="nextShort">${esc(it.nextStep)}</div>`:""}`;
  if(open)h+=detail(it,notes,files,ro,id);
  h+=`<div class="cardFoot"><button class="link" type="button" data-toggle="${id}">${ICON_C}Comments <span class="badge ${notes.length?"wait":""}">${notes.length}</span></button>
  <button class="link" type="button" data-toggle="${id}">${ICON_F}Files <span class="badge">${files.length}</span></button>
  <button class="link sp" type="button" data-toggle="${id}">${open?"Close":"Open details"}</button></div></article>`;
  return h;
}
function detail(it,notes,files,ro,id){
  const sel=(k,vals,labels)=>`<select id="f-${k}-${id}" data-field="${k}" data-id="${id}" ${ro?"disabled":""}>${vals.map((v,i)=>`<option value="${esc(v)}"${(it[k]||"")===v?" selected":""}>${esc(labels?labels[i]:v)}</option>`).join("")}</select>`;
  return`<div class="detail">
    ${it.nextStep?`<div class="blk"><h4>Next step</h4><div class="quote">${esc(it.nextStep)}</div></div>`:""}
    ${it.description?`<div class="blk"><h4>What this is</h4><p>${esc(it.description)}</p></div>`:""}
    ${it.info?`<div class="blk"><h4>Account details</h4><pre>${esc(it.info)}</pre></div>`:""}
    ${it.amount?`<div class="blk"><h4>Amount</h4><p class="mono">${esc(it.amount)}</p></div>`:""}
    ${it.dueText?`<div class="blk"><h4>Due (as written on the notice)</h4><p>${esc(it.dueText)}</p></div>`:""}
    <div class="blk"><h4>Comments &amp; call notes</h4><div class="notes">${notes.map(n=>`<div class="note"><div class="by"><b>${esc(who(n.by))}</b><span>${esc(fmtAt(n.at))}</span>${n.by&&n.by===S.me?`<button class="x" type="button" data-delnote="${esc(n.id)}">Delete</button>`:""}</div><div class="txt">${esc(n.text)}</div></div>`).join("")||`<div class="empty">No comments yet.</div>`}</div></div>
    <div class="compose"><textarea id="note-${id}" placeholder="Add a comment or call note: who you spoke to, confirmation #, what's next" ${ro?"disabled":""}></textarea>
      <div class="row"><span class="hint">Ctrl/⌘ + Enter to save</span><button class="btn primary" type="button" data-addnote="${id}" ${ro?"disabled":""}>Add comment</button></div></div>
    <div class="blk"><h4>Documents</h4><div class="files">${files.map(fileRow).join("")||`<div class="empty">No documents yet.</div>`}</div></div>
    ${S.assets?`<label class="drop" data-drop="${id}"><input type="file" multiple hidden data-upload="${id}" accept=".pdf,.png,.jpg,.jpeg,.gif,.webp,.csv,.txt,.json,.md">Drop a PDF, photo or receipt here, or click to choose</label>`:(S.db?`<div class="hint">Uploading files needs Editor access. You can still paste a link.</div>`:"")}
    <div class="linkadd"><input id="link-${id}" placeholder="Paste a link (Google Drive receipt, portal page)" ${ro?"disabled":""}><button class="btn" type="button" data-addlink="${id}" ${ro?"disabled":""}>Add link</button></div>
    <div class="blk"><h4>Edit</h4><div class="fields">
      <label>Priority${sel("priority",TIERS.map(t=>t.k),TIERS.map(t=>t.name))}</label>
      <label>Status${sel("status",STATUSES)}</label>
      <label>Due date<input type="date" id="f-dueDate-${id}" data-field="dueDate" data-id="${id}" value="${esc(it.dueDate||"")}" ${ro?"disabled":""}></label>
      <label>Category${sel("category",CATS)}</label>
      <label class="wide">Amount<input id="f-amount-${id}" data-field="amount" data-id="${id}" value="${esc(it.amount||"")}" ${ro?"disabled":""}></label>
      <label class="wide">Next step<textarea rows="3" id="f-nextStep-${id}" data-field="nextStep" data-id="${id}" ${ro?"disabled":""}>${esc(it.nextStep||"")}</textarea></label>
    </div></div>
    <div class="row" style="justify-content:flex-end">${S.confirmDel===it.id?`<span class="hint">Delete this item with its comments?</span><button class="btn" type="button" data-canceldel>Keep</button><button class="btn danger" type="button" data-delitem="${id}">Yes, delete</button>`:`<button class="btn danger" type="button" data-askdel="${id}" ${ro?"disabled":""}>Delete item</button>`}</div>
  </div>`;
}
function fileRow(f,withItem){
  const href=f.assetId?"/_blob/"+f.assetId:f.href,ext=f.kind==="link"?"LINK":((f.name||"").split(".").pop()||"FILE").slice(0,4).toUpperCase();
  const img=f.assetId&&/^image\//.test(f.contentType||""),it=withItem&&S.items.find(i=>i.id===f.itemId);
  return`<div class="file"><span class="ic">${esc(ext)}</span><a href="${esc(href)}" target="_blank" rel="noopener">${esc(f.name||href)}</a><span class="sz">${esc([fmtSize(f.size),who(f.by)].filter(Boolean).join(" · "))}</span>${S.db?`<button class="x" type="button" aria-label="Remove" data-delfile="${esc(f.id)}">✕</button>`:""}</div>${it?`<div class="hint" style="margin:-2px 0 4px 8px">on <button class="link" type="button" data-goto="${esc(it.id)}">${esc(it.title)}</button></div>`:""}${img?`<img class="thumb" src="${esc(href)}" alt="${esc(f.name)}">`:""}`;
}

function tierView(k){
  const t=TIERS.find(x=>x.k===k),all=S.items.filter(i=>pri(i)===k),hide=$("#hideDone")&&$("#hideDone").checked;
  const list=sortItems(all.filter(i=>!(hide&&isDone(i)))),open=all.filter(i=>!isDone(i)).length;
  return`<div class="viewHead"><h2>${esc(t.name)}</h2><span class="src">${esc(t.why)} ${open} open of ${all.length}.</span></div>
  <div class="filters"><label class="chk"><input type="checkbox" id="hideDone" ${hide?"checked":""}> Hide closed items</label></div>
  <div class="grid">${list.map(itemCard).join("")||`<div class="card empty">Nothing in this list.</div>`}</div>`;
}
function searchView(q){
  const ql=q.toLowerCase(),hit=S.items.filter(it=>[it.title,it.description,it.info,it.amount,it.nextStep,it.status,it.category,notesFor(it.id).map(n=>n.text).join(" ")].join(" ").toLowerCase().includes(ql));
  const ordered=[];TIERS.forEach(t=>ordered.push(...sortItems(hit.filter(i=>pri(i)===t.k))));
  return`<div class="viewHead"><h2>Search</h2><span class="src">${hit.length} item${hit.length==1?"":"s"} match “${esc(q)}”</span></div><div class="grid">${ordered.map(itemCard).join("")||`<div class="card empty">No matches. Try a vendor name, address or account number.</div>`}</div>`;
}
function notesView(){
  const ns=S.notes.slice().sort((a,b)=>(a.at||"")<(b.at||"")?1:-1);
  return`<div class="viewHead"><h2>All notes</h2><span class="src">${ns.length} comments and call notes, newest first</span></div>
  <div class="card"><div class="notes">${ns.map(n=>{const it=S.items.find(i=>i.id===n.itemId);return`<div class="note">${it?`<div class="on">on <button class="link" type="button" data-goto="${esc(it.id)}">${esc(it.title)}</button></div>`:""}<div class="by"><b>${esc(who(n.by))}</b><span>${esc(fmtAt(n.at))}</span></div><div class="txt">${esc(n.text)}</div></div>`}).join("")||`<div class="empty">No notes yet.</div>`}</div></div>`;
}
function filesView(){
  const fs=S.files.slice().sort((a,b)=>(a.at||"")<(b.at||"")?1:-1);
  return`<div class="viewHead"><h2>Documents</h2><span class="src">${fs.length} files and links. Open an item to add more.</span></div><div class="card"><div class="files">${fs.map(f=>fileRow(f,true)).join("")||`<div class="empty">No documents yet.</div>`}</div></div>`;
}

function render(){
  const st=stats();renderHeader(st);renderSide(st);
  const drafts={};document.querySelectorAll("textarea[id^=note-],input[id^=link-]").forEach(el=>{if(el.value)drafts[el.id]=el.value});
  const ae=document.activeElement,fid=ae&&ae.id,fval=ae&&ae.dataset&&ae.dataset.field?ae.value:null;
  const q=$("#q").value.trim();
  let h;
  if(!S.loaded)h=`<div class="card empty">Loading the shared list…</div>`;
  else if(q)h=searchView(q);
  else if(S.view==="notes")h=notesView();
  else if(S.view==="files")h=filesView();
  else if(TIERS.some(t=>t.k===S.view))h=tierView(S.view);
  else h=overview(st);
  $("#main").innerHTML=h;
  for(const k in drafts){const el=document.getElementById(k);if(el)el.value=drafts[k]}
  if(fid&&fid!=="q"){const el=document.getElementById(fid);if(el){if(fval!==null)el.value=fval;el.focus()}}
}
function setView(v){S.view=v;$("#q").value="";try{localStorage.setItem("mdView",v);history.replaceState(null,"","#"+v)}catch(e){}render();window.scrollTo({top:0})}

async function resolveNames(){
  if(!S.user)return;
  const ids=[...new Set([...S.notes.map(n=>n.by),...S.files.map(f=>f.by),...S.items.map(i=>i.closedBy),...S.items.map(i=>i.updatedBy)].filter(b=>b&&b!=="sheet"&&b!=="claude"))];
  if(!ids.length)return;
  try{const ps=await S.user.profiles(ids);let ch=false;for(const id of ids){const n=(ps[id]&&ps[id].name)||"";if(S.names[id]!==n){S.names[id]=n;ch=true}}if(ch)render()}catch(e){}
}
async function write(fn,ok){
  try{await fn();if(ok)toast(ok)}catch(e){
    if(e&&e.code==="invalid_argument")banner("You have view-only access, so changes can't be saved. Ask the owner for Contributor or Editor access.",true);
    else if(e&&e.code==="quota_exceeded")banner("The list is full. Delete old items or files to add more.",true);
    else banner("That change didn't save. Check your connection and try again.",true);
  }
}
const now=()=>new Date().toISOString();

document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-view],[data-goto],[data-toggle],[data-addnote],[data-delnote],[data-addlink],[data-delfile],[data-askdel],[data-canceldel],[data-delitem],#addBtn");
  if(!t)return;
  if(t.id==="addBtn"){if(!S.db){toast("The shared list isn't connected in this view");return}const d=$("#dlg");d.showModal?d.showModal():d.setAttribute("open","");return}
  if(t.dataset.view)return setView(t.dataset.view);
  if(t.dataset.goto){const it=S.items.find(i=>i.id===t.dataset.goto);if(!it)return;S.open.add(it.id);saveOpen();setView(pri(it));const el=document.getElementById("item-"+it.id);if(el)el.scrollIntoView({block:"start"});return}
  if(t.dataset.toggle){const id=t.dataset.toggle;S.open.has(id)?S.open.delete(id):S.open.add(id);saveOpen();render();return}
  if(t.dataset.addnote)return addNote(t.dataset.addnote);
  if(t.dataset.delnote)return write(()=>S.db.doc("notes/"+t.dataset.delnote).delete(),"Comment deleted");
  if(t.dataset.addlink){const id=t.dataset.addlink,inp=document.getElementById("link-"+id),v=inp.value.trim();
    if(!/^https?:\/\//i.test(v)){toast("Paste a full link starting with https://");return}
    inp.value="";let name=v;try{const u=new URL(v);name=u.hostname.includes("drive.google")?"Google Drive file":u.hostname}catch(e){}
    return write(()=>S.db.collection("files").add({itemId:id,name,href:v,kind:"link",by:S.me,at:now()}),"Link added")}
  if(t.dataset.delfile){const f=S.files.find(x=>x.id===t.dataset.delfile);if(!f)return;
    await write(()=>S.db.doc("files/"+f.id).delete(),"Removed");
    if(f.assetId&&S.assets&&!S.files.some(x=>x.id!==f.id&&x.assetId===f.assetId)){try{await S.assets.delete(f.assetId)}catch(e){}}return}
  if(t.dataset.askdel){S.confirmDel=t.dataset.askdel;render();return}
  if("canceldel" in t.dataset){S.confirmDel=null;render();return}
  if(t.dataset.delitem){const id=t.dataset.delitem;S.confirmDel=null;
    await write(async()=>{for(const n of notesFor(id))await S.db.doc("notes/"+n.id).delete();for(const f of filesFor(id))await S.db.doc("files/"+f.id).delete();await S.db.doc("items/"+id).delete()},"Item deleted")}
});
function saveOpen(){try{localStorage.setItem("mdOpen",JSON.stringify([...S.open]))}catch(e){}}
async function addNote(id){const ta=document.getElementById("note-"+id),v=ta.value.trim();if(!v||!S.db)return;ta.value="";await write(()=>S.db.collection("notes").add({itemId:id,text:v,by:S.me,at:now()}),"Comment added")}
document.addEventListener("keydown",e=>{
  if(e.target.id&&e.target.id.startsWith("note-")&&e.key==="Enter"&&(e.metaKey||e.ctrlKey)){e.preventDefault();addNote(e.target.id.slice(5))}
  if(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$("#q").focus()}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.close&&S.db){const it=S.items.find(i=>i.id===el.dataset.close);if(!it)return;
    const patch=el.checked?{status:it.action==="Pay"?"Paid":"Done",prevStatus:it.status,closedBy:S.me,closedAt:now(),updatedAt:now(),updatedBy:S.me}
      :{status:it.prevStatus&&!DONE.has(it.prevStatus)?it.prevStatus:"Pending",closedBy:null,closedAt:null,updatedAt:now(),updatedBy:S.me};
    return write(()=>S.db.doc("items/"+it.id).update(patch),el.checked?"Marked closed":"Reopened")}
  if(el.dataset.field&&el.dataset.id&&S.db){const it=S.items.find(i=>i.id===el.dataset.id);if(!it||(it[el.dataset.field]||"")===el.value)return;
    write(()=>S.db.doc("items/"+el.dataset.id).update({[el.dataset.field]:el.value||null,updatedAt:now(),updatedBy:S.me}),"Saved")}
  if(el.id==="hideDone")render();
  if(el.dataset.upload)uploadFiles(el.dataset.upload,el.files);
});
$("#q").addEventListener("input",()=>render());
document.addEventListener("dragover",e=>{const d=e.target.closest("[data-drop]");if(d){e.preventDefault();d.classList.add("over")}});
document.addEventListener("dragleave",e=>{const d=e.target.closest("[data-drop]");if(d)d.classList.remove("over")});
document.addEventListener("drop",e=>{const d=e.target.closest("[data-drop]");if(d){e.preventDefault();d.classList.remove("over");uploadFiles(d.dataset.drop,e.dataTransfer.files)}});
const TYPES={pdf:"application/pdf",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",webp:"image/webp",csv:"text/csv",txt:"text/plain",json:"application/json",md:"text/markdown"};
async function uploadFiles(itemId,list){
  if(!S.assets||!list||!list.length)return;
  for(const f of list){const type=TYPES[(f.name.split(".").pop()||"").toLowerCase()];
    if(!type){toast(`${f.name}: use PDF, image, CSV or text files`);continue}
    toast("Uploading "+f.name+"…");
    try{const r=await S.assets.upload(f,{type});
      await write(()=>S.db.collection("files").add({itemId,name:f.name,assetId:r.id,contentType:r.contentType,size:r.sizeBytes,kind:"asset",by:S.me,at:now()}),"Uploaded "+f.name)}
    catch(e){const m={too_large:"is over the 20 MB limit",unsupported_type:"isn't a supported file type",quota_or_state:"couldn't be stored: storage is full",rate_limited:"wasn't uploaded. Wait a moment and try again",not_granted:"needs Editor access to upload"};toast(`${f.name} ${m[e&&e.code]||"didn't upload. Try again"}`)}
  }
}
$("#cancelAdd").addEventListener("click",()=>$("#dlg").close());
$("#addForm").addEventListener("submit",async e=>{
  e.preventDefault();const title=$("#nTitle").value.trim();if(!title)return;
  const data={title,priority:$("#nPri").value,status:$("#nStatus").value,amount:$("#nAmt").value.trim(),dueDate:$("#nDue").value||null,dueText:"",category:$("#nCat").value,
    action:$("#nAction").value,description:$("#nDesc").value.trim(),nextStep:$("#nNext").value.trim(),info:"",month:new Date().toISOString().slice(0,7),createdAt:now(),createdBy:S.me};
  $("#dlg").close();e.target.reset();$("#nPri").value="normal";
  await write(async()=>{const ref=await S.db.collection("items").add(data);S.open.add(ref.id);saveOpen();setView(data.priority)},"Item added");
});

render();
(async()=>{
  const c=window.claude;if(!c||!c.use){banner("Open this page on claude.ai to see and edit the shared list.",true);return}
  const [db,user,assets]=await Promise.all([c.use("db"),c.use("user"),c.use("assets")]);
  if(!db){banner("The shared list isn't available in this view. Open the page from its claude.ai link while signed in.",true);return}
  S.db=db;S.user=user;S.assets=assets;
  if(user){try{S.me=await user.id()}catch(e){}}
  const sub=(name,key)=>db.collection(name).onSnapshot(s=>{S[key]=s.docs.map(d=>({id:d.id,...d.data()}));if(key==="items")S.loaded=true;render();resolveNames()},
    err=>{if(err.code!=="revoked")banner("Live updates stopped. Reload the page to reconnect.",true)});
  sub("items","items");sub("notes","notes");sub("files","files");
})();
</script>
