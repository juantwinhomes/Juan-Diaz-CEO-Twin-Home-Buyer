<title>Receipt Inbox</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: an app shell. Slim top bar; below it a review queue on the left and the selected receipt on the right, each scrolling on its own. Phones show one pane at a time. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --sunk: #f5f7f9;
  --ink: #16202b;
  --muted: #5d6877;
  --line: #d6dce3;
  --accent: #1f4e9c;
  --accent-ink: #ffffff;
  --accent-soft: #e5ecf8;
  --ok: #1b7349; --ok-soft: #e2f1e9;
  --warn: #9a5a05; --warn-soft: #faefdc;
  --bad: #ad2a22; --bad-soft: #fae6e4;
  --wait: #5d6877; --wait-soft: #e9ecf0;
  --paper: #ffffff; /* receipt pages stay white in both themes, like paper */
  --display: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1218; --surface: #151c25; --sunk: #111821; --ink: #e6ebf1; --muted: #9ba6b4; --line: #27313e;
    --accent: #8fb0ef; --accent-ink: #0d1218; --accent-soft: #1b2843;
    --ok: #6fd1a0; --ok-soft: #13301f; --warn: #f0b45a; --warn-soft: #382811;
    --bad: #f28b82; --bad-soft: #3b1917; --wait: #a9b3c0; --wait-soft: #222a35;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1218; --surface: #151c25; --sunk: #111821; --ink: #e6ebf1; --muted: #9ba6b4; --line: #27313e;
  --accent: #8fb0ef; --accent-ink: #0d1218; --accent-soft: #1b2843;
  --ok: #6fd1a0; --ok-soft: #13301f; --warn: #f0b45a; --warn-soft: #382811;
  --bad: #f28b82; --bad-soft: #3b1917; --wait: #a9b3c0; --wait-soft: #222a35;
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.45; }
.shell {
  height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px;
  max-width: 1680px; margin: 0 auto;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
p { margin: 0; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button, select, input { font: inherit; color: inherit; }

/* Top bar */
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.brand { display: grid; gap: 0; margin-right: auto; min-width: 0; }
.brand .eyebrow { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.brand h1 { font-size: 1.45rem; line-height: 1.1; }
.inbox { font-size: 0.78rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.inbox.live { color: var(--ok); border-color: var(--ok); }
.inbox.test { color: var(--warn); border-color: var(--warn); }
.scanbox { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.scanbox label { font-size: 0.78rem; color: var(--muted); }
select, input[type="text"], input[type="search"] {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; min-width: 0;
}
.btn {
  font-weight: 600; font-size: 0.85rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 8px; padding: 6px 12px; white-space: nowrap; text-decoration: none; line-height: 1.3;
}
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: 0.55; cursor: progress; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.good { background: var(--ok); color: var(--surface); border-color: var(--ok); }
.btn.ghost { background: transparent; }
.btn.small { font-size: 0.78rem; padding: 4px 9px; }
kbd { font-family: var(--mono); font-size: 0.7rem; padding: 0 4px; border-radius: 4px; border: 1px solid currentColor; opacity: 0.7; }
.statusline { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.8rem; color: var(--muted); min-height: 1.2em; }
.statusline span:empty { display: none; }
.banner { border-radius: 8px; padding: 8px 12px; background: var(--warn-soft); border: 1px solid var(--warn); font-size: 0.88rem; }
.banner.bad { background: var(--bad-soft); border-color: var(--bad); }

/* Two panes */
.app {
  flex: 1; min-height: 0; display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 12px;
}
.pane { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

/* Queue */
.qhead { display: grid; gap: 8px; padding: 10px; border-bottom: 1px solid var(--line); }
.segs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; background: var(--sunk); border-radius: 9px; padding: 3px; }
.seg { cursor: pointer; border: 0; background: transparent; border-radius: 7px; padding: 5px 4px; display: grid; justify-items: center; gap: 0; color: var(--muted); }
.seg .seg-count { font-family: var(--display); font-weight: 700; font-size: 1.05rem; line-height: 1.1; color: var(--ink); }
.seg .seg-label { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; white-space: nowrap; }
.seg[aria-selected="true"] { background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
.seg[data-key="new"][aria-selected="true"] .seg-label { color: var(--accent); }
.seg[data-key="follow_up"][aria-selected="true"] .seg-label { color: var(--warn); }
.seg[data-key="good"][aria-selected="true"] .seg-label { color: var(--ok); }
.tools { display: flex; gap: 6px; }
.tools input { flex: 1 1 auto; }
.tools select { flex: 0 0 auto; max-width: 46%; }
.qmeta { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--muted); }
.qmeta label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.qmeta #listCount { margin-left: auto; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.bulk { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 10px; background: var(--accent-soft); border-bottom: 1px solid var(--line); }
.bulk #bulkCount { font-weight: 600; font-size: 0.82rem; margin-right: auto; }
.copybox { margin: 8px 10px; min-height: 90px; font-family: var(--mono); font-size: 0.75rem; border: 1px solid var(--line); border-radius: 8px; background: var(--sunk); color: var(--ink); padding: 6px; }
.items { flex: 1; overflow: auto; }
.item {
  display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; align-items: start;
  padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer;
}
.item:hover { background: var(--sunk); }
.item.active { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.item input { margin-top: 3px; }
.item-main { display: grid; gap: 2px; min-width: 0; }
.item-top { display: flex; gap: 8px; align-items: baseline; }
.item-vendor { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 auto; min-width: 0; }
.item-amt { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 500; white-space: nowrap; }
.item-sub { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 0.78rem; color: var(--muted); }
.item-sub span { overflow-wrap: anywhere; }
.item-flags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.badge, .pill { font-size: 0.66rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 1px 7px; border-radius: 999px; background: var(--sunk); color: var(--muted); border: 1px solid var(--line); }
.badge.warn, .pill.test { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.s-new { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.pill.s-follow_up { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.s-good { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.s-not_receipt { background: var(--wait-soft); color: var(--wait); border-color: transparent; }
.pill.ai { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.empty { padding: 28px 18px; color: var(--muted); text-align: center; display: grid; gap: 6px; justify-items: center; }
.empty b { color: var(--ink); font-size: 0.98rem; }

/* Detail */
.detail { overflow: auto; }
.d-head { display: grid; gap: 8px; padding: 14px 18px 10px; }
.back { display: none; justify-self: start; }
.d-title { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.d-title h2 { font-size: 1.5rem; line-height: 1.15; overflow-wrap: anywhere; }
.d-meta { color: var(--muted); font-size: 0.85rem; }
.d-amt { text-align: right; display: grid; justify-items: end; }
.d-amt .num { font-size: 1.6rem; font-weight: 500; line-height: 1.1; }
.d-amt small { color: var(--muted); font-size: 0.75rem; }
.d-pills { display: flex; flex-wrap: wrap; gap: 4px; }
.d-actions {
  position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  padding: 8px 18px; background: var(--surface); border-block: 1px solid var(--line);
}
.d-actions .spacer { flex: 1 1 auto; }
.d-body { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; padding: 16px 18px 24px; align-items: start; }
.viewer { display: grid; gap: 10px; min-width: 0; }
.vbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.vseg { display: inline-flex; background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
.vseg button { cursor: pointer; border: 0; background: transparent; padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; color: var(--muted); }
.vseg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.zoom { display: inline-flex; align-items: center; gap: 4px; margin-left: auto; font-size: 0.78rem; color: var(--muted); }
.zoom .num { min-width: 3.2em; text-align: center; }
.vscroll { overflow: auto; border-radius: 10px; background: var(--sunk); border: 1px solid var(--line); padding: 12px; max-height: none; }
.pv-files { display: grid; gap: 12px; justify-items: center; }
.pv-pdf { display: grid; gap: 10px; width: calc(var(--zoom, 1) * 100%); max-width: none; }
.pv-page { display: block; width: 100%; height: auto; background: var(--paper); border-radius: 4px; box-shadow: 0 1px 2px rgba(15, 23, 32, 0.18), 0 6px 18px rgba(15, 23, 32, 0.08); }
.pv-files img { display: block; width: calc(var(--zoom, 1) * 100%); max-width: none; height: auto; border-radius: 6px; background: var(--paper); }
.pv-body { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 0.86rem; line-height: 1.55; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; max-width: 80ch; }
.pv-note { color: var(--muted); font-size: 0.85rem; }
.facts { position: sticky; top: 56px; display: grid; gap: 14px; background: var(--sunk); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.field input { width: 100%; box-sizing: border-box; }
.facts dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 7px 12px; font-size: 0.85rem; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.facts dd.num { font-family: var(--mono); }
.keys { font-size: 0.75rem; color: var(--muted); line-height: 1.7; }
.d-empty { height: 100%; display: grid; place-items: center; padding: 40px 20px; text-align: center; color: var(--muted); }
.d-empty b { display: block; color: var(--ink); font-size: 1.05rem; margin-bottom: 6px; }

@media (max-width: 1280px) {
  .d-body { grid-template-columns: minmax(0, 1fr); }
  .facts { position: static; order: -1; }
}
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .detail { display: none; }
  body.show-detail .detail { display: flex; }
  body.show-detail .queue { display: none; }
  .back { display: inline-flex; }
  kbd, .keys { display: none; }
  .brand h1 { font-size: 1.25rem; }
}
@media (max-width: 480px) {
  .seg .seg-label { font-size: 0.6rem; }
  .d-title { flex-direction: column; }
  .d-amt { justify-items: start; text-align: left; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="eyebrow">Twin Home Buyer &middot; Receipt agent</span>
      <h1>Receipt Inbox</h1>
    </div>
    <span id="inbox" class="inbox">Inbox: shown after the first scan</span>
    <div class="scanbox">
      <label for="days">Look back</label>
      <select id="days">
        <option value="1">1 day</option>
        <option value="3">3 days</option>
        <option value="7" selected>7 days</option>
        <option value="14">14 days</option>
        <option value="30">30 days</option>
        <option value="60">60 days</option>
        <option value="90">90 days</option>
      </select>
      <button id="scan" class="btn primary" type="button">Scan inbox</button>
      <button id="fillClaude" class="btn" type="button" hidden></button>
    </div>
  </header>
  <div class="statusline">
    <span id="status" role="status" aria-live="polite"></span>
    <span id="usage"></span>
  </div>
  <div id="banner" class="banner" role="alert" hidden></div>

  <div class="app">
    <section class="pane queue" aria-label="Receipts to review">
      <div class="qhead">
        <div class="segs" id="tabs" role="tablist" aria-label="Status"></div>
        <div class="tools">
          <input type="search" id="search" placeholder="Search vendor, amount, order #" aria-label="Search receipts">
          <select id="source" aria-label="Source">
            <option value="all">All sources</option>
          </select>
        </div>
        <div class="qmeta">
          <label for="selAll"><input type="checkbox" id="selAll"> Select all</label>
          <span id="listCount"></span>
        </div>
      </div>
      <div class="bulk" id="bulk" hidden>
        <span id="bulkCount"></span>
        <button type="button" class="btn small" data-act="good">Good</button>
        <button type="button" class="btn small" data-act="follow_up">Follow-up</button>
        <button type="button" class="btn small" data-act="not_receipt">Not a receipt</button>
        <button type="button" class="btn small" data-act="new">To review</button>
        <button type="button" class="btn small" data-act="claude">Ask Claude</button>
        <button type="button" class="btn small" data-act="csv">Download CSV</button>
        <button type="button" class="btn small ghost" data-act="copy">Copy rows</button>
        <button type="button" class="btn small ghost" data-act="clear">Clear</button>
      </div>
      <textarea id="copyBox" class="copybox" aria-label="Rows to paste into the ledger" readonly hidden></textarea>
      <div class="items" id="items" role="listbox" aria-label="Receipts"></div>
      <div class="empty" id="listEmpty">
        <b>No receipts yet</b>
        <p>Click Scan inbox to pull receipts from accounting@.</p>
      </div>
    </section>

    <section class="pane detail" id="detail" aria-label="Selected receipt"></section>
  </div>
</div>

<datalist id="propList"></datalist>

<script>
(function () {
  "use strict";

  const INBOX = "accounting@twinhomebuyer.com";
  const GMAIL = "Gmail";
  const SOURCES = [
    { key: "homedepot", label: "Home Depot", q: "from:homedepot.com subject:(receipt OR order OR purchase)" },
    { key: "amazon", label: "Amazon", q: "from:amazon.com subject:(shipped OR ordered OR refund)" },
    { key: "waymo", label: "Waymo", q: "subject:waymo" },
    { key: "uber", label: "Uber", q: "subject:uber subject:(trip OR receipt OR order)" },
    { key: "juan", label: "Juan's forwards", q: "from:juan@twinhomebuyer.com subject:(fwd OR fw) (receipt OR order OR trip OR ride OR purchase)" },
    { key: "other", label: "Crew & other", q: "subject:receipt -from:amazon.com -from:homedepot.com -subject:waymo -subject:uber" }
  ];
  const STATUSES = [
    { key: "new", label: "To review" },
    { key: "follow_up", label: "Follow-up" },
    { key: "good", label: "Good" },
    { key: "not_receipt", label: "Not a receipt" }
  ];
  const STATUS_LABEL = Object.fromEntries(STATUSES.map(s => [s.key, s.label]));
  const SOURCE_LABEL = Object.fromEntries(SOURCES.map(s => [s.key, s.label]));
  const BATCH = 8;
  const VENDOR_BY_SOURCE = { homedepot: "Home Depot", amazon: "Amazon", waymo: "Waymo" };

  const state = {
    docs: new Map(),   // saved receipts from the shared store
    temp: new Map(),   // test-scan receipts, never saved
    tab: "new",
    source: "all",
    selected: new Set(),
    account: null,
    scanning: false,
    selectedId: null,   // the receipt shown on the right
    query: "",
    viewMode: "file",   // "file" or "email" in the receipt viewer
    zoom: 1
  };
  const msgCache = new Map(); // email text and photos loaded for the inline view, this visit only
  let db = null, mcp = null, sample = null, sampleOff = false;
  const $ = id => document.getElementById(id);

  // ---------- helpers ----------
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  function num(v) {
    if (v === null || v === undefined || v === "") return null;
    const n = typeof v === "number" ? v : parseFloat(String(v).replace(/[$,\s]/g, ""));
    return Number.isFinite(n) ? n : null;
  }
  const money = n => n === null ? "" : n.toLocaleString("en-US", { style: "currency", currency: "USD" });
  function amountOf(r) {
    const x = r.extracted || {};
    const t = num(x.total);
    if (t !== null) return { value: t, label: money(t), note: "" };
    const s = num(x.itemsSubtotal);
    if (s !== null) return { value: s, label: money(s), note: "items, plus tax" };
    return { value: null, label: "—", note: "" };
  }
  function shortDate(iso) {
    if (!iso) return "";
    const d = new Date(/^\d{4}-\d{2}-\d{2}$/.test(iso) ? iso + "T12:00:00" : iso);
    if (isNaN(d)) return String(iso).slice(0, 10);
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  }
  function gmailAfter(days) {
    const d = new Date(Date.now() - days * 86400000);
    return d.getFullYear() + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + String(d.getDate()).padStart(2, "0");
  }
  function isoOf(v) {
    const d = new Date(v || "");
    return isNaN(d) ? "" : d.toISOString();
  }
  function str(v, max) {
    if (v === null || v === undefined) return null;
    const s = String(v).replace(/\s+/g, " ").trim();
    return s ? s.slice(0, max) : null;
  }
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }
  function setStatus(t) { $("status").textContent = t || ""; }
  function banner(text, bad) {
    const b = $("banner");
    if (!text) { b.hidden = true; b.textContent = ""; return; }
    b.textContent = text;
    b.className = "banner" + (bad ? " bad" : "");
    b.hidden = false;
  }

  function gmailMessage(e) {
    const c = e && e.code;
    if (c === "server_not_connected") return "Gmail isn't connected to your Claude. Add it in claude.ai Settings → Connectors, signed in as accounting@, then scan again.";
    if (c === "needs_reauth") return "Gmail needs to be reconnected. Reconnect it in claude.ai Settings → Connectors, then scan again.";
    if (c === "not_in_manifest" || c === "approval_required" || c === "consent_required") return "Gmail is not allowed on this page yet. Click Scan inbox and choose Allow, or turn Gmail on in this page's Permissions menu.";
    if (c === "selection_required") return "More than one Gmail is connected to your Claude. Pick accounting@ when Claude asks, then scan again.";
    if (c === "blocked_by_policy") return "Your organization blocks Gmail on this page.";
    if (c === "server_unavailable" || c === "upstream_error") return "Gmail didn't answer. Wait a minute and scan again.";
    if (c === "not_granted" || c === "capability_disabled" || c === "capability_removed") return "This view can't use Gmail. Open the page in claude.ai to scan.";
    return "The scan stopped: " + ((e && e.message) || "unknown error") + ".";
  }
  function dbMessage(e) {
    const c = e && e.code;
    if (c === "quota_exceeded") return "The saved list is full. Older receipts need to be cleared before new ones can be saved.";
    if (c === "revoked") return "This page lost access to its saved list. Reload the page.";
    if (c === "invalid_argument") return "You can view this list but not change it. Ask Seth for edit access.";
    return "Saving didn't work just now. Try again in a minute.";
  }

  // ---------- data ----------
  function allRows() {
    const m = new Map(state.docs);
    for (const [k, v] of state.temp) m.set(k, v);
    return [...m.values()].sort((a, b) => {
      const da = (a.extracted && a.extracted.date) || a.emailDate || "";
      const dbb = (b.extracted && b.extracted.date) || b.emailDate || "";
      return String(dbb).localeCompare(String(da));
    });
  }

  async function saveFields(id, patch) {
    if (state.temp.has(id)) { Object.assign(state.temp.get(id), patch); return true; }
    if (!db) return false;
    try {
      await db.collection("receipts").doc(id).update(patch);
      const d = state.docs.get(id);
      if (d) Object.assign(d, patch); // show the change before the store echoes it back
      return true;
    } catch (e) { banner(dbMessage(e), true); return false; }
  }

  // ---------- render ----------

  const narrow = () => window.matchMedia("(max-width: 900px)").matches;
  function senderName(r) {

  }
  function longDate(iso) {

    const d = new Date(/^\d{4}-\d{2}-\d{2}$/.test(iso) ? iso + "T12:00:00" : iso);
    return isNaN(d) ? String(iso).slice(0, 10) : d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  }
  function matchesFilters(r) {
    if (state.source !== "all" && r.source !== state.source) return false;
    const q = state.query.trim().toLowerCase();
    if (!q) return true;
    const x = r.extracted || {};
    return [x.vendor, x.items, x.orderNumber, x.location, x.note, x.cardLast4, r.subject, r.property, senderName(r), amountOf(r).label]
      .filter(Boolean).join(" ").toLowerCase().includes(q);
  }
  function visibleRows() {
    return allRows().filter(r => matchesFilters(r) && (r.status || "new") === state.tab);

  function current() {

  // One receipt: save its status, then move on to the next one in the same tab.
  async function setOne(id, status) {

    if (status !== state.tab) state.selectedId = next ? next.id : null;

    $("detail").scrollTop = 0;

    const keys = el("p", "keys", "J / K next and previous · G good · F follow-up · N not a receipt · D download");
    facts.append(field, dl, keys);

    body.append(viewer, facts);
    pane.append(head, actions, body);
  }
  function fillViewer(box, r) {

    if (c.error) { box.append(el("p", "pv-note", c.error)); return; }
    const hasFile = c.attachments.length > 0;
    const mode = hasFile && state.viewMode === "file" ? "file" : "email";

      z.append(zb("−", -0.25, "Zoom out"), zl, zb("+", 0.25, "Zoom in"), fit);

  function refreshPreview(id) {

  // ---------- downloads ----------
  let dlApi;
  async function downloadsApi() {
    if (dlApi === undefined) {
      const C = window.claude;
      dlApi = C && typeof C.use === "function" ? await C.use("downloads") : null;
    }
    return dlApi;
  }
  function fileBase(r) {
    // Same naming as the Company Receipts drive: "$134.25 Home Depot 820 28th St"
    const x = r.extracted || {};
    const a = amountOf(r).value;
    const amt = a === null ? "" : (a < 0 ? "-$" : "$") + Math.abs(a).toFixed(2);
    const name = [amt, x.vendor || senderName(r), r.property || ""].filter(Boolean).join(" ");
    return (name || "Receipt").replace(/[\\/:*?"<>|]+/g, " ").replace(/\s+/g, " ").trim().slice(0, 150);
  }
  async function saveFile(filename, data) {
    const api = await downloadsApi();
    if (!api) { banner("Downloads don't work in this view. Open the page in claude.ai, or use the Gmail link."); return false; }
    try {
      await api.save({ filename, data });
      setStatus("Saved " + filename + ".");
      return true;
    } catch (e) {
      const c = e && e.code;
      if (c === "declined") return false;
      if (c === "rate_limited") { banner("A download is already waiting for your OK. Finish that one first."); return false; }
      if (c === "unavailable" || c === "not_granted" || c === "capability_disabled" || c === "capability_removed") { banner("Downloads don't work in this view. Use the Gmail link."); return false; }
      banner("The download didn't work: " + ((e && e.message) || "unknown error") + ".", true);
      return false;
    }
  }
  const JSPDF = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
  let jspdfReady = null;
  function jspdf() {
    if (!jspdfReady) {
      jspdfReady = loadScript(JSPDF).then(() => {
        if (!window.jspdf || !window.jspdf.jsPDF) throw new Error("PDF maker missing");
        return window.jspdf.jsPDF;
      });
      jspdfReady.catch(() => { jspdfReady = null; });
    }
    return jspdfReady;
  }
  const latin = s => String(s || "")
    .replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, "-")
    .replace(/[•·]/g, "*").replace(/[^\x09\x0A\x0D\x20-\x7E\xA0-\xFF]/g, " ");
  function summaryPairs(r) {
    const x = r.extracted || {};
    const amt = amountOf(r);
    return [
      ["Vendor", x.vendor || senderName(r)],
      ["Amount", amt.label + (amt.note ? " (" + amt.note + ")" : "")],
      ["Date", longDate(x.date || r.emailDate)],
      ["Card", x.cardLast4 ? "ending " + x.cardLast4 : ""],
      ["Order", x.orderNumber],
      ["Items", x.items],
      ["Location", x.location],
      ["Property", r.property],
      ["Note", x.note],
      ["Email", r.subject],
      ["From", r.sender]
    ].filter(p => p[1]);
  }
  // Email-only receipts (Amazon, Uber, Waymo) download as a one-page PDF of the details and the email.
  async function receiptPdf(r, text) {
    try {
      const JsPDF = await jspdf();
      const doc = new JsPDF({ unit: "pt", format: "letter" });
      const margin = 54, width = 612 - margin * 2;
      let y = margin;
      const write = (t, size, bold) => {
        doc.setFont("helvetica", bold ? "bold" : "normal");
        doc.setFontSize(size);
        for (const line of doc.splitTextToSize(latin(t), width)) {
          if (y > 792 - margin) { doc.addPage(); y = margin; }
          doc.text(line, margin, y);
          y += size * 1.4;
        }
      };
      write(fileBase(r), 15, true);
      y += 6;
      for (const [k, v] of summaryPairs(r)) write(k + ": " + v, 10);
      y += 10;
      write("Email text", 11, true);
      write(text || "(no text)", 9);
      return doc.output("blob");
    } catch (e) {
      return null;
    }
  }
  async function downloadReceipt(r, btn) {
    if (!r) return;
    if (btn) btn.disabled = true;
    try {
      const base = fileBase(r);
      if (!msgCache.has(r.id) && mcp) await loadPreview(r.id);
      const c = msgCache.get(r.id) || {};
      if (mcp && c.attachments && c.attachments.length) {
        try {
          const parts = await fileParts(r.id);
          const file = parts.find(p => p.pdf) || parts.find(p => p.bytes.length >= 15000);
          if (file) {
            const ext = file.pdf ? "pdf" : /png/.test(file.type) ? "png" : /gif/.test(file.type) ? "gif" : /webp/.test(file.type) ? "webp" : "jpg";
            await saveFile(base + "." + ext, new Blob([file.bytes], { type: file.type }));
            return;
          }
        } catch (e) { /* fall back to a PDF of the email */ }
      }
      const pdf = await receiptPdf(r, c.text || "");
      if (pdf) await saveFile(base + ".pdf", pdf);
      else await saveFile(base + ".txt", summaryPairs(r).map(p => p[0] + ": " + p[1]).join("\n") + "\n\n" + (c.text || ""));
    } finally {
      if (btn) btn.disabled = false;
    }
  }
  async function downloadCsv(rows) {
    const q = v => '"' + String(v === null || v === undefined ? "" : v).replace(/"/g, '""') + '"';
    const head = ["Date", "Vendor", "Amount", "Tax", "Card", "Order #", "Items", "Location", "Property", "Status", "Source", "File name", "Email"];
    const lines = [head.map(q).join(",")].concat(rows.map(r => {
      const x = r.extracted || {};
      const a = amountOf(r).value;
      return [x.date || (r.emailDate || "").slice(0, 10), x.vendor || senderName(r), a === null ? "" : a.toFixed(2), num(x.tax) === null ? "" : num(x.tax).toFixed(2),
        x.cardLast4 || "", x.orderNumber || "", x.items || "", x.location || "", r.property || "", STATUS_LABEL[r.status || "new"],
        SOURCE_LABEL[r.source] || "Other", fileBase(r), r.viewUrl || ""].map(q).join(",");
    }));
    const today = new Date().toISOString().slice(0, 10);
    await saveFile("Receipts " + today + ".csv", lines.join("\r\n"));
  }

  // ---------- controls and keyboard ----------
  function wire() {

    srcSel.onchange = () => { state.source = srcSel.value; state.selected.clear(); render(); };
    $("search").addEventListener("input", e => { state.query = e.target.value; render(); });
    $("scan").onclick = scan;
    $("fillClaude").onclick = () => fillWithClaude(allRows().filter(r => needsClaude(r) && (r.status || "new") !== "not_receipt").map(r => r.id));
    $("selAll").onchange = e => {
      for (const r of visibleRows()) { if (e.target.checked) state.selected.add(r.id); else state.selected.delete(r.id); }

        const m = await gmail("get_message", { messageId: ids[i], messageFormat: "PLAIN_TEXT" });
        if (!m) continue;
        if (!state.account && m.viewUrl) { detectAccount(m.viewUrl); showAccount(); }
        let body = String(m.plaintextBody || m.snippet || "");
        if (fileAttachments(m).some(a => isPdf(a.mimeType, a.filename))) {
          try {
            const t = await pdfTextOf(ids[i]);
            if (t.trim()) body = "RECEIPT PDF:\n" + t.slice(0, 1500) + "\n\nEMAIL:\n" + body;
          } catch (e) { /* email text only */ }
        }
        msgs.push({ id: ids[i], subject: String(m.subject || ""), sender: String(m.sender || ""), emailDate: isoOf(m.date), body });
      }
      const details = await extract(msgs);
      let done = 0;
      for (const [id, x] of details) {
        if (await saveFields(id, { extracted: x })) done++;
      }
      if (done) await countUsage(done, Math.ceil(msgs.length / BATCH));
      setStatus("Claude filled in " + done + " of " + ids.length + (ids.length === 1 ? " receipt." : " receipts."));
    } catch (e) {
      banner(gmailMessage(e), true);
      setStatus("");
    } finally {
      state.scanning = false;
      $("scan").disabled = false;
      $("fillClaude").disabled = false;
      render();
    }
  }

  async function scan() {
    if (state.scanning) return;
    if (!mcp) { banner("Scanning needs claude.ai with Gmail connected. Open this page in claude.ai.", true); return; }
    state.scanning = true;
    $("scan").disabled = true;
    banner("");
    const days = Number($("days").value) || 7;
    const after = gmailAfter(days);
    const found = new Map();
    try {
      for (const s of SOURCES) {
        setStatus("Searching " + s.label + "…");
        let token = null, pages = 0;
        do {
          const input = { query: s.q + " after:" + after, pageSize: 50 };
          if (token) input.pageToken = token;
          const p = (await gmail("search_threads", input)) || {};
          for (const t of (p.threads || [])) {
            for (const m of (t.messages || [])) {
              if (!m || !m.id || found.has(m.id)) continue;
              if (String(m.sender || "").toLowerCase().includes(INBOX)) continue; // our own replies
              found.set(m.id, { source: s.key, threadId: t.id || m.threadId || "", subject: m.subject || "", sender: m.sender || "" });
            }
          }
          token = p.nextPageToken || null;
          pages++;
        } while (token && pages < 4);
      }

      const todo = [...found].filter(([id]) => {
        const d = state.docs.get(id) || state.temp.get(id);
        return !d || !d.extracted;
      });
      if (!found.size) {
        setStatus("No receipt emails in the last " + days + (days === 1 ? " day." : " days."));
        return;
      }
      if (!todo.length) {
        setStatus(found.size + " receipt emails found. All of them are already in the list.");
        return;
      }

      const msgs = [];
      for (let i = 0; i < todo.length; i++) {
        const [id, meta] = todo[i];
        setStatus("Reading email " + (i + 1) + " of " + todo.length + "…");
        const m = await gmail("get_message", { messageId: id, messageFormat: "PLAIN_TEXT" });
        if (!m) continue;
        if (!state.account && m.viewUrl) { detectAccount(m.viewUrl); showAccount(); }
        msgs.push({
          id,
          source: meta.source,
          threadId: m.threadId || meta.threadId,
          subject: String(m.subject || meta.subject || "").slice(0, 300),
          sender: String(m.sender || meta.sender || "").slice(0, 200),
          emailDate: isoOf(m.date),
          viewUrl: String(m.viewUrl || ""),
          body: String(m.plaintextBody || m.snippet || ""),
          attachments: fileAttachments(m)
        });
      }

      const live = !!db && state.account === INBOX;
      const now = new Date().toISOString();
      let saved = 0, freeCount = 0;
      for (const m of msgs) {
        const prev = state.docs.get(m.id) || state.temp.get(m.id) || {};
        let x = (prev.extracted && prev.extracted.readBy === "claude") ? prev.extracted : freeRead(m);
        if (x.readBy !== "claude" && x.total === null && x.itemsSubtotal === null && m.attachments.some(a => isPdf(a.mimeType, a.filename))) {
          setStatus("Reading the PDF receipt from " + (x.vendor || "a vendor") + "\u2026");
          try {
            const t = await pdfTextOf(m.id);
            const got = t.trim() ? freeRead(Object.assign({}, m, { body: t })) : null;
            if (got && (got.total !== null || got.itemsSubtotal !== null)) {
              x = Object.assign({}, x, { total: got.total, itemsSubtotal: got.itemsSubtotal, tax: got.tax, orderNumber: x.orderNumber || got.orderNumber, cardLast4: x.cardLast4 || got.cardLast4, readBy: "pdf" });
            }
          } catch (e) { /* left for Claude */ }
        }
        if (x.total !== null || x.itemsSubtotal !== null) freeCount++;
        const doc = {
          id: m.id,
          threadId: m.threadId,
          source: m.source,
          subject: m.subject,
          sender: m.sender,
          emailDate: m.emailDate,
          viewUrl: m.viewUrl,
          extracted: x,
          status: prev.status || (x && x.isReceipt === false ? "not_receipt" : "new"),
          property: prev.property || "",
          reviewedAt: prev.reviewedAt || null,
          scannedAt: now
        };
        if (live) {
          try { await db.collection("receipts").doc(m.id).set(doc); saved++; }
          catch (e) { banner(dbMessage(e), true); break; }
        } else {
          state.temp.set(m.id, doc);
        }
      }
      const left = msgs.length - freeCount;
      setStatus(msgs.length + " new " + (msgs.length === 1 ? "receipt" : "receipts") + " from the last " + days + " days" +
        (live ? ", saved." : ", shown as a test and not saved.") +
        " Read for free: " + freeCount + "." +
        (left ? " " + left + " need Claude. Click Fill with Claude when you want them done." : ""));
      if (!live && db && state.account && state.account !== INBOX) {
        banner("This scan read " + state.account + ". Only accounting@ scans are saved, so these rows disappear when you reload.");
      } else if (!live && db && !state.account) {
        banner("This page couldn't tell which inbox it read, so the scan ran as a test and nothing was saved.");
      }
    } catch (e) {
      banner(gmailMessage(e), true);
      setStatus("");
    } finally {
      state.scanning = false;
      $("scan").disabled = false;
      render();
    }
  }

  // ---------- wiring ----------
  wire();

  async function boot() {
    render();
    const C = window.claude;
    if (!C || typeof C.use !== "function") {
      banner("Open this page in claude.ai to scan the inbox and save receipts.");
      return;
    }
    [mcp, sample, db] = await Promise.all([C.use("mcp"), C.use("sample"), C.use("db")]);
    if (!mcp) banner("This view can't reach Gmail. Open the page in claude.ai to scan.");
    if (db) {
      let loaded = false;
      const timer = setTimeout(() => { if (!loaded) setStatus("Saved receipts can't be reached yet."); }, 10000);
      db.collection("receipts").orderBy("emailDate", "desc").limit(1000).onSnapshot(snap => {
        if (!snap.metadata.fromCache) { loaded = true; clearTimeout(timer); if ($("status").textContent === "Saved receipts can't be reached yet.") setStatus(""); }
        state.docs = new Map(snap.docs.map(d => [d.id, Object.assign({}, d.data(), { id: d.id })]));
        render();
      }, err => { clearTimeout(timer); banner(dbMessage(err), true); });
      db.doc("meta/usage").onSnapshot(s => {
        const months = s.exists ? (s.data().months || {}) : {};
        const m = months[monthKey()];
        $("usage").textContent = m ? "Claude this month: " + m.receipts + " receipts in " + m.calls + (m.calls === 1 ? " call" : " calls") : "Claude this month: none yet";
      }, () => {});
    } else {
      banner("Saving is off in this view. Scans show here but are not kept.");
    }
  }
  boot();
})();
</script>
