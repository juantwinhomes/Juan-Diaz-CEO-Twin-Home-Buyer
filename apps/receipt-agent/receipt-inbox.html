      const row = {
        date: day,
        type: cell(r, col.type).slice(0, 40),
        num: cell(r, col.num).slice(0, 30),
        name: cell(r, col.name).slice(0, 80),
        memo: cell(r, col.memo).slice(0, 120),
        split: cell(r, col.split).slice(0, 80),
        account: (cell(r, col.account) || group || fallback).slice(0, 80),
        unnamed: !cell(r, col.account) && !group,
        raw: Math.round(amt * 100) / 100
      };
      if (!row.name && row.memo) row.name = row.memo.slice(0, 80);
      const base = [row.account, row.date, row.type, row.num, row.name, row.memo, row.raw.toFixed(2)].join("|");
      const n = (seen.get(base) || 0) + 1;
      seen.set(base, n);
      row.k = hashKey(base + "|" + n);
      out.push(row);
    }
    // Charges carry the account's usual sign; the other sign is a refund or credit.
    const isPayment = r => /card payment|^payment$|transfer|deposit/i.test(r.type) || /autopay|payment\s*-?\s*thank you|online payment/i.test(r.name + " " + r.memo);
    const plain = out.filter(r => !isPayment(r));
    const pos = plain.filter(r => r.raw > 0).length;
    const chargeSign = pos >= plain.length - pos ? 1 : -1;
    for (const r of out) {
      r.payment = isPayment(r);
      const refund = /credit card credit|refund|return/i.test(r.type) || (!r.type && Math.sign(r.raw) !== chargeSign);
      r.amount = Math.round((refund ? -Math.abs(r.raw) : Math.abs(r.raw)) * 100) / 100;
      delete r.raw;
    }
    return out;
  }
  async function readCardFile(file) {
    const X = await xlsxLib();
    const wb = X.read(await file.arrayBuffer(), { type: "array" });
    const out = [];
    for (const name of wb.SheetNames) {
      const rows = X.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: false, defval: "", blankrows: false });
      try { out.push(...parseCardRows(rows, file.name)); } catch (e) { /* a sheet with no transactions */ }
    }
    return out;
  }
  const slug = s => String(s || "card").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 80) || "card";
  async function uploadCards(file) {
    if (!db) { banner("Saving is off in this view. Open the page in claude.ai to upload the card report.", true); return; }
    banner("");
    setStatus("Reading " + file.name + "…");
    let rows;
    try { rows = await readCardFile(file); }
    catch (e) {
      banner("That file couldn't be read. In QuickBooks, export the card's report with Export → Export to Excel, then upload that file.", true);
      setStatus("");
      return;
    }
    if (!rows.length) {
      banner("No charges were found in " + file.name + ". Upload the card's report from QuickBooks with the Date and Amount columns.", true);
      setStatus("");
      return;
    }
    const unnamed = rows.some(r => r.unnamed);
    for (const r of rows) delete r.unnamed;
    const byAcct = new Map();
    for (const r of rows) { if (!byAcct.has(r.account)) byAcct.set(r.account, []); byAcct.get(r.account).push(r); }
    let saved = 0;
    for (const [account, list] of byAcct) {
      const id = slug(account);
      const prev = state.cards.get(id) || {};
      const days = list.map(r => r.date).sort();
      const from = days[0], to = days[days.length - 1];
      // The new file replaces its own date range; older rows outside it stay.
      let merged = (prev.rows || []).filter(r => r.date < from || r.date > to).concat(list)
        .sort((a, b) => a.date.localeCompare(b.date));
      if (merged.length > 900) merged = merged.slice(merged.length - 900);
      const all = merged.map(r => r.date);
      const doc = {
        account, rows: merged, marks: prev.marks || {},
        from: all[0], to: all[all.length - 1],
        uploadedAt: new Date().toISOString(), file: String(file.name).slice(0, 120)
      };
      try { await db.collection("cards").doc(id).set(doc); state.cards.set(id, doc); saved += list.length; }
      catch (e) { banner(dbMessage(e), true); break; }
    }
    if (unnamed) banner("This file didn't name the card, so it was saved under \"" + [...byAcct.keys()].join(", ") + "\". If that's wrong, rename the file to the card's name (for example Amex 1004.xlsx) and upload it again.");
    state.view = "cards";
    setStatus("Loaded " + saved + " card " + (saved === 1 ? "line" : "lines") + " from " + file.name + ".");
    render();
  }

  // ---------- matching ----------
  function vendorKey(s) {
    s = String(s || "").toLowerCase();
    if (/home\s*depot|homedepot/.test(s)) return "homedepot";
    if (/amazon|amzn/.test(s)) return "amazon";
    if (/uber/.test(s)) return "uber";
    if (/waymo/.test(s)) return "waymo";
    if (/lowe'?s/.test(s)) return "lowes";
    return "";
  }
  function localDay(iso) {
    if (!iso) return null;
    if (/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso;
    const d = new Date(iso);
    return isNaN(d) ? null : d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }
  const dayNum = day => Date.UTC(+day.slice(0, 4), +day.slice(5, 7) - 1, +day.slice(8, 10)) / 86400000;
  function cardModel() {
    const charges = [];
    for (const [id, d] of state.cards) {
      const marks = d.marks || {};
      for (const r of (d.rows || [])) charges.push(Object.assign({}, r, { cardId: id, account: r.account || d.account, marked: marks[r.k] || "" }));
    }
    const byCharge = new Map(), byReceipt = new Map();
    if (!charges.length) return { charges, byCharge, byReceipt, from: null, to: null };
    const days = charges.map(c => c.date).sort();
    const receipts = allRows().filter(r => (r.status || "new") !== "not_receipt" && r.extracted);
    const pairs = [];
    for (const c of charges) {
      if (c.payment || c.marked) continue;
      const vc = vendorKey(c.name + " " + c.memo);
      const last4 = (String(c.account).match(/(\d{4})\D*$/) || [])[1] || null;
      for (const r of receipts) {
        const x = r.extracted;
        const t = num(x.total), sub = num(x.itemsSubtotal);
        let quality = null, score = 0;
        if (t !== null && Math.abs(t - c.amount) < 0.005) quality = "matched";
        else if (t === null && sub !== null && c.amount > 0 && c.amount >= sub - 0.005 && c.amount <= sub * 1.11 + 0.01) { quality = "check"; score += 4; }
        else continue;
        const rd = localDay(x.date || r.emailDate);
        if (!rd) continue;
        const diff = dayNum(c.date) - dayNum(rd);
        if (diff < -3 || diff > 10) continue;
        score += Math.abs(diff) * 0.5;
        const vr = vendorKey([x.vendor, senderName(r), r.subject].join(" "));
        if (vc && vr) { if (vc !== vr) continue; score -= 2; } else score += 1;
        if (last4 && x.cardLast4 && last4 !== x.cardLast4) continue;
        pairs.push({ c, r, quality, score });
      }
    }
    pairs.sort((a, b) => (a.quality === b.quality ? 0 : a.quality === "matched" ? -1 : 1) || a.score - b.score);
    for (const p of pairs) {
      if (byCharge.has(p.c.k) || byReceipt.has(p.r.id)) continue;
      byCharge.set(p.c.k, { r: p.r, quality: p.quality });
      byReceipt.set(p.r.id, { c: p.c, quality: p.quality });
    }
    return { charges, byCharge, byReceipt, from: days[0], to: days[days.length - 1] };
  }
  function chargeState(c) {
    if (c.payment || c.marked) return "skipped";
    const m = model.byCharge.get(c.k);
    return m ? m.quality : "missing";
  }
  function receiptsNoCharge() {
    if (!model || !model.charges.length) return [];
    return allRows().filter(r => {
      if ((r.status || "new") === "not_receipt" || model.byReceipt.has(r.id)) return false;
      if (amountOf(r).value === null) return false;
      const d = localDay((r.extracted && r.extracted.date) || r.emailDate);
      return d && d >= model.from && d <= model.to;
    });
  }
  function cardCounts() {
    const out = { missing: [], check: [], matched: [], skipped: [] };
    for (const c of model.charges) out[chargeState(c)].push(c);
    out.nocharge = receiptsNoCharge();
    return out;
  }
  const sumOf = list => list.reduce((a, c) => a + (c.amount !== undefined ? c.amount : (amountOf(c).value || 0)), 0);

  // ---------- card charges view ----------
  function renderViews() {
    $("viewReceipts").setAttribute("aria-pressed", String(state.view === "receipts"));
    $("viewCards").setAttribute("aria-pressed", String(state.view === "cards"));
    document.querySelector(".app").hidden = state.view !== "receipts";
    $("cards").hidden = state.view !== "cards";
    $("bulk").hidden = state.view !== "receipts" || state.selected.size === 0;
  }
  function openReceipt(id) {
    const r = allRows().find(x => x.id === id);
    if (!r) return;
    state.view = "receipts";
    state.tab = r.status || "new";
    state.source = "all";
    $("source").value = "all";
    state.query = "";
    $("search").value = "";
    state.selected.clear();
    select(id);
  }
  async function markCharge(c, mark) {
    const d = state.cards.get(c.cardId);
    if (!d || !db) return;
    const marks = Object.assign({}, d.marks || {});
    if (mark) marks[c.k] = mark; else delete marks[c.k];
    try {
      await db.collection("cards").doc(c.cardId).update({ marks });
      d.marks = marks;
      render();
    } catch (e) { banner(dbMessage(e), true); }
  }
  function stat(label, value, extra, cls) {
    const s = el("div", "stat" + (cls ? " " + cls : ""));
    s.append(el("b", null, String(value)), el("span", null, label));
    if (extra) s.append(el("small", null, extra));
    return s;
  }
  function renderCards() {
    const counts = cardCounts();
    const st = $("cStats");
    st.textContent = "";
    const n = model.charges.filter(c => !c.payment);
    st.append(
      stat("Card charges", n.length, n.length ? money(sumOf(n)) : ""),
      stat("Matched", counts.matched.length, "", counts.matched.length ? "ok" : ""),
      stat("Check", counts.check.length, "", counts.check.length ? "warn" : ""),
      stat("Missing receipt", counts.missing.length, counts.missing.length ? money(sumOf(counts.missing)) : "", counts.missing.length ? "bad" : ""),
      stat("Receipt, no charge", counts.nocharge.length)
    );
    const tabs = $("cTabs");
    tabs.textContent = "";
    for (const t of CTABS) {
      const b = el("button", "seg");
      b.type = "button";
      b.dataset.key = t.key;
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", String(state.cTab === t.key));
      b.append(el("span", "seg-count", String(counts[t.key].length)), el("span", "seg-label", t.label));
      b.onclick = () => { state.cTab = t.key; render(); };
      tabs.append(b);
    }
    const files = [...state.cards.values()].sort((a, b) => String(a.account).localeCompare(String(b.account)));
    $("cFiles").textContent = files.length
      ? "Loaded: " + files.map(d => d.account + " (" + shortDate(d.from) + " to " + shortDate(d.to) + ", uploaded " + shortDate(d.uploadedAt) + ")").join(" · ")
      : "";
    const box = $("cList");
    box.textContent = "";
    if (!model.charges.length) {
      const e = el("div", "empty");
      e.append(el("b", null, "No card report yet"),
        el("p", null, "In QuickBooks: Accounting → Chart of accounts → the card's Action menu → Run report → Last 30 days → Export to Excel. Then click Upload card report. One file per card."));
      box.append(e);
      return;
    }
    const head = el("div", "crow head");
    if (state.cTab === "nocharge") {
      ["Date", "Receipt", "Source", "Amount", "Status", ""].forEach(t => head.append(el("span", t === "Amount" ? "amt" : null, t)));
      box.append(head);
      const list = counts.nocharge;
      if (!list.length) { box.append(emptyNote("Every receipt in these dates has a card charge.")); return; }
      for (const r of list) {
        const row = el("div", "crow");
        const x = r.extracted || {};
        row.append(el("span", "c-date", shortDate(x.date || r.emailDate)));
        const p = el("span", "payee", x.vendor || senderName(r));
        if (x.items) p.append(el("small", null, x.items));
        row.append(p, el("span", "c-cat", SOURCE_LABEL[r.source] || "Other"), el("span", "amt", amountOf(r).label));
        const m = el("span", "match");
        m.append(el("span", "pill s-" + (r.status || "new"), STATUS_LABEL[r.status || "new"]));
        if (state.temp.has(r.id)) m.append(el("span", "pill test", "Test"));
        row.append(m);
        const act = el("span", "c-act");
        const open = el("button", "btn small", "Open receipt");
        open.type = "button";
        open.onclick = () => openReceipt(r.id);
        act.append(open);
        row.append(act);
        box.append(row);
      }
      return;
    }
    ["Date", "Payee", "Card · category", "Amount", "Receipt", ""].forEach(t => head.append(el("span", t === "Amount" ? "amt" : null, t)));
    box.append(head);
    const list = counts[state.cTab] || [];
    if (!list.length) {
      box.append(emptyNote(state.cTab === "missing" ? "Every card charge has a receipt." : "Nothing here."));
      return;
    }
    for (const c of list.slice().sort((a, b) => b.date.localeCompare(a.date))) {
      const row = el("div", "crow");
      row.append(el("span", "c-date", shortDate(c.date)));
      const p = el("span", "payee", c.name || c.memo || "No payee");
      if (c.memo && c.memo !== c.name) p.append(el("small", null, c.memo));
      row.append(p);
      const cat = el("span", "c-cat", c.account);
      cat.append(el("small", null, [c.type, c.split].filter(Boolean).join(" · ")));
      row.append(cat, el("span", "amt", money(c.amount)));
      const m = el("span", "match");
      const hit = model.byCharge.get(c.k);
      const s = chargeState(c);
      if (hit) {
        m.append(el("span", "pill m-" + hit.quality, hit.quality === "matched" ? "Matched" : "Check amount"));
        const x = hit.r.extracted || {};
        const link = el("button", "linkbtn", [x.vendor || senderName(hit.r), shortDate(x.date || hit.r.emailDate), amountOf(hit.r).label].join(" · "));
        link.type = "button";
        link.title = "Open this receipt";
        link.onclick = () => openReceipt(hit.r.id);
        m.append(link);
      } else if (s === "skipped") {
        m.append(el("span", "pill", c.payment ? "Card payment" : "No receipt needed"));
      } else {
        m.append(el("span", "pill m-missing", "Missing receipt"));
      }
      row.append(m);
      const act = el("span", "c-act");
      if (!c.payment && !hit) {
        const b = el("button", "btn small ghost", c.marked ? "Undo" : "No receipt needed");
        b.type = "button";
        b.onclick = () => markCharge(c, c.marked ? "" : "no_receipt");
        act.append(b);
      }
      row.append(act);
      box.append(row);
    }
  }
  function emptyNote(t) {
    const e = el("div", "empty");
    e.append(el("p", null, t));
    return e;
  }

  // ---------- the typed report for Juan ----------
  function reportText() {
    const today = localDay(new Date().toISOString());
    const rows = allRows();
    const by = k => rows.filter(r => (r.status || "new") === k).length;
    const lines = ["Receipt agent report, " + longDate(today) + ". All times Pacific.", ""];
    lines.push("RECEIPTS: " + rows.length + " in the inbox. To review " + by("new") + ", Follow-up " + by("follow_up") + ", Good " + by("good") + ", Not a receipt " + by("not_receipt") + ".");
    if (!model.charges.length) {
      lines.push("CARD CHARGES: no card report uploaded yet.");
      return lines.join("\n");
    }
    const c = cardCounts();
    const n = model.charges.filter(x => !x.payment);
    const accounts = [...new Set(model.charges.map(x => x.account))];
    lines.push("CARD CHARGES: " + n.length + " (" + money(sumOf(n)) + "), " + longDate(model.from) + " to " + longDate(model.to) + ", " + accounts.join(", ") + ".");
    lines.push("- Matched to a receipt: " + c.matched.length);
    lines.push("- Likely match, amount to check: " + c.check.length);
    lines.push("- Missing a receipt: " + c.missing.length + (c.missing.length ? " (" + money(sumOf(c.missing)) + ")" : ""));
    lines.push("- No receipt needed or card payments: " + c.skipped.length);
    lines.push("- Receipts with no card charge yet: " + c.nocharge.length);
    if (c.missing.length) {
      lines.push("", "MISSING RECEIPTS");
      const list = c.missing.slice().sort((a, b) => b.amount - a.amount);
      list.slice(0, 25).forEach((x, i) => lines.push((i + 1) + ". " + shortDate(x.date) + ", " + (x.name || x.memo || "No payee") + ", " + money(x.amount) + ", " + x.account));
      if (list.length > 25) lines.push("...and " + (list.length - 25) + " more in the Receipt Inbox page.");
    }
    return lines.join("\n");
  }
  async function copyReport() {
    const text = reportText();
    const box = $("reportBox");
    try {
      await navigator.clipboard.writeText(text);
      box.hidden = true;
      setStatus("Report copied. Paste it into your email to Juan.");
    } catch (e) {
      box.value = text;
      box.hidden = false;
      box.focus();
      box.select();
      setStatus("Press Ctrl+C (Cmd+C on a Mac) to copy the report.");
    }
  }
  async function downloadCardCsv() {
    if (!model.charges.length) { banner("Upload a card report first."); return; }
    const q = v => '"' + String(v === null || v === undefined ? "" : v).replace(/"/g, '""') + '"';
    const label = { missing: "Missing receipt", check: "Check amount", matched: "Matched", skipped: "No receipt needed" };
    const head = ["Date", "Card", "Type", "Payee", "Memo", "Category", "Amount", "Match", "Receipt vendor", "Receipt date", "Receipt amount", "Property", "Email"];
    const lines = [head.map(q).join(",")];
    for (const c of model.charges.slice().sort((a, b) => a.date.localeCompare(b.date))) {
      const hit = model.byCharge.get(c.k);
      const r = hit && hit.r, x = (r && r.extracted) || {};
      lines.push([c.date, c.account, c.type, c.name, c.memo, c.split, c.amount.toFixed(2), c.payment ? "Card payment" : label[chargeState(c)],
        r ? (x.vendor || senderName(r)) : "", r ? localDay(x.date || r.emailDate) : "", r ? amountOf(r).label : "", r ? r.property || "" : "", r ? r.viewUrl || "" : ""].map(q).join(","));
    }
    await saveFile("Card match " + localDay(new Date().toISOString()) + ".csv", lines.join("\r\n"));
  }


  // ---------- wiring ----------
  wire();

  async function boot() {
    render();
    const C = window.claude;
    if (!C || typeof C.use !== "function") {
      banner("Open this page in claude.ai to scan the inbox and save receipts.");
      return;
    }
    [mcp, sample, db] = await Promise.all([C.use("mcp"), C.use("sample"), C.use("db")]);
    if (!mcp) banner("This view can't reach Gmail. Open the page in claude.ai to scan.");
    if (db) {
      let loaded = false;
      const timer = setTimeout(() => { if (!loaded) setStatus("Saved receipts can't be reached yet."); }, 10000);
      db.collection("receipts").orderBy("emailDate", "desc").limit(1000).onSnapshot(snap => {
        if (!snap.metadata.fromCache) { loaded = true; clearTimeout(timer); if ($("status").textContent === "Saved receipts can't be reached yet.") setStatus(""); }
        state.docs = new Map(snap.docs.map(d => [d.id, Object.assign({}, d.data(), { id: d.id })]));
        render();
      }, err => { clearTimeout(timer); banner(dbMessage(err), true); });
      db.collection("cards").onSnapshot(snap => {
        state.cards = new Map(snap.docs.map(d => [d.id, d.data()]));
        render();
      }, () => {});
      db.doc("meta/usage").onSnapshot(s => {
        const months = s.exists ? (s.data().months || {}) : {};
        const m = months[monthKey()];
        $("usage").textContent = m ? "Claude this month: " + m.receipts + " receipts in " + m.calls + (m.calls === 1 ? " call" : " calls") : "Claude this month: none yet";
      }, () => {});
    } else {
      banner("Saving is off in this view. Scans show here but are not kept.");
    }
  }
  boot();
})();
</script>
