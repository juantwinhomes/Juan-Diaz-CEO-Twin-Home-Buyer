<script>
(function(){
  'use strict';
  /* ================= server bridge ================= */
  var LOCAL = !(window.google && google.script && google.script.run);
  function gs(fn){var args=Array.prototype.slice.call(arguments,1);
    if(LOCAL) return window.__localRun(fn,args);
    return new Promise(function(res,rej){var r=google.script.run.withSuccessHandler(res).withFailureHandler(rej);r[fn].apply(r,args)})}
  function norm(p){return p.then(function(r){if(!r||typeof r.ok!=='boolean')throw {code:'BAD_RESPONSE',message:'Unexpected server response.'};if(!r.ok)throw r;return r},
    function(e){if(e&&typeof e.ok==='boolean')throw e;throw {code:'NETWORK',message:(e&&e.message)||'Could not reach the server. Check your connection and try again.'}})}
  function call(fn){var a=Array.prototype.slice.call(arguments);setNet('busy','Saving…');return norm(gs.apply(null,a)).then(function(r){setNet('ok',r.message||'Saved');return r},function(e){setNet('err',codeLabel(e.code));throw e})}
  function read(fn){return norm(gs.apply(null,Array.prototype.slice.call(arguments)))}
  function codeLabel(c){return {CONFLICT_RECORD_CHANGED:'Changed by another user',ACCESS_DENIED:'Access denied',VALIDATION_ERROR:'Could not save',NETWORK:'Could not save',SERVER_ERROR:'Could not save',BUSY:'Desk busy, retry',DUPLICATE:'Duplicate'}[c]||'Could not save'}
  var netTimer; function setNet(kind,text){var el=$('netStatus');el.className='status '+kind;el.textContent=text;clearTimeout(netTimer);if(kind==='ok')netTimer=setTimeout(function(){el.textContent='';el.className='status'},2500)}
  var toastTimer; function toast(msg,kind){var t=$('toast');t.textContent=msg;t.className='toast '+(kind||'');t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true},kind==='err'?6000:3000)}
  function showError(e,fb){var m=(e&&e.message)||fb||'Something went wrong.';toast(m,'err');return m}

  /* ================= state ================= */
  var boot=null, me=null, C=null, S={}, users=[], usersById={}, today='', view='today', todayPane='queue', queueTab='overdue', dashPane='pace';
  var todayData=null, juan=null, board={items:[],page:1,has_more:false,tally:null,total:0}, toolsData=null, dash=null, dashDrawn='';
  var refreshTimer=null, editing=false, editTimer=null, prefs={}, current=null /* open lead */, currentTool=null;
  try{prefs=JSON.parse(localStorage.getItem('thb:ui2')||'{}')}catch(e){prefs={}}
  function pref(k,v){prefs[k]=v;try{localStorage.setItem('thb:ui2',JSON.stringify(prefs))}catch(e){}}

  /* ================= helpers ================= */
  function $(id){return document.getElementById(id)}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function n(v){return Number(v)||0}
  function num(v){return (v===''||v==null||!isFinite(Number(v)))?null:Number(v)} /* blank stays blank, unlike n() */
  function money(v){return (v!=null&&isFinite(v))?'$'+Math.round(v).toLocaleString():'—'}
  function pctS(v){return v==null?'—':v+'%'}
  function when(iso){if(!iso)return '';var d=new Date(iso);return isNaN(d)?'':d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}
  function timeOnly(iso){var d=new Date(iso);return isNaN(d)?'':d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}
  function can(cap){return !!(me&&me.capabilities&&me.capabilities.indexOf(cap)>-1)}
  function safeUrl(u){return /^https?:\/\//i.test(u||'')?u:''}
  function label(st){return (C&&C.status_labels[st])||st}
  function opt(list,sel,vk,lk){return list.map(function(o){var v=vk?o[vk]:o,l=lk?o[lk]:o;return '<option value="'+esc(v)+'"'+(String(v)===String(sel)?' selected':'')+'>'+esc(l)+'</option>'}).join('')}
  function markEditing(){editing=true;clearTimeout(editTimer);editTimer=setTimeout(function(){editing=false},4000)}
  document.addEventListener('focusin',function(e){if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))markEditing()});
  document.addEventListener('input',markEditing);
  function isTyping(){var a=document.activeElement;return editing||(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName)&&a.value!=='')}
  function fact(v,l,cls){return '<div class="fact"><b'+(cls?' class="'+cls+'"':'')+'>'+v+'</b><span>'+l+'</span></div>'}
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

  var loaded={today:false,leads:false,tools:false};
  /* ================= boot ================= */
  read('bootstrapApp').then(function(r){
    boot=r.data; me=boot.user; C=boot.constants; S=boot.settings; today=boot.today; users=boot.users; users.forEach(function(u){usersById[u.user_id]=u});
    $('meName').textContent=me.name; $('meRole').textContent=me.role; var av=$('meAvatar');av.textContent=(me.name||'?').charAt(0).toUpperCase();if(me.photo_url){var im=new Image();im.alt='';im.referrerPolicy='no-referrer';im.onload=function(){av.textContent='';av.appendChild(im)};im.src=me.photo_url} $('meAvatar').title=me.name+' · '+me.role.toLowerCase()+' · '+me.email;
    $('footEnv').textContent=boot.env; $('footToday').textContent=today; $('footTz').textContent=boot.timezone;
    if(boot.env!=='production'){var w=document.createElement('div');w.className='alertbox';w.innerHTML='<b>Development</b>Not production data.';$('boot').parentNode.insertBefore(w,$('boot'))}
    $('tabAdmin').hidden=!can('manage_users'); $('juanPanelTab').hidden=!can('view_team'); $('juanPanel').hidden=true;
    if(!can('create_leads'))$('openAdd').hidden=true; if(!can('manage_tools'))$('addToolSheet').hidden=true;
    if(!can('manage_targets')){$('targetsBox').hidden=true} if(!can('enter_metrics'))$('saveDay').disabled=true;
    $('boot').hidden=true;
    if(prefs.sort)$('sort').value=prefs.sort; if(prefs.filter)setFilter(prefs.filter,true); if(prefs.period)$('period').value=prefs.period;
    var f=boot.first_screen||{};
    if(f.today){todayData=f.today;today=todayData.today;juan=f.today.juan||f.juan||null;renderToday();loaded.today=true}
    if(f.board){seedBoard(f.board);loaded.leads=true}
    if(f.tools){toolsData=f.tools;renderTools();loaded.tools=true}
    show(prefs.tab||'today');
    if(!f.today||!f.board||!f.tools)loadAll(); /* older server, or a section this person cannot see */
    startAutoRefresh();
  }).catch(function(e){$('boot').hidden=true;var el=$('bootError');el.hidden=false;el.innerHTML='<b>'+esc(codeLabel(e.code)==='Could not save'?'Could not open the desk':codeLabel(e.code))+'</b>'+esc(e.message||'')+(e.code==='IDENTITY_UNAVAILABLE'?'<p class="small muted">Administrator: deploy the web app with access limited to the company Workspace, executing as the owner.</p>':'')});

  var TITLES={today:['Today',function(){return 'business day '+today+' · '+(boot?boot.timezone:'')}],leads:['Board',function(){return board.tally?board.tally.live+' live · '+(board.tally.closed||0)+' closed · '+board.tally.archived+' archived':''}],dash:['Dashboards',function(){return 'reporting · one question per page'}],tools:['Tools',function(){return toolsData?toolsData.tools.length+' builds · '+toolsData.tools_today.required+' on the daily list':''}],plan:['The plan',function(){return '10 September 2026'}],admin:['Admin',function(){return 'users · settings · backups'}]};
  function show(v){view=v;pref('tab',v);document.querySelectorAll('[data-view]').forEach(function(b){b.setAttribute('aria-current',b.dataset.view===v?'page':'false')});
    ['today','leads','dash','tools','plan','admin'].forEach(function(k){$('view-'+k).hidden=(k!==v)});
    $('viewTitle').textContent=TITLES[v][0];$('viewSub').textContent=TITLES[v][1]();
    $('sub-today').hidden=v!=='today';$('sub-dash').hidden=v!=='dash';
    if(v==='admin'&&can('manage_users'))loadAdmin(); if(v==='dash'){loadDash().then(function(){animateIn()})} window.scrollTo(0,0)}
  document.querySelectorAll('[data-view]').forEach(function(b){b.onclick=function(){var v=b.dataset.view;show(v);
    if(['today','leads','tools'].indexOf(v)<0)return;
    if(loaded[v])return void refreshCurrent().catch(function(){}); /* already on screen — refresh quietly */
    loaded[v]=true;setNet('busy','Loading…');refreshCurrent().then(function(){setNet('ok','Up to date')},showError)}});
  document.querySelectorAll('[data-goto]').forEach(function(b){b.onclick=function(){show(b.dataset.goto)}});
  $('sub-today').querySelectorAll('button[data-p]').forEach(function(b){b.onclick=function(){setTodayPane(b.dataset.p)}});
  function setTodayPane(p){todayPane=p;$('sub-today').querySelectorAll('button[data-p]').forEach(function(x){x.setAttribute('aria-selected',x.dataset.p===p?'true':'false')});document.querySelectorAll('.pane-today').forEach(function(s){s.hidden=s.dataset.p!==p});if(p==='team')$('juanPanel').hidden=!can('view_team')}
  $('sub-dash').querySelectorAll('button[data-d]').forEach(function(b){b.onclick=function(){dashPane=b.dataset.d;$('sub-dash').querySelectorAll('button[data-d]').forEach(function(x){x.setAttribute('aria-selected',x.dataset.d===dashPane?'true':'false')});document.querySelectorAll('.dpane').forEach(function(p){p.hidden=p.id!=='d-'+dashPane;p.classList.remove('in')});setTimeout(animateIn,30);window.scrollTo(0,0)}});
  $('period').onchange=function(){pref('period',this.value);dashDrawn='';loadDash().then(animateIn)};

  function loadAll(){return Promise.all([loadToday(),loadBoard(1),loadTools()]).catch(showError)}
  function refreshCurrent(){if(view==='today')return loadToday();if(view==='leads')return loadBoard(1,true);if(view==='tools')return loadTools();if(view==='admin')return loadAdmin();if(view==='dash'){dashDrawn='';return loadDash()}return Promise.resolve()}
  $('refreshBtn').onclick=function(){setNet('busy','Refreshing…');(view==='plan'?loadAll():refreshCurrent()).then(function(){setNet('ok','Up to date')},showError)};
  function startAutoRefresh(){clearInterval(refreshTimer);var secs=n(S.auto_refresh_seconds);if(!secs)return;refreshTimer=setInterval(function(){if(document.hidden||isTyping()||view==='plan'||!$('drawer').hidden)return;refreshCurrent().catch(function(){})},Math.max(10,secs)*1000)}

  /* ================= TODAY ================= */
  var METRICS=['tv_spend','ppc_spend','seo_spend','ppl_spend','mail_spend','other_spend','new_leads','inbound_calls','missed_calls','sellers_reached','appointments_set','contracts_signed','contracts_fell_out','deals_closed','minutes_to_first_call'];
  function loadToday(){return read('getTodayDashboard').then(function(r){todayData=r.data;juan=todayData.juan||null;today=todayData.today;renderToday()})}
  function renderToday(){var t=todayData;if(!t)return;var q=t.work_queue,needs=q.counts.overdue+q.counts.no_next_action;
    $('todayHero').innerHTML='<b>'+needs+'</b> '+(needs===1?'property':'properties')+'<small>'+q.counts.overdue+' overdue · '+q.counts.no_next_action+' with no next action'+(q.counts.no_due_date?' · '+q.counts.no_due_date+' with no due date':'')+'</small>';
    $('todayHeroNote').textContent=needs?'Clear these and the board is clean. Everything else is moving.':'Nothing is stuck. Work the due list and log the day.';
    var m=t.metrics; $('todayFacts').innerHTML=fact(t.waiting_on_juan.length,'waiting on Juan',t.waiting_on_juan.length?'alert':'')+fact(q.counts.due_today,'due today')+fact(m?'✓':'—','day logged'+(m?' · '+esc(m.updated_by_name||m.created_by_name):''),m?'ok':'alert');
    $('c-queue').textContent=needs||''; $('c-queue').className='c'+(needs?' hot':''); $('c-juan').textContent=t.waiting_on_juan.length||''; $('c-juan').className='c'+(t.waiting_on_juan.length?' hot':'');
    $('c-log').textContent=m?'logged':'not yet'; $('c-log').className='c'+(m?'':' hot'); $('c-tools').textContent=t.tools_today.required?t.tools_today.done+'/'+t.tools_today.required:''; $('c-tools').className='c'+(t.tools_today.required&&t.tools_today.done<t.tools_today.required?' hot':'');
    var badge=needs+t.waiting_on_juan.length; ['todayBadge','todayBadgeM'].forEach(function(id){$(id).hidden=!badge;$(id).textContent=badge});
    if(!isTyping())METRICS.forEach(function(f){$('d_'+f).value=(m&&m[f]!=null)?m[f]:''});
    $('todayLabel').textContent=m?('logged '+timeOnly(m.updated_at)+' by '+(m.updated_by_name||m.created_by_name)):'not logged yet';
    $('notLogged').innerHTML=m?'':'<div class="alertbox"><b>Day log</b>Today has not been logged. It takes about a minute. <button class="btn xs" data-goto-pane="log" style="margin-left:8px">Log it</button></div>';
    $('toolsTodayLbl').textContent=t.tools_today.required?t.tools_today.done+' of '+t.tools_today.required+(t.tools_today.streak>1?' · streak '+t.tools_today.streak:''):'';
    renderQueue(q); renderFlagged(t.waiting_on_juan); renderRunsToday(t.tools_today); renderAppts(t.upcoming_appointments); renderTeam(t.team); if(juan)renderJuan(juan);
    setTodayPane(todayPane);
  }
  $('view-today').addEventListener('click',function(e){var b=e.target.closest('[data-goto-pane]');if(b)setTodayPane(b.dataset.gotoPane)});
  $('saveDay').onclick=function(){var data={};METRICS.forEach(function(f){var v=$('d_'+f).value;data[f]=v===''?'':Number(v)});$('saveMsg').textContent='Saving…';
    call('saveDailyMetrics',today,data).then(function(r){$('saveMsg').textContent=r.message;editing=false;dashDrawn='';return loadToday()}).catch(function(e){$('saveMsg').textContent=showError(e)})};
  function qItem(i){var alert=i.due_state==='OVERDUE'||i.due_state==='NO_NEXT_ACTION';var st=i.due_state==='OVERDUE'?'Overdue '+i.days_overdue+' day'+(i.days_overdue===1?'':'s')+'<small>was due '+esc(i.due_date)+'</small>':i.due_state==='DUE_TODAY'?'Due today':i.due_state==='UPCOMING'?'Due '+esc(i.due_date):i.due_state==='NO_DUE_DATE'?'No due date<small>has a next action</small>':'No next action<small>this lead will stall</small>';
    return '<div class="row clickable" data-open="'+esc(i.lead_id)+'"><i class="sq'+(alert?' alert':i.compliance_mailer_check||i.flag_juan?' alert':'')+'"></i><div><div class="t">'+esc(i.address)+'</div><div class="m">'+(i.next_action?'<b>'+esc(i.next_action)+'</b> · ':'')+esc(i.assigned_name||'unassigned')+' · '+esc(i.status_label)+(i.compliance_mailer_check?' · mailer or check':i.flag_juan?' · flagged for Juan':'')+(i.days_untouched>=n(S.stale_lead_days||7)?' · untouched '+i.days_untouched+' days':'')+'</div></div><div class="state'+(alert?' alert':'')+'">'+st+'</div><div class="acts">'+(can('work_leads')?(i.next_action?'<button class="btn sm" data-qdone="'+esc(i.lead_id)+'">Mark done</button>':'<button class="btn ghost sm" data-qnext="'+esc(i.lead_id)+'">Set next action</button>'):'<button class="btn ghost sm" data-open="'+esc(i.lead_id)+'">Open</button>')+'</div></div>'}
  function renderQueue(q){var keys={overdue:'overdue',due_today:'due_today',upcoming:'upcoming',no_next_action:'no_next_action',no_due_date:'no_due_date'};
    $('queueTabs').querySelectorAll('button').forEach(function(b){var c=q.counts[b.dataset.q]||0;b.querySelector('.c').textContent=c||'';b.querySelector('.c').className='c'+((b.dataset.q==='overdue'||b.dataset.q==='no_next_action')&&c?' hot':'');b.setAttribute('aria-selected',b.dataset.q===queueTab?'true':'false')});
    var list=q[keys[queueTab]]||[]; $('queueTotal').textContent=(q.counts.overdue+q.counts.due_today+q.counts.upcoming+q.counts.no_due_date+q.counts.no_next_action)+' live with something to do';
    $('queue').innerHTML=list.length?list.map(qItem).join(''):'<div class="empty">'+({overdue:'Nothing overdue.',due_today:'Nothing due today.',upcoming:'Nothing due in the next 7 days.',no_next_action:'Every live property has a next action.',no_due_date:'Every next action has a date.'})[queueTab]+'</div>'}
  $('queueTabs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;queueTab=b.dataset.q;if(todayData)renderQueue(todayData.work_queue)});
  function renderFlagged(f){$('flagged').innerHTML=f.length?f.map(function(l){return '<div class="row clickable" data-open="'+esc(l.lead_id)+'"><i class="sq alert"></i><div><div class="t">'+esc(l.address)+'</div><div class="m">'+(l.last_note?'<b>“'+esc(l.last_note)+'”</b> · ':'')+esc(l.assigned_name||'unassigned')+' · '+esc(l.status_label)+'</div></div><div class="state alert">'+(l.compliance?'Mailer or check':'Flagged for Juan')+(l.flagged_at?'<small>flagged '+esc(when(l.flagged_at))+'</small>':'')+'</div><div class="acts"><button class="btn sm" data-open="'+esc(l.lead_id)+'">Open</button></div></div>'}).join(''):'<div class="empty">Nothing waiting on Juan.</div>'}
  function renderRunsToday(tt){if(!tt||!tt.required){$('runsToday').innerHTML='<div class="empty">No tool is set to run daily yet. Set a cadence on the Tools tab.</div>';return}
    $('runsToday').innerHTML=tt.items.map(function(x){return '<div class="row two"><i class="chk'+(x.done?' on':'')+'">'+(x.done?'<svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>':'')+'</i><div><div class="t">'+esc(x.name)+'</div><div class="m">'+esc(x.operator||'no operator set')+(x.expected_output?' · looks right when: '+esc(x.expected_output):'')+(x.done?' · done by '+esc(x.run_by_name)+' at '+esc(timeOnly(x.run_at)):'')+'</div></div><div class="state'+(x.done?'':' alert')+'">'+(x.done?'Run':'Not run')+'<small>'+esc(x.cadence.toLowerCase())+'</small></div><div class="acts"><button class="btn sm'+(x.done?' ghost':'')+'" data-run="'+esc(x.tool_id)+'" data-done="'+(x.done?1:0)+'"'+(can('run_tools')?'':' disabled')+'>'+(x.done?'Undo':'Mark run')+'</button></div></div>'}).join('')}
  function renderAppts(a){$('appts').innerHTML=a&&a.length?a.slice(0,4).map(function(x){return '<p><b>'+esc(x.appointment_date)+(x.appointment_time?' '+esc(x.appointment_time):'')+'</b> '+esc(x.address)+' · '+esc(x.assigned_name)+'</p>'}).join(''):'<p class="muted">None in the next seven days.</p>'}
  function renderTeam(team){var worked=team.filter(function(r){return r.total_actions>0});
    if(!can('view_team')){return}
    $('juanTally').textContent=worked.length+' worked · '+team.reduce(function(t,r){return t+r.leads_touched},0)+' leads touched · '+team.reduce(function(t,r){return t+r.attempts},0)+' attempts';
    $('juanTeam').innerHTML='<tr><th>Who</th><th>Touched</th><th>Attempts</th><th>Notes</th><th>Moves</th><th>Appts</th><th>Assigned live</th><th>Overdue</th><th>No next action</th><th>Last seen</th></tr>'+team.map(function(r){var z=!r.total_actions;return '<tr><td class="name">'+esc(r.name)+'<small>'+esc(r.role.toLowerCase())+'</small></td><td'+(z?' class="alert"':'')+'>'+r.leads_touched+'</td><td'+(z?' class="alert"':'')+'>'+r.attempts+'</td><td>'+r.notes+'</td><td>'+r.status_changes+'</td><td>'+r.appointments+'</td><td>'+r.active_assigned+'</td><td'+(r.overdue_assigned?' class="alert"':'')+'>'+r.overdue_assigned+'</td><td'+(r.no_next_action_assigned?' class="alert"':'')+'>'+r.no_next_action_assigned+'</td><td'+(z?' class="alert"':'')+'>'+(r.last_activity?esc(when(r.last_activity)):'nothing today')+'</td></tr>'}).join('')}
  function renderJuan(j){$('juanChanges').innerHTML=j.changes_today.length?'<div class="thread">'+j.changes_today.slice(0,40).map(function(c){return '<div class="entry"><span class="when">'+esc(timeOnly(c.timestamp_utc))+'</span><div><span class="who">'+esc(c.user_name)+'</span><span class="muted">'+esc(c.address)+'</span><br>'+esc(c.display)+'</div></div>'}).join('')+'</div>':'<div class="empty">No changes yet today.</div>';
    $('quietPace').innerHTML='<p><b>'+j.pace.closed+' of '+(j.pace.target||'—')+'</b> closed · expected '+j.pace.expected_to_date+' by today</p><p><b>'+money(j.pace.spend_mtd)+'</b>'+(j.pace.budget?' of '+money(j.pace.budget):'')+' spent</p>'}
  $('view-today').addEventListener('click',function(e){var t=e.target.closest('button,[data-open]');if(!t)return;
    if(t.dataset.run){var fn=t.dataset.done==='1'?'undoToolRun':'logToolRun';t.disabled=true;call(fn,t.dataset.run,'','').then(function(r){renderRunsToday(r.data.tools_today);loadToday()}).catch(function(e){showError(e);t.disabled=false});return}
    if(t.dataset.qdone){markDone(t.dataset.qdone);return} if(t.dataset.qnext){promptNext(t.dataset.qnext);return}
    if(t.dataset.open){openLead(t.dataset.open)}});
  function markDone(id){var next=window.prompt('Done. What is the NEXT action on this property? (leave blank only if there truly is none — it will be flagged)','');if(next===null)return;var due='';
    if(next.trim()){due=window.prompt('When is it due? (yyyy-mm-dd)',today)||'';if(due&&!/^\d{4}-\d{2}-\d{2}$/.test(due)){toast('Use yyyy-mm-dd for the date','err');return}}
    call('completeNextAction',id,next.trim(),due,null).then(function(r){toast(r.message,r.data.due_state==='NO_NEXT_ACTION'?'err':'ok');absorb(r.data);return Promise.all([loadToday(),loadBoard(1,true)])}).catch(showError)}
  function promptNext(id){var next=window.prompt('Next action for this property:','');if(next===null)return;var due=window.prompt('Due date (yyyy-mm-dd):',today);if(due===null)return;if(due&&!/^\d{4}-\d{2}-\d{2}$/.test(due)){toast('Use yyyy-mm-dd for the date','err');return}
    call('setNextAction',id,next.trim(),due,null).then(function(r){absorb(r.data);return Promise.all([loadToday(),loadBoard(1,true)])}).catch(showError)}

  /* ================= BOARD ================= */
  var filter='live';
  function setFilter(f,silent){filter=f;pref('filter',f);$('filterTabs').querySelectorAll('button').forEach(function(b){b.setAttribute('aria-selected',b.dataset.filter===f?'true':'false')});if(!silent)loadBoard(1)}
  $('filterTabs').addEventListener('click',function(e){var b=e.target.closest('button');if(b)setFilter(b.dataset.filter)});
  $('sort').onchange=function(){pref('sort',this.value);loadBoard(1)};
  var searchTimer; $('globalSearch').oninput=function(){clearTimeout(searchTimer);searchTimer=setTimeout(function(){if(view!=='leads'){show('leads')}loadBoard(1)},250)};
  document.addEventListener('keydown',function(e){if(e.key==='/'&&!/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){e.preventDefault();$('globalSearch').focus()}if(e.key==='Escape')closeDrawers()});
  function boardParams(page){return {filter:filter,sort:$('sort').value,search:$('globalSearch').value.trim(),page:page||1,page_size:S.page_size||150}}
  var boardReq=0;
  function seedBoard(d){board.items=d.items;board.page=d.page;board.has_more=d.has_more;board.tally=d.tally;board.total=d.total;today=d.today||today;renderBoard()}

    $('heat').innerHTML=di.tools.length?di.tools.map(function(t){return '<span title="'+esc(t.name)+'">'+esc(t.name)+'</span>'+t.days.map(function(x){return '<i class="'+x.state+'" data-tip="<b>'+esc(t.name)+'</b> · '+x.date+' · '+({run:'run',missed:'missed',pending:'today, not yet',off:'not scheduled'})[x.state]+'"></i>'}).join('')}).join(''):'<span class="muted">No tool is on the daily list yet.</span>';
    lineChart($('ch-fu'),L,di.followup_by_bucket,{max:100,fmt:function(v){return v+'%'},tipfmt:function(v){return v+'%'},target:di.followup_target,targetLabel:di.followup_target+'% target'});
    lineChart($('ch-speed'),L,di.speed_by_bucket,{cls:'ice',fmt:function(v){return Math.round(v)+'m'},tipfmt:function(v){return v+' min'},target:di.speed_target,targetLabel:di.speed_target+' min target'});
    /* appointments */
    var ap=d.appointments;$('apHero').innerHTML=cnt(ap.set)+' set<small>'+ap.visited+' visited · '+ap.offered+' offers made · '+ap.signed+' signed · '+ap.no_show+' no-show · '+ap.upcoming_7d+' coming up in 7 days</small>';
    $('apFacts').innerHTML=fact(pctS(ap.visited_pct),'visited')+fact(pctS(ap.offer_pct),'visited → offer')+fact(pctS(ap.no_show_pct),'no-show',ap.no_show?'alert':'');
    funnel($('afunnel'),[{l:'Set',v:ap.set},{l:'Visited',v:ap.visited},{l:'Offer made',v:ap.offered},{l:'Signed',v:ap.signed}]);
    var reps=ap.by_rep.slice(0,5);columns($('ch-arep'),reps.length?reps.map(function(r){return r.name}):['—'],[{name:'Set',v:reps.map(function(r){return r.set}),cls:'soft'},{name:'Visited',v:reps.map(function(r){return r.visited})},{name:'Signed',v:reps.map(function(r){return r.signed}),cls:'ink'}],{labelAll:true});
    document.querySelectorAll('.dpane').forEach(function(p){p.hidden=p.id!=='d-'+dashPane});
  }
  $('saveTargets').onclick=function(){$('targetMsg').textContent='Saving…';call('saveSetting','monthly_deal_target',Number($('t_deals').value)||0).then(function(){return call('saveSetting','monthly_marketing_budget',Number($('t_budget').value)||0)}).then(function(){S.monthly_deal_target=Number($('t_deals').value)||0;S.monthly_marketing_budget=Number($('t_budget').value)||0;$('targetMsg').textContent='Saved';editing=false;dashDrawn='';return loadDash().then(animateIn)}).catch(function(e){$('targetMsg').textContent=showError(e)})};

  /* ================= TOOLS ================= */
  var builder='';
  function loadTools(){return read('getTools').then(function(r){toolsData=r.data;renderTools();if(todayData){todayData.tools_today=toolsData.tools_today;renderRunsToday(toolsData.tools_today)}if(view==='tools')$('viewSub').textContent=TITLES.tools[1]()})}
  function renderTools(){var T=toolsData,tools=T.tools;
    var used=tools.filter(function(t){return t.status==='Live and used daily'}).length,nosteps=tools.filter(function(t){return !t.steps}).length,untrained=tools.filter(function(t){return !t.trained.length}).length,noop=tools.filter(function(t){return !t.operator}).length,undec=tools.filter(function(t){return (t.recommendation||'Decide')==='Decide'}).length,handed=tools.filter(function(t){return t.verdict==='Works, in use'}).length;
    $('toolsHero').innerHTML='<b>'+tools.length+'</b> builds<small>'+T.tools_today.required+' on the daily list · '+used+' used daily · '+handed+' handed over and working</small>';
    $('toolNote').textContent=noop?('A build with no operator is where every one of these died. '+noop+' have a builder but nobody running them.'):nosteps?('Steps are missing on '+nosteps+' of them. A tool without steps gets used once and abandoned.'):untrained?'Every tool has steps. Now mark who is trained so it survives one person being out.':'Steps written and people trained on all of them.';
    $('toolTally').innerHTML=fact(nosteps,'no written steps',nosteps?'alert':'')+fact(noop,'no operator',noop?'alert':'')+fact(undec,'no call made yet',undec?'alert':'');
    var builders={};tools.forEach(function(t){if(t.built_by)builders[t.built_by]=(builders[t.built_by]||0)+1});
    $('builderFilter').innerHTML='<button data-b=""'+(builder===''?' aria-selected="true"':'')+'>All <span class="c">'+tools.length+'</span></button>'+Object.keys(builders).sort().map(function(b){return '<button data-b="'+esc(b)+'"'+(builder===b?' aria-selected="true"':'')+'>'+esc(b)+' <span class="c">'+builders[b]+'</span></button>'}).join('')+'<button data-b="__none"'+(builder==='__none'?' aria-selected="true"':'')+'>Builder not recorded <span class="c hot">'+tools.filter(function(t){return !t.built_by}).length+'</span></button><button data-b="__daily"'+(builder==='__daily'?' aria-selected="true"':'')+'>Daily <span class="c">'+tools.filter(function(t){return t.is_daily}).length+'</span></button>';
    var list=tools.filter(function(t){if(!builder)return true;if(builder==='__none')return !t.built_by;if(builder==='__daily')return t.is_daily;return t.built_by===builder});
    $('toolList').innerHTML=list.length?list.map(function(t){var ok=t.verdict==='Works, in use',bad=!t.steps||!t.operator;var st=ok?'Works, in use':t.verdict==='Broken, sent back'?'Broken, sent back':!t.steps?'No steps':!t.operator?'No operator':t.verdict==='Needs training first'?'Needs training':'Not handed over';
      return '<div class="row two clickable" id="tool-'+esc(t.tool_id)+'" data-tid="'+esc(t.tool_id)+'"><i class="sq'+(ok?' ok':bad?' alert':'')+'"></i><div><div class="t">'+esc(t.name)+'</div><div class="m">'+[t.built_by?'built by '+esc(t.built_by):'builder not recorded',t.operator?esc(t.operator)+' runs it':'no operator',t.is_daily?esc(t.cadence.toLowerCase()):'',esc(t.description)].filter(Boolean).join(' · ')+'</div></div><div class="state'+(ok?'':bad?' alert':'')+'">'+st+'<small>'+(t.trained.length?t.trained.length+' trained':'nobody trained')+(t.link?' · has a link':' · no link')+'</small></div><div class="state">'+esc(t.status)+'<small>status</small></div></div>'}).join(''):'<div class="empty">No tools in this view.</div>';
    $('rollcall').innerHTML=T.builders.map(function(b){var mine=tools.filter(function(t){return (t.built_by||'').indexOf(b)>-1}),withLink=mine.filter(function(t){return t.link}).length,withSteps=mine.filter(function(t){return t.steps}).length;return '<p><b>'+esc(b)+'</b> '+mine.length+' logged · '+withLink+' with a link · '+withSteps+' with steps · <input data-asked="'+esc(b)+'" value="'+esc(T.asked[b]||'')+'" placeholder="date asked" style="width:110px;height:26px;border:1px solid var(--line);background:var(--panel);padding:0 6px;color:var(--text)"'+(can('manage_tools')?'':' disabled')+'></p>'}).join('');
    $('pillars').innerHTML=T.pillars.map(function(p){return '<p><b>'+esc(p.name)+'</b> <span class="muted">'+esc(p.what)+'</span><br><select data-pillar="'+esc(p.id)+'" style="height:26px;border:1px solid var(--line);background:var(--panel);color:var(--text);margin-top:4px"'+(can('manage_tools')?'':' disabled')+'>'+opt(T.enums.pillar_states,p.state)+'</select></p>'}).join('');
    if(currentTool){var fresh=tools.filter(function(t){return t.tool_id===currentTool.tool_id})[0];if(fresh){currentTool=fresh;renderToolDrawer()}}}
  $('builderFilter').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;builder=b.dataset.b;renderTools()});
  $('toolList').addEventListener('click',function(e){var r=e.target.closest('[data-tid]');if(r)openTool(r.dataset.tid)});
  function openTool(id){currentTool=toolsData.tools.filter(function(t){return t.tool_id===id})[0];if(!currentTool)return;$('scrim').hidden=false;$('toolDrawer').hidden=false;$('drawer').hidden=true;$('addDrawer').hidden=true;renderToolDrawer()}
  function renderToolDrawer(){var t=currentTool,E=toolsData.enums,ro=can('manage_tools')?'':' disabled';var d=$('toolDrawer');d.dataset.tid=t.tool_id;
    var keep=null,a=document.activeElement;if(a&&d.contains(a)&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')&&a.dataset.tool){keep={sel:'[data-tool="'+a.dataset.tool+'"]',value:a.value};try{keep.s=a.selectionStart;keep.e=a.selectionEnd}catch(e){}}
    $('tdLbl').textContent='Tool · '+t.tool_id;$('tdTitle').textContent=t.name;$('tdMeta').textContent=[t.description,t.built_by?'built by '+t.built_by:'',t.operator?t.operator+' runs it':''].filter(Boolean).join(' · ');
    var link=safeUrl(t.link);
    $('tdBody').innerHTML=(link?'<a class="btn ghost sm" href="'+esc(link)+'" target="_blank" rel="noopener noreferrer" style="text-decoration:none;align-self:flex-start">Open it ↗</a>':'<div class="alertbox"><b>No link saved</b>If it has no link here, nobody will find it.</div>')+
      '<div class="spec one"><dl>'+kv('Status','<select data-tool="status"'+ro+'>'+opt(E.status,t.status)+'</select>')+kv('Recommendation','<select data-tool="recommendation"'+ro+'>'+opt(E.recommendation,t.recommendation||'Decide')+'</select>')+kv('Cadence','<select data-tool="cadence"'+ro+'>'+opt(E.cadence,t.cadence||'Not set')+'</select>')+kv('Built it','<input data-tool="built_by" value="'+esc(t.built_by)+'" placeholder="e.g. Seth"'+ro+'>')+kv('Runs it every day','<input data-tool="operator" value="'+esc(t.operator)+'" placeholder="the operator, not the builder"'+ro+'>')+kv('Covers when out','<input data-tool="backup_operator" value="'+esc(t.backup_operator)+'"'+ro+'>')+kv('Link','<input class="wide" data-tool="link" value="'+esc(t.link)+'" placeholder="https://..."'+ro+'>')+kv('Looks right when','<input class="wide" data-tool="expected_output" value="'+esc(t.expected_output)+'" placeholder="e.g. a fresh list in the export folder"'+ro+'>')+kv('Asked builder for steps','<input type="date" data-tool="asked_date" value="'+esc(t.asked_date)+'"'+ro+'>')+kv('Handed to the user on','<input type="date" data-tool="handoff_date" value="'+esc(t.handoff_date)+'"'+ro+'>')+kv('User verdict','<select data-tool="verdict"'+ro+'>'+opt(E.verdict,t.verdict||'Not handed over yet')+'</select>')+kv('Produced last week','<input class="wide" data-tool="proof_last_week" value="'+esc(t.proof_last_week)+'" placeholder="e.g. 340 records cleared, 12 callbacks"'+ro+'>')+'</dl></div>'+
      '<div class="field"><label>Steps to run it</label><textarea data-tool="steps" rows="5" placeholder="1. Open ... 2. Run ... 3. Export ..."'+ro+'>'+esc(t.steps)+'</textarea></div>'+
      '<div><div class="lbl" style="margin-bottom:8px">Trained and able to run it alone</div><div class="actions">'+toolsData.people.map(function(p){var on=t.trained.some(function(x){return x.user_id===p.user_id});return '<button class="btn sm'+(on?'':' ghost')+'" data-trained="'+esc(p.user_id)+'" data-on="'+(on?1:0)+'"'+ro+'>'+esc(p.name)+'</button>'}).join('')+'</div></div>';
    if(keep){var f=$('tdBody').querySelector(keep.sel);if(f){f.value=keep.value;f.focus();try{if(keep.s!=null)f.setSelectionRange(keep.s,keep.e)}catch(e){}}}}
  function setTdStatus(kind,text){var s=$('tdStatus');s.className='status '+kind;s.textContent=text;if(kind==='ok')setTimeout(function(){if(s.textContent===text)s.textContent=''},2000)}
  function toolPatch(elm){if(!currentTool)return;var f=elm.dataset.tool;if(String(currentTool[f]||'')===String(elm.value))return;var p={};p[f]=elm.value;setTdStatus('busy','Saving…');
    call('updateTool',currentTool.tool_id,p).then(function(r){setTdStatus('ok','Saved');Object.keys(r.data).forEach(function(k){currentTool[k]=r.data[k]});currentTool.is_daily=['Every day','Every weekday'].indexOf(currentTool.cadence)>-1;return loadTools()}).catch(function(e){setTdStatus('err',codeLabel(e.code));showError(e)})}
  $('toolDrawer').addEventListener('change',function(e){if(e.target.dataset.tool)toolPatch(e.target)});
  $('toolDrawer').addEventListener('blur',function(e){if(e.target.dataset.tool&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))toolPatch(e.target)},true);
  $('toolDrawer').addEventListener('click',function(e){var b=e.target.closest('button[data-trained]');if(!b||!currentTool)return;b.disabled=true;call('setToolTraining',currentTool.tool_id,b.dataset.trained,b.dataset.on!=='1','').then(loadTools).catch(function(e){showError(e);b.disabled=false})});
  $('view-tools').addEventListener('change',function(e){var t=e.target;if(t.dataset.pillar)call('saveSetting','pillar_'+t.dataset.pillar,t.value).then(loadTools).catch(showError)});
  $('view-tools').addEventListener('blur',function(e){var t=e.target;if(t.dataset.asked!=null&&toolsData&&toolsData.asked[t.dataset.asked]!==t.value)call('saveSetting','asked_'+t.dataset.asked,t.value).then(loadTools).catch(showError)},true);
  $('addTool').onclick=function(){var nm=$('newTool').value.trim();if(!nm)return;$('addToolMsg').textContent='Adding…';call('createTool',{name:nm,built_by:$('newToolOwner').value,link:$('newToolLink').value.trim(),description:$('newToolJob').value.trim()}).then(function(r){$('newTool').value='';$('newToolLink').value='';$('newToolJob').value='';$('addToolMsg').textContent=r.message;return loadTools()}).catch(function(e){$('addToolMsg').textContent=showError(e)})};

  /* ================= ADMIN ================= */
  var SETTING_FIELDS=[['mao_percentage','MAO % of ARV'],['stale_lead_days','Stale after (days)'],['cpl_ceiling','Cost per lead ceiling $'],['speed_target_minutes','Speed to first call target (min)'],['auto_refresh_seconds','Auto refresh (seconds, 0 = off)'],['business_timezone','Business timezone'],['live_list_target','Live list target'],['page_size','Records per page (10-200)'],['monthly_deal_target','Deals target per month'],['monthly_marketing_budget','Marketing budget per month $']];
  function loadAdmin(){if(!can('manage_users'))return Promise.resolve();return Promise.all([read('getUsers'),read('getSettings'),read('getBackupLog',20),read('getAuditLog',100)]).then(function(r){renderUsers(r[0].data);renderSettings(r[1].data);renderBackups(r[2].data);renderAudit(r[3].data)}).catch(showError)}
  function renderUsers(list){$('usersTable').innerHTML='<tr><th>Name</th><th>Google email</th><th>Team</th><th>Role</th><th>Access</th><th></th></tr>'+list.map(function(u){return '<tr data-uid="'+esc(u.user_id)+'"><td class="l"><input data-u="name" value="'+esc(u.name)+'"></td><td class="l"><input data-u="email" value="'+esc(u.email)+'" placeholder="needs email"></td><td class="l"><input data-u="team" value="'+esc(u.team)+'"></td><td><select data-u="role">'+opt(C.roles,u.role)+'</select></td><td>'+(u.needs_email?'<span class="badge off">needs email</span>':u.active?'<span class="badge on">active</span>':'<span class="badge off">inactive</span>')+'</td><td>'+(u.needs_email?'':'<button class="btn ghost xs" data-toggle="'+(u.active?0:1)+'">'+(u.active?'Deactivate':'Activate')+'</button>')+'</td></tr>'}).join('')}
  $('usersTable').addEventListener('change',function(e){var t=e.target;if(!t.dataset.u)return;var uid=t.closest('tr').dataset.uid,p={};p[t.dataset.u]=t.value;call('updateUser',uid,p).then(loadAdmin).catch(function(e){showError(e);loadAdmin()})});
  $('usersTable').addEventListener('click',function(e){var t=e.target.closest('button');if(!t||t.dataset.toggle==null)return;var uid=t.closest('tr').dataset.uid;call('updateUser',uid,{active:t.dataset.toggle==='1'}).then(loadAdmin).catch(showError)});
  $('addUser').onclick=function(){$('userMsg').textContent='Adding…';call('createUser',{name:$('u_name').value,email:$('u_email').value,team:$('u_team').value,role:$('u_role').value}).then(function(r){$('userMsg').textContent=r.message;$('u_name').value='';$('u_email').value='';$('u_team').value='';return Promise.all([loadAdmin(),read('bootstrapApp').then(function(b){users=b.data.users;usersById={};users.forEach(function(u){usersById[u.user_id]=u})})])}).catch(function(e){$('userMsg').textContent=showError(e)})};
  function renderSettings(s){var form=$('settingsForm');var dirty=Array.prototype.some.call(form.querySelectorAll('[data-skey]'),function(i){return String(S[i.dataset.skey]==null?'':S[i.dataset.skey])!==i.value})||form.contains(document.activeElement);if(dirty){return}$('settingsForm').innerHTML=SETTING_FIELDS.map(function(f){return kv(f[1],'<input id="s_'+f[0]+'" data-skey="'+f[0]+'" value="'+esc(s[f[0]]==null?'':s[f[0]])+'">')}).join('')+kv('App version','<span class="muted">'+esc(s.app_version)+'</span>');S=Object.assign(S,s)}
  $('saveSettings').onclick=function(){var inputs=Array.prototype.slice.call(document.querySelectorAll('#settingsForm [data-skey]')),changed=inputs.filter(function(i){return String(S[i.dataset.skey]==null?'':S[i.dataset.skey])!==i.value});if(!changed.length){$('settingsMsg').textContent='Nothing changed';return}$('settingsMsg').textContent='Saving…';
    changed.reduce(function(p,i){return p.then(function(){return call('saveSetting',i.dataset.skey,i.value)})},Promise.resolve()).then(function(){$('settingsMsg').textContent='Saved';return read('getSettings')}).then(function(r){S=Object.assign(S,r.data);startAutoRefresh();dashDrawn='';return Promise.all([loadAdmin(),loadBoard(1,true)])}).catch(function(e){$('settingsMsg').textContent=showError(e);loadAdmin()})};
  $('backupNow').onclick=function(){$('backupMsg').textContent='Backing up…';call('createDatabaseBackup').then(function(r){$('backupMsg').textContent='Backup created: '+r.data.name;return loadAdmin()}).catch(function(e){$('backupMsg').textContent=showError(e)})};
  function renderBackups(b){$('backupTable').innerHTML='<tr><th>When</th><th>Name</th><th>Status</th></tr>'+(b.length?b.map(function(x){return '<tr><td>'+esc(when(x.timestamp))+'</td><td style="text-align:left;font-weight:400">'+esc(x.backup_name)+'</td><td>'+esc(x.status)+(x.error?' — '+esc(x.error):'')+'</td></tr>'}).join(''):'<tr><td colspan="3" class="dim">No backups yet. Install the daily trigger (DEPLOY.md) or run one now.</td></tr>')}
  function renderAudit(a){$('auditTable').innerHTML='<tr><th>When</th><th>Who</th><th>Action</th><th>Entity</th></tr>'+a.map(function(x){return '<tr><td>'+esc(when(x.timestamp_utc))+'</td><td style="text-align:left;font-weight:400">'+esc(x.user_email||x.user_id)+'</td><td style="text-align:left;font-weight:400">'+esc(x.action)+'</td><td style="text-align:left;font-weight:400">'+esc(x.entity_type+' '+x.entity_id)+'</td></tr>'}).join('')}
})();
</script>
