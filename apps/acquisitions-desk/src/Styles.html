<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Titillium+Web:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&display=swap">
<style>
  /* ============ TOKENS — light "ION" / dark "INFERNO" ============ */
  :root{
    --ground:#E4E6E8; --ground-2:#D6D9DC; --panel:#FFFFFF; --panel-2:#F3F4F5;
    --ink:#15171A; --ink-2:#3B4046; --graphite:#6B727A; --mist:#9AA1A9; --line:#CDD1D5; --line-2:#E1E4E7;
    --accent:#8FC6D9; --accent-deep:#2F7F9E; --accent-soft:#E3F1F6;
    --alert:#F28C00; --alert-deep:#B45F00; --alert-soft:#FCEBD6; --ok:#4C8A62;
    --text:var(--ink); --muted:var(--graphite); --on-ink:#FFFFFF; --rail-bg:#15171A; --rail-fg:#FFFFFF;
    --hair:repeating-linear-gradient(135deg,transparent 0 9px,rgba(21,23,26,.06) 9px 10px);
    --maxw:1280px; --gut:clamp(16px,3vw,40px);
  }
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --ground:#0E0F11; --ground-2:#141618; --panel:#191B1E; --panel-2:#202327;
    --ink:#F1F2F3; --ink-2:#C9CDD2; --graphite:#9AA1A9; --mist:#6A7179; --line:#2B2F34; --line-2:#23272B;
    --accent:#3E8FAB; --accent-deep:#7CC3DB; --accent-soft:#14303A; --alert:#F28C00; --alert-deep:#F5A33A; --alert-soft:#2A1E0F; --ok:#6FB388;
    --text:#F1F2F3; --muted:#9AA1A9; --on-ink:#0E0F11; --hair:repeating-linear-gradient(135deg,transparent 0 9px,rgba(255,255,255,.05) 9px 10px);
  }}
  :root[data-theme="dark"]{
    --ground:#0E0F11; --ground-2:#141618; --panel:#191B1E; --panel-2:#202327;
    --ink:#F1F2F3; --ink-2:#C9CDD2; --graphite:#9AA1A9; --mist:#6A7179; --line:#2B2F34; --line-2:#23272B;
    --accent:#3E8FAB; --accent-deep:#7CC3DB; --accent-soft:#14303A; --alert:#F28C00; --alert-deep:#F5A33A; --alert-soft:#2A1E0F; --ok:#6FB388;
    --text:#F1F2F3; --muted:#9AA1A9; --on-ink:#0E0F11; --hair:repeating-linear-gradient(135deg,transparent 0 9px,rgba(255,255,255,.05) 9px 10px);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ground);color:var(--text);font-family:"Titillium Web",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
  h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:var(--accent-deep)}
  :focus-visible{outline:2px solid var(--accent-deep);outline-offset:2px}
  [hidden]{display:none!important}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
  .disp{font-family:"Michroma","Titillium Web",sans-serif;letter-spacing:.06em;text-transform:uppercase}
  .lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .muted{color:var(--muted)} .small{font-size:12.5px} .alertc{color:var(--alert-deep)} .okc{color:var(--ok)}
  .sq{display:inline-block;width:10px;height:10px;background:var(--line);transform:skewX(-12deg);flex:none}
  .sq.alert{background:var(--alert)} .sq.ok{background:var(--ok)} .sq.ice{background:var(--accent)}

  /* ============ SHELL ============ */
  .shell{display:grid;grid-template-columns:72px 1fr;min-height:100vh}
  .rail{position:sticky;top:0;height:100vh;background:var(--rail-bg);color:var(--rail-fg);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:16px 0;z-index:25}
  .rail .mark{width:34px;height:34px;border:2px solid var(--rail-fg);display:grid;place-items:center;font-family:"Michroma";font-size:11px;transform:skewX(-12deg);margin-bottom:22px}
  .rail .mark span{transform:skewX(12deg)}
  .rail nav{display:flex;flex-direction:column;gap:4px;width:100%}
  .rail nav button{width:100%;background:none;border:none;color:rgba(255,255,255,.55);padding:12px 0 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;position:relative;font-weight:600}
  .rail nav button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .rail nav button:hover{color:#fff}
  .rail nav button[aria-current="page"]{color:#fff}
  .rail nav button[aria-current="page"]::before{content:"";position:absolute;left:0;top:10px;bottom:8px;width:3px;background:var(--alert)}
  .rail nav .dot{position:absolute;top:8px;right:16px;min-width:16px;height:16px;background:var(--alert);color:#111;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;transform:skewX(-12deg)}
  .rail .vert{margin-top:auto;writing-mode:vertical-rl;transform:rotate(180deg);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.45);padding:10px 0}
  .rail .avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#111;display:grid;place-items:center;font-weight:700;font-size:13px;margin-top:12px;cursor:default}

  .main{min-width:0;display:flex;flex-direction:column}
  .ribbon{position:sticky;top:0;z-index:20;background:var(--ground);border-bottom:1px solid var(--line)}
  .ribbon .in{max-width:var(--maxw);margin:0 auto;padding:18px var(--gut) 0;display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap}
  .ribbon h1{font-size:22px;font-weight:400;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .ribbon h1 em{font-style:normal;font-family:"Titillium Web";font-weight:300;letter-spacing:0;text-transform:none;color:var(--muted);font-size:15px}
  .ribbon .stripe{height:4px;margin:10px auto 0;position:relative;background:var(--line);max-width:var(--maxw)}
  .ribbon .stripe::after{content:"";position:absolute;right:0;top:0;height:4px;width:96px;background:var(--accent-deep);clip-path:polygon(10px 0,100% 0,100% 100%,0 100%)}
  .ribbon .right{margin-left:auto;display:flex;align-items:center;gap:14px;padding-bottom:4px;flex-wrap:wrap}
  .ribbon .search{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;background:var(--panel);border:1px solid var(--line);width:min(300px,60vw);color:var(--muted)}
  .ribbon .search input{border:none;background:none;flex:1;min-width:0;color:var(--text)} .ribbon .search input::placeholder{color:var(--mist)}
  .status{font-size:12px;color:var(--muted);min-width:80px;text-align:right}
  .status.ok{color:var(--ok);font-weight:600} .status.err{color:var(--alert-deep);font-weight:600} .status.busy{color:var(--muted);font-weight:600}
  .subnav{max-width:var(--maxw);margin:0 auto;padding:0 var(--gut);display:flex;gap:26px;overflow-x:auto;align-items:center}
  .subnav button{background:none;border:none;border-bottom:3px solid transparent;padding:12px 0 10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);cursor:pointer;display:flex;gap:8px;align-items:center;white-space:nowrap;font-weight:600}
  .subnav button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--ink)}
  .subnav .c{font-weight:600;color:var(--mist)} .subnav .c.hot{color:var(--alert-deep)}
  .subnav .end{margin-left:auto;display:flex;gap:8px;align-items:center;padding:6px 0}
  .content{max-width:var(--maxw);width:100%;margin:0 auto;padding:24px var(--gut) 80px;display:flex;flex-direction:column;gap:28px}
  .pane{display:flex;flex-direction:column;gap:28px}
  .boot{padding:40px var(--gut);color:var(--muted)}
  .bootError{max-width:560px;margin:60px auto;padding:22px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--alert)}
  .bootError b{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--alert-deep);margin-bottom:6px}

  /* ============ HERO ============ */
  .hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,1fr);gap:clamp(20px,4vw,48px);align-items:end;padding:8px 0 4px}
  .hero .q{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-weight:600}
  .hero .big{font-size:clamp(40px,5.2vw,72px);line-height:1;font-weight:300;letter-spacing:-.03em}
  .hero .big b{font-weight:600}
  .hero .big small{display:block;font-size:17px;font-weight:400;letter-spacing:0;color:var(--muted);margin-top:8px}
  .hero p{margin:12px 0 0;max-width:46ch;color:var(--ink-2)}
  .facts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .fact{padding:14px 16px;border-left:1px solid var(--line);cursor:default}
  .fact:first-child{border-left:none;padding-left:0}
  .fact b{display:block;font-size:26px;font-weight:300;letter-spacing:-.02em;line-height:1.1}
  .fact b.alert{color:var(--alert-deep);font-weight:600} .fact b.ok{color:var(--ok)}
  .fact span{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px;font-weight:600}

  /* ============ SHEET / LIST ============ */
  .sheet{background:var(--panel);border:1px solid var(--line);min-width:0}
  .sheet .head{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
  .sheet .head h2{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;display:flex;gap:10px;align-items:center}
  .sheet .head h2::before{content:"";width:8px;height:8px;background:var(--accent);transform:skewX(-12deg)}
  .sheet .head .hint{color:var(--muted);font-size:13px}
  .sheet .head .right{margin-left:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .sheet .body{padding:18px 20px}
  .tabs{display:flex;gap:22px;padding:0 20px;border-bottom:1px solid var(--line-2);overflow-x:auto}
  .tabs button{background:none;border:none;border-bottom:2px solid transparent;padding:12px 0 10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:600}
  .tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--alert)}
  .tabs button .c{margin-left:6px;color:var(--mist);font-weight:600} .tabs button .c.hot{color:var(--alert-deep)}
  .row{display:grid;grid-template-columns:22px minmax(0,1fr) 190px auto;gap:18px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line-2)}
  .row.clickable{cursor:pointer} .row.clickable:hover{background:var(--panel-2)}
  .row[aria-selected="true"]{background:var(--panel-2);box-shadow:inset 3px 0 0 var(--accent-deep)}
  .row .sq{justify-self:center}
  .row .t{font-size:16px;font-weight:600;letter-spacing:-.005em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .m{font-size:13px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .m b{color:var(--ink-2);font-weight:600}
  .row .state{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--muted);text-align:right;line-height:1.35;white-space:nowrap}
  .row .state.alert{color:var(--alert-deep)}
  .row .state small{display:block;letter-spacing:0;text-transform:none;font-weight:400;color:var(--mist);font-size:12px;white-space:normal}
  .row .acts{display:flex;gap:6px;justify-content:flex-end}
  .row.two{grid-template-columns:22px minmax(0,1fr) 190px 130px}
  .empty{padding:28px 20px;color:var(--muted);text-align:center;font-size:14px}
  .foot{display:flex;align-items:center;gap:14px;padding:12px 20px;border-top:1px solid var(--line-2);font-size:12.5px;color:var(--muted);flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 16px;border:1px solid var(--ink);background:var(--ink);color:var(--on-ink);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;cursor:pointer;white-space:nowrap;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.ghost{background:transparent;color:var(--text);border-color:var(--line);clip-path:none}
  .btn.ghost:hover:not(:disabled){border-color:var(--ink)}
  .btn.alert{background:var(--alert);border-color:var(--alert);color:#111}
  .btn.sm{height:30px;padding:0 12px;font-size:10.5px}
  .btn.xs{height:26px;padding:0 10px;font-size:10px}
  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:80;background:var(--rail-bg);color:var(--rail-fg);font-size:12px;letter-spacing:.06em;font-weight:600;padding:10px 16px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);max-width:min(92vw,560px)}
  .toast.err{background:var(--alert);color:#111} .toast.ok{background:var(--ok);color:#fff}

  /* spec table (label / value / hairline) */
  .spec{display:grid;grid-template-columns:1fr 1fr;gap:0 40px}
  .spec.one{grid-template-columns:1fr}
  .spec dl{margin:0}
  .kv{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13.5px;align-items:center}
  .kv dt{color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-size:11px;font-weight:600}
  .kv dd{margin:0;font-weight:600;text-align:right;min-width:0}
  .kv dd.alert{color:var(--alert-deep)} .kv dd.dim{color:var(--mist);font-weight:400}
  .kv dd input,.kv dd select{width:170px;max-width:100%;height:32px;border:1px solid var(--line);background:var(--panel);padding:0 8px;text-align:right;color:var(--text)}
  .kv dd input[type=date]{text-align:left}
  .kv dd select{text-align:left}
  .kv dd input.wide{width:260px;text-align:left}
  .kv dd input:disabled,.kv dd select:disabled{color:var(--mist);background:var(--panel-2)}
  .field label{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;height:36px;border:1px solid var(--line);background:var(--panel);padding:0 10px;color:var(--text)}
  .field textarea{height:auto;padding:8px 10px}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:12px} .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .alertbox{background:var(--alert-soft);border-left:4px solid var(--alert);padding:12px 14px;font-size:14px}
  .alertbox b{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--alert-deep);margin-bottom:2px}
  .conflict{background:var(--accent-soft);border-left:4px solid var(--accent-deep);padding:10px 14px;font-size:13.5px}

  /* team table */
  table.team{width:100%;border-collapse:collapse;font-size:13.5px}
  table.team th{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right;padding:10px 14px;border-bottom:1px solid var(--line-2);white-space:nowrap}
  table.team td{padding:11px 14px;text-align:right;border-bottom:1px solid var(--line-2);white-space:nowrap}
  table.team th:first-child,table.team td:first-child{text-align:left}
  table.team td.alert{color:var(--alert-deep);font-weight:600}
  table.team td.name{font-weight:600;font-size:15px} table.team td.name small{color:var(--muted);font-weight:400;font-size:12px;margin-left:8px;letter-spacing:.06em;text-transform:uppercase}
  table.team td.l{text-align:left;white-space:normal}
  table.team td input,table.team td select{height:30px;border:1px solid var(--line);background:var(--panel);padding:0 8px;color:var(--text);min-width:90px;max-width:220px}
  .scroll{overflow-x:auto}
  .badge{display:inline-block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:2px 8px;background:var(--line-2);color:var(--muted);transform:skewX(-12deg)}
  .badge.on{background:var(--ok);color:#fff} .badge.off{background:var(--alert);color:#111}

  /* quiet strip */
  .quiet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
  .quiet > div{background:var(--panel);padding:16px 20px;min-width:0}
  .quiet h3{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .quiet h3 button{background:none;border:none;color:var(--accent-deep);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;cursor:pointer;padding:0}
  .quiet p{margin:8px 0 0;font-size:14px;color:var(--ink-2)} .quiet p b{font-weight:600;color:var(--text)}
  .streak{display:flex;gap:3px} .streak i{width:14px;height:4px;background:var(--line)} .streak i.on{background:var(--ok)}
  .chk{width:22px;height:22px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;transform:skewX(-12deg);background:var(--panel)}
  .chk.on{background:var(--ok);border-color:var(--ok)} .chk svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:3;transform:skewX(12deg)}

  /* ============ DRAWER (spec sheet) ============ */
  .scrim{position:fixed;inset:0;background:rgba(14,15,17,.45);z-index:30}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:min(580px,100vw);background:var(--panel);border-left:1px solid var(--line);z-index:40;display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.18)}
  .drawer .dh{padding:24px 28px 16px;border-bottom:1px solid var(--line-2);background:var(--hair);position:relative}
  .drawer .dh .lbl{margin-bottom:6px}
  .drawer .dh h2{font-size:23px;font-weight:600;letter-spacing:-.01em;line-height:1.15;padding-right:44px;text-wrap:pretty}
  .drawer .dh .m{font-size:13.5px;color:var(--muted);margin-top:6px}
  .drawer .dh .x{position:absolute;right:20px;top:20px;width:34px;height:34px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--text)}
  .drawer .dtabs{display:flex;gap:20px;padding:0 28px;border-bottom:1px solid var(--line-2);overflow-x:auto}
  .drawer .dtabs button{background:none;border:none;border-bottom:2px solid transparent;padding:12px 0 10px;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);cursor:pointer;font-weight:600;white-space:nowrap}
  .drawer .dtabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--alert)}
  .drawer .db{padding:20px 28px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:18px}
  .drawer .df{padding:12px 28px;border-top:1px solid var(--line-2);display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
  .thread{display:flex;flex-direction:column}
  .entry{display:grid;grid-template-columns:78px 1fr;gap:14px;padding:10px 0;border-bottom:1px solid var(--line-2);font-size:14px}
  .entry .when{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mist);font-weight:600;padding-top:3px;line-height:1.4}
  .entry .who{font-weight:600;margin-right:6px}
  .entry .sys{color:var(--muted)}
  .compose{display:flex;gap:8px;position:sticky;bottom:0;background:var(--panel);padding-top:8px} .compose input{flex:1;height:38px;border:1px solid var(--line);background:var(--panel);padding:0 12px;color:var(--text)}
  .bigmao{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .bigmao div{padding:16px 0} .bigmao div+div{border-left:1px solid var(--line);padding-left:20px}
  .bigmao b{display:block;font-size:30px;font-weight:300;letter-spacing:-.02em;line-height:1} .bigmao span{display:block;margin-top:6px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .bigmao b.ok{color:var(--ok);font-weight:600} .bigmao b.alert{color:var(--alert-deep);font-weight:600}
  .import{font-size:13px;margin-top:10px} .import li{margin:3px 0} .import code{font-size:12px;color:var(--muted)}

  /* ============ DASHBOARDS ============ */
  .dgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
  .card{grid-column:span 12;background:var(--panel);border:1px solid var(--line);padding:18px 20px 16px;position:relative;transform-style:preserve-3d;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s;will-change:transform;min-width:0}
  .card.c6{grid-column:span 6} .card.c4{grid-column:span 4} .card.c8{grid-column:span 8} .card.c3{grid-column:span 3} .card.c7{grid-column:span 7} .card.c5{grid-column:span 5}
  .card:hover{box-shadow:0 22px 50px -24px rgba(21,23,26,.35),0 2px 0 var(--line)}
  .card .ch{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
