<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in · Analytics</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e;
    --muted: #898781; --border: rgba(11,11,11,0.10); --accent: #2a78d6; --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
      --muted: #898781; --border: rgba(255,255,255,0.10); --accent: #3987e5; --critical: #e66767;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--page); color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; place-items: center; padding: 20px;
  }
  form {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 28px; width: 100%; max-width: 360px;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.lead { margin: 0 0 20px; color: var(--ink-2); font-size: 13px; }
  label { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
  input {
    width: 100%; font: inherit; padding: 9px 11px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--page); color: var(--ink);
  }
  input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    width: 100%; margin-top: 14px; font: 600 14px system-ui; padding: 10px;
    border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  .err {
    margin-top: 14px; font-size: 12.5px; color: var(--critical);
    border: 1px solid var(--critical); border-radius: 8px; padding: 9px 11px;
  }
</style>
</head>
<body>
  <form method="POST" action="/login">
    <h1>Analytics</h1>
    <p class="lead">Twin Home Buyer &middot; internal dashboard</p>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
    <button type="submit">Sign in</button>
    <!--ERROR-->
  </form>
</body>
</html>
