<title>Juan's Accounting Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
/* Layout: fixed left ledger-rail nav + one section at a time; compact KPI strip pinned above every section. */
:root{
  --bg:#ffffff; --panel:#f6f7f8; --line:#e2e5e8; --line-strong:#cbd0d6;
  --fg:#16202a; --muted:#5b6672; --faint:#8a939d;
  --accent:#1d5c63; --accent-soft:#e6f0f0; --accent-fg:#ffffff;
  --ok:#1f7a45; --ok-soft:#e5f3ea; --warn:#9a6200; --warn-soft:#fbf1dc;
  --bad:#b42318; --bad-soft:#fdecea; --info:#3b5a85; --info-soft:#e9eff7;
  --pv:#7a5b00; --pv-soft:#fff6d6;
  --f-display:"Fraunces",Georgia,serif; --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171c; --panel:#1a2128; --line:#2a333c; --line-strong:#3a4550;
  --fg:#e8ecef; --muted:#a3adb7; --faint:#77828d;
  --accent:#5fb3b3; --accent-soft:#1d3335; --accent-fg:#0d1417;
  --ok:#5cc489; --ok-soft:#173326; --warn:#e3a94a; --warn-soft:#3a2d14;
  --bad:#f0857a; --bad-soft:#3d1c19; --info:#8fb0de; --info-soft:#1c2a3d;
  --pv:#e8c55a; --pv-soft:#352c10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171c; --panel:#1a2128; --line:#2a333c; --line-strong:#3a4550;
  --fg:#e8ecef; --muted:#a3adb7; --faint:#77828d;
  --accent:#5fb3b3; --accent-soft:#1d3335; --accent-fg:#0d1417;
  --ok:#5cc489; --ok-soft:#173326; --warn:#e3a94a; --warn-soft:#3a2d14;
  --bad:#f0857a; --bad-soft:#3d1c19; --info:#8fb0de; --info-soft:#1c2a3d;
  --pv:#e8c55a; --pv-soft:#352c10; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:600;font-size:1.35rem;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:.95rem;font-weight:600}
.lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
a{color:var(--accent)}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{border-right:1px solid var(--line);background:var(--panel);padding:20px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:0 8px 16px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand .co{font-size:.75rem;color:var(--muted);margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;font-size:.88rem;color:var(--fg)}
.nav button:hover{background:var(--line)}
.nav button[aria-current="true"]{background:var(--accent);color:var(--accent-fg);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.nav .n{font-family:var(--f-num);font-size:.72rem;opacity:.7;width:16px}
.nav .badge{margin-left:auto;font-family:var(--f-num);font-size:.7rem;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:0 6px}
.nav button[aria-current="true"] .badge{background:var(--accent-fg);color:var(--accent)}

.main{min-width:0;padding-block:20px 60px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.top .title{display:flex;flex-direction:column;gap:2px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line-strong);background:var(--bg);border-radius:6px;padding:7px 12px;cursor:pointer;font-size:.85rem;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn.sm{padding:4px 9px;font-size:.78rem}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.savestate{font-size:.78rem;color:var(--muted)}
.savestate.dirty{color:var(--warn);font-weight:600}

.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:18px}
.kpi{padding:10px 14px;border-right:1px solid var(--line);min-width:0}
.kpi:last-child{border-right:0}
.kpi .v{font-family:var(--f-num);font-size:1.25rem;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:.72rem;color:var(--muted);margin-top:1px}
.kpi.ok .v{color:var(--ok)} .kpi.warn .v{color:var(--warn)} .kpi.bad .v{color:var(--bad)}
.kpi button{all:unset;cursor:pointer;display:block}

.banner{border-radius:var(--r);padding:10px 14px;font-size:.85rem;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.banner.info{background:var(--info-soft);color:var(--info)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner .grow{flex:1;min-width:200px}

.sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:14px}
.verified{font-size:.75rem;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.verified b{font-weight:600;color:var(--fg)}
.stack{display:flex;flex-direction:column;gap:18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.panel{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.panel>h3{margin-bottom:10px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 18px}
.fact .lbl{margin-bottom:3px}
.fact .val{font-weight:500}
.fact .val.big{font-family:var(--f-num);font-size:1.15rem;font-weight:600}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--panel);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tfoot td{font-weight:600;background:var(--panel);border-top:1px solid var(--line-strong)}
td input,td select{min-width:90px}

.pv{display:inline-block;font-size:.72rem;font-weight:600;color:var(--pv);background:var(--pv-soft);border-radius:4px;padding:1px 6px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.neutral{background:var(--panel);color:var(--muted);border:1px solid var(--line)}

input.f,select.f,textarea.f{border:1px solid var(--line-strong);background:var(--bg);border-radius:5px;padding:5px 7px;width:100%;font-size:.85rem}
input.f:focus,select.f:focus,textarea.f:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
textarea.f{resize:vertical;min-height:56px;line-height:1.4}
.editing input.f,.editing select.f{background:var(--accent-soft)}

/* decision cards */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
.dcard{border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0;background:var(--bg);scroll-margin-top:16px}
.dcard.st-Approved{border-color:var(--ok)}
.dcard.st-Hold{border-color:var(--warn)}
.dcard.flash{box-shadow:0 0 0 3px var(--accent)}
.dhead{padding:12px 16px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--line)}
.dhead h3{font-size:1rem}
.damt{padding:10px 16px 0;font-family:var(--f-num);font-size:1.5rem;font-weight:600}
.damt small{font-family:var(--f-body);font-size:.75rem;color:var(--muted);font-weight:400;margin-left:6px}
.dbody{padding:10px 16px;display:flex;flex-direction:column;gap:10px}
.rec{background:var(--accent-soft);border-radius:6px;padding:8px 10px}
.rec .lbl{color:var(--accent)}
.req{font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.act{flex:1;min-width:110px;border:1.5px solid var(--line-strong);background:var(--bg);border-radius:6px;padding:9px 12px;font-weight:700;letter-spacing:.05em;cursor:pointer;font-size:.85rem}
.act.approve:hover,.act.approve.sel{border-color:var(--ok);color:var(--ok)}
.act.approve.sel{background:var(--ok);color:var(--bg)}
.act.hold:hover,.act.hold.sel{border-color:var(--warn);color:var(--warn)}
.act.hold.sel{background:var(--warn);color:var(--bg)}
.act:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dfoot{margin-top:auto;border-top:1px solid var(--line);padding:10px 16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;font-size:.8rem;background:var(--panel);border-radius:0 0 var(--r) var(--r)}
.dfoot .full{grid-column:1/-1}

.risk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.risk:last-child{border-bottom:0}
.list{display:flex;flex-direction:column}
.empty{padding:14px;color:var(--muted);font-size:.85rem;text-align:center}
.filterbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);font-weight:600}
.linkbtn:hover{text-decoration:underline}
.linkbtn:focus-visible{outline:2px solid var(--accent)}

.modal-bg{position:fixed;inset:0;background:rgba(10,15,20,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow-y:auto}
.modal{background:var(--bg);border-radius:var(--r);max-width:720px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.modal textarea{font-family:var(--f-num);font-size:.75rem;min-height:200px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:6px;font-size:.85rem;z-index:60;max-width:360px}

#report{font-size:.85rem}
#report th{background:#eee;color:#333}#report td,#report th{border:1px solid #ccc}#report h2{color:#111}
#report h2{margin:18px 0 8px}
#report table{margin-bottom:6px}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kpi:nth-child(3){border-right:0}.kpi:nth-child(-n+3){border-bottom:1px solid var(--line)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;border-right:0;border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
  .brand{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:4px}
  .nav button{white-space:nowrap;padding:6px 10px}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .dgrid{grid-template-columns:minmax(0,1fr)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi{border-right:1px solid var(--line)!important;border-bottom:1px solid var(--line)}.kpi:nth-child(2n){border-right:0!important}.dfoot{grid-template-columns:minmax(0,1fr)}}
@media print{.side,.tools,.no-print,.actions .btn{display:none!important}.app{display:block}.main{padding:0}.dcard{break-inside:avoid}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="root"><div style="padding:40px 20px;color:#5b6672;font-family:system-ui,sans-serif">Loading the accounting review…</div></div>

<script id="seed" type="application/json">/*SEED*/</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script>
(function(){
const {useState,useEffect,useMemo,useRef,useContext,createContext,useCallback}=React;
const html=htm.bind(React.createElement);
const Ctx=createContext(null);
const SEED=JSON.parse(document.getElementById('seed').textContent);
const DRAFT_KEY='thb-accounting-review-draft-v1';

const SECTIONS=[
 ['overview','Executive Overview'],['cards','Credit Cards & Paydown'],['contractors','Contractor Payments'],
 ['tax','PPS 2025 Tax Returns'],['honda','Honda Accord Buyout'],['rental','8715 D St Rental'],
 ['time','Clock-In / Clock-Out'],['payroll','Matrix Payroll'],['other','Other Pending Decisions'],['summary','Final Decision Summary']];
const SEC_NAME=Object.fromEntries(SECTIONS);

/* ---------- helpers ---------- */
const clone=o=>JSON.parse(JSON.stringify(o));
function num(v){if(v===null||v===undefined||v==='')return null;if(typeof v==='number')return isFinite(v)?v:null;const n=parseFloat(String(v).replace(/[$,\s]/g,''));return isFinite(n)?n:null}
function money(v,{cents}={}){const n=num(v);if(n===null)return null;return n.toLocaleString('en-US',{style:'currency',currency:'USD',minimumFractionDigits:cents?2:0,maximumFractionDigits:cents?2:(Number.isInteger(n)?0:2)})}
function pct(v){return v===null?null:(v*100).toFixed(1)+'%'}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDate(s){if(!s)return null;const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);if(!m)return s;const d=new Date(+m[1],+m[2]-1,+m[3]);return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
function daysUntil(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');if(!m)return null;const d=new Date(+m[1],+m[2]-1,+m[3]);const t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/86400000)}
function getAt(o,path){return path.split('.').reduce((a,k)=>a==null?a:a[k],o)}
function setAt(o,parts,v){if(!parts.length)return v;const [k,...rest]=parts;const c=Array.isArray(o)?o.slice():{...o};c[k]=setAt(o==null?undefined:o[k],rest,v);return c}
function uid(p){return p+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

/* ---------- calculations ---------- */
const RISK={immediate:{label:'Immediate attention',cls:'bad',rank:1},high:{label:'High utilization',cls:'bad',rank:2},monitor:{label:'Monitor',cls:'warn',rank:3},preferred:{label:'Preferred',cls:'ok',rank:4},charge:{label:'Charge card',cls:'neutral',rank:5},unknown:{label:'Pending verification',cls:'neutral',rank:6}};
function cardCalc(c){
  const bal=num(c.balance),lim=num(c.limit);
  const util=(!c.charge&&lim>0&&bal!==null)?bal/lim:null;
  let risk;
  if(c.pastDue==='Yes'||c.autopay==='Off')risk='immediate';
  else if(c.charge)risk=bal===null?'unknown':'charge';
  else if(util===null)risk='unknown';
  else if(util>0.30)risk='high';else if(util>=0.10)risk='monitor';else risk='preferred';
  const to30=util!==null?Math.max(0,bal-0.30*lim):null;
  const to10=util!==null?Math.max(0,bal-0.10*lim):null;
  const manual=num(c.paydown);
  let auto=null;
  if(c.charge)auto=bal; else if(to30!==null)auto=to30;
  if(auto!==null&&c.pastDue==='Yes'&&num(c.minDue)!==null)auto=Math.max(auto,num(c.minDue));
  const rec=manual!==null?manual:auto;
  return {bal,lim,util,risk,to30,to10,rec,recAuto:manual===null};
}
function calc(S){
  const cards=S.cards.map(c=>({c,k:cardCalc(c)}));
  const cardsWithData=cards.filter(x=>x.k.bal!==null);
  const cardPaydown=cardsWithData.length?cards.reduce((a,x)=>a+(x.k.rec||0),0):null;
  const totBal=cardsWithData.length?cardsWithData.reduce((a,x)=>a+x.k.bal,0):null;
  const revolving=cards.filter(x=>x.k.util!==null);
  const revLim=revolving.reduce((a,x)=>a+x.k.lim,0),revBal=revolving.reduce((a,x)=>a+x.k.bal,0);
  const overallUtil=revLim>0?revBal/revLim:null;
  // rental
  const units=S.rental.units.map(u=>{const rent=num(u.rent),sep=num(u.sep),oct=num(u.oct);
    const auto=(rent!==null&&sep!==null&&oct!==null)?Math.max(0,rent-sep)+Math.max(0,rent-oct):null;
    const out=num(u.outstanding)!==null?num(u.outstanding):auto;return {u,rent,sep,oct,out,auto}});
  const sum=(arr,f)=>{const v=arr.map(f).filter(x=>x!==null);return v.length?v.reduce((a,b)=>a+b,0):null};
  const expected=sum(units,x=>x.rent),sepRcv=sum(units,x=>x.sep),octRcv=sum(units,x=>x.oct),outstanding=sum(units,x=>x.out);
  const mort=num(S.rental.mortgage),exp=num(S.rental.expenses);
  const netActual=(octRcv!==null&&mort!==null&&exp!==null)?octRcv-mort-exp:null;
  const netFull=(expected!==null&&mort!==null&&exp!==null)?expected-mort-exp:null;
  const shortfall=netActual===null?null:Math.max(0,-netActual);
  // honda
  const h=S.honda;const hb=num(h.buyout);
  const hondaTotal=hb===null?null:hb+(num(h.fees)||0)+(num(h.salesTax)||0);
  const payrollTotal=num(S.payroll.total)!==null?num(S.payroll.total):((num(S.payroll.regular)!==null||num(S.payroll.overtime)!==null)?(num(S.payroll.regular)||0)+(num(S.payroll.overtime)||0):null);
  const contractorsApproved=S.contractors.approved.reduce((a,p)=>a+(num(p.amount)||0),0);
  return {cards,cardPaydown,totBal,overallUtil,units,expected,sepRcv,octRcv,outstanding,mort,exp,netActual,netFull,shortfall,hondaTotal,payrollTotal,contractorsApproved};
}
function decisionAmount(d,K){
  switch(d.amountSource){
    case 'cards':return K.cardPaydown;
    case 'honda':return K.hondaTotal;
    case 'rentalOutstanding':return K.outstanding;
    case 'rentalShortfall':return K.shortfall;
    case 'payroll':return K.payrollTotal;
    default:return num(d.amount);
  }
}
function risks(S,K){
  const r=[];
  K.cards.forEach(({c,k},i)=>{const nm=(c.name||'Card '+(i+1))+(c.last4?' ••'+c.last4:'');
    if(c.pastDue==='Yes')r.push({lvl:'bad',text:nm+' is past due',sec:'cards'});
    else if(c.autopay==='Off')r.push({lvl:'bad',text:nm+' has autopay turned off',sec:'cards'});
    if(k.risk==='high')r.push({lvl:'warn',text:nm+' is at '+pct(k.util)+' utilization — pay '+money(k.to30)+' to get below 30%',sec:'cards'});
    const dd=daysUntil(c.dueDate);if(dd!==null&&dd>=0&&dd<=7&&c.autopay!=='On')r.push({lvl:'warn',text:nm+' payment due '+fmtDate(c.dueDate)+' without confirmed autopay',sec:'cards'});
  });
  if(!K.cards.some(x=>x.k.bal!==null))r.push({lvl:'warn',text:'Credit card balances not entered yet — card risk cannot be measured',sec:'cards'});
  if(!/filed/i.test(S.tax.status)||/not/i.test(S.tax.status))r.push({lvl:'bad',text:'PPS 2025 returns: extended federal deadlines have passed and filing is not confirmed',sec:'tax'});
  if(K.outstanding>0)r.push({lvl:'warn',text:'8715 D St has '+money(K.outstanding)+' in unpaid rent',sec:'rental'});
  if(K.shortfall>0)r.push({lvl:'warn',text:'8715 D St is short '+money(K.shortfall)+' this month after mortgage and expenses',sec:'rental'});
  if(S.rental.qbMissing.length)r.push({lvl:'warn',text:S.rental.qbMissing.length+' missing QuickBooks record item(s) for 8715 D St',sec:'rental'});
  const hd=daysUntil(S.honda.deadline);if(hd!==null&&hd<=14&&hd>=0)r.push({lvl:'warn',text:'Honda buyout deadline in '+hd+' day(s)',sec:'honda'});
  return r;
}
function deadlines(S,K){
  const out=[];
  out.push({date:S.meta.reviewDate,text:'Accounting review report complete',sec:'overview'});
  S.decisions.forEach(d=>{if(d.status!=='Approved'&&d.target)out.push({date:d.target,text:d.title,sec:d.section==='other'?'other':d.section,id:d.id})});
  S.cards.forEach((c,i)=>{if(c.dueDate)out.push({date:c.dueDate,text:'Card payment due — '+(c.name||'Card '+(i+1)),sec:'cards'})});
  if(S.honda.deadline)out.push({date:S.honda.deadline,text:'Honda buyout deadline',sec:'honda'});
  if(S.payroll.payDate)out.push({date:S.payroll.payDate,text:'Matrix payroll pay date',sec:'payroll'});
  return out.filter(x=>daysUntil(x.date)!==null&&daysUntil(x.date)>=-3).sort((a,b)=>a.date.localeCompare(b.date));
}

function F({path,kind='text',options,ph,empty,width,big}){
  const {S,set,edit}=useContext(Ctx);
  const v=getAt(S,path);
  const id='f-'+path.replace(/\./g,'-');
  if(!edit){
    let d=null;
    if(kind==='money')d=money(v);else if(kind==='date')d=fmtDate(v);else if(kind==='bool')d=v?'Yes':'No';else d=(v===null||v===undefined||v==='')?null:String(v);
    if(d===null||(kind==='select'&&/^(Unknown|Pending verification)$/.test(v)))return empty!==undefined?html`<span class="muted">${empty}</span>`:html`<${PV}/>`;
    return html`<span class=${(kind==='money'?'num':'')+(big?' big':'')}>${d}</span>`;
  }
  const st=width?{minWidth:width}:null;
  if(kind==='select')return html`<select id=${id} class="f" style=${st} value=${v||''} onChange=${e=>set(path,e.target.value)}>${options.map(o=>html`<option key=${o} value=${o}>${o}</option>`)}</select>`;
  if(kind==='textarea')return html`<textarea id=${id} class="f" placeholder=${ph||''} value=${v||''} onChange=${e=>set(path,e.target.value)}></textarea>`;
  if(kind==='bool')return html`<input id=${id} type="checkbox" checked=${!!v} onChange=${e=>set(path,e.target.checked)}/>`;
  if(kind==='date')return html`<input id=${id} class="f" type="date" style=${st} value=${v||''} onChange=${e=>set(path,e.target.value)}/>`;
  if(kind==='money')return html`<input id=${id} class="f num" style=${st||{minWidth:'96px'}} inputmode="decimal" placeholder=${ph||'$0'} value=${v===null||v===undefined?'':v} onChange=${e=>set(path,e.target.value===''?null:e.target.value)}/>`;
  return html`<input id=${id} class="f" style=${st} placeholder=${ph||''} value=${v||''} onChange=${e=>set(path,e.target.value)}/>`;
}

function summaryText(S,K){
  const lines=[`ACCOUNTING REVIEW — DECISION SUMMARY`,`${S.meta.company} · Review date ${fmtDate(S.meta.reviewDate)} · Exported ${new Date().toLocaleString('en-US')}`,''];
  S.decisions.forEach((d,n)=>{const a=decisionAmount(d,K);
    lines.push(`${n+1}. ${d.title} — ${a!==null?money(a):(d.amountNote||'Pending verification')}`);
    lines.push(`   Decision: ${d.status==='Hold'?'HOLD':d.status.toUpperCase()}${d.decidedOn?' ('+fmtDate(d.decidedOn)+')':''}`);
    lines.push(`   Recommendation: ${d.rec}`);
    if(d.status==='Hold'&&d.holdReason)lines.push(`   Hold reason: ${d.holdReason}`);
    if(d.notes)lines.push(`   Juan's notes: ${d.notes}`);
    lines.push(`   Owner: ${d.owner||'—'} · Target: ${fmtDate(d.target)||'—'} · Next: ${d.next||'—'}`);lines.push('');});
  lines.push(`Already approved contractor payments: ${money(K.contractorsApproved)} (${S.contractors.approved.length} payments; completion being verified)`);
  return lines.join('\n');
}

  h+='<h2>Approved contractor payments — '+esc(money(K.contractorsApproved))+'</h2>'+tbl(['Payee','Job','Amount','Source','Status','Paid on'],S.contractors.approved.concat(S.contractors.hold).map(p=>row([esc(p.payee),esc(p.job),esc(money(p.amount)),esc(p.source||pv),esc(p.status),esc(fmtDate(p.paidOn)||'—')])));
  h+='<h2>8715 D St</h2>'+tbl(['Unit','Tenant','Rent','Sept.','Oct.','Outstanding','Status'],K.units.map(x=>row([esc(x.u.unit||'—'),esc(x.u.tenant||'—'),esc(money(x.rent)||pv),esc(money(x.sep)||pv),esc(money(x.oct)||pv),esc(money(x.out)||pv),esc(x.u.status)])));
  h+='<p>Expected rent '+esc(money(K.expected)||pv)+' · Mortgage '+esc(money(K.mort)||pv)+' · Expenses '+esc(money(K.exp)||pv)+' · Net (actual Oct.) '+esc(money(K.netActual)||pv)+'</p>';
  return '<!doctype html><html><head><meta charset="utf-8"><title>Accounting Review Decision Summary</title><style>body{font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#111;margin:24px}h1{font-size:18px;margin:0 0 4px}h2{font-size:13px;margin:18px 0 6px;border-bottom:1px solid #999;padding-bottom:3px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #bbb;padding:4px 6px;text-align:left;vertical-align:top}th{background:#eee}tr{break-inside:avoid}</style></head><body>'+h+'</body></html>';
}

/* ---------- app ---------- */
function App(){
  const [S,setS]=useState(SEED);
  const [loaded,setLoaded]=useState(false);
  const [edit,setEdit]=useState(false);
  const [sec,setSec]=useState(()=>{const h=(location.hash||'').slice(1);return SEC_NAME[h]?h:'overview'});
  const [flash,setFlash]=useState(null);
  const [dirty,setDirty]=useState(false);
  const [saveMsg,setSaveMsg]=useState('');
  const [toast,setToast]=useState('');
  const [modal,setModal]=useState(null);
  const [draft,setDraft]=useState(null);
  const [art,setArt]=useState(undefined); // undefined = checking, null = unavailable
  const [readOnly,setReadOnly]=useState(false);
  const [saving,setSaving]=useState(false);
  const mainRef=useRef(null);

  const K=useMemo(()=>calc(S),[S]);
  const counts=useMemo(()=>{const c={Pending:0,Approved:0,Hold:0};S.decisions.forEach(d=>c[d.status]=(c[d.status]||0)+1);return c},[S]);

  const say=m=>{setToast(m);clearTimeout(say.t);say.t=setTimeout(()=>setToast(''),3200)};

  // load shared state
  useEffect(()=>{let live=true;
    fetch('state.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null).then(shared=>{
      if(!live)return;const base=shared&&shared.decisions?shared:SEED;setS(base);setLoaded(true);
      try{const raw=localStorage.getItem(DRAFT_KEY);if(raw){const d=JSON.parse(raw);
        if(d&&d.data&&d.data.decisions&&JSON.stringify(d.data)!==JSON.stringify(base)&&(!base.meta.savedAt||d.at>base.meta.savedAt))setDraft(d);}}catch(e){}
    });
    return()=>{live=false}},[]);
  // capability
  useEffect(()=>{let n=0;const tryUse=()=>{if(window.claude&&window.claude.use){window.claude.use('artifact').then(a=>setArt(a||null)).catch(()=>setArt(null))}else if(n++<20)setTimeout(tryUse,150);else setArt(null)};tryUse()},[]);
  // autosave draft locally
  useEffect(()=>{if(!loaded||!dirty)return;const t=setTimeout(()=>{try{localStorage.setItem(DRAFT_KEY,JSON.stringify({at:new Date().toISOString(),data:S}))}catch(e){}},600);return()=>clearTimeout(t)},[S,dirty,loaded]);
  // hash
  useEffect(()=>{const f=()=>{const h=(location.hash||'').slice(1);if(SEC_NAME[h])setSec(h)};window.addEventListener('hashchange',f);return()=>window.removeEventListener('hashchange',f)},[]);

  const set=useCallback((path,v)=>{setS(s=>setAt(s,path.split('.'),v));setDirty(true)},[]);
  const setDecision=useCallback((id,status)=>{setS(s=>({...s,decisions:s.decisions.map(d=>d.id!==id?d:{...d,status,decidedOn:status==='Pending'?'':today()})}));setDirty(true);
    if(status==='Hold')setTimeout(()=>{const el=document.getElementById('hr-'+id);if(el)el.focus()},50)},[]);
  const removeDecision=id=>{setS(s=>({...s,decisions:s.decisions.filter(d=>d.id!==id)}));setDirty(true)};
  const go=(s,id)=>{const target=s==='other'?'other':s;setSec(target);try{history.replaceState(null,'','#'+target)}catch(e){}
    if(id){setFlash(id);setTimeout(()=>{const el=document.getElementById('dec-'+id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})},60);setTimeout(()=>setFlash(null),2200)}else window.scrollTo({top:0})};

  async function save(){
    if(!art){setModal('export');say('Shared saving is not available in this view. Export JSON to keep your work.');return}
    const next={...S,meta:{...S.meta,savedAt:new Date().toISOString()}};
    try{localStorage.setItem(DRAFT_KEY,JSON.stringify({at:new Date().toISOString(),data:S}))}catch(e){}
    setSaving(true);
    try{await art.publish({'state.json':{content:JSON.stringify(next,null,2),contentType:'application/json'}});
      setS(next);setDirty(false);setSaveMsg('Saved for everyone · '+new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}));
      try{localStorage.removeItem(DRAFT_KEY)}catch(e){}
      say('Saved. Everyone who opens this report sees these decisions.');
    }catch(err){const c=err&&err.code;
      if(c==='conflict')say('Someone saved a newer version. The page will reload to it; your edits are kept as a draft on this device.');
      else if(['not_writer','not_granted','capability_disabled','capability_removed','not_declared','consent_required'].includes(c)){setReadOnly(true);setModal('export');say('This view cannot save the shared report. Use Export JSON to keep your decisions.')}
      else say('Save did not go through ('+(c||'error')+'). Your edits are kept on this device; try again in a moment.');
    }finally{setSaving(false)}
  }
  async function download(filename,data,type){
    try{const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
      if(!dl)throw {code:'unavailable'};
      const r=await dl.save({filename,data:new Blob([data],{type})});if(r&&r.status==='saved')say('Saved '+filename);
    }catch(e){if(e&&e.code==='cancelled')return;say('Download is not available here. Copy the text instead.');setModal({copy:data,title:filename})}
  }
  async function copy(text,label){try{await navigator.clipboard.writeText(text);say(label+' copied to clipboard.')}catch(e){setModal({copy:text,title:label})}}
  const copySummary=()=>copy(summaryText(S,K),'Decision summary');
  const openReport=()=>setModal('report');
  function importJSON(text){
    try{const d=JSON.parse(text);if(!d||!Array.isArray(d.decisions)||!d.cards)throw 0;setS({...SEED,...d});setDirty(true);setModal(null);say('Imported. Press Save to share it, or keep exporting JSON.')}
    catch(e){say('That file is not a saved review. Choose a JSON file exported from this dashboard.')}
  }

  const totalAmt=S.decisions.reduce((a,d)=>a+(decisionAmount(d,K)||0),0);
  const unknownAmt=S.decisions.filter(d=>decisionAmount(d,K)===null&&!d.amountNote).length;
  const pendingAmt=S.decisions.filter(d=>d.status==='Pending').reduce((a,d)=>a+(decisionAmount(d,K)||0),0);
  const R=risks(S,K);const crit=R.filter(r=>r.lvl==='bad').length;
  const DL=deadlines(S,K).filter(x=>daysUntil(x.date)>=0);const nextDL=DL[0];
  const secCount=s=>S.decisions.filter(d=>(d.section===s)&&d.status==='Pending').length;

  const ctx={S,K,set,edit,go,flash,setDecision,removeDecision,counts,copySummary,openReport};
  const Sec={overview:Overview,cards:Cards,contractors:Contractors,tax:Tax,honda:Honda,rental:Rental,time:Time,payroll:Payroll,other:Other,summary:Summary}[sec];

  const saveLabel=readOnly?'View only — export to keep changes':dirty?'Unsaved changes':(saveMsg||(S.meta.savedAt?'Last saved '+new Date(S.meta.savedAt).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'Starting data · not yet saved'));

  return html`<${Ctx.Provider} value=${ctx}>
  <div class="app">
    <aside class="side">
      <div class="brand"><h1>Accounting Review</h1><div class="co">${S.meta.company}</div><div class="co">Due ${fmtDate(S.meta.reviewDate)}</div></div>
      <nav class="nav" aria-label="Sections">${SECTIONS.map(([k,l],i)=>html`<button key=${k} aria-current=${sec===k} onClick=${()=>go(k)}><span class="n">${String(i+1).padStart(2,'0')}</span>${l}${secCount(k)>0&&html`<span class="badge">${secCount(k)}</span>`}</button>`)}</nav>
    </aside>
    <main class="main" ref=${mainRef}>
      <div class="top">
        <div class="title"><span class="lbl">Juan Diaz, CEO · with Kristine, Controller</span><span class=${'savestate'+(dirty?' dirty':'')}>${saveLabel}</span></div>
        <div class="tools">
          <button class=${'btn'+(edit?' on':'')} aria-pressed=${edit} onClick=${()=>setEdit(!edit)}>${edit?'Done editing':'Edit data'}</button>
          <button class="btn" onClick=${()=>setModal('export')}>Export / import</button>
          <button class="btn" onClick=${openReport}>Printable report</button>
          <button class="btn primary" disabled=${saving||(!dirty&&!draft)||readOnly} onClick=${save}>${saving?'Saving…':'Save'}</button>
        </div>
      </div>
      ${draft&&html`<div class="banner warn" style=${{marginBottom:'12px'}}><span class="grow">This device has unsaved changes from ${new Date(draft.at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}.</span><button class="btn sm" onClick=${()=>{setS(draft.data);setDirty(true);setDraft(null);say('Draft restored. Press Save to share it.')}}>Restore draft</button><button class="btn sm" onClick=${()=>{try{localStorage.removeItem(DRAFT_KEY)}catch(e){}setDraft(null)}}>Discard</button></div>`}
      ${art===null&&!readOnly&&html`<div class="banner info no-print" style=${{marginBottom:'12px'}}><span class="grow">Shared saving is not available in this view. Decisions are kept on this device only; use <b>Export / import</b> to save a JSON copy.</span></div>`}
      <div class="kpis">
        <div class="kpi"><div class="lbl">New decisions total</div><div class="v">${money(totalAmt)}</div><div class="s">${unknownAmt?unknownAmt+' item(s) pending verification':'all amounts known'}</div></div>
        <div class="kpi info"><button onClick=${()=>go('summary')}><div class="lbl">Pending</div><div class="v">${counts.Pending}</div><div class="s">${money(pendingAmt)} awaiting Juan</div></button></div>
        <div class="kpi ok"><div class="lbl">Approved in review</div><div class="v">${counts.Approved}</div><div class="s">of ${S.decisions.length} decisions</div></div>
        <div class="kpi warn"><div class="lbl">On hold</div><div class="v">${counts.Hold}</div><div class="s">waiting on conditions</div></div>
        <div class="kpi"><div class="lbl">Next deadline</div><div class="v" style=${{fontSize:'1rem'}}>${nextDL?fmtDate(nextDL.date):'—'}</div><div class="s" title=${nextDL?nextDL.text:''} style=${{whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>${nextDL?nextDL.text:'None dated'}</div></div>
        <div class=${'kpi '+(crit?'bad':'')}><button onClick=${()=>go('overview')}><div class="lbl">Critical risks</div><div class="v">${crit}</div><div class="s">${R.length-crit} more to watch</div></button></div>
      </div>
      <${Sec}/>
    </main>
  </div>
  ${modal==='export'&&html`<${ExportModal} S=${S} close=${()=>setModal(null)} download=${download} copy=${copy} importJSON=${importJSON} K=${K}/>`}
  ${modal==='report'&&html`<${ReportModal} S=${S} K=${K} close=${()=>setModal(null)} download=${download} copy=${copy}/>`}
  ${modal&&modal.copy!==undefined&&html`<div class="modal-bg" onClick=${e=>{if(e.target===e.currentTarget)setModal(null)}}><div class="modal" role="dialog" aria-label="Copy text"><h3>${modal.title}</h3><p class="muted">Select all and copy this text.</p><textarea class="f" id="copy-fallback" readonly value=${modal.copy} onFocus=${e=>e.target.select()}></textarea><div><button class="btn" onClick=${()=>setModal(null)}>Close</button></div></div></div>`}
  ${toast&&html`<div class="toast" role="status">${toast}</div>`}
  <//>`;
}

function ExportModal({S,K,close,download,copy,importJSON}){
  const [paste,setPaste]=useState('');
  const json=JSON.stringify(S,null,2);
  const stamp=today();
  const onFile=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importJSON(String(r.result));r.readAsText(f)};
  return html`<div class="modal-bg" onClick=${e=>{if(e.target===e.currentTarget)close()}}><div class="modal" role="dialog" aria-label="Export or import">
    <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center'}}><h2>Export / import</h2><button class="btn sm" onClick=${close}>Close</button></div>
    <p class="muted" style=${{margin:0}}><b>Save</b> stores decisions in the shared report for everyone with access. A JSON export is a backup you keep yourself, and it restores every decision, note, and figure.</p>
    <div class="tools">
      <button class="btn primary" onClick=${()=>download('accounting-review-'+stamp+'.json',json,'application/json')}>Download JSON backup</button>
      <button class="btn" onClick=${()=>copy(json,'JSON backup')}>Copy JSON</button>
      <button class="btn" onClick=${()=>copy(summaryText(S,K),'Decision summary')}>Copy decision summary</button>
      <button class="btn" onClick=${()=>download('decision-summary-'+stamp+'.txt',summaryText(S,K),'text/plain')}>Download summary (.txt)</button>
    </div>
    <hr style=${{border:0,borderTop:'1px solid var(--line)',width:'100%'}}/>
    <h3>Import a saved JSON backup</h3>
    <input id="import-file" type="file" accept="application/json,.json" onChange=${onFile}/>
    <textarea class="f" id="import-paste" placeholder="…or paste the JSON here" value=${paste} onChange=${e=>setPaste(e.target.value)} onPaste=${e=>{}}></textarea>
    <div><button class="btn" disabled=${!paste.trim()} onClick=${()=>importJSON(paste)}>Import pasted JSON</button></div>
    <p class="muted" style=${{margin:0,fontSize:'.78rem'}}>Importing replaces what is on screen. Press Save afterward to share it.</p>
  </div></div>`;
}
function ReportModal({S,K,close,download,copy}){
  const doc=reportHTML(S,K);
  const body=doc.replace(/^[\s\S]*<body>/,'').replace(/<\/body>[\s\S]*$/,'');
  return html`<div class="modal-bg" onClick=${e=>{if(e.target===e.currentTarget)close()}}><div class="modal" role="dialog" aria-label="Printable report" style=${{maxWidth:'1000px'}}>
    <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',gap:'8px',flexWrap:'wrap'}}><h2>Printable report</h2>
      <div class="tools"><button class="btn primary" onClick=${()=>download('accounting-review-report-'+today()+'.html',doc,'text/html')}>Download report to print</button><button class="btn" onClick=${()=>copy(summaryText(S,K),'Decision summary')}>Copy summary</button><button class="btn sm" onClick=${close}>Close</button></div></div>
    <p class="muted" style=${{margin:0,fontSize:'.8rem'}}>This viewer cannot open the print dialog. Download the report, open it in your browser, and print or save as PDF from there.</p>
    <div id="report" class="tablewrap" style=${{padding:'14px',background:'#fff',color:'#111'}} dangerouslySetInnerHTML=${{__html:body}}></div>
  </div></div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
})();
</script>
