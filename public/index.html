<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>AI &amp; Systems — Daily KPI Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232563eb'/><rect x='7' y='16' width='4' height='9' rx='1.4' fill='white'/><rect x='14' y='11' width='4' height='14' rx='1.4' fill='white'/><rect x='21' y='7' width='4' height='18' rx='1.4' fill='white'/></svg>">
<script>
  // Apply the saved appearance before the first paint, so a dark page never flashes white.
  (function () {
    var pref = null;
    try { pref = localStorage.getItem('kpi.theme'); } catch (e) { /* storage blocked */ }
    var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    if (dark) document.querySelector('meta[name="theme-color"]').content = '#121826';
  })();
</script>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="28" height="28"><rect width="32" height="32" rx="7" fill="#2563eb"/><rect x="7" y="16" width="4" height="9" rx="1.4" fill="#fff"/><rect x="14" y="11" width="4" height="14" rx="1.4" fill="#fff"/><rect x="21" y="7" width="4" height="18" rx="1.4" fill="#fff"/></svg>
        </span>
        <span class="brand-text">
          <strong>AI &amp; Systems</strong>
          <small>Daily KPI Dashboard</small>
        </span>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <p class="philosophy">
          <b>Daily</b> — are we moving?<br>
          <b>Weekly</b> — are we shipping?<br>
          <b>Monthly</b> — is it valuable?
        </p>
      </div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open navigation">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="topbar-title">
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSubtitle"></p>
        </div>
        <div class="topbar-actions">
          <label class="date-picker">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>
            <input type="date" id="globalDate" aria-label="Viewing date">
          </label>
          <button class="btn btn-ghost" id="todayBtn">Today</button>
          <button class="icon-btn theme-btn" id="themeBtn" aria-label="Switch to dark mode" title="Switch to dark mode">
            <svg class="when-light" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="when-dark" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          </button>
        </div>
      </header>
      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="modal-root" id="modalRoot" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
