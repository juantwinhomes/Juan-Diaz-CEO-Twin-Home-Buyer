# One-click blueprint for Render. See deploy/DEPLOY.md.
#
# The database lives in Supabase, so this service needs no persistent disk and
# runs on the free plan. Free instances sleep after ~15 minutes of inactivity
# and take 30-60 seconds to wake.
services:
  - type: web
    name: kpi-dashboard
    runtime: docker
    plan: free
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL   # Supabase -> Project Settings -> Database -> Connection string
        sync: false
      - key: APP_PASSWORD   # the shared password your team signs in with
        sync: false
      - key: SESSION_SECRET
        generateValue: true
