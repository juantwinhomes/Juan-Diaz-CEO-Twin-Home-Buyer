# One-click blueprint for Render. See the Deploying section of README.md.
services:
  - type: web
    name: kpi-dashboard
    runtime: docker
    plan: starter          # needs a paid instance: free instances have no persistent disk
    healthCheckPath: /login
    disk:
      name: kpi-data       # the SQLite file lives here and survives redeploys
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: KPI_DB_PATH
        value: /data/kpi.db
      - key: APP_PASSWORD  # set this in the Render dashboard — the shared team password
        sync: false
      - key: SESSION_SECRET
        generateValue: true
